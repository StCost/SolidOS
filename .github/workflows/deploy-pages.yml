name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site (main menu at root)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -r "Web Main Menu/." _site/
          cp -r Localization _site/
          cp -r audio _site/
          touch _site/.nojekyll
          sed -i 's|\.\./Localization/|Localization/|g' _site/menu-locale-loader.js
          sed -i 's|\.\./audio/|audio/|g' _site/menu-music.js _site/menu-ui-sounds.js _site/extras-game-start-music.js _site/extras-manifest.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
