<!DOCTYPE html>

<html lang="en">



<head>

  <meta charset="UTF-8" />

  <meta name="transparent" content="true" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>COLLAPSE MACHINE - HUD</title>

  <link rel="stylesheet" href="../Web Main Menu/screen-shared.css" />

  <link rel="stylesheet" href="../Web Main Menu/menu-scrollbar.css" />

  <link rel="stylesheet" href="game-hud.css" />

  <script>window.WebMenuMode = "game";</script>

  <script src="../Web Main Menu/menu-locale.js"></script>

  <script src="../Web Main Menu/menu-locale-loader.js"></script>

  <script src="../Web Main Menu/menu-scrollbar.js"></script>

  <script src="game-hud-cursor-bridge.js"></script>

  <script src="game-hud.js" defer></script>

</head>



<body>

  <main class="game-hud" id="gameHudRoot" aria-hidden="false">

    <div class="game-hud-anchor">

      <section class="game-hud-chat os-window os-window--focused os-window--chat-hud" id="gameHudChat" hidden
        aria-label="Chat">
        <div class="os-window-body-shell menu-scroll-host">

          <div class="game-hud-chat-body os-window-body os-window-body--terminal">

            <div class="game-hud-chat-log-host">

              <div class="game-hud-chat-log menu-v-scroll-view" id="chatLog" role="log" aria-live="polite"

                aria-relevant="additions">

                <div class="game-hud-chat-log-inner" id="chatLogInner"></div>

              </div>

            </div>

            <p class="term-prompt game-hud-chat-input-row">

              <span class="term-prompt-path terminal-text--dim" aria-hidden="true">say&gt;</span>

              <input type="text" id="chatInput" class="game-hud-chat-input worlds-compose-input"

                data-locale-placeholder="chat.placeholder" placeholder="Type a message..." autocomplete="off"

                spellcheck="false" maxlength="512" />

            </p>

          </div>

        </div>

      </section>

      <div class="game-hud-panel" role="group" aria-label="Player status">

        <div class="game-hud-health" id="healthBar" role="meter" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">

        </div>

        <ol class="game-hud-hotbar" id="hotbarSlots"></ol>

      </div>

    </div>

  </main>

</body>



</html>
