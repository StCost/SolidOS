<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Leap</title>
  <script src="../iframe-game-locale.js"></script>
  <script src="../iframe-game-input.js"></script>
  <script src="../extras-game-start-music-notify.js"></script>
  <script src="../extras-game-synth-audio.js"></script>
  <link rel="stylesheet" href="space-leap.css" />
</head>

<body>
  <div id="gameRoot" tabindex="0">
    <canvas id="gameCanvas" aria-hidden="true"></canvas>
    <div id="hudPlaying" class="hud-panel hidden">
      <div id="hudDistance">0 km</div>
    </div>
    <div id="hudBest" class="hud-panel">best 0 km</div>
    <div id="gameScreen">
      <h1 id="screenTitle">Space Leap</h1>
      <p id="controlHint" data-locale-key="web.game.space-leap.hint">
        Hold to aim, release to launch from orbit. Hop between planets and climb through the stars.
      </p>
      <p id="screenScore" class="screen-score hidden">0 km</p>
    </div>
  </div>
  <script src="space-leap.js"></script>
</body>

</html>
