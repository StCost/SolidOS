<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tunnel Drift</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      tap-highlight-color: transparent;
    }

    *:focus,
    *:focus-visible,
    *:active {
      outline: none;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #03050c;
      color: #b8e8ff;
      font-family: "Courier New", Courier, monospace;
      cursor: url("../../../cursor-pointer.svg") 2.1 0, pointer;
    }

    #gameRoot:focus {
      outline: none;
    }

    #gameRoot {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #gameCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    #damageFlash {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(circle at 50% 55%, rgba(255, 60, 80, 0.65), transparent 62%);
      opacity: 0;
    }

    #damageFlash.is-active {
      animation: damage-flash 0.42s ease-out forwards;
    }

    @keyframes damage-flash {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }

    .hud-panel {
      position: absolute;
      z-index: 6;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(80, 180, 255, 0.45);
    }

    #hudPlaying {
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      letter-spacing: 0.14em;
    }

    #hudPlaying.hidden {
      display: none;
    }

    #hudDistance {
      font-size: 1.15rem;
      color: #d8f4ff;
    }

    #hudSpeed {
      margin-top: 2px;
      font-size: 0.78rem;
      color: #7ec8e8;
      letter-spacing: 0.12em;
    }

    #hudHighScore {
      bottom: 12px;
      right: 14px;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      color: #6aa8c8;
      text-align: right;
    }

    #hudHighScore.is-record {
      color: #ffd878;
      animation: record-glow 0.7s ease-in-out infinite alternate;
    }

    @keyframes record-glow {
      from { text-shadow: 0 0 8px rgba(255, 200, 80, 0.4); }
      to { text-shadow: 0 0 16px rgba(255, 220, 120, 0.85); }
    }

    #gameScreen {
      position: absolute;
      inset: 0;
      z-index: 7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      pointer-events: auto;
      background: rgba(4, 8, 18, 0.42);
      cursor: url("../../../cursor-pointer.svg") 2.1 0, pointer;
    }

    #gameScreen.hidden {
      display: none;
    }

    #screenTitle {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #d8f4ff;
      text-shadow: 0 0 18px rgba(80, 200, 255, 0.55);
    }

    #controlHint {
      margin: 0;
      font-size: 0.88rem;
      letter-spacing: 0.12em;
      color: #8ec8e0;
      text-align: center;
      max-width: 88%;
      line-height: 1.45;
    }

    #screenMeters {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.16em;
      color: #a8d8f0;
    }

    #screenMeters.hidden {
      display: none;
    }

    #gameScreen.is-record #screenTitle {
      color: #ffe898;
      text-shadow: 0 0 22px rgba(255, 210, 80, 0.75);
    }

    #clickReticle {
      position: absolute;
      width: 22px;
      height: 22px;
      margin-left: -11px;
      margin-top: -11px;
      border: 1px solid rgba(120, 220, 255, 0.55);
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.12s ease, transform 0.12s ease;
    }

    #clickReticle.is-visible {
      opacity: 1;
      transform: scale(1);
    }

    #clickReticle::before,
    #clickReticle::after {
      content: "";
      position: absolute;
      background: rgba(120, 220, 255, 0.65);
    }

    #clickReticle::before {
      left: 50%;
      top: 3px;
      bottom: 3px;
      width: 1px;
      margin-left: -0.5px;
    }

    #clickReticle::after {
      top: 50%;
      left: 3px;
      right: 3px;
      height: 1px;
      margin-top: -0.5px;
    }
  </style>
</head>
<body>
  <div id="gameRoot" tabindex="0">
    <canvas id="gameCanvas" aria-hidden="true"></canvas>
    <div id="damageFlash"></div>
    <div id="clickReticle" aria-hidden="true"></div>
    <div id="hudPlaying" class="hud-panel hidden">
      <div id="hudDistance">0m</div>
      <div id="hudSpeed">0 m/s</div>
    </div>
    <div id="hudHighScore" class="hud-panel">best 0m</div>
    <div id="gameScreen">
      <h1 id="screenTitle">Tunnel Drift</h1>
      <p id="controlHint">Click anywhere to steer through the tunnel</p>
      <p id="screenMeters" class="hidden">0m</p>
    </div>
  </div>
  <script>
    var HIGH_SCORE_STORAGE_KEY = "cm-tunnel-drift-high-score";
    var GAME_TITLE = "Tunnel Drift";
    var LOCALE_KEY_GAME_OVER = "web.game.game-over";
    var LOCALE_KEY_BEST_LABEL = "web.game.best-label";
    var LOCALE_KEY_METERS_SUFFIX = "web.game.meters-suffix";
    var LOCALE_KEY_SPEED_SUFFIX = "web.game.speed-suffix";
    var LOCALE_KEY_CLICK_STEER = "web.game.prompt.tunnel-wasd-or-click";

    var PHASE_START = "start";
    var PHASE_PLAYING = "playing";
    var PHASE_GAME_OVER = "gameover";

    var SECTOR_COUNT = 8;
    var TWO_PI = Math.PI * 2;
    var SECTOR_ANGLE = TWO_PI / SECTOR_COUNT;

    var Z_FAR = 90;
    var Z_COLLIDE = 1.2;
    var Z_COLLIDE_NEAR = 0.35;
    var WALL_THICKNESS = 3.2;
    var WALL_SPAWN_GAP = 16;
    var FOCAL_LENGTH = 420;
    var TUNNEL_RADIUS = 0.88;
    var PLAYER_EDGE_LIMIT = 0.82;
    var PLAYER_MOVE_SPEED = 2.1;
    var KEY_STEER_SPEED = 2.1;
    var METERS_PER_UNIT = 0.18;

    var WALL_OUTER_NORM = 1.02;
    var WALL_FILL_COLOR = "#2d7aab";
    var WALL_EDGE_COLOR = "#5eb8e8";
    var RETICLE_PLANE_Z = 1.1;
    var VANISH_X_RATIO = 0.56;
    var VANISH_Y_RATIO = 0.48;
    var CLICK_CENTER_DEAD = 32;
    var RING_SEGMENTS = 52;
    var ARC_SEGMENTS = 7;
    var GUIDE_DASH = 7;
    var GUIDE_GAP = 11;
    var GUIDE_DASH_WORLD_SCALE = 0.38;
    var GUIDE_DASH_SCROLL_SCALE = 2.85;

    var canvas = document.getElementById("gameCanvas");
    var context = canvas.getContext("2d");
    var gameRoot = document.getElementById("gameRoot");
    var damageFlash = document.getElementById("damageFlash");
    var hudPlaying = document.getElementById("hudPlaying");
    var hudDistance = document.getElementById("hudDistance");
    var hudSpeed = document.getElementById("hudSpeed");
    var hudHighScore = document.getElementById("hudHighScore");
    var gameScreen = document.getElementById("gameScreen");
    var screenTitle = document.getElementById("screenTitle");
    var screenMeters = document.getElementById("screenMeters");
    var controlHint = document.getElementById("controlHint");
    var clickReticle = document.getElementById("clickReticle");

    var width = 0;
    var height = 0;
    var devicePixelRatioScale = 1;
    var tunnelScale = 1;

    var gamePhase = PHASE_START;
    var forwardSpeed = 14;
    var forwardSpeedBase = 14;
    var distanceUnits = 0;
    var highScoreMeters = 0;

    var playerX = 0;
    var playerY = 0;
    var targetX = 0;
    var targetY = 0;

    var walls = [];
    var nextWallAt = Z_FAR * 0.55;
    var stars = [];
    var speedStreaks = [];

    var screenShakeTimer = 0;
    var screenShakeStrength = 0;
    var moveShakeTimer = 0;
    var reticleTimer = 0;
    var reticleX = 0;
    var reticleY = 0;

    var keySteerLeft = false;
    var keySteerRight = false;
    var keySteerUp = false;
    var keySteerDown = false;

    function getLocaleApi() {
      if (window.parent && window.parent !== window && window.parent.WebLocale) {
        return window.parent.WebLocale;
      }
      if (window.WebLocale) {
        return window.WebLocale;
      }
      return null;
    }

    function getLocalized(key, fallback) {
      var api = getLocaleApi();
      if (api) {
        return api.get(key, fallback);
      }
      return fallback;
    }

    function getClickSteerHint() {
      return getLocalized(LOCALE_KEY_CLICK_STEER, "WASD or click relative to center to steer");
    }

    function focusGameRoot() {
      if (gameRoot && gameRoot.focus) {
        gameRoot.focus();
      }
    }

    function clampTunnelNorm(normX, normY) {
      var length = Math.sqrt(normX * normX + normY * normY);
      if (length > PLAYER_EDGE_LIMIT) {
        return {
          x: normX / length * PLAYER_EDGE_LIMIT,
          y: normY / length * PLAYER_EDGE_LIMIT
        };
      }
      return { x: normX, y: normY };
    }

    function screenToTunnelNorm(screenX, screenY) {
      var center = getScreenCenter();
      var deltaX = screenX - center.x;
      var deltaY = screenY - center.y;
      var length = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
      if (length < CLICK_CENTER_DEAD) {
        return { x: 0, y: 0 };
      }
      var angle = Math.atan2(deltaY, deltaX);
      return clampTunnelNorm(
        Math.cos(angle) * PLAYER_EDGE_LIMIT,
        Math.sin(angle) * PLAYER_EDGE_LIMIT
      );
    }

    function syncReticleToTarget() {
      var projected = projectWorld(targetX, targetY, RETICLE_PLANE_Z);
      reticleX = projected.x;
      reticleY = projected.y;
      clickReticle.style.left = reticleX + "px";
      clickReticle.style.top = reticleY + "px";
      clickReticle.classList.add("is-visible");
      reticleTimer = 0.35;
    }

    function setTargetFromTunnelNorm(normX, normY) {
      var norm = clampTunnelNorm(normX, normY);
      targetX = norm.x;
      targetY = norm.y;
      syncReticleToTarget();
    }

    function isSteerKey(key) {
      if (key === "a" || key === "A" || key === "ArrowLeft") return true;
      if (key === "d" || key === "D" || key === "ArrowRight") return true;
      if (key === "w" || key === "W" || key === "ArrowUp") return true;
      if (key === "s" || key === "S" || key === "ArrowDown") return true;
      return false;
    }

    function setSteerKeyFromEvent(event, isDown) {
      var key = event.key;
      if (key === "a" || key === "A" || key === "ArrowLeft") keySteerLeft = isDown;
      if (key === "d" || key === "D" || key === "ArrowRight") keySteerRight = isDown;
      if (key === "w" || key === "W" || key === "ArrowUp") keySteerUp = isDown;
      if (key === "s" || key === "S" || key === "ArrowDown") keySteerDown = isDown;
    }

    function clearSteerKeys() {
      keySteerLeft = false;
      keySteerRight = false;
      keySteerUp = false;
      keySteerDown = false;
    }

    function updateKeyboardSteer(deltaSeconds) {
      if (!isPlaying()) return;
      var deltaNormX = 0;
      var deltaNormY = 0;
      if (keySteerLeft) deltaNormX -= KEY_STEER_SPEED * deltaSeconds;
      if (keySteerRight) deltaNormX += KEY_STEER_SPEED * deltaSeconds;
      if (keySteerUp) deltaNormY -= KEY_STEER_SPEED * deltaSeconds;
      if (keySteerDown) deltaNormY += KEY_STEER_SPEED * deltaSeconds;
      if (deltaNormX === 0 && deltaNormY === 0) return;
      setTargetFromTunnelNorm(targetX + deltaNormX, targetY + deltaNormY);
    }

    function onKeyDown(event) {
      if (!isSteerKey(event.key)) return;
      event.preventDefault();
      if (isStart() || isGameOver()) {
        startPlaying();
      }
      setSteerKeyFromEvent(event, true);
      focusGameRoot();
    }

    function onKeyUp(event) {
      if (!isSteerKey(event.key)) return;
      event.preventDefault();
      setSteerKeyFromEvent(event, false);
    }

    function onWindowBlur() {
      clearSteerKeys();
    }

    function isPlaying() {
      return gamePhase === PHASE_PLAYING;
    }

    function isStart() {
      return gamePhase === PHASE_START;
    }

    function isGameOver() {
      return gamePhase === PHASE_GAME_OVER;
    }

    function clamp(value, minValue, maxValue) {
      if (value < minValue) return minValue;
      if (value > maxValue) return maxValue;
      return value;
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function normalizeAngle(angle) {
      var result = angle % TWO_PI;
      if (result < 0) result += TWO_PI;
      return result;
    }

    function randomRange(minValue, maxValue) {
      return minValue + Math.random() * (maxValue - minValue);
    }

    function randomSign() {
      return Math.random() < 0.5 ? -1 : 1;
    }

    function createBlockedArray(openSectorCount, consecutive) {
      var blocked = [];
      var index;
      for (index = 0; index < SECTOR_COUNT; index++) {
        blocked[index] = true;
      }
      var openCount = clamp(Math.round(openSectorCount), 1, SECTOR_COUNT - 1);
      if (consecutive) {
        var start = Math.floor(Math.random() * SECTOR_COUNT);
        for (index = 0; index < openCount; index++) {
          blocked[(start + index) % SECTOR_COUNT] = false;
        }
      } else {
        var placed = 0;
        while (placed < openCount) {
          var pick = Math.floor(Math.random() * SECTOR_COUNT);
          if (!blocked[pick]) continue;
          blocked[pick] = false;
          placed += 1;
        }
      }
      return blocked;
    }

    function createWallPattern() {
      var roll = Math.random();
      if (roll < 0.22) {
        return createBlockedArray(4, true);
      }
      if (roll < 0.4) {
        return createBlockedArray(2, true);
      }
      if (roll < 0.58) {
        return createBlockedArray(6, true);
      }
      if (roll < 0.78) {
        return createBlockedArray(1, true);
      }
      return createBlockedArray(randomRange(2, 4), false);
    }

    function createWall(z) {
      var speed = randomRange(0.35, 1.8) * randomSign();
      if (Math.random() < 0.12) {
        speed = 0;
      }
      return {
        z: z,
        rotation: Math.random() * TWO_PI,
        rotateSpeed: speed,
        blocked: createWallPattern(),
        passed: false
      };
    }

    function initStars() {
      stars.length = 0;
      var index;
      for (index = 0; index < 140; index++) {
        stars.push({
          x: Math.random(),
          y: Math.random(),
          size: randomRange(0.4, 1.8),
          brightness: randomRange(0.25, 1),
          depth: randomRange(0.2, 1)
        });
      }
    }

    function initSpeedStreaks() {
      speedStreaks.length = 0;
      var index;
      for (index = 0; index < 48; index++) {
        speedStreaks.push({
          angle: Math.random() * TWO_PI,
          radiusNorm: randomRange(0.15, 0.95),
          length: randomRange(0.04, 0.14),
          speed: randomRange(0.6, 1.4)
        });
      }
    }

    function loadHighScore() {
      try {
        var stored = window.localStorage.getItem(HIGH_SCORE_STORAGE_KEY);
        if (stored) {
          highScoreMeters = parseInt(stored, 10) || 0;
        }
      } catch (error) {
        highScoreMeters = 0;
      }
      syncHighScoreHud(false);
    }

    function saveHighScoreIfNeeded() {
      var meters = Math.floor(distanceUnits * METERS_PER_UNIT);
      if (meters <= highScoreMeters) return false;
      highScoreMeters = meters;
      try {
        window.localStorage.setItem(HIGH_SCORE_STORAGE_KEY, String(highScoreMeters));
      } catch (error) {
      }
      return true;
    }

    function syncHighScoreHud(isRecord) {
      var bestLabel = getLocalized(LOCALE_KEY_BEST_LABEL, "best");
      var suffix = getLocalized(LOCALE_KEY_METERS_SUFFIX, "m");
      hudHighScore.textContent = bestLabel + " " + highScoreMeters + suffix;
      if (isRecord) {
        hudHighScore.classList.add("is-record");
      } else {
        hudHighScore.classList.remove("is-record");
      }
    }

    function formatDistanceText(units) {
      var suffix = getLocalized(LOCALE_KEY_METERS_SUFFIX, "m");
      return Math.floor(units * METERS_PER_UNIT) + suffix;
    }

    function formatSpeedText(speed) {
      var suffix = getLocalized(LOCALE_KEY_SPEED_SUFFIX, " m/s");
      return Math.floor(speed * METERS_PER_UNIT) + suffix;
    }

    function syncPlayingHud() {
      hudDistance.textContent = formatDistanceText(distanceUnits);
      hudSpeed.textContent = formatSpeedText(forwardSpeed);
    }

    function showStartScreen() {
      gamePhase = PHASE_START;
      clearSteerKeys();
      gameScreen.classList.remove("hidden");
      gameScreen.classList.remove("is-record");
      screenTitle.textContent = GAME_TITLE;
      controlHint.textContent = getClickSteerHint();
      controlHint.classList.remove("hidden");
      screenMeters.classList.add("hidden");
      hudPlaying.classList.add("hidden");
    }

    function showGameOverScreen(isRecord) {
      gamePhase = PHASE_GAME_OVER;
      clearSteerKeys();
      gameScreen.classList.remove("hidden");
      screenTitle.textContent = getLocalized(LOCALE_KEY_GAME_OVER, "Game Over");
      controlHint.textContent = getClickSteerHint();
      controlHint.classList.remove("hidden");
      screenMeters.textContent = formatDistanceText(distanceUnits);
      screenMeters.classList.remove("hidden");
      hudPlaying.classList.add("hidden");
      if (isRecord) {
        gameScreen.classList.add("is-record");
        syncHighScoreHud(true);
      } else {
        gameScreen.classList.remove("is-record");
      }
    }

    function startPlaying() {
      gamePhase = PHASE_PLAYING;
      gameScreen.classList.add("hidden");
      hudPlaying.classList.remove("hidden");
      distanceUnits = 0;
      forwardSpeed = forwardSpeedBase;
      playerX = 0;
      playerY = 0;
      targetX = 0;
      targetY = 0;
      walls.length = 0;
      nextWallAt = Z_FAR * 0.45;
      walls.push(createWall(nextWallAt));
      nextWallAt += WALL_SPAWN_GAP + randomRange(0, 10);
      syncPlayingHud();
      focusGameRoot();
    }

    function triggerScreenShake(strength, duration) {
      screenShakeStrength = Math.max(screenShakeStrength, strength);
      screenShakeTimer = Math.max(screenShakeTimer, duration);
    }

    function triggerMoveShake() {
      moveShakeTimer = 0.18;
      triggerScreenShake(2.2, 0.14);
    }

    function triggerDamageFlash() {
      damageFlash.classList.remove("is-active");
      void damageFlash.offsetWidth;
      damageFlash.classList.add("is-active");
      triggerScreenShake(10, 0.38);
    }

    function getScreenShakeOffset() {
      if (screenShakeTimer <= 0) {
        return { x: 0, y: 0 };
      }
      var amount = screenShakeStrength * (screenShakeTimer / 0.38);
      return {
        x: (Math.random() - 0.5) * amount * 2,
        y: (Math.random() - 0.5) * amount * 2
      };
    }

    function getScreenCenter() {
      return {
        x: width * VANISH_X_RATIO,
        y: height * VANISH_Y_RATIO
      };
    }

    function getWorldScale(z) {
      if (z < 0.3) {
        z = 0.3;
      }
      return (FOCAL_LENGTH / z) * tunnelScale * TUNNEL_RADIUS;
    }

    function projectWorld(worldX, worldY, z) {
      var center = getScreenCenter();
      var scale = getWorldScale(z);
      return {
        x: center.x + (worldX - playerX) * scale,
        y: center.y + (worldY - playerY) * scale
      };
    }

    function screenToNorm(screenX, screenY) {
      return screenToTunnelNorm(screenX, screenY);
    }

    function traceProjectedRing(z, radiusNorm) {
      var segmentIndex;
      var angle;
      var point;
      for (segmentIndex = 0; segmentIndex <= RING_SEGMENTS; segmentIndex++) {
        angle = (segmentIndex / RING_SEGMENTS) * TWO_PI;
        point = projectWorld(Math.cos(angle) * radiusNorm, Math.sin(angle) * radiusNorm, z);
        if (segmentIndex === 0) {
          context.moveTo(point.x, point.y);
        } else {
          context.lineTo(point.x, point.y);
        }
      }
    }

    function traceProjectedArc(z, radiusNorm, angleStart, angleEnd, continuePath) {
      var segmentIndex;
      var angle;
      var point;
      for (segmentIndex = 0; segmentIndex <= ARC_SEGMENTS; segmentIndex++) {
        angle = angleStart + (angleEnd - angleStart) * (segmentIndex / ARC_SEGMENTS);
        point = projectWorld(Math.cos(angle) * radiusNorm, Math.sin(angle) * radiusNorm, z);
        if (segmentIndex === 0 && !continuePath) {
          context.moveTo(point.x, point.y);
        } else {
          context.lineTo(point.x, point.y);
        }
      }
    }

    function fillProjectedSector(z, radiusNorm, angleStart, angleEnd, fillColor) {
      var axis = projectWorld(0, 0, z);
      var segmentIndex;
      var angle;
      var point;
      context.beginPath();
      context.moveTo(axis.x, axis.y);
      for (segmentIndex = 0; segmentIndex <= ARC_SEGMENTS; segmentIndex++) {
        angle = angleStart + (angleEnd - angleStart) * (segmentIndex / ARC_SEGMENTS);
        point = projectWorld(Math.cos(angle) * radiusNorm, Math.sin(angle) * radiusNorm, z);
        context.lineTo(point.x, point.y);
      }
      context.closePath();
      context.fillStyle = fillColor;
      context.fill();
    }

    function strokeProjectedSector(z, radiusNorm, angleStart, angleEnd, strokeColor, lineWidth) {
      var axis = projectWorld(0, 0, z);
      var segmentIndex;
      var angle;
      var point;
      context.beginPath();
      context.moveTo(axis.x, axis.y);
      for (segmentIndex = 0; segmentIndex <= ARC_SEGMENTS; segmentIndex++) {
        angle = angleStart + (angleEnd - angleStart) * (segmentIndex / ARC_SEGMENTS);
        point = projectWorld(Math.cos(angle) * radiusNorm, Math.sin(angle) * radiusNorm, z);
        context.lineTo(point.x, point.y);
      }
      context.closePath();
      context.strokeStyle = strokeColor;
      context.lineWidth = lineWidth;
      context.stroke();
    }

    function setTargetFromScreen(screenX, screenY) {
      var norm = screenToTunnelNorm(screenX, screenY);
      setTargetFromTunnelNorm(norm.x, norm.y);
      if (isPlaying()) {
        triggerMoveShake();
      }
    }

    function onPointerDown(event) {
      if (event.button !== 0) return;
      event.preventDefault();
      focusGameRoot();
      var rect = gameRoot.getBoundingClientRect();
      var screenX = event.clientX - rect.left;
      var screenY = event.clientY - rect.top;
      if (isStart() || isGameOver()) {
        startPlaying();
      }
      setTargetFromScreen(screenX, screenY);
    }

    function updatePlayer(deltaSeconds) {
      updateKeyboardSteer(deltaSeconds);
      var prevX = playerX;
      var prevY = playerY;
      var moveBlend = 1 - Math.exp(-PLAYER_MOVE_SPEED * deltaSeconds);
      playerX = lerp(playerX, targetX, moveBlend);
      playerY = lerp(playerY, targetY, moveBlend);

      var deltaX = playerX - prevX;
      var deltaY = playerY - prevY;
      var moveAmount = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

      if (moveAmount > 0.004 && isPlaying()) {
        moveShakeTimer = Math.max(moveShakeTimer, 0.08);
      }
    }

    function getGuideDashOffsetForWorldZ(worldZ) {
      var period = GUIDE_DASH + GUIDE_GAP;
      var scroll = distanceUnits * GUIDE_DASH_SCROLL_SCALE + worldZ * GUIDE_DASH_WORLD_SCALE;
      var mod = scroll % period;
      if (mod < 0) {
        mod += period;
      }
      return mod;
    }

    function getSectorIndex(wall, angle) {
      var localAngle = normalizeAngle(angle - wall.rotation);
      var sectorIndex = Math.floor(localAngle / SECTOR_ANGLE);
      if (sectorIndex >= SECTOR_COUNT) {
        sectorIndex = SECTOR_COUNT - 1;
      }
      return sectorIndex;
    }

    function isSectorBlocked(wall, angle) {
      return wall.blocked[getSectorIndex(wall, angle)];
    }

    function isPlayerBlockedByWall(wall) {
      var radius = Math.sqrt(playerX * playerX + playerY * playerY);
      if (radius > PLAYER_EDGE_LIMIT) {
        return true;
      }
      if (radius < 0.035) {
        return false;
      }
      var angle = Math.atan2(playerY, playerX);
      return isSectorBlocked(wall, angle);
    }

    function checkCollisions() {
      var index;

      for (index = 0; index < walls.length; index++) {
        var wall = walls[index];
        if (wall.z > Z_COLLIDE || wall.z < Z_COLLIDE_NEAR) continue;
        if (isPlayerBlockedByWall(wall)) {
          return true;
        }
      }

      var edgeRadius = Math.sqrt(playerX * playerX + playerY * playerY);
      if (edgeRadius > PLAYER_EDGE_LIMIT) {
        return true;
      }
      return false;
    }

    function updateWalls(deltaSeconds) {
      var index;
      var move = forwardSpeed * deltaSeconds;
      distanceUnits += move;
      forwardSpeed = forwardSpeedBase + distanceUnits * 0.012;

      for (index = walls.length - 1; index >= 0; index--) {
        var wall = walls[index];
        wall.z -= move;
        wall.rotation += wall.rotateSpeed * deltaSeconds;
        if (!wall.passed && wall.z <= Z_COLLIDE) {
          wall.passed = true;
        }
        if (wall.z < -WALL_THICKNESS) {
          walls.splice(index, 1);
        }
      }

      var farthest = walls.length ? walls[walls.length - 1].z : 0;
      while (farthest < Z_FAR) {
        farthest = nextWallAt;
        walls.push(createWall(nextWallAt));
        nextWallAt += WALL_SPAWN_GAP + randomRange(2, 14);
      }
    }

    function killPlayer() {
      triggerDamageFlash();
      var isRecord = saveHighScoreIfNeeded();
      window.setTimeout(function () {
        showGameOverScreen(isRecord);
      }, 420);
      gamePhase = PHASE_GAME_OVER;
    }

    function update(deltaSeconds) {
      if (screenShakeTimer > 0) {
        screenShakeTimer -= deltaSeconds;
        if (screenShakeTimer <= 0) {
          screenShakeTimer = 0;
          screenShakeStrength = 0;
        }
      }

      if (moveShakeTimer > 0) {
        moveShakeTimer -= deltaSeconds;
      }

      if (reticleTimer > 0) {
        reticleTimer -= deltaSeconds;
        if (reticleTimer <= 0) {
          clickReticle.classList.remove("is-visible");
        }
      }

      if (!isPlaying()) {
        return;
      }

      updatePlayer(deltaSeconds);
      updateWalls(deltaSeconds);
      syncPlayingHud();

      if (checkCollisions()) {
        killPlayer();
      }
    }

    function drawBackground() {
      var center = getScreenCenter();
      var gradient = context.createRadialGradient(
        center.x, center.y, width * 0.04,
        center.x, center.y, width * 0.78
      );
      gradient.addColorStop(0, "#0a1428");
      gradient.addColorStop(0.55, "#060a14");
      gradient.addColorStop(1, "#020408");
      context.fillStyle = gradient;
      context.fillRect(0, 0, width, height);

      var index;
      var parallaxScale = getWorldScale(28);
      for (index = 0; index < stars.length; index++) {
        var star = stars[index];
        var drift = isPlaying() ? forwardSpeed * 0.0006 * star.depth : 0.002;
        star.y += drift * 0.016;
        if (star.y > 1.05) {
          star.y = -0.05;
          star.x = Math.random();
        }
        var sx = star.x * width - playerX * parallaxScale * star.depth * 0.35;
        var sy = star.y * height - playerY * parallaxScale * star.depth * 0.35;
        context.fillStyle = "rgba(200, 230, 255, " + (star.brightness * 0.75) + ")";
        context.beginPath();
        context.arc(sx, sy, star.size, 0, TWO_PI);
        context.fill();
      }
    }

    function drawTunnelGuideLines() {
      var sectorIndex;
      var angle;
      var nearZ = 1.4;
      var farZ = Z_FAR * 0.94;
      var z;
      var zStep = 9;
      var zNext;
      var tickHalf;
      var tickAlpha;
      var depthFade;
      var ringAlpha;
      var point;
      var pointNext;
      var tickAngle;
      var tickInner;
      var tickOuter;
      var segmentMidZ;

      context.lineCap = "round";

      for (sectorIndex = 0; sectorIndex < SECTOR_COUNT; sectorIndex++) {
        angle = sectorIndex * SECTOR_ANGLE;
        context.strokeStyle = "rgba(100, 210, 255, 0.24)";
        context.lineWidth = 1.1;
        context.setLineDash([GUIDE_DASH, GUIDE_GAP]);

        for (z = nearZ; z < farZ; z += zStep) {
          zNext = z + zStep;
          if (zNext > farZ) {
            zNext = farZ;
          }
          segmentMidZ = (z + zNext) * 0.5;
          point = projectWorld(Math.cos(angle), Math.sin(angle), z);
          pointNext = projectWorld(Math.cos(angle), Math.sin(angle), zNext);
          context.lineDashOffset = getGuideDashOffsetForWorldZ(segmentMidZ);
          context.beginPath();
          context.moveTo(point.x, point.y);
          context.lineTo(pointNext.x, pointNext.y);
          context.stroke();
        }

        context.setLineDash([]);

        for (z = 10; z < farZ; z += 11) {
          tickAlpha = 0.08 + (1 - z / farZ) * 0.18;
          tickHalf = 0.04;
          tickAngle = angle + SECTOR_ANGLE * 0.5;
          tickInner = projectWorld(Math.cos(tickAngle) * (1 - tickHalf), Math.sin(tickAngle) * (1 - tickHalf), z);
          tickOuter = projectWorld(Math.cos(tickAngle) * (1 + tickHalf), Math.sin(tickAngle) * (1 + tickHalf), z);
          context.strokeStyle = "rgba(90, 200, 255, " + tickAlpha + ")";
          context.lineWidth = 0.85;
          context.beginPath();
          context.moveTo(tickInner.x, tickInner.y);
          context.lineTo(tickOuter.x, tickOuter.y);
          context.stroke();
        }
      }

      for (z = 10; z < farZ; z += 11) {
        depthFade = 1 - z / farZ;
        ringAlpha = 0.06 + depthFade * 0.16;
        context.strokeStyle = "rgba(80, 190, 245, " + ringAlpha + ")";
        context.lineWidth = 0.8;
        context.beginPath();
        traceProjectedRing(z, 1);
        context.stroke();
      }

      context.setLineDash([]);
      context.lineDashOffset = 0;
    }

    function drawTunnelRing(z, innerNorm, outerNorm, colorInner, colorOuter, lineWidth) {
      var midNorm = (innerNorm + outerNorm) * 0.5;
      if (getWorldScale(z) * midNorm < 2) return;

      var center = projectWorld(0, 0, z);
      var edge = projectWorld(midNorm, 0, z);
      var midRadius = Math.sqrt((edge.x - center.x) * (edge.x - center.x) + (edge.y - center.y) * (edge.y - center.y));
      if (midRadius < 2) return;

      var gradient = context.createRadialGradient(
        center.x, center.y, midRadius * (innerNorm / midNorm),
        center.x, center.y, midRadius
      );
      gradient.addColorStop(0, colorInner);
      gradient.addColorStop(1, colorOuter);

      context.strokeStyle = gradient;
      context.lineWidth = lineWidth;
      context.beginPath();
      traceProjectedRing(z, midNorm);
      context.stroke();
    }

    function drawTunnelTube() {
      var z;
      var step = 4.5;
      for (z = Z_FAR; z > 1; z -= step) {
        var depthFade = 1 - z / Z_FAR;
        var alpha = 0.08 + depthFade * 0.22;
        drawTunnelRing(
          z,
          0.92,
          1,
          "rgba(40, 120, 180, " + (alpha * 0.35) + ")",
          "rgba(80, 200, 255, " + alpha + ")",
          1 + depthFade * 2
        );
        drawTunnelRing(
          z,
          0.55,
          0.62,
          "rgba(20, 60, 100, " + (alpha * 0.2) + ")",
          "rgba(50, 140, 200, " + (alpha * 0.45) + ")",
          0.8
        );
      }
    }

    function drawWallSector(wall, sectorIndex, zNear, zFar) {
      if (!wall.blocked[sectorIndex]) return;

      var angleStart = wall.rotation + sectorIndex * SECTOR_ANGLE;
      var angleEnd = angleStart + SECTOR_ANGLE;

      fillProjectedSector(zNear, WALL_OUTER_NORM, angleStart, angleEnd, WALL_FILL_COLOR);
      strokeProjectedSector(zNear, WALL_OUTER_NORM, angleStart, angleEnd, WALL_EDGE_COLOR, 1.4);
    }

    function drawWalls() {
      var sorted = walls.slice();
      sorted.sort(function (a, b) {
        return b.z - a.z;
      });

      var index;
      var wall;
      for (index = 0; index < sorted.length; index++) {
        wall = sorted[index];
        var zNear = wall.z;
        var zFar = wall.z + WALL_THICKNESS;
        var sectorIndex;
        for (sectorIndex = 0; sectorIndex < SECTOR_COUNT; sectorIndex++) {
          drawWallSector(wall, sectorIndex, zNear, zFar);
        }

        if (wall.z < 30) {
          var pulse = 0.5 + Math.sin(wall.rotation * 3) * 0.5;
          context.strokeStyle = "rgba(255, 160, 80, " + (0.08 + pulse * 0.12) + ")";
          context.lineWidth = 2;
          context.beginPath();
          traceProjectedRing(wall.z, 0.98);
          context.stroke();
        }
      }
    }

    function drawSpeedStreaks() {
      if (!isPlaying()) return;
      var index;
      var z = 10;
      var lenNorm;
      for (index = 0; index < speedStreaks.length; index++) {
        var streak = speedStreaks[index];
        var inner = projectWorld(
          Math.cos(streak.angle) * streak.radiusNorm,
          Math.sin(streak.angle) * streak.radiusNorm,
          z
        );
        lenNorm = streak.length * (forwardSpeed * 0.012);
        var outer = projectWorld(
          Math.cos(streak.angle) * (streak.radiusNorm + lenNorm),
          Math.sin(streak.angle) * (streak.radiusNorm + lenNorm),
          z
        );
        context.strokeStyle = "rgba(120, 200, 255, " + (0.08 + streak.speed * 0.06) + ")";
        context.lineWidth = 1;
        context.beginPath();
        context.moveTo(inner.x, inner.y);
        context.lineTo(outer.x, outer.y);
        context.stroke();
      }
    }

    function drawVignette() {
      var center = getScreenCenter();
      var gradient = context.createRadialGradient(
        center.x, center.y, width * 0.08,
        center.x, center.y, width * 0.62
      );
      gradient.addColorStop(0, "rgba(0,0,0,0)");
      gradient.addColorStop(0.72, "rgba(0,0,0,0.08)");
      gradient.addColorStop(1, "rgba(0,0,0,0.55)");
      context.fillStyle = gradient;
      context.fillRect(0, 0, width, height);
    }

    function render() {
      var shake = getScreenShakeOffset();
      var extraShakeX = 0;
      var extraShakeY = 0;
      if (moveShakeTimer > 0) {
        extraShakeX = (Math.random() - 0.5) * 3;
        extraShakeY = (Math.random() - 0.5) * 3;
      }

      canvas.style.transform =
        "translate(" + (shake.x + extraShakeX) + "px," + (shake.y + extraShakeY) + "px)";

      context.save();
      context.clearRect(0, 0, width, height);
      drawBackground();
      drawTunnelTube();
      drawTunnelGuideLines();
      drawWalls();
      drawSpeedStreaks();
      drawVignette();
      context.restore();
    }

    function resizeCanvas() {
      var rect = canvas.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      devicePixelRatioScale = window.devicePixelRatio || 1;
      canvas.width = Math.floor(width * devicePixelRatioScale);
      canvas.height = Math.floor(height * devicePixelRatioScale);
      context.setTransform(devicePixelRatioScale, 0, 0, devicePixelRatioScale, 0, 0);
      tunnelScale = Math.min(width, height) * 0.0048;
      FOCAL_LENGTH = Math.min(width, height) * 0.95;
    }

    function applyGameLocale() {
      controlHint.textContent = getClickSteerHint();
      syncHighScoreHud(false);
    }

    function bindLocaleListener() {
      window.addEventListener("web-locale-changed", applyGameLocale);
      if (window.parent && window.parent !== window) {
        window.parent.addEventListener("web-locale-changed", applyGameLocale);
      }
    }

    var lastFrameTime = 0;
    function gameLoop(timestamp) {
      if (!lastFrameTime) lastFrameTime = timestamp;
      var deltaSeconds = Math.min(0.05, (timestamp - lastFrameTime) / 1000);
      lastFrameTime = timestamp;
      update(deltaSeconds);
      render();
      window.requestAnimationFrame(gameLoop);
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("keyup", onKeyUp);
    window.addEventListener("blur", onWindowBlur);
    gameRoot.addEventListener("pointerdown", onPointerDown);

    initStars();
    initSpeedStreaks();
    bindLocaleListener();
    loadHighScore();
    resizeCanvas();
    showStartScreen();
    applyGameLocale();
    render();
    window.requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
