<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airborne Robot</title>
  <link rel="stylesheet" href="../../../screen-shared.css" />
  <link rel="stylesheet" href="../../../settings-menu.css" />
  <script src="../iframe-game-locale.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0a0d1a;
      color: #cfe0ff;
      font-family: "Courier New", Courier, monospace;
      cursor: url("../../../cursor-pointer.svg") 2.1 0, pointer;
    }

    #gameRoot,
    #gameCanvas {
      cursor: url("../../../cursor-pointer.svg") 2.1 0, pointer;
    }

    #gameRoot {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #gameCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #damageFlash {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(circle at 20% 64%, rgba(255, 130, 40, 0.5), transparent 56%);
      opacity: 0;
    }

    #damageFlash.is-active {
      animation: damage-flash 0.34s ease-out forwards;
    }

    @keyframes damage-flash {
      0% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    #damageFlash.is-head-burst {
      background: radial-gradient(circle at 50% 64%, rgba(255, 45, 25, 0.75), rgba(255, 110, 35, 0.42) 38%, transparent 62%);
    }

    #damageFlash.is-head-burst.is-active {
      animation: head-burst-flash 0.52s ease-out forwards;
    }

    @keyframes head-burst-flash {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    #robotWrap {
      position: absolute;
      left: 0;
      top: 0;
      width: 80px;
      height: 110px;
      overflow: visible;
      pointer-events: none;
      z-index: 6;
    }

    #robotSpin {
      width: 100%;
      height: 100%;
      transform-origin: 50% 50%;
    }

    #robotSvg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      filter: drop-shadow(0 3px 8px rgba(255, 140, 50, 0.35));
    }

    #robotWrap.is-dead #robotSvg {
      filter: grayscale(0.85) brightness(0.55) drop-shadow(0 2px 4px rgba(10, 12, 26, 0.7));
    }

    .robot-part.is-lost {
      display: none;
    }

    #detachedLimbsRoot {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
      z-index: 5;
    }

    .detached-limb-wrap {
      position: absolute;
      left: 0;
      top: 0;
      overflow: visible;
      pointer-events: none;
    }

    .detached-limb-spin {
      width: 100%;
      height: 100%;
    }

    .detached-limb-spin svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      filter: drop-shadow(0 2px 6px rgba(10, 12, 26, 0.45));
    }

    #robotWrap.is-headless #robotTorso,
    #robotWrap.is-headless #robotFlame {
      display: none;
    }

    #robotWrap.is-headless #robotSvg {
      filter: drop-shadow(0 0 10px rgba(255, 120, 60, 0.85)) drop-shadow(0 3px 8px rgba(255, 140, 50, 0.4));
    }

    #robotWrap.is-shielded #robotSvg {
      animation: shield-pulse 1.4s ease-in-out infinite;
    }

    @keyframes shield-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.88; }
    }

    #robotFlame {
      opacity: 0;
      transition: opacity 0.08s linear;
    }

    #robotWrap.is-thrusting #robotFlame {
      opacity: 1;
    }

    #launchLeg {
      position: absolute;
      left: 0;
      top: 0;
      width: 100px;
      height: 200px;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.12s linear;
    }

    #launchLeg.is-visible {
      opacity: 1;
    }

    #launchLegPivot {
      width: 100%;
      height: 100%;
      transform-origin: 31.4% 13%;
    }

    #launchLegSvg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 5px 12px rgba(10, 12, 26, 0.55));
    }

    #countdownText {
      position: absolute;
      left: 50%;
      top: 36%;
      transform: translate(-50%, -50%);
      font-size: clamp(3rem, 15vmin, 8rem);
      font-weight: bold;
      letter-spacing: 0.05em;
      color: #ffe7b0;
      text-shadow: 0 0 20px rgba(255, 150, 60, 0.78), 0 4px 14px rgba(0, 0, 0, 0.55);
      z-index: 8;
      pointer-events: none;
      opacity: 0;
    }

    #countdownText.is-visible {
      opacity: 1;
    }

    #countdownText.is-go {
      color: #b6ff8a;
      text-shadow: 0 0 24px rgba(150, 255, 120, 0.85), 0 4px 14px rgba(0, 0, 0, 0.55);
    }

    #countdownText.pop {
      animation: countdown-pop 0.9s ease-out;
    }

    @keyframes countdown-pop {
      0% { transform: translate(-50%, -50%) scale(1.65); opacity: 0; }
      16% { opacity: 1; }
      30% { transform: translate(-50%, -50%) scale(1); }
      86% { opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.05); opacity: 0; }
    }

    .hud-panel {
      position: absolute;
      z-index: 7;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(120, 180, 255, 0.45);
    }

    #hudScoreRow {
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 1.15rem;
      letter-spacing: 0.14em;
      color: #dcecff;
    }

    #hudDistance {
      line-height: 1.1;
    }

    #hudSpeed {
      font-size: 0.7em;
      letter-spacing: 0.12em;
      color: #9fd0ff;
      line-height: 1.1;
    }

    #hudCombo {
      font-size: 0.78em;
      letter-spacing: 0.12em;
      color: #ffb060;
      line-height: 1.1;
      min-height: 1.1em;
    }

    #hudCombo.hidden {
      visibility: hidden;
    }

    #hudPlaying.hidden {
      display: none;
    }

    #hudParts {
      top: 12px;
      left: 14px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .part-pip {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: #ffb060;
      box-shadow: 0 0 6px rgba(255, 150, 60, 0.6);
      transition: background 0.2s linear, transform 0.2s ease, opacity 0.2s linear;
    }

    .part-pip.is-lost {
      background: #2c3550;
      box-shadow: none;
      transform: scale(0.7);
      opacity: 0.5;
    }

    #hudHighScore {
      bottom: 12px;
      right: 14px;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      color: #7e98cc;
      text-align: right;
      z-index: 9;
    }

    #hudHighScore.is-record {
      color: #ffd878;
      animation: record-title-glow 0.7s ease-in-out infinite alternate;
    }

    #debugPanel {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      min-width: min(92vw, 22rem);
      padding: 0.55em 0.65em 0.7em;
      border: 1px solid rgba(255, 128, 0, 0.55);
      background: rgba(6, 8, 12, 0.96);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      pointer-events: auto;
      font-family: "IBM3270", "CMFallback", "IBM 3270", ui-monospace, monospace;
      font-size: clamp(0.82rem, 1.75vmin, 1.02rem);
      --settings-choice-btn-height: clamp(2rem, 3.2vmin, 2.35rem);
    }

    #debugPanel.hidden {
      display: none;
    }

    #debugPanelTitle {
      margin: 0 0 0.35em;
      text-align: center;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #debugPanel .settings-controls-block {
      gap: 0;
    }

    #debugPanel .settings-row.settings-row--toggle:last-child {
      border-bottom: none;
      padding-bottom: 0.2em;
    }

    #debugPanel .debug-spawn-control {
      flex-direction: row;
      align-items: center;
      gap: 0.35em;
    }

    #debugPanel .debug-spawn-input {
      width: 5.5em;
      max-width: 100%;
      text-align: right;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    #debugPanel .debug-spawn-input::-webkit-outer-spin-button,
    #debugPanel .debug-spawn-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    #debugPanel .debug-spawn-unit {
      color: rgba(255, 200, 140, 0.45);
      letter-spacing: 0.08em;
      line-height: 1;
    }

    #debugPanel input {
      user-select: text;
      -webkit-user-select: text;
    }

    #gameScreen {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding-bottom: 26vh;
      pointer-events: none;
      background: rgba(6, 9, 20, 0.4);
    }

    #gameScreen.hidden {
      display: none;
    }

    #screenTitle {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #dcecff;
      text-shadow: 0 0 16px rgba(120, 180, 255, 0.55);
    }

    #screenMeters {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.16em;
      color: #ffb060;
    }

    #screenMeters.hidden {
      display: none;
    }

    #controlHint {
      margin: 0.35rem 0 0;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #a8c0ee;
      text-align: center;
      max-width: min(92vw, 24rem);
    }

    #controlHint.hidden {
      display: none;
    }

    #gameScreen.is-record #screenTitle {
      animation: record-title-glow 0.9s ease-in-out infinite alternate;
      color: #ffe8a8;
    }

    #gameScreen.is-record #screenMeters {
      color: #ffd878;
      animation: record-title-glow 0.7s ease-in-out infinite alternate;
    }

    @keyframes record-title-glow {
      from { text-shadow: 0 0 8px rgba(255, 200, 100, 0.4); }
      to { text-shadow: 0 0 22px rgba(255, 220, 140, 0.95), 0 0 40px rgba(255, 160, 80, 0.45); }
    }

    #recordBurst {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0;
    }

    #recordBurst.is-active {
      opacity: 1;
    }

    .record-spark {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffe090;
      box-shadow: 0 0 10px #ffb040;
      animation: record-spark-fly 1.1s ease-out forwards;
    }

    @keyframes record-spark-fly {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }

    #robotColorPicker {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      display: flex;
      gap: 0.55rem;
      pointer-events: auto;
    }

    #robotColorPicker.hidden {
      display: none;
    }

    .robot-color-option {
      padding: 0.3rem;
      margin: 0;
      font: inherit;
      color: inherit;
      border: 2px solid rgba(120, 150, 210, 0.25);
      border-radius: 8px;
      background: rgba(10, 14, 28, 0.65);
      cursor: url("../../../cursor-pointer.svg") 2.1 0, pointer;
      transition: border-color 0.15s linear, box-shadow 0.15s linear, transform 0.12s ease;
    }

    .robot-color-option:hover {
      border-color: rgba(255, 176, 96, 0.45);
      transform: translateY(-2px);
    }

    .robot-color-option.is-selected {
      border-color: #ffb060;
      box-shadow: 0 0 14px rgba(255, 150, 60, 0.5);
    }

    .robot-color-option svg {
      width: clamp(34px, 7.5vmin, 46px);
      height: auto;
      display: block;
      filter: drop-shadow(0 2px 5px rgba(10, 12, 26, 0.45));
    }
  </style>
</head>
<body>
  <div id="gameRoot">
    <canvas id="gameCanvas" aria-hidden="true"></canvas>
    <div id="damageFlash" aria-hidden="true"></div>
    <div id="detachedLimbsRoot" aria-hidden="true"></div>
    <div id="launchLeg" aria-hidden="true">
      <div id="launchLegPivot">
        <svg id="launchLegSvg" viewBox="0 0 140 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g stroke="#1f2942" stroke-width="2" stroke-linejoin="round">
            <path d="M50 34 C 92 40, 98 70, 92 106" fill="none" stroke="#b5402f" stroke-width="6" stroke-linecap="round" />
            <path d="M50 34 C 92 40, 98 70, 92 106" fill="none" stroke="#e0573f" stroke-width="2.4" stroke-linecap="round" />
            <rect x="20" y="10" width="48" height="34" rx="7" fill="#6b7ba0" />
            <rect x="26" y="16" width="20" height="12" rx="3" fill="#28324c" stroke="none" />
            <circle cx="44" cy="30" r="9" fill="#8694b8" />
            <circle cx="44" cy="30" r="3.4" fill="#28324c" stroke="none" />
            <path d="M34 32 L58 30 L100 104 L74 117 Z" fill="#5c6b8c" />
            <rect x="51" y="40" width="9" height="58" rx="4" fill="#9aa8c6" transform="rotate(28 55 70)" />
            <path d="M74 104 L100 110 L86 178 L62 172 Z" fill="#4a5878" />
            <circle cx="86" cy="110" r="16" fill="#7e8eb2" />
            <circle cx="86" cy="110" r="6" fill="#28324c" stroke="none" />
            <circle cx="74" cy="174" r="9" fill="#7e8eb2" />
            <path d="M58 166 L94 162 Q114 164 118 182 L118 190 Q118 197 109 197 L60 197 Q51 197 51 188 Z" fill="#8694b8" />
            <rect x="93" y="176" width="24" height="9" rx="3" fill="#28324c" stroke="none" />
            <circle cx="64" cy="70" r="2.6" fill="#28324c" stroke="none" />
            <circle cx="80" cy="142" r="2.6" fill="#28324c" stroke="none" />
          </g>
        </svg>
      </div>
    </div>
    <div id="robotWrap" aria-hidden="true">
      <div id="robotSpin">
        <svg id="robotSvg" viewBox="-24 -28 128 164" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g id="robotFlame">
            <path d="M30 96 Q40 132 50 96 Q40 108 30 96 Z" fill="#ffd24a" />
            <path d="M34 96 Q40 120 46 96 Q40 106 34 96 Z" fill="#ff7a1e" />
            <path d="M37 96 Q40 110 43 96 Q40 102 37 96 Z" fill="#fff2c4" />
          </g>
          <g id="robotArmLeft" class="robot-part">
            <rect x="10" y="40" width="11" height="26" rx="4" fill="#5c6b8c" stroke="#2c364f" stroke-width="1.4" />
            <circle cx="15.5" cy="68" r="5.5" fill="#7e8eb2" stroke="#2c364f" stroke-width="1.4" />
          </g>
          <g id="robotArmRight" class="robot-part">
            <rect x="59" y="40" width="11" height="26" rx="4" fill="#5c6b8c" stroke="#2c364f" stroke-width="1.4" />
            <circle cx="64.5" cy="68" r="5.5" fill="#7e8eb2" stroke="#2c364f" stroke-width="1.4" />
          </g>
          <g id="robotLegLeft" class="robot-part">
            <rect x="29" y="66" width="10" height="28" rx="3" fill="#4a5878" stroke="#262f47" stroke-width="1.4" />
            <path d="M25 92 L41 92 L43 100 L23 100 Z" fill="#8694b8" stroke="#262f47" stroke-width="1.4" stroke-linejoin="round" />
          </g>
          <g id="robotLegRight" class="robot-part">
            <rect x="41" y="66" width="10" height="28" rx="3" fill="#4a5878" stroke="#262f47" stroke-width="1.4" />
            <path d="M39 92 L55 92 L57 100 L37 100 Z" fill="#8694b8" stroke="#262f47" stroke-width="1.4" stroke-linejoin="round" />
          </g>
          <g id="robotTorso">
            <rect x="24" y="34" width="32" height="40" rx="9" fill="#6b7ba0" stroke="#2c364f" stroke-width="1.6" />
            <rect x="30" y="42" width="20" height="16" rx="4" fill="#28324c" />
            <circle cx="40" cy="50" r="5.2" fill="#ff7a1e" stroke="#ffd24a" stroke-width="1.4" />
            <rect x="33" y="63" width="14" height="4" rx="2" fill="#3a4566" />
          </g>
          <g id="robotHead">
            <line x1="40" y1="14" x2="40" y2="4" stroke="#7e8eb2" stroke-width="2" stroke-linecap="round" />
            <circle cx="40" cy="3" r="3" fill="#ff7a1e" />
            <rect x="28" y="12" width="24" height="22" rx="8" fill="#8694b8" stroke="#2c364f" stroke-width="1.6" />
            <rect x="32" y="19" width="16" height="8" rx="4" fill="#0e1426" />
            <circle cx="37" cy="23" r="2.4" fill="#ff5a3c" />
            <circle cx="45" cy="23" r="2.4" fill="#ff5a3c" />
          </g>
        </svg>
      </div>
    </div>
    <div id="countdownText" aria-hidden="true"></div>
    <div id="hudPlaying">
      <div id="hudScoreRow" class="hud-panel">
        <div id="hudDistance">0m</div>
        <div id="hudSpeed">0 m/s</div>
        <div id="hudCombo" class="hidden">x0</div>
      </div>
      <div id="hudParts" class="hud-panel"></div>
    </div>
    <div id="hudHighScore" class="hud-panel">best 0m</div>
    <div id="debugPanel" class="hidden" aria-hidden="true">
      <div id="debugPanelTitle" class="term-row-label terminal-text">Debug</div>
      <div class="settings-controls-block">
        <div class="settings-row settings-row--toggle">
          <div class="settings-field-line">
            <div class="settings-field-label-box">
              <span class="settings-label">
                <span class="settings-label-text term-row-label terminal-text">Initial position</span>
              </span>
            </div>
            <div class="settings-field-control-box settings-field-control-box--toggle debug-spawn-control">
              <input id="debugSpawnInput" type="number" min="0" step="100" class="settings-slider-value-input debug-spawn-input" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="Initial position" />
              <span class="debug-spawn-unit terminal-text--dim">m</span>
            </div>
          </div>
        </div>
        <div class="settings-row settings-row--toggle">
          <div class="settings-field-line">
            <div class="settings-field-label-box">
              <span class="settings-label">
                <span class="settings-label-text term-row-label terminal-text">Godmode</span>
              </span>
            </div>
            <div class="settings-field-control-box settings-field-control-box--toggle">
              <button id="debugGodmodeSwitch" type="button" class="settings-switch" role="switch" aria-checked="false" aria-label="Godmode">
                <span class="settings-switch-track" aria-hidden="true">
                  <span class="settings-switch-thumb"></span>
                </span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="gameScreen">
      <h1 id="screenTitle">Airborne Robot</h1>
      <p id="controlHint">Hold to reverse spin &mdash; land on your feet</p>
      <p id="screenMeters" class="hidden">0m</p>
      <div id="robotColorPicker" aria-label="Robot color"></div>
      <div id="recordBurst" aria-hidden="true"></div>
    </div>
  </div>
  <script src="../extras-game-start-music-notify.js"></script>
  <script>
    var HIGH_SCORE_STORAGE_KEY = "cm-airborne-robot-high-score";
    var ROBOT_COLOR_STORAGE_KEY = "cm-airborne-robot-color";
    var GAME_TITLE = "Airborne Robot";
    var LOCALE_KEY_GAME_OVER = "web.game.game-over";
    var LOCALE_KEY_BEST_LABEL = "web.game.best-label";
    var LOCALE_KEY_METERS_SUFFIX = "web.game.meters-suffix";
    var SPEED_SUFFIX = " m/s";
    var LOCALE_KEY_HOLD_REVERSE = "web.game.prompt.hold-reverse-spin";
    var HINT_FALLBACK = "Hold to reverse spin \u2014 land on your feet";
    var COMBO_PREFIX = "x";

    var METERS_PER_UNIT = 0.06;

    // ========== DEBUG-ONLY — revert: delete this entire block ==========
    var DEBUG_MODE_KEY_CODE = "F8";
    var DEBUG_SPAWN_DEFAULT_METERS = 2500;
    var debugModeEnabled = false;
    // ========== end DEBUG-ONLY ==========

    var PHASE_START = "start";
    var PHASE_LAUNCH = "launch";
    var PHASE_PLAYING = "playing";
    var PHASE_GAME_OVER = "gameover";

    var LAUNCH_COUNTDOWN_SECONDS = 3;
    var LAUNCH_KICK_DURATION = 0.24;
    var LAUNCH_KICK_CONTACT = 0.1;
    var LAUNCH_FORWARD_SPEED = 430;
    var LAUNCH_BOUNCE = 540;
    var HEAD_LAUNCH_SPEED_MULTIPLIER = 2;
    var HEAD_LAUNCH_SPEED = HEAD_LAUNCH_SPEED_MULTIPLIER * Math.sqrt(LAUNCH_FORWARD_SPEED * LAUNCH_FORWARD_SPEED + LAUNCH_BOUNCE * LAUNCH_BOUNCE);
    var HEAD_LAUNCH_BEACON_BONUS = 1;
    var HEAD_GAME_OVER_BOUNCE_FACTOR = 0.38;
    var HEAD_GAME_OVER_BOUNCE_MIN = 60;
    var HEAD_GROUND_SPEED_FRICTION = 1.4;
    var HEAD_GROUND_SPIN_FRICTION = 0.8;
    var HEAD_LANDING_LOCK_SECONDS = 0.08;
    var LEG_REST_ANGLE = 0.2;
    var LEG_COCK_ANGLE = 0.62;
    var LEG_KICK_ANGLE = -0.72;
    var LEG_FADE_SECONDS = 0.5;
    var PLATEAU_EDGE_OFFSET_FACTOR = 0.5;

    var GOOD_LANDING_TOLERANCE = 0.62;
    var PERFECT_LANDING_TOLERANCE = 0.24;
    var TWO_PI = Math.PI * 2;
    var TWO_OVER_PI = 2 / Math.PI;

    var LIMB_LOSS_ORDER = ["robotArmRight", "robotArmLeft", "robotLegRight", "robotLegLeft"];
    var TOTAL_LIMBS = LIMB_LOSS_ORDER.length;
    var LIMB_HIT_POINTS = 2;

    }

    function getRobotBodyCenterOffsetX() {
      return (ROBOT_BODY_CENTER_X + ROBOT_VIEW_PAD_LEFT) * getRobotUnitScale();
    }

    function getRobotBodyCenterOffsetY() {
      return (ROBOT_BODY_CENTER_Y + ROBOT_VIEW_PAD_TOP) * getRobotUnitScale();
    }

    function getHeadCenterOffsetX() {
      return (HEAD_CENTER_X + ROBOT_VIEW_PAD_LEFT) * getRobotUnitScale();
    }

    function getHeadCenterOffsetY() {
      return (HEAD_CENTER_Y + ROBOT_VIEW_PAD_TOP) * getRobotUnitScale();
    }

    function setHeadDetachOffsets() {
      var unitScale = getRobotUnitScale();
      var localOffsetX = (HEAD_CENTER_X - ROBOT_BODY_CENTER_X) * unitScale;
      var localOffsetY = (HEAD_CENTER_Y - ROBOT_BODY_CENTER_Y) * unitScale;
      var cos = Math.cos(robotAngle);
      var sin = Math.sin(robotAngle);
      headDetachOffsetNaturalX = localOffsetX * cos - localOffsetY * sin;
      headDetachOffsetNaturalY = localOffsetX * sin + localOffsetY * cos;
    }

    function resizeCanvas() {
      var rect = canvas.getBoundingClientRect();
      width = Math.max(320, Math.floor(rect.width));
      height = Math.max(200, Math.floor(rect.height));
      devicePixelRatioScale = window.devicePixelRatio || 1;
      canvas.width = Math.floor(width * devicePixelRatioScale);
      canvas.height = Math.floor(height * devicePixelRatioScale);
      context.setTransform(devicePixelRatioScale, 0, 0, devicePixelRatioScale, 0, 0);
      robotPx = Math.max(64, Math.min(140, Math.min(width, height) * 0.16));
      footReach = robotPx * footReachRatio;
      robotWrap.style.width = getRobotWrapWidth() + "px";
      robotWrap.style.height = getRobotWrapHeight() + "px";
      playerScreenX = width * 0.32;
      playerWorldX = worldScroll + playerScreenX;
      if (isStart() || isLaunch()) {
        plateauEndWorldX = playerScreenX + robotPx * PLATEAU_EDGE_OFFSET_FACTOR;
      }
    }

    function groundBumpNoise(worldX) {
      var bumpScale = height * GROUND_BUMP_RATIO;
      return (
        Math.sin(worldX * 0.016) * bumpScale +
        Math.sin(worldX * 0.039 + 1.8) * bumpScale * 0.5 +
        Math.sin(worldX * 0.085 + 3.4) * bumpScale * 0.3
      );
    }

    function getWorldElevation(worldX) {
      if (worldX <= plateauEndWorldX) {
        return 0;
      }
      var pastEdge = worldX - plateauEndWorldX;
      var bumpRamp = Math.min(1, pastEdge / 240);
      return pastEdge * GROUND_SLOPE_TANGENT + groundBumpNoise(worldX) * bumpRamp;
    }

    function groundWave(worldX) {
      var playerGroundScreenY = height * GROUND_PLAYER_Y_RATIO;
      return playerGroundScreenY + getWorldElevation(worldX) - getWorldElevation(playerWorldX);
    }

    function getForwardSpinRate() {
      return baseSpinRate + forwardSpeed * SPIN_SPEED_FACTOR + spinBonus;
    }

    function getReverseSpinRate() {
      return (REVERSE_BASE_SPIN_RATE + forwardSpeed * REVERSE_SPIN_SPEED_FACTOR) * REVERSE_SPIN_MULTIPLIER;
    }

    function getPlayerGroundY() {
      return groundWave(playerWorldX);
    }

    function getGroundSlopeAngle(worldX) {
      var sampleDelta = 4;
      var elevationAhead = getWorldElevation(worldX + sampleDelta);
      var elevationBehind = getWorldElevation(worldX - sampleDelta);
      var screenSlope = (elevationAhead - elevationBehind) / (2 * sampleDelta);
      return Math.atan(screenSlope);
    }

    function normalizeAngle(angle) {
      var result = angle % TWO_PI;
      if (result < 0) {
        result += TWO_PI;
      }
      return result;
    }

    function getUprightError(angle) {
      var normalized = normalizeAngle(angle);
      return Math.min(normalized, TWO_PI - normalized);
    }

    function rebaseWorldCoordinates() {
      if (worldScroll < WORLD_REBASE_THRESHOLD) {
        return;
      }
      var shift = worldScroll - WORLD_REBASE_TARGET;
      var index;
      worldScroll = WORLD_REBASE_TARGET;
      playerWorldX -= shift;
      for (index = 0; index < exhaustParticles.length; index++) {
        exhaustParticles[index].worldX -= shift;
      }
      for (index = 0; index < landingRings.length; index++) {
        landingRings[index].worldX -= shift;
      }
      for (index = 0; index < beacons.length; index++) {
        beacons[index].worldX -= shift;
      }
      for (index = 0; index < detachedLimbs.length; index++) {
        detachedLimbs[index].worldX -= shift;
      }
    }

    function getLimbWorldAnchor(localX, localY) {
      var spinW = robotPx * ROBOT_VIEW_WIDTH / ROBOT_VIEW_HEIGHT;
      var spinH = robotPx;
      var centerX = playerScreenX;
      var centerY = getPlayerGroundY() + playerYOffset - footReach;
      var normalizedX = (localX / ROBOT_VIEW_WIDTH - 0.5) * spinW;
      var normalizedY = (localY / ROBOT_VIEW_HEIGHT - 0.5) * spinH;
      var cos = Math.cos(robotAngle);
      var sin = Math.sin(robotAngle);
      return {
        x: centerX + normalizedX * cos - normalizedY * sin,
        y: centerY + normalizedX * sin + normalizedY * cos
      };
    }

    function spawnLimbDebris(limbId) {
      var config = LIMB_DETACH_CONFIG[limbId];
      var origin = getLimbWorldAnchor(config.centerX, config.centerY);
      spawnSparks(origin.x, origin.y, 8);
    }

    function getDetachedLimbDetachAngle(limbId) {
      var localRadians = 0;
      if (limbId === "robotArmLeft") {
        localRadians = armLeftAngle * DEG_TO_RAD;
      } else if (limbId === "robotArmRight") {
        localRadians = armRightAngle * DEG_TO_RAD;
      } else if (limbId === "robotLegLeft") {
        localRadians = legLeftSwayAngle * DEG_TO_RAD;
      } else if (limbId === "robotLegRight") {
        localRadians = legRightSwayAngle * DEG_TO_RAD;
      }
      return robotAngle + localRadians;
    }

    function getDetachedLimbLaunchVelocity(limbId) {
      var lateral = Math.sin(robotAngle);
      var vertical = -Math.cos(robotAngle);
      return {
        velocityWorldX: forwardSpeed * 0.22 + lateral * 130 + (Math.random() - 0.5) * 90,
        velocityY: vertical * 80 - 150 - Math.random() * 110
      };
    }

    function createDetachedLimbElement(limbId) {
      var wrap = document.createElement("div");
      wrap.className = "detached-limb-wrap";
      var spin = document.createElement("div");
      spin.className = "detached-limb-spin";
      var svg = document.createElementNS(SVG_NS, "svg");
      svg.setAttribute("viewBox", "-24 -28 128 164");
      svg.setAttribute("aria-hidden", "true");
      var group = limbElements[limbId].cloneNode(true);
      group.removeAttribute("id");
      group.removeAttribute("class");
      group.removeAttribute("transform");
      svg.appendChild(group);
      spin.appendChild(svg);
      wrap.appendChild(spin);
      detachedLimbsRoot.appendChild(wrap);
      return {
        wrapElement: wrap,
        spinElement: spin
      };
    }

    function removeDetachedLimbAt(index) {
      var limb = detachedLimbs[index];
      if (limb.wrapElement.parentNode === detachedLimbsRoot) {
        detachedLimbsRoot.removeChild(limb.wrapElement);
      }
      detachedLimbs.splice(index, 1);
    }

    function removeDetachedLimbById(limbId) {
      var index;
      for (index = detachedLimbs.length - 1; index >= 0; index--) {
        if (detachedLimbs[index].limbId === limbId) {
          removeDetachedLimbAt(index);
          return;
        }
      }
    }

    function clearDetachedLimbs() {
      while (detachedLimbs.length > 0) {
        removeDetachedLimbAt(0);
      }
    }

    function spawnDetachedLimb(limbId) {
      var config = LIMB_DETACH_CONFIG[limbId];
      var origin = getLimbWorldAnchor(config.centerX, config.centerY);
      var launch = getDetachedLimbLaunchVelocity(limbId);
      var elements = createDetachedLimbElement(limbId);
      detachedLimbs.push({
        limbId: limbId,
        worldX: worldScroll + origin.x,
        screenY: origin.y,
        velocityWorldX: launch.velocityWorldX,
        velocityY: launch.velocityY,
        angle: getDetachedLimbDetachAngle(limbId),
        angularVelocity: robotAngularVelocity * 0.55 + (Math.random() - 0.5) * 9,
        rollRadiusSvg: config.rollRadiusSvg,
        grounded: false,
        wrapElement: elements.wrapElement,
        spinElement: elements.spinElement
      });
      spawnLimbDebris(limbId);
    }

    function getDetachedLimbRollRadius(limb) {
      return limb.rollRadiusSvg * getRobotUnitScale();
    }

    function getDetachedLimbPivotOffset(limbId) {
      var config = LIMB_DETACH_CONFIG[limbId];
      var unitScale = getRobotUnitScale();
      return {
        x: (config.centerX + ROBOT_VIEW_PAD_LEFT) * unitScale,
        y: (config.centerY + ROBOT_VIEW_PAD_TOP) * unitScale
      };
    }

    function updateDetachedLimbs(deltaSeconds) {
      if (detachedLimbs.length === 0) {
        return;
      }
      var index = 0;
      while (index < detachedLimbs.length) {
        var limb = detachedLimbs[index];
        var rollRadius = getDetachedLimbRollRadius(limb);
        if (!limb.grounded) {
          limb.velocityY += DETACHED_LIMB_GRAVITY * deltaSeconds;
          limb.screenY += limb.velocityY * deltaSeconds;
          limb.worldX += limb.velocityWorldX * deltaSeconds;
          limb.angle += limb.angularVelocity * deltaSeconds;
          var groundY = groundWave(limb.worldX);
          if (limb.screenY + rollRadius >= groundY) {
            limb.screenY = groundY - rollRadius;
            if (Math.abs(limb.velocityY) > 55) {
              limb.velocityY = -Math.abs(limb.velocityY) * DETACHED_LIMB_BOUNCE;
              limb.velocityWorldX *= 0.88;
              limb.angularVelocity += limb.velocityWorldX / rollRadius * 0.35;
            } else {
              limb.velocityY = 0;
              limb.grounded = true;
              limb.angularVelocity = limb.velocityWorldX / rollRadius;
            }
          }
        } else {
          var slopeAngle = getGroundSlopeAngle(limb.worldX);
          limb.velocityWorldX += DETACHED_LIMB_GRAVITY * Math.sin(slopeAngle) * deltaSeconds;
          limb.velocityWorldX *= Math.exp(-DETACHED_LIMB_GROUND_FRICTION * deltaSeconds);
          limb.worldX += limb.velocityWorldX * deltaSeconds;
          limb.screenY = groundWave(limb.worldX) - rollRadius;
          if (Math.abs(limb.velocityWorldX) > 8) {
            limb.angularVelocity = limb.velocityWorldX / rollRadius;
          } else {
            limb.velocityWorldX = 0;
            limb.angularVelocity *= Math.exp(-DETACHED_LIMB_GROUND_FRICTION * deltaSeconds);
          }
          limb.angle += limb.angularVelocity * deltaSeconds;
        }
        if (limb.worldX < worldScroll - DETACHED_LIMB_OFFSCREEN_MARGIN) {
          removeDetachedLimbAt(index);
        } else {
          index += 1;
        }
      }
    }

    function positionDetachedLimbsDom() {
      if (detachedLimbs.length === 0) {
        return;
      }
      var wrapWidth = getRobotWrapWidth();
      var wrapHeight = getRobotWrapHeight();
      var pivotY = height * GROUND_PLAYER_Y_RATIO;
      var index;
      for (index = 0; index < detachedLimbs.length; index++) {
        var limb = detachedLimbs[index];
        var pivotOffset = getDetachedLimbPivotOffset(limb.limbId);
        var naturalScreenX = limb.worldX - worldScroll;
        var naturalScreenY = limb.screenY;
        var scaledScreenX = playerScreenX + (naturalScreenX - playerScreenX) * cameraScale;
        var scaledScreenY = pivotY + (naturalScreenY - pivotY) * cameraScale;
        var scaledWidth = wrapWidth * cameraScale;
        var scaledHeight = wrapHeight * cameraScale;
        var pivotOffsetX = pivotOffset.x * cameraScale;
        var pivotOffsetY = pivotOffset.y * cameraScale;
        limb.wrapElement.style.width = scaledWidth + "px";
        limb.wrapElement.style.height = scaledHeight + "px";
        limb.wrapElement.style.left = (scaledScreenX - pivotOffsetX) + "px";
        limb.wrapElement.style.top = (scaledScreenY - pivotOffsetY) + "px";
        limb.spinElement.style.transformOrigin = pivotOffset.x + "px " + pivotOffset.y + "px";
        limb.spinElement.style.transform = "rotate(" + limb.angle + "rad)";
      }
    }

    function spawnSparks(originX, originY, count, baseHue) {
      var sparkHue = baseHue == null ? SPARK_DEFAULT_HUE : baseHue;
      var index;
      for (index = 0; index < count; index++) {
        var angle = Math.random() * TWO_PI;
        var speed = 80 + Math.random() * 220;
        sparkParticles.push({
          x: originX,
          y: originY,
          velocityX: Math.cos(angle) * speed,
          velocityY: Math.sin(angle) * speed - 40,
          age: 0,
          life: 0.3 + Math.random() * 0.3,
          size: 1.5 + Math.random() * 2.5,
          hue: sparkHue + Math.random() * 26
        });
      }
    }

    function spawnLandingRing(quality) {
      landingRings.push({
        worldX: playerWorldX,
        groundY: getPlayerGroundY(),
        age: 0,
        life: 0.5,
        maxRadius: quality === "perfect" ? 64 : 44,
        quality: quality
      });
    }

    function spawnExhaust() {
      var groundY = getPlayerGroundY();
      var footY = groundY + playerYOffset;
      exhaustParticles.push({
        worldX: playerWorldX + (Math.random() - 0.5) * 16,
        y: footY - 6 - Math.random() * 10,
        radius: 5 + Math.random() * 6,
        life: 0.5 + Math.random() * 0.4,
        age: 0,
        riseSpeed: 16 + Math.random() * 26,
        expandRate: 16 + Math.random() * 22
      });
    }

    function triggerScreenShake(duration, strength) {
      screenShakeTimer = duration;
      screenShakeDuration = duration;
      screenShakeStrength = strength;
    }

    function triggerDamageEffects() {
      triggerScreenShake(0.24, 8);
      damageFlash.classList.remove("is-active");
      damageFlash.classList.remove("is-head-burst");
      void damageFlash.offsetWidth;
      damageFlash.classList.add("is-active");
    }

    function triggerHeadBurstFlash() {
      damageFlash.classList.remove("is-active");
      damageFlash.classList.add("is-head-burst");
      void damageFlash.offsetWidth;
      damageFlash.classList.add("is-active");
    }

    function clearHeadTrail() {
      headTrailPoints.length = 0;
      headTrailSampleTimer = 0;
      headTrailActive = false;
    }

    function startHeadTrail() {
      headTrailPoints.length = 0;
      headTrailSampleTimer = 0;
      headTrailActive = true;
    }

    function updateHeadTrail(deltaSeconds) {
      if (!headDetached || !headTrailActive) {
        return;
      }
      headTrailSampleTimer -= deltaSeconds;
      if (headTrailSampleTimer <= 0) {
        headTrailSampleTimer = HEAD_TRAIL_POINT_INTERVAL;
        var origin = getHeadScreenCenter();
        headTrailPoints.push({
          x: origin.x,
          y: origin.y,
          age: 0
        });
        if (headTrailPoints.length > HEAD_TRAIL_MAX_POINTS) {
          headTrailPoints.shift();
        }
      }
      var index = 0;
      while (index < headTrailPoints.length) {
        headTrailPoints[index].age += deltaSeconds;
        if (headTrailPoints[index].age >= HEAD_TRAIL_POINT_LIFE) {
          headTrailPoints.splice(index, 1);
        } else {
          index += 1;
        }
      }
    }

    function spawnExplosionSparks(originX, originY, count) {
      var index;
      for (index = 0; index < count; index++) {
        var angle = Math.random() * TWO_PI;
        var speed = 140 + Math.random() * 320;
        sparkParticles.push({
          x: originX,
          y: originY,
          velocityX: Math.cos(angle) * speed,
          velocityY: Math.sin(angle) * speed - 80,
          age: 0,
          life: 0.45 + Math.random() * 0.35,
          size: 3 + Math.random() * 5,
          hue: SPARK_HEAD_HUE + Math.random() * 18
        });
      }
    }

    function spawnHeadDetachExplosion(originX, originY) {
      var index;
      triggerScreenShake(HEAD_DETACH_SHAKE_DURATION, HEAD_DETACH_SHAKE_STRENGTH);
      triggerHeadBurstFlash();
      spawnSparks(originX, originY, 22, SPARK_HEAD_HUE);
      spawnExplosionSparks(originX, originY, 24);
      explosionBursts.push({
        x: originX,
        y: originY,
        age: 0,
        life: 0.58,
        maxRadius: 96
      });
      explosionBursts.push({
        x: originX,
        y: originY,
        age: 0,
        life: 0.38,
        maxRadius: 52
      });
      for (index = 0; index < 10; index++) {
        spawnLimbDebrisAtCenter();
      }
    }

    function updateExplosionBursts(deltaSeconds) {
      var index = 0;
      while (index < explosionBursts.length) {
        explosionBursts[index].age += deltaSeconds;
        if (explosionBursts[index].age >= explosionBursts[index].life) {
          explosionBursts.splice(index, 1);
        } else {
          index += 1;
        }
      }
    }

    function applyGoodLanding(uprightError, impactSpeed) {
      var isPerfect = uprightError < PERFECT_LANDING_TOLERANCE;
      var bounceUp;
      comboCount += 1;
      setComboHud();
      var speedGain = 14 + Math.min(comboCount, 12) * 1.6;
      if (isPerfect) {
        speedGain += 12;
      }
      forwardSpeed = Math.min(FORWARD_SPEED_MAX, forwardSpeed + speedGain);
      spinBonus = Math.min(SPIN_BONUS_MAX, spinBonus + (isPerfect ? PERFECT_SPIN_BONUS : GOOD_SPIN_BONUS));
      bounceUp = impactSpeed * 0.62 + 280 + forwardSpeed * 0.32;
      if (isPerfect) {
        bounceUp += 120;
      }
      playerVelocityY = -bounceUp;
      playerYOffset = 0;
      spawnLandingRing(isPerfect ? "perfect" : "good");
      spawnSparks(playerScreenX, getPlayerGroundY() + playerYOffset, isPerfect ? 10 : 5);
    }

    function setShieldActive(active) {
      shieldActive = active;
      if (active) {
        robotWrap.classList.add("is-shielded");
      } else {
        robotWrap.classList.remove("is-shielded");
      }
      updateRobotGlowFilter();
    }

    function consumeShield() {
      if (!shieldActive) {
        return false;
      }
      setShieldActive(false);
      spawnSparks(playerScreenX, getPlayerGroundY() + playerYOffset - footReach, 10, SPARK_SHIELD_HUE);
      return true;
    }

    function applyBadLanding(impactSpeed) {
      if (isDebugGodmodeEnabled()) {
        playerVelocityY = -(impactSpeed * 0.32 + 180);
        playerYOffset = 0;
        landingLockTimer = 0.12;
        return;
      }
      if (shieldActive) {
        consumeShield();
        playerVelocityY = -(impactSpeed * 0.32 + 180);
        playerYOffset = 0;
        landingLockTimer = 0.12;
        return;
      }
      comboCount = 0;
      setComboHud();
      forwardSpeed = Math.max(FORWARD_SPEED_MIN, forwardSpeed * 0.58);
      spinBonus = 0;
      triggerDamageEffects();
      currentLimbDamage += 1;
      if (currentLimbDamage < LIMB_HIT_POINTS) {
        playerVelocityY = -(impactSpeed * 0.32 + 180);
        playerYOffset = 0;
        landingLockTimer = 0.12;
        return;
      }
      currentLimbDamage = 0;
      var limbId = LIMB_LOSS_ORDER[lostLimbCount];
      lostLimbCount += 1;
      limbElements[limbId].classList.add("is-lost");
      syncPartPips();
      spawnDetachedLimb(limbId);
      playerVelocityY = -(impactSpeed * 0.32 + 180);
      playerYOffset = 0;
      landingLockTimer = 0.12;
    }

    function launchHead() {
      headDetached = true;
      setShieldActive(false);
      robotWrap.classList.add("is-headless");
      robotWrap.classList.remove("is-thrusting");
      resetRobotGlow();
      var facingX = Math.sin(robotAngle);
      var facingY = -Math.cos(robotAngle);
      var headLaunchSpeed = HEAD_LAUNCH_SPEED + headLaunchBeaconBonus;
      forwardSpeed = facingX * headLaunchSpeed;
      playerVelocityY = facingY * headLaunchSpeed;
      playerYOffset = 0;
      landingLockTimer = 0.18;
      spinBonus = 0;
      comboCount = 0;
      setComboHud();
      setHeadDetachOffsets();
      startHeadTrail();
      var neckOrigin = getLimbWorldAnchor(HEAD_NECK_X, HEAD_NECK_Y);
      spawnHeadDetachExplosion(neckOrigin.x, neckOrigin.y);
    }

    function spawnLimbDebrisAtCenter() {
      var centerX = playerScreenX;
      var centerY = getPlayerGroundY() + playerYOffset - footReach;
      var angle = Math.random() * TWO_PI;
      var speed = 120 + Math.random() * 260;
      var debrisColors = getDebrisColorPair();
      debrisParticles.push({
        x: centerX,
        y: centerY,
        velocityX: Math.cos(angle) * speed,
        velocityY: Math.sin(angle) * speed - 160,
        rotation: Math.random() * TWO_PI,
        spin: (Math.random() - 0.5) * 18,
        size: 7 + Math.random() * 10,
        age: 0,
        life: 1.3 + Math.random() * 0.7,
        color: Math.random() > 0.5 ? debrisColors.dark : debrisColors.light
      });
    }

    function applyHeadGameOverLanding(impactSpeed) {
      clearHeadTrail();
      playerYOffset = 0;
      landingLockTimer = HEAD_LANDING_LOCK_SECONDS;
      var bounceUp = impactSpeed * HEAD_GAME_OVER_BOUNCE_FACTOR + HEAD_GAME_OVER_BOUNCE_MIN;
      if (bounceUp > 30) {
        playerVelocityY = -bounceUp;
      } else {
        playerVelocityY = 0;
      }
      forwardSpeed *= 0.94;
      spawnSparks(playerScreenX, getPlayerGroundY() + playerYOffset - footReach, 6);
    }

    function updateHeadGameOverPhysics(deltaSeconds) {
      playerVelocityY += gravity * deltaSeconds;
      playerYOffset += playerVelocityY * deltaSeconds;
      if (landingLockTimer > 0) {
        landingLockTimer -= deltaSeconds;
        return;
      }
      if (playerYOffset >= 0) {
        if (playerVelocityY > 0) {
          applyHeadGameOverLanding(playerVelocityY);
        } else {
          playerYOffset = 0;
          forwardSpeed *= Math.exp(-HEAD_GROUND_SPEED_FRICTION * deltaSeconds);
          robotAngularVelocity *= Math.exp(-HEAD_GROUND_SPIN_FRICTION * deltaSeconds);
        }
      }
    }

    function updateHeadGameOverWorld(deltaSeconds) {
      worldScroll += forwardSpeed * deltaSeconds;
      playerWorldX = worldScroll + playerScreenX;
      var layerIndex;
      for (layerIndex = 0; layerIndex < parallaxPhase.length; layerIndex++) {
        parallaxPhase[layerIndex] += forwardSpeed * parallaxSpeeds[layerIndex] * deltaSeconds;
      }
      rebaseWorldCoordinates();
      robotAngle += robotAngularVelocity * deltaSeconds;
      updateHeadGameOverPhysics(deltaSeconds);
      updateCamera(deltaSeconds);
      updateDebris(deltaSeconds);
      updateSparks(deltaSeconds);
      updateExplosionBursts(deltaSeconds);
      updateHeadTrail(deltaSeconds);
      positionRobotDom();
    }

    function processLanding() {
      var impactSpeed = playerVelocityY;
      if (headDetached) {
        if (!isGameOver()) {
          endGame();
        }
        applyHeadGameOverLanding(impactSpeed);
        return;
      }
      if (lostLimbCount >= TOTAL_LIMBS) {
        if (!isDebugGodmodeEnabled()) {
          launchHead();
        }
        return;
      }
      var groundSlopeAngle = getGroundSlopeAngle(playerWorldX);
      var uprightError = getUprightError(robotAngle - groundSlopeAngle);
      resetRobotGlow();
      if (uprightError <= GOOD_LANDING_TOLERANCE) {
        applyGoodLanding(uprightError, impactSpeed);
      } else {
        applyBadLanding(impactSpeed);
      }
    }

    function resetRobotGlow() {
      robotPassiveSpinAccumulated = 0;
      robotGlowStrength = 0;
      robotSvg.style.filter = "";
    }

    function getRobotGlowTargetStrength() {
      if (headDetached || !isPlaying()) {
        return 0;
      }
      var spinBeyondStart = robotPassiveSpinAccumulated - GLOW_START_RADIANS;
      if (spinBeyondStart <= 0) {
        return 0;
      }
      var extraRotations = spinBeyondStart / TWO_PI;
      var targetStrength = extraRotations / GLOW_MAX_ROTATIONS;
      if (targetStrength > 1) {
        targetStrength = 1;
      }
      if (pointerHeld) {
        targetStrength *= GLOW_ALIGN_MULTIPLIER;
      }
      return targetStrength;
    }

    function updateRobotGlowStrength(deltaSeconds) {
      var targetStrength = getRobotGlowTargetStrength();
      var lerpFactor = deltaSeconds * GLOW_LERP_RATE;
      if (lerpFactor > 1) {
        lerpFactor = 1;
      }
      robotGlowStrength += (targetStrength - robotGlowStrength) * lerpFactor;
    }

    function getShieldOutlineFilter() {
      if (!shieldActive) {
        return "";
      }
      return "drop-shadow(0 0 2px rgba(255, 255, 255, " + SHIELD_OUTLINE_INNER_ALPHA + ")) drop-shadow(0 0 5px rgba(255, 255, 255, " + SHIELD_OUTLINE_MID_ALPHA + ")) drop-shadow(0 0 10px rgba(255, 255, 255, " + SHIELD_OUTLINE_OUTER_ALPHA + ")) ";
    }

    function getRobotGlowFilter() {
      var shieldFilter = getShieldOutlineFilter();
      if (robotGlowStrength <= 0.001) {
        return shieldFilter + ROBOT_SHADOW_FILTER;
      }
      var innerBlur = 4 + robotGlowStrength * 18;
      var outerBlur = 10 + robotGlowStrength * 30;
      var innerAlpha = robotGlowStrength * 0.82;
      var outerAlpha = robotGlowStrength * 0.44;
      return shieldFilter + "drop-shadow(0 0 " + innerBlur.toFixed(1) + "px rgba(148, 72, 255, " + innerAlpha.toFixed(3) + ")) drop-shadow(0 0 " + outerBlur.toFixed(1) + "px rgba(120, 50, 220, " + outerAlpha.toFixed(3) + ")) " + ROBOT_SHADOW_FILTER;
    }

    function updateRobotGlowFilter() {
      if (robotWrap.classList.contains("is-dead") || robotWrap.classList.contains("is-headless")) {
        robotSvg.style.filter = "";
        return;
      }
      if (!isPlaying()) {
        robotSvg.style.filter = "";
        return;
      }
      robotSvg.style.filter = getRobotGlowFilter();
    }

    function updateRobotSpin(deltaSeconds) {
      var spinDelta;
      if (pointerHeld) {
        robotAngularVelocity = -getReverseSpinRate();
        spinDelta = Math.abs(robotAngularVelocity * deltaSeconds);
        robotPassiveSpinAccumulated -= spinDelta;
        if (robotPassiveSpinAccumulated < 0) {
          robotPassiveSpinAccumulated = 0;
        }
      } else {
        robotAngularVelocity = getForwardSpinRate();
        if (!headDetached) {
          spinDelta = Math.abs(robotAngularVelocity * deltaSeconds);
          robotPassiveSpinAccumulated += spinDelta;
        }
      }
      robotAngle += robotAngularVelocity * deltaSeconds;
      updateRobotGlowStrength(deltaSeconds);
    }

    function setRobotArmRotation(armElement, angleDegrees, pivotX, pivotY) {
      armElement.setAttribute("transform", "rotate(" + angleDegrees + " " + pivotX + " " + pivotY + ")");
    }

    function resetRobotArms() {
      armLeftAngle = 0;
      armRightAngle = 0;
      armSwayPhase = 0;
      legHeadSwayPhase = 0;
      legLeftSwayAngle = 0;
      legRightSwayAngle = 0;
      if (!limbElements.robotArmLeft.classList.contains("is-lost")) {
        setRobotArmRotation(limbElements.robotArmLeft, 0, ARM_SHOULDER_LEFT_X, ARM_SHOULDER_LEFT_Y);
      }
      if (!limbElements.robotArmRight.classList.contains("is-lost")) {
        setRobotArmRotation(limbElements.robotArmRight, 0, ARM_SHOULDER_RIGHT_X, ARM_SHOULDER_RIGHT_Y);
      }
      if (!limbElements.robotLegLeft.classList.contains("is-lost")) {
        setRobotArmRotation(limbElements.robotLegLeft, 0, LEG_HIP_LEFT_X, LEG_HIP_LEFT_Y);
      }
      if (!limbElements.robotLegRight.classList.contains("is-lost")) {
        setRobotArmRotation(limbElements.robotLegRight, 0, LEG_HIP_RIGHT_X, LEG_HIP_RIGHT_Y);
      }
      if (robotHeadElement) {
        setRobotArmRotation(robotHeadElement, 0, HEAD_NECK_X, HEAD_NECK_Y);
      }
    }

    function clampArmAngle(angle, minAngle, maxAngle) {
      if (angle < minAngle) {
        return minAngle;
      }
      if (angle > maxAngle) {
        return maxAngle;
      }
      return angle;
    }

    function updateRobotArms(deltaSeconds) {
      var fallBlend = 0;
      var riseBlend = 0;
      if (playerVelocityY > 30) {
        fallBlend = Math.min(1, playerVelocityY / ARM_VELOCITY_REFERENCE);
      } else if (playerVelocityY < -30) {
        riseBlend = Math.min(1, -playerVelocityY / (ARM_VELOCITY_REFERENCE * 0.78));
      }

      var targetLeft = fallBlend * ARM_LIFT_ANGLE + riseBlend * ARM_TUCK_ANGLE;
      var targetRight = fallBlend * (-ARM_LIFT_ANGLE) + riseBlend * (-ARM_TUCK_ANGLE);

      armSwayPhase += deltaSeconds * ARM_SWAY_SPEED;
      var motionBlend = 0.28 + fallBlend * 0.62 + riseBlend * 0.5;
      var swayLeft = Math.sin(armSwayPhase) * ARM_SWAY_AMOUNT * motionBlend;
      var swayRight = Math.sin(armSwayPhase + 2.15) * ARM_SWAY_AMOUNT * motionBlend;

      var lerpFactor = Math.min(1, deltaSeconds * ARM_ANGLE_LERP_RATE);
      armLeftAngle += (targetLeft + swayLeft - armLeftAngle) * lerpFactor;
      armRightAngle += (targetRight + swayRight - armRightAngle) * lerpFactor;
      armLeftAngle = clampArmAngle(armLeftAngle, -ARM_INWARD_LIMIT, ARM_LIFT_ANGLE);
      armRightAngle = clampArmAngle(armRightAngle, -ARM_LIFT_ANGLE, ARM_INWARD_LIMIT);

      if (!limbElements.robotArmLeft.classList.contains("is-lost")) {
        setRobotArmRotation(limbElements.robotArmLeft, armLeftAngle, ARM_SHOULDER_LEFT_X, ARM_SHOULDER_LEFT_Y);
      }
      if (!limbElements.robotArmRight.classList.contains("is-lost")) {
        setRobotArmRotation(limbElements.robotArmRight, armRightAngle, ARM_SHOULDER_RIGHT_X, ARM_SHOULDER_RIGHT_Y);
      }
    }

    function updateRobotLegsAndHead(deltaSeconds) {
      var fallBlend = 0;
      var riseBlend = 0;
      if (playerVelocityY > 30) {
        fallBlend = Math.min(1, playerVelocityY / ARM_VELOCITY_REFERENCE);
      } else if (playerVelocityY < -30) {
        riseBlend = Math.min(1, -playerVelocityY / (ARM_VELOCITY_REFERENCE * 0.78));
      }

      var motionBlend = 0.3 + fallBlend * 0.5 + riseBlend * 0.4;
      legHeadSwayPhase += deltaSeconds * LEG_SWAY_SPEED;
      legLeftSwayAngle = Math.sin(legHeadSwayPhase) * LEG_SWAY_AMOUNT * motionBlend;
      legRightSwayAngle = Math.sin(legHeadSwayPhase + 1.85) * LEG_SWAY_AMOUNT * motionBlend;

      if (!limbElements.robotLegLeft.classList.contains("is-lost")) {
        setRobotArmRotation(limbElements.robotLegLeft, legLeftSwayAngle, LEG_HIP_LEFT_X, LEG_HIP_LEFT_Y);
      }
      if (!limbElements.robotLegRight.classList.contains("is-lost")) {
        setRobotArmRotation(limbElements.robotLegRight, legRightSwayAngle, LEG_HIP_RIGHT_X, LEG_HIP_RIGHT_Y);
      }
      if (!headDetached && robotHeadElement) {
        var headAngle = Math.sin(legHeadSwayPhase * 0.82 + 1.05) * HEAD_SWAY_AMOUNT * motionBlend;
        setRobotArmRotation(robotHeadElement, headAngle, HEAD_NECK_X, HEAD_NECK_Y);
      }
    }

    function updateCamera(deltaSeconds) {
      var pivotY = height * GROUND_PLAYER_Y_RATIO;
      var marginTop = height * CAMERA_TOP_MARGIN_RATIO;
      var robotHeightAbovePivot = footReach - playerYOffset;
      var desiredScale = 1;
      if (robotHeightAbovePivot > 0) {
        desiredScale = (pivotY - marginTop) / robotHeightAbovePivot;
      }
      if (desiredScale > 1) {
        desiredScale = 1;
      }
      if (desiredScale < CAMERA_MIN_SCALE) {
        desiredScale = CAMERA_MIN_SCALE;
      }
      var lerpFactor = Math.min(1, deltaSeconds * CAMERA_LERP_RATE);
      cameraScale += (desiredScale - cameraScale) * lerpFactor;
    }

    function updatePhysics(deltaSeconds) {
      playerVelocityY += gravity * deltaSeconds;
      playerYOffset += playerVelocityY * deltaSeconds;
      if (landingLockTimer > 0) {
        landingLockTimer -= deltaSeconds;
      }
      if (playerYOffset >= 0 && playerVelocityY >= 0 && landingLockTimer <= 0) {
        processLanding();
      }
      if (!headDetached && playerVelocityY < -30) {
        robotWrap.classList.add("is-thrusting");
        if (Math.random() < deltaSeconds * 40) {
          spawnExhaust();
        }
      } else {
        robotWrap.classList.remove("is-thrusting");
      }
    }

    function spawnBeacons() {
      var nextBeaconMeters = (beaconsSpawnedCount + 1) * BEACON_INTERVAL_METERS;
      while (distanceMeters >= nextBeaconMeters - BEACON_SPAWN_LEAD_METERS) {
        var aheadUnits = (nextBeaconMeters - distanceMeters) / METERS_PER_UNIT;
        beacons.push({
          worldX: playerWorldX + aheadUnits,
          triggered: false,
          fadeTimer: -1
        });
        beaconsSpawnedCount += 1;
        nextBeaconMeters = (beaconsSpawnedCount + 1) * BEACON_INTERVAL_METERS;
      }
    }

    function triggerBeacon(beacon) {
      beacon.triggered = true;
      beacon.fadeTimer = 0;
      if (headDetached) {
        return;
      }
      headLaunchBeaconBonus += HEAD_LAUNCH_BEACON_BONUS;
      currentLimbDamage = 0;
      if (lostLimbCount > 0) {
        lostLimbCount -= 1;
        var restoredLimbId = LIMB_LOSS_ORDER[lostLimbCount];
        limbElements[restoredLimbId].classList.remove("is-lost");
        removeDetachedLimbById(restoredLimbId);
        syncPartPips();
        spawnSparks(playerScreenX, getPlayerGroundY() + playerYOffset - footReach, 14, SPARK_BEACON_HUE);
        return;
      }
      setShieldActive(true);
      spawnSparks(playerScreenX, getPlayerGroundY() + playerYOffset - footReach, 16, SPARK_SHIELD_HUE);
    }

    function updateBeacons(deltaSeconds) {
      var index = 0;
      while (index < beacons.length) {
        var beacon = beacons[index];
        if (!beacon.triggered && playerWorldX >= beacon.worldX) {
          triggerBeacon(beacon);
        }
        if (beacon.fadeTimer >= 0) {
          beacon.fadeTimer += deltaSeconds;
        }
        if (beacon.fadeTimer >= BEACON_FADE_SECONDS || beacon.worldX < worldScroll - 200) {
          beacons.splice(index, 1);
        } else {
          index += 1;
        }
      }
    }

    function updateDebris(deltaSeconds) {
      var index = 0;
      while (index < debrisParticles.length) {
        var piece = debrisParticles[index];
        piece.age += deltaSeconds;
        piece.x -= (forwardSpeed * 0.4) * deltaSeconds;
        piece.x += piece.velocityX * deltaSeconds;
        piece.y += piece.velocityY * deltaSeconds;
        piece.velocityY += 620 * deltaSeconds;
        piece.rotation += piece.spin * deltaSeconds;
        if (piece.age >= piece.life || piece.y > height + 60) {
          debrisParticles.splice(index, 1);
        } else {
          index += 1;
        }
      }
    }

    function updateSparks(deltaSeconds) {
      var index = 0;
      while (index < sparkParticles.length) {
        var spark = sparkParticles[index];
        spark.age += deltaSeconds;
        spark.x += spark.velocityX * deltaSeconds;
        spark.y += spark.velocityY * deltaSeconds;
        spark.velocityY += 480 * deltaSeconds;
        if (spark.age >= spark.life) {
          sparkParticles.splice(index, 1);
        } else {
          index += 1;
        }
      }
    }

    function updateExhaust(deltaSeconds) {
      var index = 0;
      while (index < exhaustParticles.length) {
        var particle = exhaustParticles[index];
        particle.age += deltaSeconds;
        particle.y += particle.riseSpeed * deltaSeconds;
        particle.radius += particle.expandRate * deltaSeconds;
        if (particle.age >= particle.life) {
          exhaustParticles.splice(index, 1);
        } else {
          index += 1;
        }
      }
    }

    function updateLandingRings(deltaSeconds) {
      var index = 0;
      while (index < landingRings.length) {
        landingRings[index].age += deltaSeconds;
        if (landingRings[index].age >= landingRings[index].life) {
          landingRings.splice(index, 1);
        } else {
          index += 1;
        }
      }
    }

    function spawnDustParticle() {
      dustParticles.push({
        x: width + Math.random() * 60,
        y: height * 0.06 + Math.random() * height * 0.8,
        size: 0.8 + Math.random() * 2.2,
        speedX: 24 + Math.random() * 44 + forwardSpeed * 0.06,
        alpha: 0.05 + Math.random() * 0.14,
        life: 2.4 + Math.random() * 3.2,
        age: 0
      });
    }

    function updateDustParticles(deltaSeconds) {
      var index = 0;
      if (isPlaying() || isStart() || isLaunch()) {
        while (dustParticles.length < dustParticleMax && Math.random() < deltaSeconds * 7) {
          spawnDustParticle();
        }
      }
      while (index < dustParticles.length) {
        var particle = dustParticles[index];
        particle.age += deltaSeconds;
        particle.x -= particle.speedX * deltaSeconds;
        if (particle.age >= particle.life || particle.x < -20) {
          dustParticles.splice(index, 1);
        } else {
          index += 1;
        }
      }
    }

    function easeOutCubic(t) {
      var inverse = 1 - t;
      return 1 - inverse * inverse * inverse;
    }

    function setCountdownText(text, isGo) {
      countdownText.textContent = text;
      countdownText.classList.add("is-visible");
      if (isGo) {
        countdownText.classList.add("is-go");
      } else {
        countdownText.classList.remove("is-go");
      }
      countdownText.classList.remove("pop");
      void countdownText.offsetWidth;
      countdownText.classList.add("pop");
    }

    function hideCountdown() {
      countdownText.classList.remove("is-visible");
      countdownText.classList.remove("pop");
      countdownText.classList.remove("is-go");
    }

    function getLaunchLegHeight() {
      return robotPx * 2.1;
    }

    function positionLaunchLeg() {
      var legHeight = getLaunchLegHeight();
      var legWidth = legHeight * (140 / 200);
      var groundY = getPlayerGroundY();
      var hipScreenX;
      if (launchLegFadeTimer >= 0) {
        hipScreenX = legWorldAnchorX - worldScroll;
      } else {
        hipScreenX = playerScreenX - robotPx * 0.62;
      }
      var hipScreenY = groundY - legHeight * 0.82;
      launchLeg.style.width = legWidth + "px";
      launchLeg.style.height = legHeight + "px";
      launchLeg.style.left = (hipScreenX - 0.314 * legWidth) + "px";
      launchLeg.style.top = (hipScreenY - 0.13 * legHeight) + "px";
      launchLegPivot.style.transform = "rotate(" + legCurrentAngle + "rad)";
    }

    function updateLaunch(deltaSeconds) {
      launchTimer += deltaSeconds;
      if (!launchKicked) {
        var remaining = LAUNCH_COUNTDOWN_SECONDS - launchTimer;
        var countdownNumber = Math.ceil(remaining);
        if (countdownNumber < 1) {
          countdownNumber = 1;
        }
        if (countdownNumber !== countdownNumberShown) {
          countdownNumberShown = countdownNumber;
          setCountdownText(String(countdownNumber), false);
        }
        var cockProgress = easeOutCubic(Math.min(1, launchTimer / LAUNCH_COUNTDOWN_SECONDS));
        legCurrentAngle = LEG_REST_ANGLE + (LEG_COCK_ANGLE - LEG_REST_ANGLE) * cockProgress;
        if (launchTimer >= LAUNCH_COUNTDOWN_SECONDS) {
          launchKicked = true;
          kickTimer = 0;
          setCountdownText("GO!", true);
        }
      } else {
        kickTimer += deltaSeconds;
        var kickProgress = Math.min(1, kickTimer / LAUNCH_KICK_DURATION);
        legCurrentAngle = LEG_COCK_ANGLE + (LEG_KICK_ANGLE - LEG_COCK_ANGLE) * (kickProgress * kickProgress);
        if (kickTimer >= LAUNCH_KICK_CONTACT) {
          beginPlaying();
        }
      }
      updateRobotArms(deltaSeconds);
      updateRobotLegsAndHead(deltaSeconds);
      updateDustParticles(deltaSeconds);
      positionRobotDom();
      positionLaunchLeg();
    }

    function updateLaunchLegFade(deltaSeconds) {
      if (launchLegFadeTimer < 0) {
        return;
      }
      launchLegFadeTimer += deltaSeconds;
      var fadeProgress = Math.min(1, launchLegFadeTimer / LEG_FADE_SECONDS);
      legCurrentAngle = LEG_KICK_ANGLE;
      launchLeg.style.opacity = String(1 - fadeProgress);
      positionLaunchLeg();
      if (fadeProgress >= 1) {
        launchLegFadeTimer = -1;
        launchLeg.classList.remove("is-visible");
        launchLeg.style.opacity = "";
      }
    }

    function updateStart(deltaSeconds) {
      updateRobotArms(deltaSeconds);
      updateRobotLegsAndHead(deltaSeconds);
      updateDustParticles(deltaSeconds);
      positionRobotDom();
      positionLaunchLeg();
    }

    function updateGameOver(deltaSeconds) {
      if (headDetached) {
        updateHeadGameOverWorld(deltaSeconds);
        updateRobotLegsAndHead(deltaSeconds);
      } else {
        updateRobotArms(deltaSeconds);
        updateRobotLegsAndHead(deltaSeconds);
      }
      updateExhaust(deltaSeconds);
      updateDustParticles(deltaSeconds);
      updateExplosionBursts(deltaSeconds);
      updateHeadTrail(deltaSeconds);
      if (!headDetached) {
        updateCamera(deltaSeconds);
      }
      if (screenShakeTimer > 0) {
        screenShakeTimer -= deltaSeconds;
      }
    }

    function update(deltaSeconds) {
      if (isGameOver()) {
        updateGameOver(deltaSeconds);
        return;
      }
      if (isLaunch()) {
        updateLaunch(deltaSeconds);
        return;
      }
      if (isStart()) {
        updateStart(deltaSeconds);
        return;
      }

      if (!headDetached) {
        forwardSpeed = Math.min(FORWARD_SPEED_MAX, forwardSpeed + 3 * deltaSeconds);
      }
      worldScroll += forwardSpeed * deltaSeconds;
      playerWorldX = worldScroll + playerScreenX;
      if (forwardSpeed > 0) {
        distanceMeters += forwardSpeed * deltaSeconds * METERS_PER_UNIT;
      }
      hudDistance.textContent = formatMeters(distanceMeters);
      setSpeedHud();

      var layerIndex;
      for (layerIndex = 0; layerIndex < parallaxPhase.length; layerIndex++) {
        parallaxPhase[layerIndex] += forwardSpeed * parallaxSpeeds[layerIndex] * deltaSeconds;
      }

      rebaseWorldCoordinates();

      updateRobotSpin(deltaSeconds);
      updatePhysics(deltaSeconds);
      updateRobotArms(deltaSeconds);
      updateRobotLegsAndHead(deltaSeconds);
      updateCamera(deltaSeconds);
      spawnBeacons();
      updateBeacons(deltaSeconds);
      updateDebris(deltaSeconds);
      updateSparks(deltaSeconds);
      updateExplosionBursts(deltaSeconds);
      updateExhaust(deltaSeconds);
      updateLandingRings(deltaSeconds);
      updateDustParticles(deltaSeconds);
      updateHeadTrail(deltaSeconds);

      if (screenShakeTimer > 0) {
        screenShakeTimer -= deltaSeconds;
      }

      updateLaunchLegFade(deltaSeconds);
      positionRobotDom();
    }

    function getRobotScreenCenter() {
      var pivotY = height * GROUND_PLAYER_Y_RATIO;
      var groundY = getPlayerGroundY();
      var naturalCenterY = groundY + playerYOffset - footReach;
      var scaledCenterY = pivotY + (naturalCenterY - pivotY) * cameraScale;
      return {
        x: playerScreenX,
        y: scaledCenterY
      };
    }

    function getHeadScreenCenter() {
      var center = getRobotScreenCenter();
      return {
        x: center.x + headDetachOffsetNaturalX * cameraScale,
        y: center.y + headDetachOffsetNaturalY * cameraScale
      };
    }

    function getRobotScreenBounds() {
      var center;
      var halfWidth;
      var halfHeight;
      if (headDetached) {
        center = getHeadScreenCenter();
        halfWidth = getRobotWrapWidth() * cameraScale * 0.28;
        halfHeight = getRobotWrapHeight() * cameraScale * 0.28;
      } else {
        center = getRobotScreenCenter();
        halfWidth = getRobotWrapWidth() * cameraScale * 0.5;
        halfHeight = getRobotWrapHeight() * cameraScale * 0.5;
      }
      return {
        left: center.x - halfWidth,
        right: center.x + halfWidth,
        top: center.y - halfHeight,
        bottom: center.y + halfHeight,
        centerX: center.x,
        centerY: center.y
      };
    }

    function isRobotOffScreen() {
      var bounds = getRobotScreenBounds();
      return bounds.left < -OFFSCREEN_INDICATOR_MARGIN ||
        bounds.right > width + OFFSCREEN_INDICATOR_MARGIN ||
        bounds.top < -OFFSCREEN_INDICATOR_MARGIN ||
        bounds.bottom > height + OFFSCREEN_INDICATOR_MARGIN;
    }

    function shouldShowOffScreenRobotIndicator() {
      if (isPlaying()) {
        return true;
      }
      if (isGameOver() && headDetached) {
        return true;
      }
      return false;
    }

    function drawOffScreenRobotIndicator() {
      if (!shouldShowOffScreenRobotIndicator() || !isRobotOffScreen()) {
        return;
      }
      var bounds = getRobotScreenBounds();
      var indicatorX = bounds.centerX;
      if (indicatorX < OFFSCREEN_INDICATOR_EDGE_PADDING) {
        indicatorX = OFFSCREEN_INDICATOR_EDGE_PADDING;
      } else if (indicatorX > width - OFFSCREEN_INDICATOR_EDGE_PADDING) {
        indicatorX = width - OFFSCREEN_INDICATOR_EDGE_PADDING;
      }
      var indicatorY = OFFSCREEN_INDICATOR_TOP_Y;
      var deltaX = bounds.centerX - indicatorX;
      var deltaY = bounds.centerY - indicatorY;
      var angle = Math.atan2(deltaY, deltaX);
      var arrowLength = OFFSCREEN_ARROW_LENGTH;
      var arrowWidth = OFFSCREEN_ARROW_WIDTH;
      context.save();
      context.translate(indicatorX, indicatorY);
      context.rotate(angle);
      context.shadowColor = "rgba(255, 140, 50, 0.75)";
      context.shadowBlur = 8;
      context.fillStyle = "rgba(255, 122, 30, 0.95)";
      context.strokeStyle = "rgba(255, 210, 120, 0.9)";
      context.lineWidth = 1.5;
      context.beginPath();
      context.moveTo(arrowLength, 0);
      context.lineTo(-arrowLength * 0.55, arrowWidth * 0.5);
      context.lineTo(-arrowLength * 0.25, 0);
      context.lineTo(-arrowLength * 0.55, -arrowWidth * 0.5);
      context.closePath();
      context.fill();
      context.stroke();
      context.restore();
    }

    function positionRobotDom() {
      var wrapWidth = getRobotWrapWidth();
      var wrapHeight = getRobotWrapHeight();
      var left;
      var top;
      if (headDetached) {
        var headScreen = getHeadScreenCenter();
        var headOffsetX = getHeadCenterOffsetX();
        var headOffsetY = getHeadCenterOffsetY();
        left = headScreen.x - wrapWidth * 0.5 - (headOffsetX - wrapWidth * 0.5) * cameraScale;
        top = headScreen.y - wrapHeight * 0.5 - (headOffsetY - wrapHeight * 0.5) * cameraScale;
        robotSpin.style.transformOrigin = headOffsetX + "px " + headOffsetY + "px";
      } else {
        var center = getRobotScreenCenter();
        left = center.x - getRobotBodyCenterOffsetX();
        top = center.y - getRobotBodyCenterOffsetY();
        robotSpin.style.transformOrigin = "50% 50%";
      }
      robotWrap.style.left = left + "px";
      robotWrap.style.top = top + "px";
      if (cameraScale === 1) {
        robotWrap.style.transform = "";
      } else {
        robotWrap.style.transform = "scale(" + cameraScale + ")";
      }
      robotSpin.style.transform = "rotate(" + robotAngle + "rad)";
      updateRobotGlowFilter();
    }

    function getScreenShakeOffset() {
      if (screenShakeTimer <= 0 || screenShakeDuration <= 0) {
        return { x: 0, y: 0 };
      }
      var shake = screenShakeStrength * (screenShakeTimer / screenShakeDuration);
      return {
        x: (Math.random() - 0.5) * shake * 2,
        y: (Math.random() - 0.5) * shake * 1.4
      };
    }

    function parseHexColor(hexColor) {
      var hex = hexColor.charAt(0) === "#" ? hexColor.substring(1) : hexColor;
      return {
        r: parseInt(hex.substring(0, 2), 16),
        g: parseInt(hex.substring(2, 4), 16),
        b: parseInt(hex.substring(4, 6), 16)
      };
    }

    function channelToHex(value) {
      var clamped = Math.max(0, Math.min(255, Math.round(value)));
      var hex = clamped.toString(16);
      if (hex.length < 2) {
        return "0" + hex;
      }
      return hex;
    }

    function lerpHexColor(colorA, colorB, blend) {
      var from = parseHexColor(colorA);
      var to = parseHexColor(colorB);
      var red = from.r + (to.r - from.r) * blend;
      var green = from.g + (to.g - from.g) * blend;
      var blue = from.b + (to.b - from.b) * blend;
      return "#" + channelToHex(red) + channelToHex(green) + channelToHex(blue);
    }

    function getSkyIndustrialBlend() {
      if (distanceMeters <= SKY_INDUSTRIAL_BLEND_START_METERS) {
        return 0;
      }
      if (distanceMeters < SKY_INDUSTRIAL_FULL_METERS) {
        return (distanceMeters - SKY_INDUSTRIAL_BLEND_START_METERS) / (SKY_INDUSTRIAL_FULL_METERS - SKY_INDUSTRIAL_BLEND_START_METERS);
      }
      if (distanceMeters <= SKY_INDUSTRIAL_CLEAR_START_METERS) {
        return 1;
      }
      if (distanceMeters >= SKY_INDUSTRIAL_CLEAR_END_METERS) {
        return 0;
      }
      return 1 - (distanceMeters - SKY_INDUSTRIAL_CLEAR_START_METERS) / (SKY_INDUSTRIAL_CLEAR_END_METERS - SKY_INDUSTRIAL_CLEAR_START_METERS);
    }

    function getFarIndustryBlend() {
      var start = FAR_INDUSTRY_BLEND_START_METERS;
      var end = FAR_INDUSTRY_BLEND_START_METERS + 3 * FAR_INDUSTRY_LAYER_STAGGER_METERS + FAR_INDUSTRY_LAYER_TRANSITION_METERS;
      if (distanceMeters <= start) {
        return 0;
      }
      if (distanceMeters >= end) {
        return 1;
      }
      return getSmoothStep((distanceMeters - start) / (end - start));
    }

    function getSkyBlendWeights() {
      var spaceWeight = 0;
      var skyWeight = 0;
      var segment = distanceMeters / SKY_SEGMENT_METERS;
      var spaceEnd = SKY_SPACE_SEGMENT_COUNT;
      var skyEnd = spaceEnd + SKY_ATMOSPHERE_SEGMENT_COUNT;

      if (segment <= 0) {
        spaceWeight = 1;
      } else if (segment < spaceEnd) {
        var enterSkyBlend = segment / spaceEnd;
        spaceWeight = 1 - enterSkyBlend;
        skyWeight = enterSkyBlend;
      } else if (segment < skyEnd) {
        skyWeight = 1;
      } else {
        skyWeight = 1;
      }

      var industrialWeight = getSkyIndustrialBlend();
      if (industrialWeight > 0) {
        spaceWeight = spaceWeight * (1 - industrialWeight);
        skyWeight = skyWeight * (1 - industrialWeight);
      }

      return {
        space: spaceWeight,
        sky: skyWeight,
        industrial: industrialWeight,
        violet: getFarIndustryBlend()
      };
    }

    function blendThreeSkyColors(colorA, colorB, colorC, weightA, weightB, weightC) {
      var totalWeight = weightA + weightB + weightC;
      if (totalWeight <= 0) {
        return colorA;
      }
      var colorFromA = parseHexColor(colorA);
      var colorFromB = parseHexColor(colorB);
      var colorFromC = parseHexColor(colorC);
      var normalizedA = weightA / totalWeight;
      var normalizedB = weightB / totalWeight;
      var normalizedC = weightC / totalWeight;
      var red = colorFromA.r * normalizedA + colorFromB.r * normalizedB + colorFromC.r * normalizedC;
      var green = colorFromA.g * normalizedA + colorFromB.g * normalizedB + colorFromC.g * normalizedC;
      var blue = colorFromA.b * normalizedA + colorFromB.b * normalizedB + colorFromC.b * normalizedC;
      return "#" + channelToHex(red) + channelToHex(green) + channelToHex(blue);
    }

    function getSkyGradientColor(stopIndex, weights) {
      var baseColor = blendThreeSkyColors(
        SKY_SPACE_STOPS[stopIndex].color,
        SKY_ATMOSPHERE_STOPS[stopIndex].color,
        SKY_INDUSTRIAL_STOPS[stopIndex].color,
        weights.space,
        weights.sky,
        weights.industrial
      );
      if (weights.violet > 0) {
        return lerpHexColor(baseColor, SKY_VIOLET_STOPS[stopIndex].color, weights.violet);
      }
      return baseColor;
    }

    function setPageBackgroundColor(color) {
      document.body.style.background = color;
    }

    function drawSky() {
      var weights = getSkyBlendWeights();
      var gradient = context.createLinearGradient(0, 0, 0, height);
      var stopIndex;
      for (stopIndex = 0; stopIndex < SKY_SPACE_STOPS.length; stopIndex++) {
        gradient.addColorStop(
          SKY_SPACE_STOPS[stopIndex].position,
          getSkyGradientColor(stopIndex, weights)
        );
      }
      context.fillStyle = gradient;
      context.fillRect(0, 0, width, height);
      setPageBackgroundColor(getSkyGradientColor(0, weights));
    }

    function getSunBodyColor(spaceColor, skyColor, industrialColor, weights) {
      var baseColor = blendThreeSkyColors(spaceColor, skyColor, industrialColor, weights.space, weights.sky, weights.industrial);
      if (weights.violet > 0) {
        return lerpHexColor(baseColor, "#4a2c64", weights.violet);
      }
      return baseColor;
    }

    function drawSun() {
      var weights = getSkyBlendWeights();
      var sunX = width * SUN_SCREEN_X_RATIO;
      var sunY = height * SUN_SCREEN_Y_RATIO;
      var sunRadius = Math.max(26, Math.min(width, height) * 0.07);
      var glow = context.createRadialGradient(sunX, sunY, sunRadius * 0.5, sunX, sunY, sunRadius * 4.5);
      var violetDim = 1 - weights.violet * 0.82;
      var glowInnerAlpha = (0.4 + weights.sky * 0.08 + weights.industrial * 0.22) * violetDim;
      var glowOuterAlpha = (0.16 + weights.sky * 0.06 + weights.industrial * 0.18) * violetDim;
      var glowRed = Math.round(255 - weights.violet * 110);
      var glowGreen = Math.round(180 + weights.sky * 30 - weights.industrial * 50 - weights.violet * 90);
      var glowBlue = Math.round(90 + weights.sky * 70 - weights.industrial * 60 + weights.violet * 60);
      glow.addColorStop(0, "rgba(" + glowRed + ", " + glowGreen + ", " + glowBlue + ", " + glowInnerAlpha + ")");
      glow.addColorStop(0.4, "rgba(255, 130, 60, " + glowOuterAlpha + ")");
      glow.addColorStop(1, "transparent");
      context.fillStyle = glow;
      context.beginPath();
      context.arc(sunX, sunY, sunRadius * 4.5, 0, TWO_PI);
      context.fill();
      var body = context.createRadialGradient(sunX, sunY, sunRadius * 0.2, sunX, sunY, sunRadius);
      body.addColorStop(0, getSunBodyColor("#ffe7b0", "#fff8e8", "#fff0c8", weights));
      body.addColorStop(0.6, getSunBodyColor("#ffb060", "#ffd878", "#ff9040", weights));
      body.addColorStop(1, getSunBodyColor("#ff7a30", "#ffc848", "#ff6020", weights));
      context.fillStyle = body;
      context.beginPath();
      context.arc(sunX, sunY, sunRadius, 0, TWO_PI);
      context.fill();
    }

    function initSkyStars() {
      var index;
      var starCount = 50;
      skyStars.length = 0;
      for (index = 0; index < starCount; index++) {
        var hashX = (index * 7919 + 104729) % 9973;
        var hashY = (index * 1301 + 49297) % 9973;
        skyStars.push({
          x: (hashX / 9973) * SKY_TILE_WIDTH,
          y: (hashY / 9973) * 0.4,
          size: (index % 3 === 0) ? 1.4 : 0.9
        });
      }
    }

    function resetSkyCraft(craft) {
      craft.type = (Math.random() < 0.5) ? SKY_CRAFT_TYPE_SHIP : SKY_CRAFT_TYPE_SATELLITE;
      craft.yRatio = SKY_CRAFT_TOP_RATIO + Math.random() * (SKY_CRAFT_BOTTOM_RATIO - SKY_CRAFT_TOP_RATIO);
      craft.scale = SKY_CRAFT_MIN_SCALE + Math.random() * (SKY_CRAFT_MAX_SCALE - SKY_CRAFT_MIN_SCALE);
      craft.alpha = SKY_CRAFT_MIN_ALPHA + Math.random() * (SKY_CRAFT_MAX_ALPHA - SKY_CRAFT_MIN_ALPHA);
      craft.driftSpeed = SKY_CRAFT_MIN_DRIFT + Math.random() * (SKY_CRAFT_MAX_DRIFT - SKY_CRAFT_MIN_DRIFT);
      craft.spanPx = SKY_CRAFT_SPAN_UNITS * craft.scale;
      craft.x = width + craft.spanPx;
    }

    function initSkyCraft() {
      skyCraftShipPath = new Path2D(SKY_CRAFT_SHIP_PATH_DATA);
      skyCraftSatellitePath = new Path2D(SKY_CRAFT_SATELLITE_PATH_DATA);
      skyCraft.length = 0;
      var index;
      for (index = 0; index < SKY_CRAFT_COUNT; index++) {
        var craft = {
          type: SKY_CRAFT_TYPE_SHIP,
          x: 0,
          yRatio: 0,
          scale: 1,
          alpha: 1,
          driftSpeed: 10,
          spanPx: 40
        };
        resetSkyCraft(craft);
        skyCraft.push(craft);
      }
      skyCraftSeeded = false;
    }

    function updateSkyCraft(deltaSeconds) {
      if (width <= 0) {
        return;
      }
      var index;
      var craft;
      if (!skyCraftSeeded) {
        for (index = 0; index < skyCraft.length; index++) {
          craft = skyCraft[index];
          craft.x = (index + 0.5) / skyCraft.length * width;
        }
        skyCraftSeeded = true;
      }
      for (index = 0; index < skyCraft.length; index++) {
        craft = skyCraft[index];
        craft.x -= craft.driftSpeed * deltaSeconds;
        if (craft.x < -craft.spanPx) {
          resetSkyCraft(craft);
        }
      }
    }

    function getSkyCraftVisibility() {
      if (distanceMeters > SKY_CRAFT_MIN_METERS && distanceMeters < SKY_CRAFT_MAX_METERS) {
        var fadeIn = Math.min(1, (distanceMeters - SKY_CRAFT_MIN_METERS) / SKY_CRAFT_FADE_METERS);
        var fadeOut = Math.min(1, (SKY_CRAFT_MAX_METERS - distanceMeters) / SKY_CRAFT_FADE_METERS);
        return Math.min(fadeIn, fadeOut);
      }
      if (distanceMeters >= SKY_CRAFT_FAR_MIN_METERS) {
        return Math.min(1, (distanceMeters - SKY_CRAFT_FAR_MIN_METERS) / SKY_CRAFT_FAR_FADE_METERS);
      }
      return 0;
    }

    function drawSkyCraft() {
      var visibility = getSkyCraftVisibility();
      if (visibility <= 0) {
        return;
      }
      var index;
      var craft;
      var craftPath;
      var screenY;
      context.save();
      context.fillStyle = SKY_CRAFT_FILL;
      for (index = 0; index < skyCraft.length; index++) {
        craft = skyCraft[index];
        if (craft.x < -craft.spanPx || craft.x > width + craft.spanPx) {
          continue;
        }
        craftPath = (craft.type === SKY_CRAFT_TYPE_SHIP) ? skyCraftShipPath : skyCraftSatellitePath;
        screenY = height * craft.yRatio;
        context.save();
        context.globalAlpha = craft.alpha * visibility;
        context.translate(craft.x, screenY);
        context.scale(craft.scale, craft.scale);
        context.fill(craftPath);
        context.restore();
      }
      context.restore();
    }

    function drawStars() {
      var weights = getSkyBlendWeights();
      if (weights.space <= 0.02) {
        return;
      }
      var tileX;
      var index;
      var star;
      var screenX;
      var screenY;
      var starScroll = parallaxPhase[0];
      var starScrollWrapped = starScroll % SKY_TILE_WIDTH;
      if (starScrollWrapped < 0) {
        starScrollWrapped += SKY_TILE_WIDTH;
      }
      var tilesX = Math.ceil(width / SKY_TILE_WIDTH) + 2;
      var starAlpha = 0.7 * weights.space;
      context.fillStyle = "rgba(220, 226, 255, " + starAlpha + ")";
      for (tileX = -1; tileX < tilesX; tileX++) {
        for (index = 0; index < skyStars.length; index++) {
          star = skyStars[index];
          screenX = star.x + tileX * SKY_TILE_WIDTH - starScrollWrapped;
          screenY = star.y * height;
          if (screenX < -4 || screenX > width + 4) {
            continue;
          }
          context.beginPath();
          context.arc(screenX, screenY, star.size, 0, TWO_PI);
          context.fill();
        }
      }
    }

    function drawParallaxHills(layerIndex, topColor, bottomColor, colorStroke, amplitude, frequency, yBase) {
      var shift = parallaxPhase[layerIndex];
      var hillGradient = context.createLinearGradient(0, yBase - amplitude * 1.6, 0, height);
      hillGradient.addColorStop(0, topColor);
      hillGradient.addColorStop(0.55, bottomColor);
      hillGradient.addColorStop(1, "rgba(10, 12, 26, 0.95)");
