<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airborne Robot</title>
  <script src="../iframe-game-locale.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0a0d1a;
      color: #cfe0ff;
      font-family: "Courier New", Courier, monospace;
      cursor: url("../../../cursor-pointer.svg") 2.1 0, pointer;
    }

    #gameRoot,
    #gameCanvas {
      cursor: url("../../../cursor-pointer.svg") 2.1 0, pointer;
    }

    #gameRoot {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #gameCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #damageFlash {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(circle at 20% 64%, rgba(255, 130, 40, 0.5), transparent 56%);
      opacity: 0;
    }

    #damageFlash.is-active {
      animation: damage-flash 0.34s ease-out forwards;
    }

    @keyframes damage-flash {
      0% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    #robotWrap {
      position: absolute;
      left: 0;
      top: 0;
      width: 80px;
      height: 110px;
      pointer-events: none;
      z-index: 6;
    }

    #robotSpin {
      width: 100%;
      height: 100%;
      transform-origin: 50% 50%;
    }

    #robotSvg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 3px 8px rgba(255, 140, 50, 0.35));
    }

    #robotWrap.is-reversing #robotSvg {
      filter: drop-shadow(0 0 12px rgba(120, 200, 255, 0.85)) drop-shadow(0 3px 8px rgba(255, 140, 50, 0.35));
    }

    #robotWrap.is-dead #robotSvg {
      filter: grayscale(0.85) brightness(0.55) drop-shadow(0 2px 4px rgba(10, 12, 26, 0.7));
    }

    .robot-part.is-lost {
      display: none;
    }

    #robotWrap.is-headless #robotTorso,
    #robotWrap.is-headless #robotFlame {
      display: none;
    }

    #robotWrap.is-headless #robotSvg {
      filter: drop-shadow(0 0 10px rgba(255, 120, 60, 0.85)) drop-shadow(0 3px 8px rgba(255, 140, 50, 0.4));
    }

    #robotFlame {
      opacity: 0;
      transition: opacity 0.08s linear;
    }

    #robotWrap.is-thrusting #robotFlame {
      opacity: 1;
    }

    #launchLeg {
      position: absolute;
      left: 0;
      top: 0;
      width: 100px;
      height: 200px;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.12s linear;
    }

    #launchLeg.is-visible {
      opacity: 1;
    }

    #launchLegPivot {
      width: 100%;
      height: 100%;
      transform-origin: 31.4% 13%;
    }

    #launchLegSvg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 5px 12px rgba(10, 12, 26, 0.55));
    }

    #countdownText {
      position: absolute;
      left: 50%;
      top: 36%;
      transform: translate(-50%, -50%);
      font-size: clamp(3rem, 15vmin, 8rem);
      font-weight: bold;
      letter-spacing: 0.05em;
      color: #ffe7b0;
      text-shadow: 0 0 20px rgba(255, 150, 60, 0.78), 0 4px 14px rgba(0, 0, 0, 0.55);
      z-index: 8;
      pointer-events: none;
      opacity: 0;
    }

    #countdownText.is-visible {
      opacity: 1;
    }

    #countdownText.is-go {
      color: #b6ff8a;
      text-shadow: 0 0 24px rgba(150, 255, 120, 0.85), 0 4px 14px rgba(0, 0, 0, 0.55);
    }

    #countdownText.pop {
      animation: countdown-pop 0.9s ease-out;
    }

    @keyframes countdown-pop {
      0% { transform: translate(-50%, -50%) scale(1.65); opacity: 0; }
      16% { opacity: 1; }
      30% { transform: translate(-50%, -50%) scale(1); }
      86% { opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.05); opacity: 0; }
    }

    .hud-panel {
      position: absolute;
      z-index: 7;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(120, 180, 255, 0.45);
    }

    #hudScoreRow {
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 1.15rem;
      letter-spacing: 0.14em;
      color: #dcecff;
    }

    #hudDistance {
      line-height: 1.1;
    }

    #hudSpeed {
      font-size: 0.7em;
      letter-spacing: 0.12em;
      color: #9fd0ff;
      line-height: 1.1;
    }

    #hudCombo {
      font-size: 0.78em;
      letter-spacing: 0.12em;
      color: #ffb060;
      line-height: 1.1;
      min-height: 1.1em;
    }

    #hudCombo.hidden {
      visibility: hidden;
    }

    #hudPlaying.hidden {
      display: none;
    }

    #hudParts {
      top: 12px;
      left: 14px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .part-pip {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: #ffb060;
      box-shadow: 0 0 6px rgba(255, 150, 60, 0.6);
      transition: background 0.2s linear, transform 0.2s ease, opacity 0.2s linear;
    }

    .part-pip.is-lost {
      background: #2c3550;
      box-shadow: none;
      transform: scale(0.7);
      opacity: 0.5;
    }

    #hudHighScore {
      bottom: 12px;
      right: 14px;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      color: #7e98cc;
      text-align: right;
      z-index: 9;
    }

    #hudHighScore.is-record {
      color: #ffd878;
      animation: record-title-glow 0.7s ease-in-out infinite alternate;
    }

    #gameScreen {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      pointer-events: none;
      background: rgba(6, 9, 20, 0.4);
    }

    #gameScreen.hidden {
      display: none;
    }

    #screenTitle {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #dcecff;
      text-shadow: 0 0 16px rgba(120, 180, 255, 0.55);
    }

    #screenMeters {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.16em;
      color: #ffb060;
    }

    #screenMeters.hidden {
      display: none;
    }

    #controlHint {
      margin: 0.35rem 0 0;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #a8c0ee;
      text-align: center;
      max-width: min(92vw, 24rem);
    }

    #controlHint.hidden {
      display: none;
    }

    #gameScreen.is-record #screenTitle {
      animation: record-title-glow 0.9s ease-in-out infinite alternate;
      color: #ffe8a8;
    }

    #gameScreen.is-record #screenMeters {
      color: #ffd878;
      animation: record-title-glow 0.7s ease-in-out infinite alternate;
    }

    @keyframes record-title-glow {
      from { text-shadow: 0 0 8px rgba(255, 200, 100, 0.4); }
      to { text-shadow: 0 0 22px rgba(255, 220, 140, 0.95), 0 0 40px rgba(255, 160, 80, 0.45); }
    }

    #recordBurst {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0;
    }

    #recordBurst.is-active {
      opacity: 1;
    }

    .record-spark {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffe090;
      box-shadow: 0 0 10px #ffb040;
      animation: record-spark-fly 1.1s ease-out forwards;
    }

    @keyframes record-spark-fly {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }

    #robotColorPicker {
      display: flex;
      gap: 0.55rem;
      margin-top: 0.75rem;
      pointer-events: auto;
    }

    #robotColorPicker.hidden {
      display: none;
    }

    .robot-color-option {
      padding: 0.3rem;
      margin: 0;
      font: inherit;
      color: inherit;
      border: 2px solid rgba(120, 150, 210, 0.25);
      border-radius: 8px;
      background: rgba(10, 14, 28, 0.65);
      cursor: url("../../../cursor-pointer.svg") 2.1 0, pointer;
      transition: border-color 0.15s linear, box-shadow 0.15s linear, transform 0.12s ease;
    }

    .robot-color-option:hover {
      border-color: rgba(255, 176, 96, 0.45);
      transform: translateY(-2px);
    }

    .robot-color-option.is-selected {
      border-color: #ffb060;
      box-shadow: 0 0 14px rgba(255, 150, 60, 0.5);
    }

    .robot-color-option svg {
      width: clamp(34px, 7.5vmin, 46px);
      height: auto;
      display: block;
      filter: drop-shadow(0 2px 5px rgba(10, 12, 26, 0.45));
    }
  </style>
</head>

      var armRightJoint = robotSvg.querySelector("#robotArmRight circle");

      var legRightRect = robotSvg.querySelector("#robotLegRight rect");

      var headLine = robotSvg.querySelector("#robotHead line");

      armRightJoint.setAttribute("stroke", scheme.stroke);
      legLeftRect.setAttribute("fill", scheme.legDark);

      legLeftFoot.setAttribute("fill", scheme.highlightLight);
      legLeftFoot.setAttribute("stroke", scheme.strokeLeg);
      legRightRect.setAttribute("fill", scheme.legDark);
      legRightRect.setAttribute("stroke", scheme.strokeLeg);
      legRightFoot.setAttribute("fill", scheme.highlightLight);
      legRightFoot.setAttribute("stroke", scheme.strokeLeg);
      torsoRect.setAttribute("fill", scheme.torso);
      torsoRect.setAttribute("stroke", scheme.stroke);
      headLine.setAttribute("stroke", scheme.highlight);
      headRect.setAttribute("fill", scheme.highlightLight);
      headRect.setAttribute("stroke", scheme.stroke);

    function syncRobotColorPickerSelection() {
      var index;
      for (index = 0; index < robotColorOptionElements.length; index++) {
        if (robotColorOptionElements[index].getAttribute("data-color-id") === currentRobotColorScheme.id) {
          robotColorOptionElements[index].classList.add("is-selected");
          robotColorOptionElements[index].setAttribute("aria-pressed", "true");
        } else {
          robotColorOptionElements[index].classList.remove("is-selected");
          robotColorOptionElements[index].setAttribute("aria-pressed", "false");
        }
      }
    }

    function setRobotColor(schemeId) {
      currentRobotColorScheme = getRobotColorSchemeById(schemeId);
      applyRobotColorScheme(currentRobotColorScheme);
      syncRobotColorPickerSelection();
      try {
        window.localStorage.setItem(ROBOT_COLOR_STORAGE_KEY, currentRobotColorScheme.id);
      } catch (error) {
      }
    }

    function onRobotColorOptionPointerDown(event) {
      event.preventDefault();
      event.stopPropagation();
      var schemeId = event.currentTarget.getAttribute("data-color-id");
      if (schemeId && schemeId !== currentRobotColorScheme.id) {
        setRobotColor(schemeId);
      }

    function buildRobotColorPicker() {
      var index;
      var scheme;
      var button;
      robotColorPicker.innerHTML = "";
      robotColorOptionElements.length = 0;
      for (index = 0; index < ROBOT_COLOR_SCHEMES.length; index++) {
        scheme = ROBOT_COLOR_SCHEMES[index];
        button = document.createElement("button");
        button.type = "button";
        button.className = "robot-color-option";
        button.setAttribute("data-color-id", scheme.id);
        button.setAttribute("aria-pressed", "false");
        button.innerHTML = getMiniRobotSvgMarkup(scheme);
        button.addEventListener("pointerdown", onRobotColorOptionPointerDown);
        robotColorPicker.appendChild(button);
        robotColorOptionElements.push(button);

      syncRobotColorPickerSelection();

    function loadRobotColor() {

        storedSchemeId = "";

      currentRobotColorScheme = getRobotColorSchemeById(storedSchemeId);
      applyRobotColorScheme(currentRobotColorScheme);

    function loadHighScore() {

          var parsed = parseInt(stored, 10);

    function formatMeters(meters) {

      return Math.floor(meters) + suffix;

    function formatSpeed(unitsPerSecond) {

        } else {

    function resizeCanvas() {
      var rect = canvas.getBoundingClientRect();
      width = Math.max(320, Math.floor(rect.width));
      height = Math.max(200, Math.floor(rect.height));
      devicePixelRatioScale = window.devicePixelRatio || 1;
      canvas.width = Math.floor(width * devicePixelRatioScale);
      canvas.height = Math.floor(height * devicePixelRatioScale);
      context.setTransform(devicePixelRatioScale, 0, 0, devicePixelRatioScale, 0, 0);
      robotPx = Math.max(64, Math.min(140, Math.min(width, height) * 0.16));
      footReach = robotPx * footReachRatio;
      robotWrap.style.width = (robotPx * 80 / 110) + "px";
      robotWrap.style.height = robotPx + "px";
      playerScreenX = width * 0.32;
      playerWorldX = worldScroll + playerScreenX;
      if (isStart() || isLaunch()) {
        plateauEndWorldX = playerScreenX + robotPx * PLATEAU_EDGE_OFFSET_FACTOR;
      }
    }

    function groundBumpNoise(worldX) {
      var bumpScale = height * GROUND_BUMP_RATIO;
      return (
        Math.sin(worldX * 0.016) * bumpScale +
        Math.sin(worldX * 0.039 + 1.8) * bumpScale * 0.5 +
        Math.sin(worldX * 0.085 + 3.4) * bumpScale * 0.3
      );
    }

    function getWorldElevation(worldX) {
      if (worldX <= plateauEndWorldX) {
        return 0;
      }
      var pastEdge = worldX - plateauEndWorldX;
      var bumpRamp = Math.min(1, pastEdge / 240);
      return pastEdge * GROUND_SLOPE_TANGENT + groundBumpNoise(worldX) * bumpRamp;
    }

    function groundWave(worldX) {
      var playerGroundScreenY = height * GROUND_PLAYER_Y_RATIO;
      return playerGroundScreenY + getWorldElevation(worldX) - getWorldElevation(playerWorldX);
    }

    function getForwardSpinRate() {
      return baseSpinRate + forwardSpeed * SPIN_SPEED_FACTOR + spinBonus;
    }

    function getReverseSpinRate() {
      return (REVERSE_BASE_SPIN_RATE + forwardSpeed * REVERSE_SPIN_SPEED_FACTOR) * REVERSE_SPIN_MULTIPLIER;
    }

    function getPlayerGroundY() {
      return groundWave(playerWorldX);
    }

    function getGroundSlopeAngle(worldX) {
      var sampleDelta = 4;
      var elevationAhead = getWorldElevation(worldX + sampleDelta);
      var elevationBehind = getWorldElevation(worldX - sampleDelta);
      var screenSlope = (elevationAhead - elevationBehind) / (2 * sampleDelta);
      return Math.atan(screenSlope);
    }

    function normalizeAngle(angle) {
      var result = angle % TWO_PI;
      if (result < 0) {
        result += TWO_PI;
      }
      return result;
    }

    function getUprightError(angle) {
      var normalized = normalizeAngle(angle);
      return Math.min(normalized, TWO_PI - normalized);
    }

    function rebaseWorldCoordinates() {
      if (worldScroll < WORLD_REBASE_THRESHOLD) {
        return;
      }
      var shift = worldScroll - WORLD_REBASE_TARGET;
      var index;
      worldScroll = WORLD_REBASE_TARGET;
      playerWorldX -= shift;
      for (index = 0; index < exhaustParticles.length; index++) {
        exhaustParticles[index].worldX -= shift;
      }
      for (index = 0; index < landingRings.length; index++) {
        landingRings[index].worldX -= shift;
      }
      for (index = 0; index < beacons.length; index++) {
        beacons[index].worldX -= shift;
      }
    }

    function showStartScreen() {
      gamePhase = PHASE_START;
      gameScreen.classList.remove("hidden");
      gameScreen.classList.remove("is-record");
      hudHighScore.classList.remove("is-record");
      screenTitle.textContent = GAME_TITLE;
      controlHint.innerHTML = getStartHintText();
      controlHint.classList.remove("hidden");
      showRobotColorPicker();
      screenMeters.classList.add("hidden");
      recordBurst.classList.remove("is-active");
      recordBurst.innerHTML = "";
      hudPlaying.classList.add("hidden");
      lostLimbCount = 0;
      currentLimbDamage = 0;
      headDetached = false;
      beacons.length = 0;
      beaconsSpawnedCount = 0;
      comboCount = 0;
      spinBonus = 0;
      headLaunchBeaconBonus = 0;
      robotAngle = 0;
      robotAngularVelocity = 0;
      worldScroll = 0;
      forwardSpeed = 0;
      playerYOffset = 0;
      playerVelocityY = 0;
      cameraScale = 1;
      playerWorldX = playerScreenX;
      plateauEndWorldX = playerScreenX + robotPx * PLATEAU_EDGE_OFFSET_FACTOR;
      legCurrentAngle = LEG_REST_ANGLE;

        window.WebExtrasGameStartMusicNotify.notifyStartScreenReady();
      }

    function showGameOverScreen(newRecord) {
      gamePhase = PHASE_GAME_OVER;
      gameScreen.classList.remove("hidden");
      screenTitle.textContent = getLocalized(LOCALE_KEY_GAME_OVER, "Game Over");
      screenMeters.textContent = formatMeters(distanceMeters);
      screenMeters.classList.remove("hidden");
      controlHint.classList.add("hidden");
      hideRobotColorPicker();
      hudPlaying.classList.add("hidden");
      if (newRecord) {
        gameScreen.classList.add("is-record");
        hudHighScore.classList.add("is-record");
        spawnRecordBurst();
        recordBurst.classList.add("is-active");
      } else {
        gameScreen.classList.remove("is-record");
        hudHighScore.classList.remove("is-record");
        recordBurst.classList.remove("is-active");
        recordBurst.innerHTML = "";
      }
      setHighScoreHud();

    function hideGameScreen() {
      gameScreen.classList.add("hidden");
      gameScreen.classList.remove("is-record");
      hudHighScore.classList.remove("is-record");
      recordBurst.classList.remove("is-active");
      hudPlaying.classList.remove("hidden");
      hideRobotColorPicker();
    }

    function spawnRecordBurst() {
      var index;
      var sparkCount = 18;
      recordBurst.innerHTML = "";
      for (index = 0; index < sparkCount; index++) {
        var spark = document.createElement("span");
        spark.className = "record-spark";
        var angle = (index / sparkCount) * TWO_PI;
        var dist = 60 + Math.random() * 90;
        spark.style.left = "50%";
        spark.style.top = "46%";
        spark.style.setProperty("--dx", Math.cos(angle) * dist + "px");
        spark.style.setProperty("--dy", Math.sin(angle) * dist + "px");
        recordBurst.appendChild(spark);
      }
    }

    function resetForLaunch() {
      worldScroll = 0;
      forwardSpeed = 0;
      distanceMeters = 0;
      lostLimbCount = 0;
      currentLimbDamage = 0;
      headDetached = false;
      beacons.length = 0;
      beaconsSpawnedCount = 0;
      comboCount = 0;
      spinBonus = 0;
      headLaunchBeaconBonus = 0;
      landingLockTimer = 0;
      screenShakeTimer = 0;
      screenShakeStrength = 0;
      playerYOffset = 0;
      playerVelocityY = 0;
      cameraScale = 1;
      robotAngle = 0;
      robotAngularVelocity = 0;
      debrisParticles.length = 0;
      sparkParticles.length = 0;
      exhaustParticles.length = 0;
      dustParticles.length = 0;
      landingRings.length = 0;
      parallaxPhase[0] = 0;
      parallaxPhase[1] = 0;
      parallaxPhase[2] = 0;
      parallaxPhase[3] = 0;
      playerWorldX = playerScreenX;
      plateauEndWorldX = playerScreenX + robotPx * PLATEAU_EDGE_OFFSET_FACTOR;
      showAllLimbs();
      syncLimbVisibility();
      setComboHud();
      hudDistance.textContent = "0m";
      setSpeedHud();
      robotWrap.classList.remove("is-dead");
      robotWrap.classList.remove("is-thrusting");
      robotWrap.classList.remove("is-reversing");
      robotWrap.classList.remove("is-headless");
    }

    function startLaunch() {
      if (isLaunch() || isPlaying()) {
        return;
      }
      resetForLaunch();
      gamePhase = PHASE_LAUNCH;
      launchTimer = 0;
      kickTimer = 0;
      launchKicked = false;
      countdownNumberShown = 3;
      launchLegFadeTimer = -1;
      legCurrentAngle = LEG_REST_ANGLE;
      hideGameScreen();
      hudPlaying.classList.remove("hidden");
      launchLeg.style.opacity = "";
      launchLeg.classList.add("is-visible");
      setCountdownText("3", false);
      positionRobotDom();
      positionLaunchLeg();
    }

    function beginPlaying() {
      forwardSpeed = LAUNCH_FORWARD_SPEED;
      playerYOffset = 0;
      playerVelocityY = -LAUNCH_BOUNCE;
      robotAngle = 0.18;
      robotAngularVelocity = getForwardSpinRate();
      gamePhase = PHASE_PLAYING;
      hideCountdown();
      legWorldAnchorX = worldScroll + (playerScreenX - robotPx * 0.62);
      launchLegFadeTimer = 0;
      triggerKickImpact();
      if (window.WebExtrasGameStartMusicNotify && window.WebExtrasGameStartMusicNotify.notifyGameplayStarted) {
        window.WebExtrasGameStartMusicNotify.notifyGameplayStarted();
      }
    }

    function triggerKickImpact() {
      screenShakeTimer = 0.18;
      screenShakeStrength = 6;
      var groundY = getPlayerGroundY();
      spawnSparks(playerScreenX - robotPx * 0.22, groundY - footReach * 0.5, 12);
    }

    function endGame() {
      var newRecord = false;
      var finalMeters = Math.floor(distanceMeters);
      if (finalMeters > highScoreMeters) {
        highScoreMeters = finalMeters;
        saveHighScore();
        newRecord = true;
      }
      gamePhase = PHASE_GAME_OVER;
      pointerHeld = false;
      if (!headDetached) {
        robotWrap.classList.add("is-dead");
      }
      robotWrap.classList.remove("is-thrusting");
      robotWrap.classList.remove("is-reversing");
      launchLeg.classList.remove("is-visible");
      launchLegFadeTimer = -1;
      hideCountdown();
      showGameOverScreen(newRecord);
    }

    function onPointerDown(event) {
      event.preventDefault();
      if (event.target && event.target.closest && event.target.closest("#robotColorPicker")) {
        return;
      }
      pointerHeld = true;
      if (isStart() || isGameOver()) {
        startLaunch();
        return;
      }
    }

    function onPointerUp() {
      pointerHeld = false;
    }

    function getLimbWorldAnchor(localX, localY) {
      var spinW = robotPx * 80 / 110;
      var spinH = robotPx;
      var centerX = playerScreenX;
      var centerY = getPlayerGroundY() + playerYOffset - footReach;
      var normalizedX = (localX / 80 - 0.5) * spinW;
      var normalizedY = (localY / 110 - 0.5) * spinH;
      var cos = Math.cos(robotAngle);
      var sin = Math.sin(robotAngle);
      return {
        x: centerX + normalizedX * cos - normalizedY * sin,
        y: centerY + normalizedX * sin + normalizedY * cos
      };
    }

    function spawnLimbDebris(limbId) {
      var anchorMap = {
        robotArmRight: [64, 53],
        robotArmLeft: [15, 53],
        robotLegRight: [46, 84],
        robotLegLeft: [34, 84]
      };
      var anchor = anchorMap[limbId];
      var origin = getLimbWorldAnchor(anchor[0], anchor[1]);
      var index;
      var count = 4;
      var debrisColors = getDebrisColorPair();
      for (index = 0; index < count; index++) {
        debrisParticles.push({
          x: origin.x,
          y: origin.y,
          velocityX: (Math.random() - 0.4) * 180 - forwardSpeed * 0.25,
          velocityY: -120 - Math.random() * 200,
          rotation: Math.random() * TWO_PI,
          spin: (Math.random() - 0.5) * 14,
          size: 6 + Math.random() * 8,
          age: 0,
          life: 1.1 + Math.random() * 0.6,
          color: index % 2 === 0 ? debrisColors.dark : debrisColors.light
        });
      }
      spawnSparks(origin.x, origin.y, 8);
    }

    function spawnSparks(originX, originY, count, baseHue) {
      var sparkHue = baseHue == null ? SPARK_DEFAULT_HUE : baseHue;
      var index;
      for (index = 0; index < count; index++) {
        var angle = Math.random() * TWO_PI;
        var speed = 80 + Math.random() * 220;
        sparkParticles.push({
          x: originX,
          y: originY,
          velocityX: Math.cos(angle) * speed,
          velocityY: Math.sin(angle) * speed - 40,
          age: 0,
          life: 0.3 + Math.random() * 0.3,
          size: 1.5 + Math.random() * 2.5,
          hue: sparkHue + Math.random() * 26
        });
      }
    }

    function spawnLandingRing(quality) {
      landingRings.push({
        worldX: playerWorldX,
        groundY: getPlayerGroundY(),
        age: 0,
        life: 0.5,
        maxRadius: quality === "perfect" ? 64 : 44,
        quality: quality
      });
    }

    function spawnExhaust() {
      var groundY = getPlayerGroundY();
      var footY = groundY + playerYOffset;
      exhaustParticles.push({
        worldX: playerWorldX + (Math.random() - 0.5) * 16,
        y: footY - 6 - Math.random() * 10,
        radius: 5 + Math.random() * 6,
        life: 0.5 + Math.random() * 0.4,
        age: 0,
        riseSpeed: 16 + Math.random() * 26,
        expandRate: 16 + Math.random() * 22
      });
    }

    function triggerDamageEffects() {
      screenShakeTimer = 0.24;
      screenShakeStrength = 8;
      damageFlash.classList.remove("is-active");
      void damageFlash.offsetWidth;
      damageFlash.classList.add("is-active");
    }

    function applyGoodLanding(uprightError, impactSpeed) {
      var isPerfect = uprightError < PERFECT_LANDING_TOLERANCE;
      var bounceUp;
      comboCount += 1;
      setComboHud();
      var speedGain = 14 + Math.min(comboCount, 12) * 1.6;
      if (isPerfect) {
        speedGain += 12;
      }
      forwardSpeed = Math.min(FORWARD_SPEED_MAX, forwardSpeed + speedGain);
      spinBonus = Math.min(SPIN_BONUS_MAX, spinBonus + (isPerfect ? PERFECT_SPIN_BONUS : GOOD_SPIN_BONUS));
      bounceUp = impactSpeed * 0.62 + 280 + forwardSpeed * 0.32;
      if (isPerfect) {
        bounceUp += 120;
      }
      playerVelocityY = -bounceUp;
      playerYOffset = 0;
      spawnLandingRing(isPerfect ? "perfect" : "good");
      spawnSparks(playerScreenX, getPlayerGroundY() + playerYOffset, isPerfect ? 10 : 5);
    }

    function applyBadLanding(impactSpeed) {
      comboCount = 0;
      setComboHud();
      forwardSpeed = Math.max(FORWARD_SPEED_MIN, forwardSpeed * 0.58);
      spinBonus = 0;
      triggerDamageEffects();
      currentLimbDamage += 1;
      if (currentLimbDamage < LIMB_HIT_POINTS) {
        playerVelocityY = -(impactSpeed * 0.32 + 180);
        playerYOffset = 0;
        landingLockTimer = 0.12;
        return;
      }
      currentLimbDamage = 0;
      var limbId = LIMB_LOSS_ORDER[lostLimbCount];
      lostLimbCount += 1;
      limbElements[limbId].classList.add("is-lost");
      syncPartPips();
      spawnLimbDebris(limbId);
      playerVelocityY = -(impactSpeed * 0.32 + 180);
      playerYOffset = 0;
      landingLockTimer = 0.12;
    }

    function launchHead() {
      headDetached = true;
      robotWrap.classList.add("is-headless");
      robotWrap.classList.remove("is-thrusting");
      var facingX = Math.sin(robotAngle);
      var facingY = -Math.cos(robotAngle);
      var headLaunchSpeed = HEAD_LAUNCH_SPEED + headLaunchBeaconBonus;
      forwardSpeed = facingX * headLaunchSpeed;
      playerVelocityY = facingY * headLaunchSpeed;
      playerYOffset = 0;
      landingLockTimer = 0.18;
      spinBonus = 0;
      comboCount = 0;
      setComboHud();
      triggerDamageEffects();
      var index;
      for (index = 0; index < 6; index++) {
        spawnLimbDebrisAtCenter();
      }
      spawnSparks(playerScreenX, getPlayerGroundY() + playerYOffset - footReach, 18);
    }

    function spawnLimbDebrisAtCenter() {
      var centerX = playerScreenX;
      var centerY = getPlayerGroundY() + playerYOffset - footReach;
      var angle = Math.random() * TWO_PI;
      var speed = 120 + Math.random() * 260;
      var debrisColors = getDebrisColorPair();
      debrisParticles.push({
        x: centerX,
        y: centerY,
        velocityX: Math.cos(angle) * speed,
        velocityY: Math.sin(angle) * speed - 160,
        rotation: Math.random() * TWO_PI,
        spin: (Math.random() - 0.5) * 18,
        size: 7 + Math.random() * 10,
        age: 0,
        life: 1.3 + Math.random() * 0.7,
        color: Math.random() > 0.5 ? debrisColors.dark : debrisColors.light
      });
    }

    function applyHeadGameOverLanding(impactSpeed) {
      playerYOffset = 0;
      landingLockTimer = HEAD_LANDING_LOCK_SECONDS;
      var bounceUp = impactSpeed * HEAD_GAME_OVER_BOUNCE_FACTOR + HEAD_GAME_OVER_BOUNCE_MIN;
      if (bounceUp > 30) {
        playerVelocityY = -bounceUp;
      } else {
        playerVelocityY = 0;
      }
      forwardSpeed *= 0.94;
      spawnSparks(playerScreenX, getPlayerGroundY() + playerYOffset - footReach, 6);
    }

    function updateHeadGameOverPhysics(deltaSeconds) {
      playerVelocityY += gravity * deltaSeconds;
      playerYOffset += playerVelocityY * deltaSeconds;
      if (landingLockTimer > 0) {
        landingLockTimer -= deltaSeconds;
        return;
      }
      if (playerYOffset >= 0) {
        if (playerVelocityY > 0) {
          applyHeadGameOverLanding(playerVelocityY);
        } else {
          playerYOffset = 0;
          forwardSpeed *= Math.exp(-HEAD_GROUND_SPEED_FRICTION * deltaSeconds);
          robotAngularVelocity *= Math.exp(-HEAD_GROUND_SPIN_FRICTION * deltaSeconds);
        }
      }
    }

    function updateHeadGameOverWorld(deltaSeconds) {
      worldScroll += forwardSpeed * deltaSeconds;
      playerWorldX = worldScroll + playerScreenX;
      var layerIndex;
      for (layerIndex = 0; layerIndex < parallaxPhase.length; layerIndex++) {
        parallaxPhase[layerIndex] += forwardSpeed * parallaxSpeeds[layerIndex] * deltaSeconds;
      }
      rebaseWorldCoordinates();
      robotAngle += robotAngularVelocity * deltaSeconds;
      updateHeadGameOverPhysics(deltaSeconds);
      updateCamera(deltaSeconds);
      updateDebris(deltaSeconds);
      updateSparks(deltaSeconds);
      positionRobotDom();
    }

    function processLanding() {
      var impactSpeed = playerVelocityY;
      if (headDetached) {
        if (!isGameOver()) {
          endGame();
        }
        applyHeadGameOverLanding(impactSpeed);
        return;
      }
      if (lostLimbCount >= TOTAL_LIMBS) {
        launchHead();
        return;
      }
      var groundSlopeAngle = getGroundSlopeAngle(playerWorldX);
      var uprightError = getUprightError(robotAngle - groundSlopeAngle);
      if (uprightError <= GOOD_LANDING_TOLERANCE) {
        applyGoodLanding(uprightError, impactSpeed);
      } else {
        applyBadLanding(impactSpeed);
      }
    }

    function updateRobotSpin(deltaSeconds) {
      if (pointerHeld) {
        robotAngularVelocity = -getReverseSpinRate();
        robotWrap.classList.add("is-reversing");
      } else {
        robotAngularVelocity = getForwardSpinRate();
        robotWrap.classList.remove("is-reversing");
      }
      robotAngle += robotAngularVelocity * deltaSeconds;
    }

    function updateCamera(deltaSeconds) {
      var pivotY = height * GROUND_PLAYER_Y_RATIO;
      var marginTop = height * CAMERA_TOP_MARGIN_RATIO;
      var robotHeightAbovePivot = footReach - playerYOffset;
      var desiredScale = 1;
      if (robotHeightAbovePivot > 0) {
        desiredScale = (pivotY - marginTop) / robotHeightAbovePivot;
      }
      if (desiredScale > 1) {
        desiredScale = 1;
      }
      if (desiredScale < CAMERA_MIN_SCALE) {
        desiredScale = CAMERA_MIN_SCALE;
      }
      var lerpFactor = Math.min(1, deltaSeconds * CAMERA_LERP_RATE);
      cameraScale += (desiredScale - cameraScale) * lerpFactor;
    }

    function updatePhysics(deltaSeconds) {
      playerVelocityY += gravity * deltaSeconds;
      playerYOffset += playerVelocityY * deltaSeconds;
      if (landingLockTimer > 0) {
        landingLockTimer -= deltaSeconds;
      }
      if (playerYOffset >= 0 && playerVelocityY >= 0 && landingLockTimer <= 0) {
        processLanding();
      }
      if (!headDetached && playerVelocityY < -30) {
        robotWrap.classList.add("is-thrusting");
        if (Math.random() < deltaSeconds * 40) {
          spawnExhaust();
        }
      } else {
        robotWrap.classList.remove("is-thrusting");
      }
    }

    function spawnBeacons() {
      var nextBeaconMeters = (beaconsSpawnedCount + 1) * BEACON_INTERVAL_METERS;
      while (distanceMeters >= nextBeaconMeters - BEACON_SPAWN_LEAD_METERS) {
        var aheadUnits = (nextBeaconMeters - distanceMeters) / METERS_PER_UNIT;
        beacons.push({
          worldX: playerWorldX + aheadUnits,
          triggered: false,
          fadeTimer: -1
        });
        beaconsSpawnedCount += 1;
        nextBeaconMeters = (beaconsSpawnedCount + 1) * BEACON_INTERVAL_METERS;
      }
    }

    function triggerBeacon(beacon) {
      beacon.triggered = true;
      beacon.fadeTimer = 0;
      if (headDetached) {
        return;
      }
      headLaunchBeaconBonus += HEAD_LAUNCH_BEACON_BONUS;
      currentLimbDamage = 0;
      if (lostLimbCount > 0) {
        lostLimbCount -= 1;
        limbElements[LIMB_LOSS_ORDER[lostLimbCount]].classList.remove("is-lost");
        syncPartPips();
      }
      spawnSparks(playerScreenX, getPlayerGroundY() + playerYOffset - footReach, 14, SPARK_BEACON_HUE);
    }

    function updateBeacons(deltaSeconds) {
      var index = 0;
      while (index < beacons.length) {
        var beacon = beacons[index];
        if (!beacon.triggered && playerWorldX >= beacon.worldX) {
          triggerBeacon(beacon);
        }
        if (beacon.fadeTimer >= 0) {
          beacon.fadeTimer += deltaSeconds;
        }
        if (beacon.fadeTimer >= BEACON_FADE_SECONDS || beacon.worldX < worldScroll - 200) {
          beacons.splice(index, 1);
        } else {
          index += 1;
        }
      }
    }

    function updateDebris(deltaSeconds) {
      var index = 0;
      while (index < debrisParticles.length) {
        var piece = debrisParticles[index];
        piece.age += deltaSeconds;
        piece.x -= (forwardSpeed * 0.4) * deltaSeconds;
        piece.x += piece.velocityX * deltaSeconds;
        piece.y += piece.velocityY * deltaSeconds;
        piece.velocityY += 620 * deltaSeconds;
        piece.rotation += piece.spin * deltaSeconds;
        if (piece.age >= piece.life || piece.y > height + 60) {
          debrisParticles.splice(index, 1);
        } else {
          index += 1;
        }
      }
    }

    function updateSparks(deltaSeconds) {
      var index = 0;
      while (index < sparkParticles.length) {
        var spark = sparkParticles[index];
        spark.age += deltaSeconds;
        spark.x += spark.velocityX * deltaSeconds;
        spark.y += spark.velocityY * deltaSeconds;
        spark.velocityY += 480 * deltaSeconds;
        if (spark.age >= spark.life) {
          sparkParticles.splice(index, 1);
        } else {
          index += 1;
        }
      }
    }

    function updateExhaust(deltaSeconds) {
      var index = 0;
      while (index < exhaustParticles.length) {
        var particle = exhaustParticles[index];
        particle.age += deltaSeconds;
        particle.y += particle.riseSpeed * deltaSeconds;
        particle.radius += particle.expandRate * deltaSeconds;
        if (particle.age >= particle.life) {
          exhaustParticles.splice(index, 1);
        } else {
          index += 1;
        }
      }
    }

    function updateLandingRings(deltaSeconds) {
      var index = 0;
      while (index < landingRings.length) {
        landingRings[index].age += deltaSeconds;
        if (landingRings[index].age >= landingRings[index].life) {
          landingRings.splice(index, 1);
        } else {
          index += 1;
        }
      }
    }

    function spawnDustParticle() {
      dustParticles.push({
        x: width + Math.random() * 60,
        y: height * 0.06 + Math.random() * height * 0.8,
        size: 0.8 + Math.random() * 2.2,
        speedX: 24 + Math.random() * 44 + forwardSpeed * 0.06,
        alpha: 0.05 + Math.random() * 0.14,
        life: 2.4 + Math.random() * 3.2,
        age: 0
      });
    }

    function updateDustParticles(deltaSeconds) {
      var index = 0;
      if (isPlaying() || isStart() || isLaunch()) {
        while (dustParticles.length < dustParticleMax && Math.random() < deltaSeconds * 7) {
          spawnDustParticle();
        }
      }
      while (index < dustParticles.length) {
        var particle = dustParticles[index];
        particle.age += deltaSeconds;
        particle.x -= particle.speedX * deltaSeconds;
        if (particle.age >= particle.life || particle.x < -20) {
          dustParticles.splice(index, 1);
        } else {
          index += 1;
        }
      }
    }

    function easeOutCubic(t) {
      var inverse = 1 - t;
      return 1 - inverse * inverse * inverse;
    }

    function setCountdownText(text, isGo) {
      countdownText.textContent = text;
      countdownText.classList.add("is-visible");
      if (isGo) {
        countdownText.classList.add("is-go");
      } else {
        countdownText.classList.remove("is-go");
      }
      countdownText.classList.remove("pop");
      void countdownText.offsetWidth;
      countdownText.classList.add("pop");
    }

    function hideCountdown() {
      countdownText.classList.remove("is-visible");
      countdownText.classList.remove("pop");
      countdownText.classList.remove("is-go");
    }

    function getLaunchLegHeight() {
      return robotPx * 2.1;
    }

    function positionLaunchLeg() {
      var legHeight = getLaunchLegHeight();
      var legWidth = legHeight * (140 / 200);
      var groundY = getPlayerGroundY();
      var hipScreenX;
      if (launchLegFadeTimer >= 0) {
        hipScreenX = legWorldAnchorX - worldScroll;
      } else {
        hipScreenX = playerScreenX - robotPx * 0.62;
      }
      var hipScreenY = groundY - legHeight * 0.82;
      launchLeg.style.width = legWidth + "px";
      launchLeg.style.height = legHeight + "px";
      launchLeg.style.left = (hipScreenX - 0.314 * legWidth) + "px";
      launchLeg.style.top = (hipScreenY - 0.13 * legHeight) + "px";
      launchLegPivot.style.transform = "rotate(" + legCurrentAngle + "rad)";
    }

    function updateLaunch(deltaSeconds) {
      launchTimer += deltaSeconds;
      if (!launchKicked) {
        var remaining = LAUNCH_COUNTDOWN_SECONDS - launchTimer;
        var countdownNumber = Math.ceil(remaining);
        if (countdownNumber < 1) {
          countdownNumber = 1;
        }
        if (countdownNumber !== countdownNumberShown) {
          countdownNumberShown = countdownNumber;
          setCountdownText(String(countdownNumber), false);
        }
        var cockProgress = easeOutCubic(Math.min(1, launchTimer / LAUNCH_COUNTDOWN_SECONDS));
        legCurrentAngle = LEG_REST_ANGLE + (LEG_COCK_ANGLE - LEG_REST_ANGLE) * cockProgress;
        if (launchTimer >= LAUNCH_COUNTDOWN_SECONDS) {
          launchKicked = true;
          kickTimer = 0;
          setCountdownText("GO!", true);
        }
      } else {
        kickTimer += deltaSeconds;
        var kickProgress = Math.min(1, kickTimer / LAUNCH_KICK_DURATION);
        legCurrentAngle = LEG_COCK_ANGLE + (LEG_KICK_ANGLE - LEG_COCK_ANGLE) * (kickProgress * kickProgress);
        if (kickTimer >= LAUNCH_KICK_CONTACT) {
          beginPlaying();
        }
      }
      updateDustParticles(deltaSeconds);
      positionRobotDom();
      positionLaunchLeg();
    }

    function updateLaunchLegFade(deltaSeconds) {
      if (launchLegFadeTimer < 0) {
        return;
      }
      launchLegFadeTimer += deltaSeconds;
      var fadeProgress = Math.min(1, launchLegFadeTimer / LEG_FADE_SECONDS);
      legCurrentAngle = LEG_KICK_ANGLE;
      launchLeg.style.opacity = String(1 - fadeProgress);
      positionLaunchLeg();
      if (fadeProgress >= 1) {
        launchLegFadeTimer = -1;
        launchLeg.classList.remove("is-visible");
        launchLeg.style.opacity = "";
      }
    }

    function updateStart(deltaSeconds) {
      updateDustParticles(deltaSeconds);
      positionRobotDom();
      positionLaunchLeg();
    }

    function updateGameOver(deltaSeconds) {
      if (headDetached) {
        updateHeadGameOverWorld(deltaSeconds);
      }
      updateExhaust(deltaSeconds);
      updateDustParticles(deltaSeconds);
      if (!headDetached) {
        updateCamera(deltaSeconds);
      }
      if (screenShakeTimer > 0) {
        screenShakeTimer -= deltaSeconds;
      }
    }

    function update(deltaSeconds) {
      if (isGameOver()) {
        updateGameOver(deltaSeconds);
        return;
      }
      if (isLaunch()) {
        updateLaunch(deltaSeconds);
        return;
      }
      if (isStart()) {
        updateStart(deltaSeconds);
        return;
      }

      if (!headDetached) {
        forwardSpeed = Math.min(FORWARD_SPEED_MAX, forwardSpeed + 3 * deltaSeconds);
      }
      worldScroll += forwardSpeed * deltaSeconds;
      playerWorldX = worldScroll + playerScreenX;
      if (forwardSpeed > 0) {
        distanceMeters += forwardSpeed * deltaSeconds * METERS_PER_UNIT;
      }
      hudDistance.textContent = formatMeters(distanceMeters);
      setSpeedHud();

      var layerIndex;
      for (layerIndex = 0; layerIndex < parallaxPhase.length; layerIndex++) {
        parallaxPhase[layerIndex] += forwardSpeed * parallaxSpeeds[layerIndex] * deltaSeconds;
      }

      rebaseWorldCoordinates();

      updateRobotSpin(deltaSeconds);
      updatePhysics(deltaSeconds);
      updateCamera(deltaSeconds);
      spawnBeacons();
      updateBeacons(deltaSeconds);
      updateDebris(deltaSeconds);
      updateSparks(deltaSeconds);
      updateExhaust(deltaSeconds);
      updateLandingRings(deltaSeconds);
      updateDustParticles(deltaSeconds);

      if (screenShakeTimer > 0) {
        screenShakeTimer -= deltaSeconds;
      }

      updateLaunchLegFade(deltaSeconds);
      positionRobotDom();
    }

    function positionRobotDom() {
      var pivotY = height * GROUND_PLAYER_Y_RATIO;
      var groundY = getPlayerGroundY();
      var naturalCenterY = groundY + playerYOffset - footReach;
      var scaledCenterY = pivotY + (naturalCenterY - pivotY) * cameraScale;
      var spinW = robotPx * 80 / 110;
      var left = playerScreenX - spinW * 0.5;
      var top = scaledCenterY - robotPx * 0.5;
      robotWrap.style.left = left + "px";
      robotWrap.style.top = top + "px";
      if (cameraScale === 1) {
        robotWrap.style.transform = "";
      } else {
        robotWrap.style.transform = "scale(" + cameraScale + ")";
      }
      robotSpin.style.transform = "rotate(" + robotAngle + "rad)";
    }

    function getScreenShakeOffset() {
      if (screenShakeTimer <= 0) {
        return { x: 0, y: 0 };
      }
      var shake = screenShakeStrength * (screenShakeTimer / 0.24);
      return {
        x: (Math.random() - 0.5) * shake * 2,
        y: (Math.random() - 0.5) * shake * 1.4
      };
    }

    function parseHexColor(hexColor) {
      var hex = hexColor.charAt(0) === "#" ? hexColor.substring(1) : hexColor;
      return {
        r: parseInt(hex.substring(0, 2), 16),
        g: parseInt(hex.substring(2, 4), 16),
        b: parseInt(hex.substring(4, 6), 16)
      };
    }

    function channelToHex(value) {
      var clamped = Math.max(0, Math.min(255, Math.round(value)));
      var hex = clamped.toString(16);
      if (hex.length < 2) {
        return "0" + hex;
      }
      return hex;
    }

    function lerpHexColor(colorA, colorB, blend) {
      var from = parseHexColor(colorA);
      var to = parseHexColor(colorB);
      var red = from.r + (to.r - from.r) * blend;
      var green = from.g + (to.g - from.g) * blend;
      var blue = from.b + (to.b - from.b) * blend;
      return "#" + channelToHex(red) + channelToHex(green) + channelToHex(blue);
    }

    function getSkyBlendWeights() {
      var spaceWeight = 0;
      var skyWeight = 0;
      var industrialWeight = 0;
      var segment = distanceMeters / SKY_SEGMENT_METERS;
      var spaceEnd = SKY_SPACE_SEGMENT_COUNT;
      var skyEnd = spaceEnd + SKY_ATMOSPHERE_SEGMENT_COUNT;
      var transitionEnd = skyEnd + SKY_INDUSTRIAL_SEGMENT_COUNT;

      if (segment >= transitionEnd) {
        industrialWeight = 1;
      } else if (segment <= 0) {
        spaceWeight = 1;
      } else if (segment < spaceEnd) {
        var enterSkyBlend = segment / spaceEnd;
        spaceWeight = 1 - enterSkyBlend;
        skyWeight = enterSkyBlend;
      } else if (segment < skyEnd) {
        skyWeight = 1;
      } else {
        var enterIndustrialBlend = (segment - skyEnd) / SKY_INDUSTRIAL_SEGMENT_COUNT;
        if (enterIndustrialBlend > 1) {
          enterIndustrialBlend = 1;
        }
        skyWeight = 1 - enterIndustrialBlend;
        industrialWeight = enterIndustrialBlend;
      }

      return {
        space: spaceWeight,
        sky: skyWeight,
        industrial: industrialWeight
      };
    }

    function getAtmosphereBlend() {
      return getSkyBlendWeights().industrial;
    }

    function blendThreeSkyColors(colorA, colorB, colorC, weightA, weightB, weightC) {
      var totalWeight = weightA + weightB + weightC;
      if (totalWeight <= 0) {
        return colorA;
      }
      var colorFromA = parseHexColor(colorA);
      var colorFromB = parseHexColor(colorB);
      var colorFromC = parseHexColor(colorC);
      var normalizedA = weightA / totalWeight;
      var normalizedB = weightB / totalWeight;
      var normalizedC = weightC / totalWeight;
      var red = colorFromA.r * normalizedA + colorFromB.r * normalizedB + colorFromC.r * normalizedC;
      var green = colorFromA.g * normalizedA + colorFromB.g * normalizedB + colorFromC.g * normalizedC;
      var blue = colorFromA.b * normalizedA + colorFromB.b * normalizedB + colorFromC.b * normalizedC;
      return "#" + channelToHex(red) + channelToHex(green) + channelToHex(blue);
    }

    function getSkyGradientColor(stopIndex, weights) {
      return blendThreeSkyColors(
        SKY_SPACE_STOPS[stopIndex].color,
        SKY_ATMOSPHERE_STOPS[stopIndex].color,
        SKY_INDUSTRIAL_STOPS[stopIndex].color,
        weights.space,
        weights.sky,
        weights.industrial
      );
    }

    function setPageBackgroundColor(color) {
      document.body.style.background = color;
    }

    function drawSky() {
      var weights = getSkyBlendWeights();
      var gradient = context.createLinearGradient(0, 0, 0, height);
      var stopIndex;
      for (stopIndex = 0; stopIndex < SKY_SPACE_STOPS.length; stopIndex++) {
        gradient.addColorStop(
          SKY_SPACE_STOPS[stopIndex].position,
          getSkyGradientColor(stopIndex, weights)
        );
      }
      context.fillStyle = gradient;
      context.fillRect(0, 0, width, height);
      setPageBackgroundColor(getSkyGradientColor(0, weights));
    }

    function drawSun() {
      var weights = getSkyBlendWeights();
      var sunX = width * 0.74;
      var sunY = height * 0.5;
      var sunRadius = Math.max(26, Math.min(width, height) * 0.07);
      var glow = context.createRadialGradient(sunX, sunY, sunRadius * 0.5, sunX, sunY, sunRadius * 4.5);
      var glowInnerAlpha = 0.4 + weights.sky * 0.08 + weights.industrial * 0.22;
      var glowOuterAlpha = 0.16 + weights.sky * 0.06 + weights.industrial * 0.18;
      var glowRed = 255;
      var glowGreen = Math.round(180 + weights.sky * 30 - weights.industrial * 50);
      var glowBlue = Math.round(90 + weights.sky * 70 - weights.industrial * 60);
      glow.addColorStop(0, "rgba(" + glowRed + ", " + glowGreen + ", " + glowBlue + ", " + glowInnerAlpha + ")");
      glow.addColorStop(0.4, "rgba(255, 130, 60, " + glowOuterAlpha + ")");
      glow.addColorStop(1, "transparent");
      context.fillStyle = glow;
      context.beginPath();
      context.arc(sunX, sunY, sunRadius * 4.5, 0, TWO_PI);
      context.fill();
      var body = context.createRadialGradient(sunX, sunY, sunRadius * 0.2, sunX, sunY, sunRadius);
      body.addColorStop(0, blendThreeSkyColors("#ffe7b0", "#fff8e8", "#fff0c8", weights.space, weights.sky, weights.industrial));
      body.addColorStop(0.6, blendThreeSkyColors("#ffb060", "#ffd878", "#ff9040", weights.space, weights.sky, weights.industrial));
      body.addColorStop(1, blendThreeSkyColors("#ff7a30", "#ffc848", "#ff6020", weights.space, weights.sky, weights.industrial));
      context.fillStyle = body;
      context.beginPath();
      context.arc(sunX, sunY, sunRadius, 0, TWO_PI);
      context.fill();
    }

    function initSkyStars() {
      var index;
      var starCount = 50;
      skyStars.length = 0;
      for (index = 0; index < starCount; index++) {
        var hashX = (index * 7919 + 104729) % 9973;
        var hashY = (index * 1301 + 49297) % 9973;
        skyStars.push({
          x: (hashX / 9973) * SKY_TILE_WIDTH,
          y: (hashY / 9973) * 0.4,
          size: (index % 3 === 0) ? 1.4 : 0.9
        });
      }
    }

    function drawStars() {
      var weights = getSkyBlendWeights();
      if (weights.space <= 0.02) {
        return;
      }
      var tileX;
      var index;
      var star;
      var screenX;
      var screenY;
      var starScroll = parallaxPhase[0];
      var starScrollWrapped = starScroll % SKY_TILE_WIDTH;
      if (starScrollWrapped < 0) {
        starScrollWrapped += SKY_TILE_WIDTH;
      }
      var tilesX = Math.ceil(width / SKY_TILE_WIDTH) + 2;
      var starAlpha = 0.7 * weights.space;
      context.fillStyle = "rgba(220, 226, 255, " + starAlpha + ")";
      for (tileX = -1; tileX < tilesX; tileX++) {
        for (index = 0; index < skyStars.length; index++) {
          star = skyStars[index];
          screenX = star.x + tileX * SKY_TILE_WIDTH - starScrollWrapped;
          screenY = star.y * height;
          if (screenX < -4 || screenX > width + 4) {
            continue;
          }
          context.beginPath();
          context.arc(screenX, screenY, star.size, 0, TWO_PI);
          context.fill();
        }
      }
    }

    function drawParallaxHills(layerIndex, topColor, bottomColor, colorStroke, amplitude, frequency, yBase) {
      var shift = parallaxPhase[layerIndex];
      var hillGradient = context.createLinearGradient(0, yBase - amplitude * 1.6, 0, height);
      hillGradient.addColorStop(0, topColor);
      hillGradient.addColorStop(0.55, bottomColor);
      hillGradient.addColorStop(1, "rgba(10, 12, 26, 0.95)");
      context.fillStyle = hillGradient;
      context.strokeStyle = colorStroke;
      context.lineWidth = 1;
      context.beginPath();
      var hillStartX = worldViewLeft - 40;
      var hillEndX = worldViewRight + 40;
      var hillBottomY = worldViewBottom + 40;
      var x = hillStartX;
      context.moveTo(x, hillBottomY);
      while (x < hillEndX) {
        var hillY = yBase +
          Math.sin((x + shift) * frequency + layerIndex) * amplitude +
          Math.sin((x + shift * 0.7) * frequency * 0.45) * amplitude * 0.5;
        context.lineTo(x, hillY);
        x += 16;
      }
      context.lineTo(hillEndX, hillBottomY);
      context.closePath();
      context.fill();
      context.stroke();
    }

    function drawGround() {
      var startX = worldScroll + worldViewLeft - 20;
      var endX = worldScroll + worldViewRight + 20;
      var groundBottomY = worldViewBottom + 40;
      var groundTopY = height * GROUND_TOP_Y_RATIO;
      var groundGradient = context.createLinearGradient(0, groundTopY, 0, height);
      groundGradient.addColorStop(0, "#5a4a64");
      groundGradient.addColorStop(0.2, "#3c3148");
      groundGradient.addColorStop(0.55, "#241d30");
      groundGradient.addColorStop(1, "#0e0a18");
      context.fillStyle = groundGradient;
      context.strokeStyle = "#7a5a86";
      context.lineWidth = 2;
      context.beginPath();
      var x = startX;
      context.moveTo(startX - worldScroll, groundWave(startX));
      while (x <= endX) {
        context.lineTo(x - worldScroll, groundWave(x));
        x += 5;
      }
      context.lineTo(endX - worldScroll, groundBottomY);
      context.lineTo(startX - worldScroll, groundBottomY);
      context.closePath();
      context.fill();
      context.stroke();

      context.strokeStyle = "rgba(255, 160, 90, 0.22)";
      context.lineWidth = 1;
      context.beginPath();
      x = startX;
      context.moveTo(startX - worldScroll, groundWave(startX) - 2);
      while (x <= endX) {
        context.lineTo(x - worldScroll, groundWave(x) - 2);
        x += 5;
      }
      context.stroke();
    }

    function drawBeacons() {
      if (!isPlaying()) {
        return;
      }
      var index;
      var beamHalfWidth = robotPx * 0.28;
      var topY = worldViewTop - 20;
      for (index = 0; index < beacons.length; index++) {
        var beacon = beacons[index];
        var screenX = beacon.worldX - worldScroll;
        if (screenX < worldViewLeft - 80 || screenX > worldViewRight + 80) {
          continue;
        }
        var groundY = groundWave(beacon.worldX);
        var alpha = 1;
        if (beacon.fadeTimer >= 0) {
          alpha = Math.max(0, 1 - beacon.fadeTimer / BEACON_FADE_SECONDS);
        }
        var beamGradient = context.createLinearGradient(screenX, topY, screenX, groundY);
        beamGradient.addColorStop(0, "rgba(255, 176, 96, 0)");
        beamGradient.addColorStop(0.55, "rgba(255, 176, 96, " + (alpha * 0.32) + ")");
        beamGradient.addColorStop(1, "rgba(255, 200, 140, " + (alpha * 0.8) + ")");
        context.fillStyle = beamGradient;
        context.fillRect(screenX - beamHalfWidth, topY, beamHalfWidth * 2, groundY - topY);
        context.fillStyle = "rgba(255, 226, 184, " + (alpha * 0.65) + ")";
        context.fillRect(screenX - 2.5, topY, 5, groundY - topY);
        context.fillStyle = "rgba(255, 190, 120, " + (alpha * 0.5) + ")";
        context.beginPath();
        context.ellipse(screenX, groundY, beamHalfWidth * 1.4, beamHalfWidth * 0.45, 0, 0, TWO_PI);
        context.fill();
      }
    }

    function drawLandingRings() {
      var index;
      for (index = 0; index < landingRings.length; index++) {
        var ring = landingRings[index];
        var screenX = ring.worldX - worldScroll;
        if (screenX < -80 || screenX > width + 80) {
          continue;
        }
        var progress = ring.age / ring.life;
        var radius = ring.maxRadius * progress;
        var fade = 1 - progress;
        context.globalAlpha = fade;
        context.strokeStyle = ring.quality === "perfect" ? "rgba(120, 220, 255, 0.9)" : "rgba(255, 180, 90, 0.85)";
        context.lineWidth = 3 * fade;
        context.beginPath();
        context.ellipse(screenX, ring.groundY - 2, radius, radius * 0.42, 0, 0, TWO_PI);
        context.stroke();
      }
      context.globalAlpha = 1;
    }

    function drawExhaust() {
      var index;
      for (index = 0; index < exhaustParticles.length; index++) {
        var particle = exhaustParticles[index];
        var screenX = particle.worldX - worldScroll;
        if (screenX < -60 || screenX > width + 60) {
          continue;
        }
        var fade = 1 - particle.age / particle.life;
        var alpha = fade * 0.32;
        var gradient = context.createRadialGradient(screenX, particle.y, particle.radius * 0.15, screenX, particle.y, particle.radius);
        gradient.addColorStop(0, "rgba(255, 240, 220, " + (alpha * 0.95) + ")");
        gradient.addColorStop(0.45, "rgba(220, 210, 220, " + (alpha * 0.5) + ")");
        gradient.addColorStop(1, "rgba(180, 178, 190, 0)");
        context.fillStyle = gradient;
        context.beginPath();
        context.arc(screenX, particle.y, particle.radius, 0, TWO_PI);
        context.fill();
      }
    }

    function drawDebris() {
      var index;
      for (index = 0; index < debrisParticles.length; index++) {
        var piece = debrisParticles[index];
        var fade = piece.age > piece.life - 0.3 ? (piece.life - piece.age) / 0.3 : 1;
        context.save();
        context.globalAlpha = Math.max(0, fade);
        context.translate(piece.x, piece.y);
        context.rotate(piece.rotation);
        context.fillStyle = piece.color;
        context.strokeStyle = "#2c364f";
        context.lineWidth = 1.2;
        context.fillRect(-piece.size * 0.5, -piece.size * 0.4, piece.size, piece.size * 0.8);
        context.strokeRect(-piece.size * 0.5, -piece.size * 0.4, piece.size, piece.size * 0.8);
        context.restore();
      }
      context.globalAlpha = 1;
    }

    function drawSparks() {
      var index;
      for (index = 0; index < sparkParticles.length; index++) {
        var spark = sparkParticles[index];
        var fade = 1 - spark.age / spark.life;
        context.globalAlpha = fade;
        context.fillStyle = "hsl(" + spark.hue + ", 95%, 62%)";
        context.beginPath();
        context.arc(spark.x, spark.y, spark.size * fade, 0, TWO_PI);
        context.fill();
      }
      context.globalAlpha = 1;
    }

    function drawDustParticles() {
      var index;
      for (index = 0; index < dustParticles.length; index++) {
        var particle = dustParticles[index];
        var fade = 1 - particle.age / particle.life;
        var alpha = particle.alpha * fade;
        context.fillStyle = "rgba(230, 210, 200, " + alpha + ")";
        context.beginPath();
        context.arc(particle.x, particle.y, particle.size, 0, TWO_PI);
        context.fill();
      }
    }

    function render() {
      var shake = getScreenShakeOffset();
      context.save();
      context.translate(shake.x, shake.y);
      context.clearRect(0, 0, width, height);
      drawSky();
      drawSun();
      drawStars();
      context.save();
      var cameraPivotX = playerScreenX;
      var cameraPivotY = height * GROUND_PLAYER_Y_RATIO;
      var inverseScale = 1 / cameraScale;
      worldViewLeft = cameraPivotX + (0 - cameraPivotX) * inverseScale;
      worldViewRight = cameraPivotX + (width - cameraPivotX) * inverseScale;
      worldViewTop = cameraPivotY + (0 - cameraPivotY) * inverseScale;
      worldViewBottom = cameraPivotY + (height - cameraPivotY) * inverseScale;
      context.translate(cameraPivotX, cameraPivotY);
      context.scale(cameraScale, cameraScale);
      context.translate(-cameraPivotX, -cameraPivotY);
      drawParallaxHills(0, "rgba(60, 50, 78, 0.92)", "rgba(30, 24, 44, 0.88)", "rgba(96, 70, 110, 0.4)", 44, 0.0014, height * 0.5);
      drawParallaxHills(1, "rgba(78, 56, 86, 0.94)", "rgba(38, 28, 50, 0.9)", "rgba(120, 80, 110, 0.44)", 54, 0.002, height * 0.56);
      drawParallaxHills(2, "rgba(96, 64, 88, 0.96)", "rgba(46, 32, 54, 0.92)", "rgba(140, 90, 110, 0.48)", 64, 0.0026, height * 0.62);
      drawParallaxHills(3, "rgba(116, 74, 90, 0.98)", "rgba(54, 38, 58, 0.94)", "rgba(160, 100, 110, 0.52)", 74, 0.0032, height * 0.66);
      drawDustParticles();
      drawExhaust();
      drawGround();
      drawBeacons();
      drawLandingRings();
      drawDebris();
      drawSparks();
      context.restore();
      context.restore();
      positionRobotDom();
    }

    var lastFrameTime = 0;
    function gameLoop(timestamp) {
      if (!lastFrameTime) {
        lastFrameTime = timestamp;
      }
      var deltaSeconds = Math.min(0.05, (timestamp - lastFrameTime) / 1000);
      lastFrameTime = timestamp;
      update(deltaSeconds);
      render();
      window.requestAnimationFrame(gameLoop);
    }

    window.addEventListener("resize", resizeCanvas);
    canvas.addEventListener("pointerdown", onPointerDown);
    gameScreen.addEventListener("pointerdown", onPointerDown);
    window.addEventListener("pointerup", onPointerUp);
    window.addEventListener("pointercancel", onPointerUp);

    cacheLimbElements();
    buildPartPips();
    buildRobotColorPicker();
    loadRobotColor();
    initSkyStars();
    bindLocaleListener();
    loadHighScore();
    resizeCanvas();
    showStartScreen();
    applyGameLocale();
    positionRobotDom();
    render();
    window.requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
