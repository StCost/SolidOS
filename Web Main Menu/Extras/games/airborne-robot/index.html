      context.fillStyle = hillGradient;
      context.strokeStyle = colorStroke;
      context.lineWidth = 1;
      context.beginPath();
      var hillStartX = worldViewLeft - 40;
      var hillEndX = worldViewRight + 40;
      var hillBottomY = worldViewBottom + 40;
      var x = hillStartX;
      context.moveTo(x, hillBottomY);
      while (x < hillEndX) {
        var hillY = yBase +
          Math.sin((x + shift) * frequency + layerIndex) * amplitude +
          Math.sin((x + shift * 0.7) * frequency * 0.45) * amplitude * 0.5;
        context.lineTo(x, hillY);
        x += 16;
      }
      context.lineTo(hillEndX, hillBottomY);
      context.closePath();
      context.fill();
      context.stroke();
    }

    function getTriangleWave(theta) {
      return Math.asin(Math.sin(theta)) * TWO_OVER_PI;
    }

    function drawRockMountains(layerIndex) {
      var shift = parallaxPhase[layerIndex];
      var amplitude = MOUNTAIN_AMPLITUDES[layerIndex];
      var frequency = MOUNTAIN_FREQUENCIES[layerIndex];
      var yBase = height * MOUNTAIN_Y_RATIOS[layerIndex];
      var gradientTop = yBase - amplitude * (MOUNTAIN_PEAK_RIDGE_SCALE + MOUNTAIN_PEAK_DETAIL_SCALE);
      var gradientSpan = Math.max(1, height - gradientTop);
      var snowStop = Math.max(0, Math.min(0.95, (yBase - amplitude * 1.15 - gradientTop) / gradientSpan));
      var grassStop = Math.max(snowStop + 0.06, Math.min(0.98, (yBase + amplitude * 0.05 - gradientTop) / gradientSpan));
      var snowColor = MOUNTAIN_SNOW_COLORS[layerIndex];
      var rockColor = MOUNTAIN_ROCK_COLORS[layerIndex];
      var grassColor = MOUNTAIN_GRASS_COLORS[layerIndex];
      var mountainGradient = context.createLinearGradient(0, gradientTop, 0, height);
      mountainGradient.addColorStop(0, snowColor);
      mountainGradient.addColorStop(snowStop, snowColor);
      mountainGradient.addColorStop(Math.min(0.99, snowStop + 0.05), rockColor);
      mountainGradient.addColorStop(Math.max(snowStop + 0.06, grassStop - 0.05), rockColor);
      mountainGradient.addColorStop(grassStop, grassColor);
      mountainGradient.addColorStop(1, MOUNTAIN_BASE_COLORS[layerIndex]);
      context.fillStyle = mountainGradient;
      context.strokeStyle = MOUNTAIN_STROKE_COLORS[layerIndex];
      context.lineWidth = 1;
      context.beginPath();
      var mountainStartX = worldViewLeft - 40;
      var mountainEndX = worldViewRight + 40;
      var mountainBottomY = worldViewBottom + 40;
      var x = mountainStartX;
      context.moveTo(x, mountainBottomY);
      while (x < mountainEndX) {
        var ridge = Math.abs(getTriangleWave((x + shift) * frequency + layerIndex));
        var detail = Math.abs(getTriangleWave((x + shift * 1.4) * frequency * 2.7 + layerIndex * 1.7));
        var mountainY = yBase - ridge * amplitude * MOUNTAIN_PEAK_RIDGE_SCALE - detail * amplitude * MOUNTAIN_PEAK_DETAIL_SCALE;
        context.lineTo(x, mountainY);
        x += 8;
      }
      context.lineTo(mountainEndX, mountainBottomY);
      context.closePath();
      context.fill();
      context.stroke();
    }

    function getSmoothStep(value) {
      if (value <= 0) {
        return 0;
      }
      if (value >= 1) {
        return 1;
      }
      return value * value * (3 - 2 * value);
    }

    function getCityLayerProgress(layerIndex) {
      var start = CITY_BLEND_START_METERS + layerIndex * CITY_LAYER_STAGGER_METERS;
      var progress = (distanceMeters - start) / CITY_LAYER_TRANSITION_METERS;
      if (progress <= 0) {
        return 0;
      }
      if (progress >= 1) {
        return 1;
      }
      return progress;
    }

    function getMountainLayerProgress(layerIndex) {
      var start = MOUNTAIN_BLEND_START_METERS + layerIndex * MOUNTAIN_LAYER_STAGGER_METERS;
      var progress = (distanceMeters - start) / MOUNTAIN_LAYER_TRANSITION_METERS;
      if (progress <= 0) {
        return 0;
      }
      if (progress >= 1) {
        return 1;
      }
      return progress;
    }

    function getFarIndustryLayerProgress(layerIndex) {
      var start = FAR_INDUSTRY_BLEND_START_METERS + layerIndex * FAR_INDUSTRY_LAYER_STAGGER_METERS;
      var progress = (distanceMeters - start) / FAR_INDUSTRY_LAYER_TRANSITION_METERS;
      if (progress <= 0) {
        return 0;
      }
      if (progress >= 1) {
        return 1;
      }
      return progress;
    }

    function drawParallaxHillsLayer(layerIndex) {
      drawParallaxHills(
        layerIndex,
        HILL_TOP_COLORS[layerIndex],
        HILL_BOTTOM_COLORS[layerIndex],
        HILL_STROKE_COLORS[layerIndex],
        HILL_AMPLITUDES[layerIndex],
        HILL_FREQUENCIES[layerIndex],
        height * HILL_Y_RATIOS[layerIndex]
      );
    }

    function drawCityTransitionLayer(layerIndex, weights) {
      var progress = getCityLayerProgress(layerIndex);
      var mountainProgress = getMountainLayerProgress(layerIndex);
      var farIndustryProgress = getFarIndustryLayerProgress(layerIndex);
      var farIndustryAlpha = getSmoothStep(farIndustryProgress / 0.4);
      var mountainAlpha = getSmoothStep(mountainProgress / 0.4) * (1 - getSmoothStep(farIndustryProgress));
      var cityAlpha = getSmoothStep(progress / 0.4) * (1 - getSmoothStep(mountainProgress));
      var hillAlpha = 1 - getSmoothStep(progress);
      if (hillAlpha > 0.001) {
        context.globalAlpha = hillAlpha;
        drawParallaxHillsLayer(layerIndex);
      }
      if (cityAlpha > 0.001) {
        context.globalAlpha = cityAlpha;
        drawParallaxCity(layerIndex, getCitySilhouetteColor(layerIndex, weights), 1, 1, false);
      }
      if (mountainAlpha > 0.001) {
        context.globalAlpha = mountainAlpha;
        drawRockMountains(layerIndex);
      }
      if (farIndustryAlpha > 0.001) {
        context.globalAlpha = farIndustryAlpha;
        drawParallaxCity(layerIndex, getCitySilhouetteColor(layerIndex, weights), FAR_INDUSTRY_HEIGHT_MUL, FAR_INDUSTRY_SPACING_MUL, true);
      }
    }

    function getCityHash(index, salt) {
      var n = (index * 374761393 + salt * 668265263) >>> 0;
      n = (n ^ (n >>> 13)) >>> 0;
      n = (n * 1274126177) >>> 0;
      return (n >>> 8) / 16777216;
    }

    function getCitySilhouetteColor(layerIndex, weights) {
      var brightness = CITY_LAYER_BRIGHTNESS[layerIndex];
      if (brightness <= 0) {
        return "#000000";
      }
      var tint = parseHexColor(getSkyGradientColor(CITY_TINT_STOP_INDEX, weights));
      return "#" +
        channelToHex(tint.r * brightness) +
        channelToHex(tint.g * brightness) +
        channelToHex(tint.b * brightness);
    }

    function drawCitySmoke(centerX, topY, sourceWidth, layerIndex, seed, colorPrefix, baseAlpha) {
      var riseHeight = sourceWidth * (9 + layerIndex * 2);
      var riseSpeed = 0.09 + layerIndex * 0.022;
      var maxRadius = sourceWidth * 1.6;
      var drift = sourceWidth * 2.4;
      var puffIndex;
      for (puffIndex = 0; puffIndex < CITY_SMOKE_PUFF_COUNT; puffIndex++) {
        var phase = (cityAnimationTime * riseSpeed + seed + puffIndex / CITY_SMOKE_PUFF_COUNT) % 1;
        var puffY = topY - phase * riseHeight;
        var puffX = centerX + Math.sin(phase * 4 + seed * TWO_PI) * drift * phase;
        var radius = maxRadius * (0.4 + phase * 1.05);
        var alpha = (1 - phase) * baseAlpha;
        if (alpha <= 0.012) {
          continue;
        }
        context.fillStyle = colorPrefix + alpha + ")";
        context.beginPath();
        context.arc(puffX, puffY, radius, 0, TWO_PI);
        context.fill();
      }
    }

    function drawCityWindows(left, right, topY, bottomY, layerIndex, index, litThreshold, sizeRatio) {
      var buildingWidth = right - left;
      var drawBottom = Math.min(bottomY, height + 4);
      if (buildingWidth < 6 || drawBottom - topY < 12) {
        return;
      }
      var windowSize = Math.max(1.3, Math.min(7, buildingWidth * sizeRatio));
      var stepX = windowSize * 2.2;
      var stepY = windowSize * 2.6;
      var marginX = windowSize;
      var glowAlpha = 0.32 + layerIndex * 0.14;
      var windowX = left + marginX;
      var column = 0;
      while (windowX + windowSize <= right - marginX) {
        var windowY = topY + windowSize * 1.6;
        var row = 0;
        while (windowY + windowSize <= drawBottom - windowSize) {
          var litHash = getCityHash(index * 131 + column * 17 + row * 7, layerIndex * 53 + 5);
          if (litHash > litThreshold) {
            var brightness = 0.55 + litHash * 0.45;
            if (litHash > 0.95) {
              brightness *= 0.5 + 0.5 * Math.abs(Math.sin(cityAnimationTime * 2.2 + index + row));
            }
            context.fillStyle = CITY_WINDOW_COLOR_PREFIX + (glowAlpha * brightness) + ")";
            context.fillRect(windowX, windowY, windowSize, windowSize);
          }
          row++;
          windowY += stepY;
        }
        column++;
        windowX += stepX;
      }
    }

    function drawCityResidentialCell(layerIndex, fillColor, left, right, roofTopY, bottomY, index) {
      var buildingWidth = right - left;
      context.fillStyle = fillColor;
      context.beginPath();
      context.rect(left, roofTopY, buildingWidth, bottomY - roofTopY);
      var roofHash = getCityHash(index, layerIndex * 7 + 1);
      if (roofHash > 0.45) {
        var ledgeHeight = Math.max(2, buildingWidth * 0.05);
        context.rect(left, roofTopY - ledgeHeight, buildingWidth, ledgeHeight);
      }
      context.fill();
      drawCityWindows(left, right, roofTopY, bottomY, layerIndex, index, CITY_RESIDENTIAL_LIT_THRESHOLD, 0.09);
    }

    function drawCityFactoryCell(layerIndex, fillColor, left, right, roofTopY, bottomY, index, typeHash) {
      var buildingWidth = right - left;
      var centerX = (left + right) * 0.5;
      var totalHeight = bottomY - roofTopY;
      context.fillStyle = fillColor;

      if (typeHash < 0.34) {
        var hallTopY = roofTopY + totalHeight * 0.22;
        var toothCount = Math.max(2, Math.round(buildingWidth / 14));
        var toothWidth = buildingWidth / toothCount;
        var toothHeight = Math.min(toothWidth * 0.9, totalHeight * 0.16);
        var stackWidth = Math.max(2, buildingWidth * 0.12);
        var stackHeight = totalHeight * (0.5 + typeHash * 0.6);
        var stackX = left + buildingWidth * 0.2;
        var stackTopY = hallTopY - stackHeight;
        context.beginPath();
        context.rect(left, hallTopY, buildingWidth, bottomY - hallTopY);
        var toothIndex;
        for (toothIndex = 0; toothIndex < toothCount; toothIndex++) {
          var toothX = left + toothIndex * toothWidth;
          context.moveTo(toothX, hallTopY);
          context.lineTo(toothX, hallTopY - toothHeight);
          context.lineTo(toothX + toothWidth, hallTopY);
        }
        context.rect(stackX - stackWidth * 0.5, stackTopY, stackWidth, stackHeight);
        context.rect(stackX - stackWidth * 0.72, stackTopY, stackWidth * 1.44, stackHeight * 0.08);
        context.fill();
        drawCitySmoke(stackX, stackTopY, stackWidth, layerIndex, typeHash, CITY_SMOKE_COLOR_PREFIX, 0.32);
        if (buildingWidth > 26) {
          var secondStackX = left + buildingWidth * 0.62;
          var secondStackHeight = stackHeight * 0.82;
          var secondStackTopY = hallTopY - secondStackHeight;
          context.beginPath();
          context.rect(secondStackX - stackWidth * 0.42, secondStackTopY, stackWidth * 0.84, secondStackHeight);
          context.rect(secondStackX - stackWidth * 0.6, secondStackTopY, stackWidth * 1.2, secondStackHeight * 0.08);
          context.fill();
          drawCitySmoke(secondStackX, secondStackTopY, stackWidth * 0.84, layerIndex, typeHash * 0.7 + 0.2, CITY_SMOKE_COLOR_PREFIX, 0.3);
        }
        drawCityWindows(left, right, hallTopY, bottomY, layerIndex, index, CITY_INDUSTRIAL_LIT_THRESHOLD, 0.055);
      } else if (typeHash < 0.56) {
        var tankCount = (buildingWidth > 22 && typeHash > 0.44) ? 2 : 1;
        var slotWidth = buildingWidth / tankCount;
        var tankIndex;
        context.beginPath();
        for (tankIndex = 0; tankIndex < tankCount; tankIndex++) {
          var tankCenterX = left + slotWidth * (tankIndex + 0.5);
          var tankRadius = slotWidth * 0.4;
          var domeCenterY = roofTopY + totalHeight * 0.32 + tankRadius;
          context.moveTo(tankCenterX - tankRadius, bottomY);
          context.lineTo(tankCenterX - tankRadius, domeCenterY);
          context.arc(tankCenterX, domeCenterY, tankRadius, Math.PI, 0, false);
          context.lineTo(tankCenterX + tankRadius, bottomY);
        }
        context.fill();
      } else if (typeHash < 0.78) {
        var towerTopY = roofTopY - totalHeight * 0.04;
        var baseHalf = buildingWidth * 0.46;
        var waistHalf = buildingWidth * 0.28;
        var topHalf = buildingWidth * 0.36;
        var waistY = towerTopY + (bottomY - towerTopY) * 0.55;
        context.beginPath();
        context.moveTo(centerX - baseHalf, bottomY);
        context.quadraticCurveTo(centerX - waistHalf, waistY, centerX - topHalf, towerTopY);
        context.lineTo(centerX + topHalf, towerTopY);
        context.quadraticCurveTo(centerX + waistHalf, waistY, centerX + baseHalf, bottomY);
        context.closePath();
        context.fill();
        drawCitySmoke(centerX, towerTopY, buildingWidth * 0.34, layerIndex, typeHash, CITY_STEAM_COLOR_PREFIX, 0.26);
      } else {
        var stepInset = buildingWidth * 0.22;
        var stepHeight = totalHeight * 0.12;
        var boilerStackWidth = Math.max(2, buildingWidth * 0.16);
        var boilerStackHeight = totalHeight * (0.4 + typeHash * 0.3);
        var boilerStackX = right - buildingWidth * 0.16;
        var boilerStackTopY = roofTopY - boilerStackHeight;
        context.beginPath();
        context.rect(left, roofTopY, buildingWidth, bottomY - roofTopY);
        context.rect(left + stepInset, roofTopY - stepHeight, buildingWidth - stepInset * 2, stepHeight);
        context.rect(boilerStackX - boilerStackWidth * 0.5, boilerStackTopY, boilerStackWidth, boilerStackHeight);
        context.fill();
        drawCitySmoke(boilerStackX, boilerStackTopY, boilerStackWidth, layerIndex, typeHash, CITY_SMOKE_COLOR_PREFIX, 0.3);
        drawCityWindows(left, right - buildingWidth * 0.34, roofTopY, bottomY, layerIndex, index, CITY_INDUSTRIAL_LIT_THRESHOLD, 0.06);
      }
    }

    function getCityCellRoofTopY(index, layerIndex, roofBaseY, maxBuildingHeight) {
      var heightRandom = getCityHash(index, layerIndex * 29 + 11);
      return roofBaseY - maxBuildingHeight * (0.34 + heightRandom * 0.66);
    }

    function drawParallaxCity(layerIndex, fillColor, heightMul, spacingMul, forceFactory) {
      var shift = parallaxPhase[layerIndex];
      var roofBaseY = height * CITY_LAYER_Y_RATIO[layerIndex];
      var spacing = CITY_LAYER_SPACING[layerIndex] * spacingMul;
      var maxBuildingHeight = height * CITY_LAYER_MAX_HEIGHT_RATIO[layerIndex] * heightMul;
      var gap = spacing * CITY_GAP_RATIO;
      var cityStartX = worldViewLeft - 40;
      var cityEndX = worldViewRight + 40;
      var cityBottomY = worldViewBottom + 40;
      var startIndex = Math.floor((cityStartX + shift) / spacing) - 1;
      var endIndex = Math.ceil((cityEndX + shift) / spacing) + 1;
      var index;
      for (index = startIndex; index <= endIndex; index++) {
        var cellLeft = index * spacing - shift;
        var roofTopY = getCityCellRoofTopY(index, layerIndex, roofBaseY, maxBuildingHeight);
        if (layerIndex === 0 && !forceFactory) {
          drawCityResidentialCell(layerIndex, fillColor, cellLeft, cellLeft + spacing, roofTopY, cityBottomY, index);
        } else {
          var widthRandom = getCityHash(index, layerIndex * 17 + 3);
          var buildingLeft = cellLeft + gap * 0.5;
          var buildingRight = cellLeft + spacing - gap * 0.5 - spacing * 0.26 * widthRandom;
          if (buildingRight - buildingLeft < spacing * 0.3) {
            buildingRight = buildingLeft + spacing * 0.3;
          }
          var typeHash = getCityHash(index, layerIndex * 61 + 13);
          drawCityFactoryCell(layerIndex, fillColor, buildingLeft, buildingRight, roofTopY, cityBottomY, index, typeHash);
        }
      }
    }

    function getGroundMountainBlend() {
      var start = MOUNTAIN_BLEND_START_METERS;
      var end = MOUNTAIN_BLEND_START_METERS + 3 * MOUNTAIN_LAYER_STAGGER_METERS + MOUNTAIN_LAYER_TRANSITION_METERS;
      if (distanceMeters <= start) {
        return 0;
      }
      if (distanceMeters >= end) {
        return 1;
      }
      return getSmoothStep((distanceMeters - start) / (end - start));
    }

    function getGroundStopColor(stopIndex, industrialWeight, mountainWeight, farIndustryWeight) {
      var clearToIndustrial = lerpHexColor(GROUND_COLORS_CLEAR[stopIndex], GROUND_COLORS_INDUSTRIAL[stopIndex], industrialWeight);
      var withMountain = lerpHexColor(clearToIndustrial, GROUND_COLORS_MOUNTAIN[stopIndex], mountainWeight);
      return lerpHexColor(withMountain, GROUND_COLORS_FAR_INDUSTRY[stopIndex], farIndustryWeight);
    }

    function drawGround() {
      var startX = worldScroll + worldViewLeft - 20;
      var endX = worldScroll + worldViewRight + 20;
      var groundBottomY = worldViewBottom + 40;
      var groundTopY = height * GROUND_TOP_Y_RATIO;
      var weights = getSkyBlendWeights();
      var industrialWeight = weights.industrial;
      var mountainWeight = getGroundMountainBlend();
      var farIndustryWeight = getFarIndustryBlend();
      var groundGradient = context.createLinearGradient(0, groundTopY, 0, height);
      groundGradient.addColorStop(0, getGroundStopColor(0, industrialWeight, mountainWeight, farIndustryWeight));
      groundGradient.addColorStop(0.2, getGroundStopColor(1, industrialWeight, mountainWeight, farIndustryWeight));
      groundGradient.addColorStop(0.55, getGroundStopColor(2, industrialWeight, mountainWeight, farIndustryWeight));
      groundGradient.addColorStop(1, getGroundStopColor(3, industrialWeight, mountainWeight, farIndustryWeight));
      context.fillStyle = groundGradient;
      var strokeClearToIndustrial = lerpHexColor(GROUND_STROKE_CLEAR, GROUND_STROKE_INDUSTRIAL, industrialWeight);
      var strokeWithMountain = lerpHexColor(strokeClearToIndustrial, GROUND_STROKE_MOUNTAIN, mountainWeight);
      context.strokeStyle = lerpHexColor(strokeWithMountain, GROUND_STROKE_FAR_INDUSTRY, farIndustryWeight);
      context.lineWidth = 2;
      context.beginPath();
      var x = startX;
      context.moveTo(startX - worldScroll, groundWave(startX));
      while (x <= endX) {
        context.lineTo(x - worldScroll, groundWave(x));
        x += 5;
      }
      context.lineTo(endX - worldScroll, groundBottomY);
      context.lineTo(startX - worldScroll, groundBottomY);
      context.closePath();
      context.fill();
      context.stroke();

      var highlightAlpha = 0.22 * industrialWeight * (1 - mountainWeight);
      if (highlightAlpha > 0.01) {
        context.strokeStyle = "rgba(255, 160, 90, " + highlightAlpha + ")";
        context.lineWidth = 1;
        context.beginPath();
        x = startX;
        context.moveTo(startX - worldScroll, groundWave(startX) - 2);
        while (x <= endX) {
          context.lineTo(x - worldScroll, groundWave(x) - 2);
          x += 5;
        }
        context.stroke();
      }
    }

    function drawBeacons() {
      if (!isPlaying()) {
        return;
      }
      var index;
      var beamHalfWidth = robotPx * 0.28;
      var topY = worldViewTop - 20;
      for (index = 0; index < beacons.length; index++) {
        var beacon = beacons[index];
        var screenX = beacon.worldX - worldScroll;
        if (screenX < worldViewLeft - 80 || screenX > worldViewRight + 80) {
          continue;
        }
        var groundY = groundWave(beacon.worldX);
        var alpha = 1;
        if (beacon.fadeTimer >= 0) {
          alpha = Math.max(0, 1 - beacon.fadeTimer / BEACON_FADE_SECONDS);
        }
        var beamGradient = context.createLinearGradient(screenX, topY, screenX, groundY);
        beamGradient.addColorStop(0, "rgba(255, 176, 96, 0)");
        beamGradient.addColorStop(0.55, "rgba(255, 176, 96, " + (alpha * 0.32) + ")");
        beamGradient.addColorStop(1, "rgba(255, 200, 140, " + (alpha * 0.8) + ")");
        context.fillStyle = beamGradient;
        context.fillRect(screenX - beamHalfWidth, topY, beamHalfWidth * 2, groundY - topY);
        context.fillStyle = "rgba(255, 226, 184, " + (alpha * 0.65) + ")";
        context.fillRect(screenX - 2.5, topY, 5, groundY - topY);
        context.fillStyle = "rgba(255, 190, 120, " + (alpha * 0.5) + ")";
        context.beginPath();
        context.ellipse(screenX, groundY, beamHalfWidth * 1.4, beamHalfWidth * 0.45, 0, 0, TWO_PI);
        context.fill();
      }
    }

    function drawLandingRings() {
      var index;
      for (index = 0; index < landingRings.length; index++) {
        var ring = landingRings[index];
        var screenX = ring.worldX - worldScroll;
        if (screenX < -80 || screenX > width + 80) {
          continue;
        }
        var progress = ring.age / ring.life;
        var radius = ring.maxRadius * progress;
        var fade = 1 - progress;
        context.globalAlpha = fade;
        context.strokeStyle = ring.quality === "perfect" ? "rgba(120, 220, 255, 0.9)" : "rgba(255, 180, 90, 0.85)";
        context.lineWidth = 3 * fade;
        context.beginPath();
        context.ellipse(screenX, ring.groundY - 2, radius, radius * 0.42, 0, 0, TWO_PI);
        context.stroke();
      }
      context.globalAlpha = 1;
    }

    function drawExhaust() {
      var index;
      for (index = 0; index < exhaustParticles.length; index++) {
        var particle = exhaustParticles[index];
        var screenX = particle.worldX - worldScroll;
        if (screenX < -60 || screenX > width + 60) {
          continue;
        }
        var fade = 1 - particle.age / particle.life;
        var alpha = fade * 0.32;
        var gradient = context.createRadialGradient(screenX, particle.y, particle.radius * 0.15, screenX, particle.y, particle.radius);
        gradient.addColorStop(0, "rgba(255, 240, 220, " + (alpha * 0.95) + ")");
        gradient.addColorStop(0.45, "rgba(220, 210, 220, " + (alpha * 0.5) + ")");
        gradient.addColorStop(1, "rgba(180, 178, 190, 0)");
        context.fillStyle = gradient;
        context.beginPath();
        context.arc(screenX, particle.y, particle.radius, 0, TWO_PI);
        context.fill();
      }
    }

    function drawDebris() {
      var index;
      for (index = 0; index < debrisParticles.length; index++) {
        var piece = debrisParticles[index];
        var fade = piece.age > piece.life - 0.3 ? (piece.life - piece.age) / 0.3 : 1;
        context.save();
        context.globalAlpha = Math.max(0, fade);
        context.translate(piece.x, piece.y);
        context.rotate(piece.rotation);
        context.fillStyle = piece.color;
        context.strokeStyle = "#2c364f";
        context.lineWidth = 1.2;
        context.fillRect(-piece.size * 0.5, -piece.size * 0.4, piece.size, piece.size * 0.8);
        context.strokeRect(-piece.size * 0.5, -piece.size * 0.4, piece.size, piece.size * 0.8);
        context.restore();
      }
      context.globalAlpha = 1;
    }

    function drawSparks() {
      var index;
      for (index = 0; index < sparkParticles.length; index++) {
        var spark = sparkParticles[index];
        var fade = 1 - spark.age / spark.life;
        context.globalAlpha = fade;
        context.fillStyle = "hsl(" + spark.hue + ", 95%, 62%)";
        context.beginPath();
        context.arc(spark.x, spark.y, spark.size * fade, 0, TWO_PI);
        context.fill();
      }
      context.globalAlpha = 1;
    }

    function drawExplosionBursts() {
      var index;
      for (index = 0; index < explosionBursts.length; index++) {
        var burst = explosionBursts[index];
        var progress = burst.age / burst.life;
        var radius = burst.maxRadius * progress;
        var fade = 1 - progress;
        if (fade <= 0) {
          continue;
        }
        context.save();
        context.globalAlpha = fade * 0.85;
        var gradient = context.createRadialGradient(burst.x, burst.y, radius * 0.08, burst.x, burst.y, radius);
        gradient.addColorStop(0, "rgba(255, 240, 180, " + (fade * 0.95) + ")");
        gradient.addColorStop(0.28, "rgba(255, 120, 40, " + (fade * 0.72) + ")");
        gradient.addColorStop(0.62, "rgba(255, 45, 25, " + (fade * 0.38) + ")");
        gradient.addColorStop(1, "rgba(180, 20, 15, 0)");
        context.fillStyle = gradient;
        context.beginPath();
        context.arc(burst.x, burst.y, radius, 0, TWO_PI);
        context.fill();
        context.strokeStyle = "rgba(255, 180, 80, " + (fade * 0.55) + ")";
        context.lineWidth = 3 * fade;
        context.beginPath();
        context.arc(burst.x, burst.y, radius * 0.82, 0, TWO_PI);
        context.stroke();
        context.restore();
      }
      context.globalAlpha = 1;
    }

    function drawHeadTrail() {
      if (headTrailPoints.length < 2) {
        return;
      }
      var index;
      context.save();
      context.lineCap = "round";
      context.lineJoin = "round";
      for (index = 1; index < headTrailPoints.length; index++) {
        var previous = headTrailPoints[index - 1];
        var current = headTrailPoints[index];
        var trailProgress = index / (headTrailPoints.length - 1);
        var fade = (1 - current.age / HEAD_TRAIL_POINT_LIFE) * (0.2 + trailProgress * 0.8);
        if (fade <= 0) {
          continue;
        }
        var lineWidth = 3 + trailProgress * 14;
        context.strokeStyle = "rgba(255, 30, 20, " + (fade * 0.32) + ")";
        context.lineWidth = lineWidth * 2.4;
        context.beginPath();
        context.moveTo(previous.x, previous.y);
        context.lineTo(current.x, current.y);
        context.stroke();
        context.strokeStyle = "rgba(255, 85, 40, " + fade + ")";
        context.lineWidth = lineWidth;
        context.beginPath();
        context.moveTo(previous.x, previous.y);
        context.lineTo(current.x, current.y);
        context.stroke();
        context.strokeStyle = "rgba(255, 210, 120, " + (fade * 0.65) + ")";
        context.lineWidth = Math.max(1.5, lineWidth * 0.28);
        context.beginPath();
        context.moveTo(previous.x, previous.y);
        context.lineTo(current.x, current.y);
        context.stroke();
      }
      context.restore();
    }

    function drawDustParticles() {
      var index;
      for (index = 0; index < dustParticles.length; index++) {
        var particle = dustParticles[index];
        var fade = 1 - particle.age / particle.life;
        var alpha = particle.alpha * fade;
        context.fillStyle = "rgba(230, 210, 200, " + alpha + ")";
        context.beginPath();
        context.arc(particle.x, particle.y, particle.size, 0, TWO_PI);
        context.fill();
      }
    }

    function applyScreenShake() {
      var shake = getScreenShakeOffset();
      if (shake.x === 0 && shake.y === 0) {
        gameRoot.style.transform = "";
        return;
      }
      gameRoot.style.transform = "translate(" + shake.x + "px, " + shake.y + "px)";
    }

    function render() {
      applyScreenShake();
      context.save();
      context.clearRect(0, 0, width, height);
      drawSky();
      drawSun();
      drawStars();
      drawSkyCraft();
      context.save();
      var cameraPivotX = playerScreenX;
      var cameraPivotY = height * GROUND_PLAYER_Y_RATIO;
      var inverseScale = 1 / cameraScale;
      worldViewLeft = cameraPivotX + (0 - cameraPivotX) * inverseScale;
      worldViewRight = cameraPivotX + (width - cameraPivotX) * inverseScale;
      worldViewTop = cameraPivotY + (0 - cameraPivotY) * inverseScale;
      worldViewBottom = cameraPivotY + (height - cameraPivotY) * inverseScale;
      context.translate(cameraPivotX, cameraPivotY);
      context.scale(cameraScale, cameraScale);
      context.translate(-cameraPivotX, -cameraPivotY);
      var cityWeights = getSkyBlendWeights();
      drawCityTransitionLayer(0, cityWeights);
      drawCityTransitionLayer(1, cityWeights);
      drawCityTransitionLayer(2, cityWeights);
      drawCityTransitionLayer(3, cityWeights);
      context.globalAlpha = 1;
      drawDustParticles();
      drawExhaust();
      drawGround();
      drawBeacons();
      drawLandingRings();
      drawDebris();
      drawSparks();
      context.restore();
      drawExplosionBursts();
      drawHeadTrail();
      drawOffScreenRobotIndicator();
      context.restore();
      positionRobotDom();
      positionDetachedLimbsDom();
    }

    var lastFrameTime = 0;
    function gameLoop(timestamp) {
      if (!lastFrameTime) {
        lastFrameTime = timestamp;
      }
      var deltaSeconds = Math.min(0.05, (timestamp - lastFrameTime) / 1000);
      lastFrameTime = timestamp;
      cityAnimationTime += deltaSeconds;
      update(deltaSeconds);
      updateSkyCraft(deltaSeconds);
      updateDetachedLimbs(deltaSeconds);
      render();
      window.requestAnimationFrame(gameLoop);
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("keydown", onDebugKeyDown);
    debugPanel.addEventListener("pointerdown", onDebugPanelPointerDown);
    debugGodmodeSwitch.addEventListener("click", onDebugGodmodeSwitchClick);
    canvas.addEventListener("pointerdown", onPointerDown);
    gameScreen.addEventListener("pointerdown", onPointerDown);
    window.addEventListener("pointerup", onPointerUp);
    window.addEventListener("pointercancel", onPointerUp);

    cacheLimbElements();
    buildPartPips();
    buildRobotColorPicker();
    loadRobotColor();
    initSkyStars();
    initSkyCraft();
    bindLocaleListener();
    loadHighScore();
    debugSpawnInput.value = String(DEBUG_SPAWN_DEFAULT_METERS);
    resizeCanvas();
    showStartScreen();
    applyGameLocale();
    positionRobotDom();
    render();
    window.requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
