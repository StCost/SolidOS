<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Last Run</title>
  <script src="../iframe-game-locale.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0c0618;
      color: #d4b8ff;
      font-family: "Courier New", Courier, monospace;
      cursor: url("../../../cursor-pointer.svg") 2.1 0, pointer;
    }

    #gameRoot,
    #gameCanvas {
      cursor: url("../../../cursor-pointer.svg") 2.1 0, pointer;
    }

    #gameRoot {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #gameCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #damageFlash {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(circle at 22% 72%, rgba(255, 70, 110, 0.45), transparent 55%);
      opacity: 0;
    }

    #damageFlash.is-active {
      animation: damage-flash 0.32s ease-out forwards;
    }

    @keyframes damage-flash {
      0% { opacity: 0.85; }
      100% { opacity: 0; }
    }

    #runnerHerd {
      position: absolute;
      left: 0;
      top: 0;
      width: 84px;
      height: 68px;
      pointer-events: none;
      z-index: 4;
      transition: opacity 0.15s linear;
    }

    #runnerHerd.is-hit {
      animation: runner-hit 0.28s ease-out;
    }

    #runnerFollowers {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .runner-follower {
      position: absolute;
      left: 0;
      top: 0;
      width: 84px;
      height: 68px;
      pointer-events: none;
    }

    .runner-follower-tilt {
      width: 100%;
      height: 100%;
      transform-origin: 40px 62px;
    }

    .runner-follower-shake {
      width: 100%;
      height: 100%;
      transform-origin: 40px 62px;
    }

    .runner-follower-shake.is-running {
      animation: runner-run-bob 0.44s ease-in-out infinite;
    }

    .runner-follower-shake svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 2px 6px rgba(100, 50, 180, 0.4));
    }

    .runner-follower.is-joining .runner-follower-shake svg {
      filter: drop-shadow(0 0 14px rgba(210, 150, 255, 0.85)) drop-shadow(0 2px 6px rgba(100, 50, 180, 0.4));
    }

    .runner-follower-eject {
      position: absolute;
      left: 0;
      top: 0;
      width: 84px;
      height: 68px;
      pointer-events: none;
      z-index: 5;
    }

    .runner-follower-eject .runner-follower-shake svg {
      filter: drop-shadow(0 2px 6px rgba(100, 50, 180, 0.35));
    }

    #runnerWrap {
      position: absolute;
      left: 0;
      top: 0;
      width: 84px;
      height: 68px;
      pointer-events: none;
      z-index: 8;
    }

    #runnerWrap.is-hit {
      animation: none;
    }

    @keyframes runner-hit {
      0% { transform: translate(0, 0); filter: brightness(2) hue-rotate(-20deg); }
      40% { transform: translate(4px, -3px); }
      100% { transform: translate(0, 0); }
    }

    #runnerTilt {
      width: 100%;
      height: 100%;
      transform-origin: 40px 62px;
    }

    #runnerShake {
      width: 100%;
      height: 100%;
      transform-origin: 40px 62px;
    }

    #runnerShake.is-running {
      animation: runner-run-bob 0.44s ease-in-out infinite;
    }

    @keyframes runner-run-bob {
      0%, 100% {
        transform: translateY(0) scaleY(1) rotate(0.2rad);
      }
      35% {
        transform: translateY(-7px) scaleY(1.03) rotate(-0.16rad);
      }
      65% {
        transform: translateY(-2px) scaleY(0.98) rotate(0.08rad);
      }
    }

    #runnerSvg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 2px 8px rgba(120, 60, 200, 0.5));
      transition: filter 0.35s ease;
    }

    #runnerWrap.is-dead #runnerSvg {
      filter: grayscale(0.9) brightness(0.5) drop-shadow(0 2px 4px rgba(20, 10, 30, 0.6));
    }

    #runnerWrap.is-dead #runnerTilt {
      transform: rotate(68deg) !important;
    }

    .hud-panel {
      position: absolute;
      z-index: 6;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(160, 100, 220, 0.45);
    }

    #hudScoreRow {
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 1.15rem;
      letter-spacing: 0.14em;
      color: #e8cfff;
    }

    #hudDistance {
      font-size: inherit;
      letter-spacing: inherit;
      color: inherit;
      line-height: 1.1;
    }

    #hudSpeed {
      font-size: 0.78em;
      letter-spacing: 0.12em;
      color: #c9a8ff;
      line-height: 1.1;
    }

    #hudPlaying.hidden {
      display: none;
    }

    #hudHighScore {
      bottom: 12px;
      right: 14px;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      color: #a888d8;
      text-align: right;
      z-index: 9;
    }

    #hudHighScore.is-record {
      color: #ffd878;
      animation: record-title-glow 0.7s ease-in-out infinite alternate;
    }

    #gameScreen {
      position: absolute;
      inset: 0;
      z-index: 7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      pointer-events: none;
      background: rgba(8, 4, 18, 0.38);
    }

    #gameScreen.hidden {
      display: none;
    }

    #screenTitle {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #e8cfff;
      text-shadow: 0 0 16px rgba(180, 120, 255, 0.55);
    }

    #screenMeters {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.16em;
      color: #c9a8ff;
    }

    #screenMeters.hidden {
      display: none;
    }

    #controlHint {
      margin: 0.35rem 0 0;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #c9a8ff;
      text-align: center;
      max-width: min(92vw, 22rem);
    }

    #controlHint.hidden {
      display: none;
    }

    #clickHint {
      position: absolute;
      left: 18%;
      bottom: 28%;
      width: 52px;
      height: 52px;
      margin-left: -26px;
      margin-top: -26px;
      border: 2px solid rgba(200, 160, 255, 0.55);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
    }

    #clickHint.is-visible {
      opacity: 1;
      animation: click-hint-pulse 1.4s ease-in-out infinite;
    }

    #clickHint::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 2px solid rgba(232, 180, 255, 0.35);
      border-radius: 50%;
      animation: click-hint-inner 1.4s ease-in-out infinite;
    }

    @keyframes click-hint-pulse {
      0%, 100% { transform: scale(0.88); opacity: 0.35; }
      50% { transform: scale(1.08); opacity: 0.9; }
    }

    @keyframes click-hint-inner {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(0.72); opacity: 1; }
    }

    #gameScreen.is-record #screenTitle {
      animation: record-title-glow 0.9s ease-in-out infinite alternate;
      color: #ffe8a8;
    }

    #gameScreen.is-record #screenMeters {
      color: #ffd878;
      animation: record-title-glow 0.7s ease-in-out infinite alternate;
    }

    @keyframes record-title-glow {
      from { text-shadow: 0 0 8px rgba(255, 200, 100, 0.4); }
      to { text-shadow: 0 0 22px rgba(255, 220, 140, 0.95), 0 0 40px rgba(255, 160, 80, 0.45); }
    }

    #recordBurst {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0;
    }

    #recordBurst.is-active {
      opacity: 1;
    }

    .record-spark {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffe090;
      box-shadow: 0 0 10px #ffb040;
      animation: record-spark-fly 1.1s ease-out forwards;
    }

    @keyframes record-spark-fly {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="gameRoot">
    <canvas id="gameCanvas" aria-hidden="true"></canvas>
    <div id="damageFlash" aria-hidden="true"></div>
    <div id="runnerHerd" aria-hidden="true">
      <div id="runnerFollowers"></div>
      <div id="runnerWrap">
      <div id="runnerTilt">
        <div id="runnerShake">
          <svg id="runnerSvg" viewBox="0 0 84 68" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <g fill="#5a3d8a" stroke="#2e1f48" stroke-width="1.1" stroke-linejoin="round">
              <ellipse cx="38" cy="34" rx="22" ry="14" fill="#6b4aa8" />
              <path d="M14 36 Q8 38 6 44 L10 46 Q12 40 18 38 Z" fill="#4a3270" />
              <path d="M58 32 Q68 28 76 30 L74 36 Q66 34 60 36 Z" fill="#7a58b8" />
              <circle cx="52" cy="28" r="7" fill="#8a68c8" />
              <circle cx="54" cy="26" r="3" fill="#c8f0ff" />
              <circle cx="55" cy="25" r="1.2" fill="#1a1028" />
              <path d="M62 24 L70 20 L68 26 Z" fill="#9a78d0" />
            </g>
            <g stroke="#3d2860" stroke-width="1.4" stroke-linecap="round" fill="none">
              <path d="M22 46 L18 58 M18 58 L14 62" />
              <path d="M32 48 L28 60 M28 60 L24 64" />
              <path d="M44 48 L42 60 M42 60 L40 64" />
              <path d="M54 46 L56 58 M56 58 L58 62" />
            </g>
            <path d="M8 38 Q4 42 6 48" fill="none" stroke="#9a72c8" stroke-width="2" stroke-linecap="round" />
          </svg>
        </div>
      </div>
      </div>
    </div>
    <div id="hudPlaying">
      <div id="hudScoreRow" class="hud-panel">
        <div id="hudDistance">0m</div>
        <div id="hudSpeed">0 m/s</div>
      </div>
    </div>
    <div id="hudHighScore" class="hud-panel">best 0m</div>
    <div id="clickHint" class="is-visible" aria-hidden="true"></div>
    <div id="gameScreen">
      <h1 id="screenTitle">Last Run</h1>
      <p id="controlHint">Press and Hold to jump higher</p>
      <p id="screenMeters" class="hidden">0m</p>
      <div id="recordBurst" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    var HIGH_SCORE_STORAGE_KEY = "cm-last-run-high-score";
    var GAME_TITLE = "Last Run";
    var LOCALE_KEY_GAME_OVER = "web.game.game-over";
    var LOCALE_KEY_BEST_LABEL = "web.game.best-label";
    var LOCALE_KEY_METERS_SUFFIX = "web.game.meters-suffix";
    var LOCALE_KEY_SPEED_SUFFIX = "web.game.speed-suffix";
    var LOCALE_KEY_HOLD_JUMP_HIGHER = "web.game.prompt.hold-jump-higher";
    var METERS_PER_UNIT = 0.12;
    var START_HP = 2;
    var HP_DISTANCE_PER_LIFE = 1000;

    var PHASE_START = "start";
    var PHASE_PLAYING = "playing";
    var PHASE_GAME_OVER = "gameover";

    var canvas = document.getElementById("gameCanvas");
    var context = canvas.getContext("2d");
    var damageFlash = document.getElementById("damageFlash");
    var gameRoot = document.getElementById("gameRoot");
    var runnerHerd = document.getElementById("runnerHerd");
    var runnerFollowers = document.getElementById("runnerFollowers");
    var runnerWrap = document.getElementById("runnerWrap");
    var runnerSvg = document.getElementById("runnerSvg");
    var runnerTilt = document.getElementById("runnerTilt");
    var runnerShake = document.getElementById("runnerShake");
    var hudPlaying = document.getElementById("hudPlaying");
    var hudDistance = document.getElementById("hudDistance");
    var hudSpeed = document.getElementById("hudSpeed");
    var gameScreen = document.getElementById("gameScreen");
    var hudHighScore = document.getElementById("hudHighScore");
    var screenTitle = document.getElementById("screenTitle");
    var screenMeters = document.getElementById("screenMeters");
    var controlHint = document.getElementById("controlHint");
    var clickHint = document.getElementById("clickHint");
    var recordBurst = document.getElementById("recordBurst");

    var width = 0;
    var height = 0;
    var devicePixelRatioScale = 1;

    var gamePhase = PHASE_START;
    var pointerHeld = false;

    var worldScroll = 0;
    var scrollSpeedBase = 280;
    var scrollSpeed = 280;
    var speedDoubleDistanceMeters = 10000;
    var distanceMeters = 0;
    var highScoreMeters = 0;

    var WORLD_REBASE_THRESHOLD = 80000;
    var WORLD_REBASE_TARGET = 40000;

    var playerScreenX = 0;
    var playerWorldX = 0;
    var playerYOffset = 0;
    var playerVelocityY = 0;
    var grounded = true;
    var jumpHoldTime = 0;
    var jumpLaunched = false;

    var jumpTapImpulse = 370;
    var jumpHoldLift = 300;
    var jumpHoldMaxSeconds = 0.55;
    var gravity = 1180;
    var gravityRelease = 1450;

    var herdHp = START_HP;
    var hpMilestoneNext = HP_DISTANCE_PER_LIFE;
    var herdShuffleTime = 0;
    var herdFollowerElements = [];
    var herdMemberMotions = [];
    var HERD_JOIN_DURATION = 0.82;
    var HERD_EJECT_GRAVITY = 520;
    var invincibleTimer = 0;
    var screenShakeTimer = 0;
    var screenShakeStrength = 0;

    var obstacles = [];
    var flyingObstacles = [];
    var smokeParticles = [];
    var dustParticles = [];
    var dustParticleMax = 52;
    var trailCleanups = [];
    var damageParticles = [];
    var obstacleSpawnGap = 520;
    var nextObstacleAt = 700;

    var ROCK_SMALL_WIDTH = 34;
    var ROCK_SMALL_HEIGHT = 24;
    var ROCK_LARGE_WIDTH = 32;
    var ROCK_LARGE_HEIGHT = 52;
    var CACTUS_SMALL_WIDTH = 28;
    var CACTUS_SMALL_HEIGHT = 24;
    var CACTUS_LARGE_WIDTH = 30;
    var CACTUS_LARGE_HEIGHT = 52;
    var BUSH_WIDTH = 40;
    var BUSH_HEIGHT = 30;
    var BOMB_WIDTH = 28;
    var BOMB_HEIGHT = 32;
    var CRYSTAL_WIDTH = 34;
    var CRYSTAL_HEIGHT = 44;
    var OBSTACLE_METEOR_SPAWN_CHANCE = 0.12;
    var OBSTACLE_OTHER_TYPE_SLICE = (1 - OBSTACLE_METEOR_SPAWN_CHANCE) / 5;
    var METEOR_WIDTH = 36;
    var METEOR_HEIGHT = 30;

    var fallingMeteors = [];
    var meteorExplosions = [];
    var fallingMeteorCooldown = 0;
    var fallingMeteorObstacleTriggerDelay = -1;
    var fallingMeteorObstacleTriggerPending = 0;
    var meteorObstaclePulseTime = 0;
    var FALLING_METEOR_COOLDOWN_MIN = 5;
    var FALLING_METEOR_COOLDOWN_RANGE = 8;
    var FALLING_METEOR_SPAWN_ROLL = 0.0024;
    var FALLING_METEOR_RANDOM_SPAWN_FACTOR = 0.14;
    var FALLING_METEOR_OBSTACLE_TRIGGER_DELAY_MIN = 0.35;
    var FALLING_METEOR_OBSTACLE_TRIGGER_DELAY_RANGE = 0.95;
    var FALLING_METEOR_DURATION_MIN = 1.56;
    var FALLING_METEOR_DURATION_RANGE = 0.76;
    var FALLING_METEOR_TEASE_CHANCE = 0.24;
    var METEOR_IMPACT_RADIUS = 46;

    var jumpAirSlowFactor = 0.52;
    var jumpAirSlowBoost = 90;

    var parallaxPhase = [0, 0, 0, 0];
    var parallaxSpeeds = [0.018, 0.028, 0.038, 0.052];

    var GROUND_PEAK_Y_RATIO = 0.7;
    var GROUND_VALLEY_Y_RATIO = 0.9;

    var SKY_TILE_WIDTH = 1280;
    var SKY_TILE_HEIGHT = 720;
    var moonScreenXRatio = 0.82;
    var moonScreenYRatio = 0.11;
    var MOON_MARGIN_X_RATIO = 0.12;
    var MOON_MARGIN_Y_TOP_RATIO = 0.08;
    var MOON_MARGIN_Y_BOTTOM_RATIO = 0.48;
    var MOON_CLICK_RADIUS_SCALE = 1.2;
    var skyStars = [];
    var SKY_METEOR_COUNT = 48;
    var SKY_METEOR_ANGLE = Math.PI * 0.34;
    var SKY_METEOR_DIR_X = Math.cos(SKY_METEOR_ANGLE);
    var SKY_METEOR_DIR_Y = Math.sin(SKY_METEOR_ANGLE);
    var SKY_METEOR_PERP_X = -SKY_METEOR_DIR_Y;
    var SKY_METEOR_PERP_Y = SKY_METEOR_DIR_X;
    var SKY_METEOR_MAX_Y_RATIO = 0.62;
    var skyMeteorAnimTime = 0;
    var skyMeteors = [];

    function isPlaying() {
      return gamePhase === PHASE_PLAYING;
    }

    function isGameOver() {
      return gamePhase === PHASE_GAME_OVER;
    }

    function isStart() {
      return gamePhase === PHASE_START;
    }

    function getLocaleApi() {
      if (window.WebLocale) {
        return window.WebLocale;
      }
      return null;
    }

    function getLocalized(key, fallback) {
      var locale = getLocaleApi();
      if (locale) {
        return locale.get(key, fallback);
      }
      if (fallback != null) {
        return fallback;
      }
      return key;
    }

    function getStartHintText() {
      return getLocalized(LOCALE_KEY_HOLD_JUMP_HIGHER, "Press and Hold to jump higher");
    }

    function applyGameLocale() {
      if (isStart()) {
        screenTitle.textContent = GAME_TITLE;
        controlHint.textContent = getStartHintText();
      } else if (isGameOver()) {
        screenTitle.textContent = getLocalized(LOCALE_KEY_GAME_OVER, "Game Over");
        screenMeters.textContent = formatMeters(distanceMeters);
      }
      setHighScoreHud();
      if (isPlaying()) {
        hudDistance.textContent = formatMeters(distanceMeters);
        setSpeedHud();
      }
    }

    function bindLocaleListener() {
      window.addEventListener("web-locale-applied", applyGameLocale);
    }

    function loadHighScore() {
      try {
        var stored = window.localStorage.getItem(HIGH_SCORE_STORAGE_KEY);
        if (stored) {
          var parsed = parseInt(stored, 10);
          if (!isNaN(parsed) && parsed >= 0) {
            highScoreMeters = parsed;
          }
        }
      } catch (error) {
        highScoreMeters = 0;
      }
      setHighScoreHud();
    }

    function saveHighScore() {
      try {
        window.localStorage.setItem(HIGH_SCORE_STORAGE_KEY, String(highScoreMeters));
      } catch (error) {
      }
    }

    function formatMeters(meters) {
      var suffix = getLocalized(LOCALE_KEY_METERS_SUFFIX, "m");
      return Math.floor(meters) + suffix;
    }

    function formatSpeed(speedValue) {
      var speedMetersPerSecond = speedValue * METERS_PER_UNIT;
      var suffix = getLocalized(LOCALE_KEY_SPEED_SUFFIX, " m/s");
      return Math.round(speedMetersPerSecond) + suffix;
    }

    function setSpeedHud() {
      hudSpeed.textContent = formatSpeed(scrollSpeed);
    }

    function setHighScoreHud() {
      var bestLabel = getLocalized(LOCALE_KEY_BEST_LABEL, "best");
      hudHighScore.textContent = bestLabel + " " + formatMeters(highScoreMeters);
    }

    function createHerdFollowerElement(followerIndex) {
      var wrap = document.createElement("div");
      wrap.className = "runner-follower";
      var tilt = document.createElement("div");
      tilt.className = "runner-follower-tilt";
      var shake = document.createElement("div");
      shake.className = "runner-follower-shake";
      var delaySeconds = followerIndex * 0.09;
      shake.style.animationDelay = (-delaySeconds) + "s";
      var svgClone = runnerSvg.cloneNode(true);
      svgClone.removeAttribute("id");
      shake.appendChild(svgClone);
      tilt.appendChild(shake);
      wrap.appendChild(tilt);
      return wrap;
    }

    function getHerdFollowerLayout(followerIndex, slope) {
      var depth = followerIndex + 1;
      var seed = followerIndex * 2.17 + 0.61;
      var baseOffsetX = -(14 + depth * 11);
      var shuffleX = Math.sin(herdShuffleTime * 2.35 + seed) * (2.5 + depth * 0.9);
      var shuffleY = Math.sin(herdShuffleTime * 1.85 + seed * 1.37) * (2 + depth * 0.55);
      var scale = 1 - depth * 0.035;
      var opacity = 0.9 - depth * 0.07;
      return {
        offsetX: baseOffsetX + shuffleX,
        offsetY: shuffleY,
        scale: scale,
        opacity: opacity,
        depth: depth,
        slope: slope
      };
    }

    function applyHerdFollowerLayout(element, layout) {
      element.style.left = layout.offsetX + "px";
      element.style.top = layout.offsetY + "px";
      element.style.zIndex = String(layout.depth);
      element.style.opacity = String(layout.opacity);
      element.style.transform = "scale(" + layout.scale + ")";
      var tiltNode = element.firstChild;
      if (tiltNode && !isGameOver()) {
        tiltNode.style.transform = "rotate(" + (layout.slope * 0.35) + "rad)";
      }
    }

    function isFollowerJoining(element) {
      var index;
      for (index = 0; index < herdMemberMotions.length; index++) {
        if (herdMemberMotions[index].kind === "join" && herdMemberMotions[index].element === element) {
          return true;
        }
      }
      return false;
    }

    function removeHerdMotionElement(motion) {
      if (motion.element && motion.element.parentNode) {
        motion.element.parentNode.removeChild(motion.element);
      }
    }

    function clearHerdMemberMotions() {
      var index;
      for (index = 0; index < herdMemberMotions.length; index++) {
        removeHerdMotionElement(herdMemberMotions[index]);
      }
      herdMemberMotions.length = 0;
    }

    function addHerdFollowerWithJoinAnimation(followerIndex) {
      var element = createHerdFollowerElement(followerIndex);
      var shakeNode = element.querySelector(".runner-follower-shake");
      element.classList.add("is-joining");
      if (isPlaying() || isGameOver()) {
        shakeNode.classList.add("is-running");
      }
      runnerFollowers.appendChild(element);
      herdFollowerElements.push(element);
      herdMemberMotions.push({
        kind: "join",
        element: element,
        followerIndex: followerIndex,
        age: 0,
        duration: HERD_JOIN_DURATION,
        startOffsetX: 118 + Math.random() * 48,
        startOffsetY: -28 + Math.random() * 18,
        startScale: 0.68
      });
    }

    function ejectHerdFollowerFromDamage() {
      var element;
      var followerIndex;
      var layout;
      var motion;
      var shakeNode;
      var herdLeft;
      var herdTop;
      if (herdFollowerElements.length === 0) {
        return;
      }
      element = herdFollowerElements.pop();
      followerIndex = herdFollowerElements.length;
      layout = getHerdFollowerLayout(followerIndex, groundSlope(playerWorldX));
      shakeNode = element.querySelector(".runner-follower-shake");
      if (shakeNode) {
        shakeNode.classList.remove("is-running");
      }
      element.classList.remove("is-joining");
      if (element.parentNode === runnerFollowers) {
        runnerFollowers.removeChild(element);
      }
      element.className = "runner-follower-eject";
      gameRoot.appendChild(element);
      herdLeft = playerScreenX - 84 * 0.48;
      herdTop = getPlayerGroundY() + playerYOffset - 68 + 6;
      motion = {
        kind: "eject",
        element: element,
        screenX: herdLeft + layout.offsetX,
        screenY: herdTop + layout.offsetY,
        scale: layout.scale,
        rotation: (Math.random() - 0.5) * 0.45,
        velocityX: 150 + Math.random() * 110,
        velocityY: 200 + Math.random() * 150,
        spin: (Math.random() - 0.5) * 9,
        age: 0
      };
      element.style.left = motion.screenX + "px";
      element.style.top = motion.screenY + "px";
      element.style.opacity = "1";
      element.style.transform = "scale(" + motion.scale + ") rotate(" + motion.rotation + "rad)";
      herdMemberMotions.push(motion);
    }

    function updateHerdJoinMotion(motion, slope) {
      var progress = motion.age / motion.duration;
      var ease;
      var target;
      var offsetX;
      var offsetY;
      var scale;
      var opacity;
      if (progress > 1) {
        progress = 1;
      }
      ease = 1 - (1 - progress) * (1 - progress);
      target = getHerdFollowerLayout(motion.followerIndex, slope);
      offsetX = motion.startOffsetX + (target.offsetX - motion.startOffsetX) * ease;
      offsetY = motion.startOffsetY + (target.offsetY - motion.startOffsetY) * ease;
      scale = motion.startScale + (target.scale - motion.startScale) * ease;
      opacity = 0.35 + (target.opacity - 0.35) * ease;
      motion.element.style.left = offsetX + "px";
      motion.element.style.top = offsetY + "px";
      motion.element.style.zIndex = String(target.depth);
      motion.element.style.opacity = String(opacity);
      motion.element.style.transform = "scale(" + scale + ")";
      applyHerdFollowerLayout(motion.element, {
        offsetX: offsetX,
        offsetY: offsetY,
        scale: scale,
        opacity: opacity,
        depth: target.depth,
        slope: slope
      });
      if (progress >= 1) {
        motion.element.classList.remove("is-joining");
      }
    }

    function updateHerdEjectMotion(motion, deltaSeconds) {
      var tiltNode = motion.element.firstChild;
      motion.screenX -= (motion.velocityX + scrollSpeed * 0.42) * deltaSeconds;
      motion.screenY += motion.velocityY * deltaSeconds;
      motion.velocityY += HERD_EJECT_GRAVITY * deltaSeconds;
      motion.rotation += motion.spin * deltaSeconds;
      motion.element.style.left = motion.screenX + "px";
      motion.element.style.top = motion.screenY + "px";
      motion.element.style.opacity = String(Math.max(0, 1 - motion.age * 0.55));
      motion.element.style.transform = "scale(" + motion.scale + ") rotate(" + motion.rotation + "rad)";
      if (tiltNode) {
        tiltNode.style.transform = "rotate(" + (motion.rotation * 0.6) + "rad)";
      }
    }

    function updateHerdMemberMotions(deltaSeconds) {
      var index = 0;
      var motion;
      var slope = groundSlope(playerWorldX);
      while (index < herdMemberMotions.length) {
        motion = herdMemberMotions[index];
        motion.age += deltaSeconds;
        if (motion.kind === "join") {
          updateHerdJoinMotion(motion, slope);
          if (motion.age >= motion.duration) {
            herdMemberMotions.splice(index, 1);
            continue;
          }
        } else if (motion.kind === "eject") {
          updateHerdEjectMotion(motion, deltaSeconds);
          if (motion.screenX < -120 || motion.screenY > height + 40 || motion.age > 2.4) {
            removeHerdMotionElement(motion);
            herdMemberMotions.splice(index, 1);
            continue;
          }
        }
        index += 1;
      }
    }

    function applyHerdDamageLoss() {
      ejectHerdFollowerFromDamage();
    }

    function syncHerdFollowerElements() {
      var targetCount = herdHp - 1;
      var followerIndex;
      if (targetCount < 0) {
        targetCount = 0;
      }
      clearHerdMemberMotions();
      while (herdFollowerElements.length > 0) {
        var removed = herdFollowerElements.pop();
        if (removed && removed.parentNode === runnerFollowers) {
          runnerFollowers.removeChild(removed);
        } else if (removed && removed.parentNode) {
          removed.parentNode.removeChild(removed);
        }
      }
      for (followerIndex = 0; followerIndex < targetCount; followerIndex++) {
        var element = createHerdFollowerElement(followerIndex);
        if (isPlaying() || isGameOver()) {
          element.querySelector(".runner-follower-shake").classList.add("is-running");
        }
        runnerFollowers.appendChild(element);
        herdFollowerElements.push(element);
      }
    }

    function setHerdRunAnimation(isRunning) {

        runnerShake.classList.add("is-running");
      } else {
        runnerShake.classList.remove("is-running");
      }
      for (followerIndex = 0; followerIndex < herdFollowerElements.length; followerIndex++) {
        var shakeNode = herdFollowerElements[followerIndex].querySelector(".runner-follower-shake");
        if (isRunning) {
          shakeNode.classList.add("is-running");
        } else {
          shakeNode.classList.remove("is-running");
        }

    }

    function updateHerdMilestones() {

    function positionHerdFollowers(slope) {

        var element = herdFollowerElements[followerIndex];
        if (isFollowerJoining(element)) {
          continue;
        }
        applyHerdFollowerLayout(element, getHerdFollowerLayout(followerIndex, slope));
      }
    }

    function resizeCanvas() {
      var rect = canvas.getBoundingClientRect();
      width = Math.max(320, Math.floor(rect.width));
      height = Math.max(200, Math.floor(rect.height));
      devicePixelRatioScale = window.devicePixelRatio || 1;
      canvas.width = Math.floor(width * devicePixelRatioScale);
      canvas.height = Math.floor(height * devicePixelRatioScale);
      context.setTransform(devicePixelRatioScale, 0, 0, devicePixelRatioScale, 0, 0);

    function groundHillNoise(worldX) {
      var layerA = Math.sin(worldX * 0.0022);
      var layerB = Math.sin(worldX * 0.00135 + 1.2);
      var layerC = Math.sin(worldX * 0.00078 + 2.4);
      return layerA * 0.42 + layerB * 0.34 + layerC * 0.29;
    }

    function groundBumpNoise(worldX) {
      return (
        Math.sin(worldX * 0.032) * 4 +
        Math.sin(worldX * 0.064 + 1.8) * 2.8 +
        Math.sin(worldX * 0.108 + 3.4) * 1.8
      );
    }

    function groundWave(worldX) {
      var peakY = height * GROUND_PEAK_Y_RATIO;
      var valleyY = height * GROUND_VALLEY_Y_RATIO;
      var centerY = (peakY + valleyY) * 0.5;
      var hillAmplitude = (valleyY - peakY) * 0.5;
      return centerY + groundHillNoise(worldX) * hillAmplitude + groundBumpNoise(worldX);
    }

    function groundSlope(worldX) {
      var delta = 2;
      var y0 = groundWave(worldX - delta);
      var y1 = groundWave(worldX + delta);
      return Math.atan2(y1 - y0, delta * 2);
    }

    function getScrollSpeedForDistance(meters) {
      var speedMultiplier = 1 + meters / speedDoubleDistanceMeters;
      return scrollSpeedBase * speedMultiplier;
    }

    function rebaseWorldCoordinates() {
      if (worldScroll < WORLD_REBASE_THRESHOLD) {
        return;
      }
      var shift = worldScroll - WORLD_REBASE_TARGET;
      var index;
      worldScroll = WORLD_REBASE_TARGET;
      nextObstacleAt -= shift;
      for (index = 0; index < obstacles.length; index++) {
        obstacles[index].x -= shift;
      }
      for (index = 0; index < flyingObstacles.length; index++) {
        flyingObstacles[index].x -= shift;
      }
      for (index = 0; index < smokeParticles.length; index++) {
        smokeParticles[index].worldX -= shift;
      }
      for (index = 0; index < trailCleanups.length; index++) {
        trailCleanups[index].x -= shift;
      }
    }

    function cleanupBehindPlayer() {
      var removeBefore = worldScroll - width * 0.6;
      var index;
      index = 0;
      while (index < obstacles.length) {
        if (obstacles[index].x < removeBefore - 80) {
          if (obstacles[index].type === "meteor") {
            queueFallingMeteorFromObstacleDespawn();
          }
          obstacles.splice(index, 1);
        } else {
          index += 1;
        }
      }
      index = 0;
      while (index < trailCleanups.length) {
        if (trailCleanups[index].x < removeBefore) {
          trailCleanups.splice(index, 1);
        } else {
          index += 1;
        }
      }
      index = 0;
      while (index < smokeParticles.length) {
        if (smokeParticles[index].worldX < removeBefore) {
          smokeParticles.splice(index, 1);
        } else {
          index += 1;
        }
      }
      index = 0;
      while (index < flyingObstacles.length) {
        if (flyingObstacles[index].x < removeBefore) {
          flyingObstacles.splice(index, 1);
        } else {
          index += 1;
        }
      }
    }

    function getObstacleSize(obstacleType, sizeTier) {
      if (obstacleType === "rock") {
        if (sizeTier === "large") {
          return { width: ROCK_LARGE_WIDTH, height: ROCK_LARGE_HEIGHT };
        }
        return { width: ROCK_SMALL_WIDTH, height: ROCK_SMALL_HEIGHT };
      }
      if (obstacleType === "cactus") {
        if (sizeTier === "large") {
          return { width: CACTUS_LARGE_WIDTH, height: CACTUS_LARGE_HEIGHT };
        }
        return { width: CACTUS_SMALL_WIDTH, height: CACTUS_SMALL_HEIGHT };
      }
      if (obstacleType === "bush") {
        return { width: BUSH_WIDTH, height: BUSH_HEIGHT };
      }
      if (obstacleType === "bomb") {
        return { width: BOMB_WIDTH, height: BOMB_HEIGHT };
      }
      if (obstacleType === "meteor") {
        return { width: METEOR_WIDTH, height: METEOR_HEIGHT };
      }
      return { width: CRYSTAL_WIDTH, height: CRYSTAL_HEIGHT };
    }

    function pickObstacleType() {
      var typeRoll = Math.random();
      var rockThreshold = OBSTACLE_METEOR_SPAWN_CHANCE + OBSTACLE_OTHER_TYPE_SLICE;
      var cactusThreshold = rockThreshold + OBSTACLE_OTHER_TYPE_SLICE;
      var bushThreshold = cactusThreshold + OBSTACLE_OTHER_TYPE_SLICE;
      var bombThreshold = bushThreshold + OBSTACLE_OTHER_TYPE_SLICE;
      if (typeRoll < OBSTACLE_METEOR_SPAWN_CHANCE) return "meteor";
      if (typeRoll < rockThreshold) return "rock";
      if (typeRoll < cactusThreshold) return "cactus";
      if (typeRoll < bushThreshold) return "bush";
      if (typeRoll < bombThreshold) return "bomb";
      return "crystal";
    }

    function spawnObstacle() {
      var spawnX = worldScroll + width + 60 + Math.random() * 80;
      var obstacleType = pickObstacleType();
      var sizeTier = "small";
      if (obstacleType === "rock" || obstacleType === "cactus") {
        if (Math.random() > 0.5) sizeTier = "large";
      }
      var size = getObstacleSize(obstacleType, sizeTier);
      obstacles.push({
        x: spawnX,
        type: obstacleType,
        sizeTier: sizeTier,
        width: size.width,
        height: size.height
      });
      var gapBase = obstacleSpawnGap + Math.random() * 320;
      var gapMultiplier = 1;
      if (Math.random() < 0.28) {
        gapMultiplier = 0.38 + Math.random() * 0.32;
      }
      nextObstacleAt = spawnX + gapBase * gapMultiplier;
      obstacleSpawnGap = Math.max(420, obstacleSpawnGap - 0.35);
    }

    function launchDestroyedObstacle(obstacle) {
      flyingObstacles.push({
        x: obstacle.x,
        type: obstacle.type,
        sizeTier: obstacle.sizeTier,
        width: obstacle.width,
        height: obstacle.height,
        fallY: 0,
        velocityX: 140 + Math.random() * 100,
        velocityY: 220 + Math.random() * 160,
        rotation: (Math.random() - 0.5) * 0.5,
        spin: (Math.random() - 0.5) * 9
      });
    }

    function getPlayerGroundY() {

      playerVelocityY = 0;

      jumpLaunched = false;
      obstacles.length = 0;
      flyingObstacles.length = 0;
      smokeParticles.length = 0;

      fallingMeteors.length = 0;
      meteorExplosions.length = 0;

      fallingMeteorObstacleTriggerDelay = -1;
      fallingMeteorObstacleTriggerPending = 0;
      meteorObstaclePulseTime = 0;
      obstacleSpawnGap = 520;

      parallaxPhase[0] = 0;
      parallaxPhase[1] = 0;
      parallaxPhase[2] = 0;

      playerWorldX = playerScreenX;

    function endGame() {

    function triggerDamageEffects() {

    function slowAirJump() {
      if (grounded) return;
      if (playerVelocityY < 0) {
        playerVelocityY *= jumpAirSlowFactor;
        playerVelocityY += jumpAirSlowBoost;

    function tryJumpStart() {
      if (!isPlaying()) return;
      if (!grounded) {
        slowAirJump();

      grounded = false;

      jumpHoldTime = 0;
      playerVelocityY = -jumpTapImpulse;

    function getMoonRadius() {
      return Math.max(20, Math.min(width, height) * 0.052);
    }

    function getMoonGlowRadius() {
      return getMoonRadius() * 3.4;
    }

    function getMoonScreenPosition() {
      return {
        x: width * moonScreenXRatio,
        y: height * moonScreenYRatio
      };
    }

    function randomizeMoonPosition() {
      var marginX = MOON_MARGIN_X_RATIO;
      var minY = MOON_MARGIN_Y_TOP_RATIO;
      var maxY = MOON_MARGIN_Y_BOTTOM_RATIO;
      moonScreenXRatio = marginX + Math.random() * (1 - marginX * 2);
      moonScreenYRatio = minY + Math.random() * (maxY - minY);
    }

    function getPointerCanvasPosition(event) {
      var rect = canvas.getBoundingClientRect();
      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
    }

    function isPointerOnMoon(pointerX, pointerY) {
      var moonPos = getMoonScreenPosition();
      var moonHitRadius = getMoonRadius() * MOON_CLICK_RADIUS_SCALE;
      var distX = pointerX - moonPos.x;
      var distY = pointerY - moonPos.y;
      return distX * distX + distY * distY <= moonHitRadius * moonHitRadius;
    }

    function tryRandomizeMoonFromPointer(event) {
      var pointerPos = getPointerCanvasPosition(event);
      if (!isPointerOnMoon(pointerPos.x, pointerPos.y)) {
        return false;
      }
      randomizeMoonPosition();
      return true;
    }

    function onPointerDown(event) {
      event.preventDefault();
      tryRandomizeMoonFromPointer(event);
      pointerHeld = true;
      if (isGameOver()) {
        if (!grounded) {
          slowAirJump();
          return;
        }
        startGame();
        tryJumpStart();
        return;
      }
      if (isStart()) {
        startGame();
        tryJumpStart();
        return;
      }
      tryJumpStart();
    }

    function onPointerUp() {
      pointerHeld = false;
      jumpLaunched = false;
    }

    function updateJump(deltaSeconds) {
      if (isPlaying() && pointerHeld && !grounded && jumpLaunched && jumpHoldTime < jumpHoldMaxSeconds) {
        jumpHoldTime += deltaSeconds;
        playerVelocityY -= jumpHoldLift * deltaSeconds;
      }
      var currentGravity = pointerHeld && !grounded ? gravity * 0.82 : gravityRelease;
      if (!pointerHeld && !grounded) {
        currentGravity = gravityRelease;
      }
      playerVelocityY += currentGravity * deltaSeconds;
      playerYOffset += playerVelocityY * deltaSeconds;

      var groundY = getPlayerGroundY();
      var footY = groundY + playerYOffset;
      if (footY >= groundY) {
        playerYOffset = 0;
        playerVelocityY = 0;
        grounded = true;
        jumpLaunched = false;
        jumpHoldTime = 0;
      } else {
        grounded = false;
      }
    }

    function getRunnerHitbox() {
      return {
        left: playerWorldX - 22,
        right: playerWorldX + 18,
        top: getPlayerGroundY() + playerYOffset - 54,
        bottom: getPlayerGroundY() + playerYOffset - 4
      };
    }

    function checkCollisions() {
      if (invincibleTimer > 0) return;
      var hitbox = getRunnerHitbox();
      var index;
      for (index = 0; index < obstacles.length; index++) {
        var obstacle = obstacles[index];
        var groundY = groundWave(obstacle.x);
        var obstacleLeft = obstacle.x - obstacle.width * 0.5;
        var obstacleRight = obstacle.x + obstacle.width * 0.5;
        var obstacleTop = groundY - obstacle.height;
        var obstacleBottom = groundY + 4;
        if (hitbox.right > obstacleLeft && hitbox.left < obstacleRight &&
            hitbox.bottom > obstacleTop && hitbox.top < obstacleBottom) {
          herdHp -= 1;
          triggerDamageEffects();
          launchDestroyedObstacle(obstacle);
          obstacles.splice(index, 1);
          if (herdHp <= 0) {
            syncHerdFollowerElements();
            endGame();
            return;
          }
          applyHerdDamageLoss();
          invincibleTimer = 1.4;
          return;
        }
      }
    }

    function updateFlyingObstacles(deltaSeconds) {
      var index = 0;
      while (index < flyingObstacles.length) {
        var piece = flyingObstacles[index];
        piece.x -= piece.velocityX * deltaSeconds;
        piece.fallY += piece.velocityY * deltaSeconds;
        piece.velocityY += 520 * deltaSeconds;
        piece.rotation += piece.spin * deltaSeconds;
        var groundY = groundWave(piece.x);
        var screenY = groundY + piece.fallY;
        if (screenY > height + 80 || piece.x < worldScroll - 120) {
          flyingObstacles.splice(index, 1);
        } else {
          index += 1;
        }
      }
    }

    function updateSmokeParticles(deltaSeconds) {
      var index = 0;
      while (index < smokeParticles.length) {
        var particle = smokeParticles[index];
        particle.age += deltaSeconds;
        particle.y -= particle.riseSpeed * deltaSeconds;
        particle.radius += particle.expandRate * deltaSeconds;
        if (particle.age >= particle.life) {
          smokeParticles.splice(index, 1);
        } else {
          index += 1;
        }
      }
      if (isPlaying() && pointerHeld && !grounded) {
        if (Math.random() < deltaSeconds * 38) spawnSmoke(1);
      }
    }

    function spawnDustParticle() {
      dustParticles.push({
        x: width + Math.random() * 60,
        y: height * 0.08 + Math.random() * height * 0.78,
        size: 0.8 + Math.random() * 2.4,
        speedX: 24 + Math.random() * 48 + scrollSpeed * 0.06,
        speedY: (Math.random() - 0.5) * 10,
        alpha: 0.06 + Math.random() * 0.16,
        life: 2.2 + Math.random() * 3.5,
        age: 0
      });
    }

    function updateDustParticles(deltaSeconds) {
      var index = 0;
      if (isPlaying() || isStart()) {
        while (dustParticles.length < dustParticleMax && Math.random() < deltaSeconds * 7) {
          spawnDustParticle();
        }
      }
      while (index < dustParticles.length) {
        var particle = dustParticles[index];
        particle.age += deltaSeconds;
        particle.x -= particle.speedX * deltaSeconds;
        particle.y += particle.speedY * deltaSeconds;
        if (particle.age >= particle.life || particle.x < -20) {
          dustParticles.splice(index, 1);
        } else {
          index += 1;
        }
      }
    }

    function updateDamageParticles(deltaSeconds) {
      var index = 0;
      while (index < damageParticles.length) {
        var particle = damageParticles[index];
        particle.age += deltaSeconds;
        particle.x += particle.velocityX * deltaSeconds;
        particle.y += particle.velocityY * deltaSeconds;
        particle.velocityY += 420 * deltaSeconds;
        if (particle.age >= particle.life) {
          damageParticles.splice(index, 1);
        } else {
          index += 1;
        }
      }
    }

    function getFallingMeteorGroundY(screenX) {
      return groundWave(worldScroll + screenX);
    }

    function getFallingMeteorScreenPosition(meteor) {
      var progress = meteor.progress;
      var ease = progress * progress;
      var screenX = meteor.startScreenX + (meteor.targetScreenX - meteor.startScreenX) * ease;
      var targetGroundY = getFallingMeteorGroundY(meteor.targetScreenX);
      var screenY = meteor.startScreenY + (targetGroundY - meteor.startScreenY) * ease;
      return { x: screenX, y: screenY };
    }

    function queueFallingMeteorFromObstacleDespawn() {
      fallingMeteorObstacleTriggerPending += 1;
      if (fallingMeteorObstacleTriggerDelay < 0) {
        fallingMeteorObstacleTriggerDelay = FALLING_METEOR_OBSTACLE_TRIGGER_DELAY_MIN +
          Math.random() * FALLING_METEOR_OBSTACLE_TRIGGER_DELAY_RANGE;
      }
    }

    function trySpawnObstacleFallingMeteor() {
      if (fallingMeteorObstacleTriggerPending <= 0) {
        fallingMeteorObstacleTriggerDelay = -1;
        return;
      }
      if (fallingMeteors.length > 0) {
        fallingMeteorObstacleTriggerDelay = 0.15;
        return;
      }
      fallingMeteorObstacleTriggerPending -= 1;
      spawnFallingMeteor();
      fallingMeteorCooldown = FALLING_METEOR_COOLDOWN_MIN + Math.random() * FALLING_METEOR_COOLDOWN_RANGE;
      if (fallingMeteorObstacleTriggerPending > 0) {
        fallingMeteorObstacleTriggerDelay = FALLING_METEOR_OBSTACLE_TRIGGER_DELAY_MIN +
          Math.random() * FALLING_METEOR_OBSTACLE_TRIGGER_DELAY_RANGE;
      } else {
        fallingMeteorObstacleTriggerDelay = -1;
      }
    }

    function spawnFallingMeteor() {
      var isTease = Math.random() < FALLING_METEOR_TEASE_CHANCE;
      var targetScreenX;
      if (isTease) {
        targetScreenX = width * (0.38 + Math.random() * 0.24);
      } else {
        targetScreenX = playerScreenX + (Math.random() - 0.5) * 26;
      }
      fallingMeteors.push({
        state: "falling",
        startScreenX: width + 80 + Math.random() * 100,
        startScreenY: -30 - Math.random() * 70,
        targetScreenX: targetScreenX,
        progress: 0,
        duration: FALLING_METEOR_DURATION_MIN + Math.random() * FALLING_METEOR_DURATION_RANGE,
        size: 14 + Math.random() * 12,
        hitsPlayer: !isTease
      });
    }

    function trySpawnFallingMeteor(deltaSeconds) {
      if (!isPlaying()) return;

      if (fallingMeteorObstacleTriggerDelay >= 0) {
        fallingMeteorObstacleTriggerDelay -= deltaSeconds;
        if (fallingMeteorObstacleTriggerDelay <= 0) {
          trySpawnObstacleFallingMeteor();
        }
        return;
      }

      if (fallingMeteors.length > 0) return;

      if (fallingMeteorCooldown > 0) {
        fallingMeteorCooldown -= deltaSeconds;
        return;
      }
      if (Math.random() > FALLING_METEOR_SPAWN_ROLL * FALLING_METEOR_RANDOM_SPAWN_FACTOR) return;
      spawnFallingMeteor();
      fallingMeteorCooldown = FALLING_METEOR_COOLDOWN_MIN + Math.random() * FALLING_METEOR_COOLDOWN_RANGE;
    }

    function spawnMeteorExplosion(screenX, groundY, meteorSize) {
      var index;
      meteorExplosions.push({
        screenX: screenX,
        groundY: groundY,
        age: 0,
        life: 0.65 + Math.random() * 0.25,
        radius: 28 + meteorSize * 0.9,
        maxRadius: 72 + meteorSize * 1.4
      });
      for (index = 0; index < 18; index++) {
        damageParticles.push({
          x: screenX + (Math.random() - 0.5) * 44,
          y: groundY - 8 + (Math.random() - 0.5) * 22,
          velocityX: (Math.random() - 0.5) * 320,
          velocityY: -60 - Math.random() * 280,
          life: 0.4 + Math.random() * 0.45,
          age: 0,
          size: 2 + Math.random() * 5,
          hue: 18 + Math.random() * 28
        });
      }
    }

    function triggerFallingMeteorDamage(meteor) {
      if (invincibleTimer > 0) return;
      if (!meteor.hitsPlayer) return;
      var inZone = Math.abs(playerScreenX - meteor.targetScreenX) < METEOR_IMPACT_RADIUS;
      var airborne = !grounded;
      if (!inZone || airborne) return;
      herdHp -= 1;
      triggerDamageEffects();
      if (herdHp <= 0) {
        syncHerdFollowerElements();
        endGame();
        return;
      }
      applyHerdDamageLoss();
      invincibleTimer = 1.4;
    }

    function updateFallingMeteors(deltaSeconds) {
      var index = 0;
      var meteor;
      var groundY;
      while (index < fallingMeteors.length) {
        meteor = fallingMeteors[index];
        meteor.progress += deltaSeconds / meteor.duration;
        if (meteor.state === "falling" && meteor.progress >= 1) {
          meteor.progress = 1;
          meteor.state = "impact";
          groundY = getFallingMeteorGroundY(meteor.targetScreenX);
          spawnMeteorExplosion(meteor.targetScreenX, groundY, meteor.size);
          triggerFallingMeteorDamage(meteor);
          meteor.impactAge = 0;
        }
        if (meteor.state === "impact") {
          meteor.impactAge += deltaSeconds;
          if (meteor.impactAge >= 0.15) {
            fallingMeteors.splice(index, 1);
            continue;
          }
        }
        index += 1;
      }
      index = 0;
      while (index < meteorExplosions.length) {
        meteorExplosions[index].age += deltaSeconds;
        if (meteorExplosions[index].age >= meteorExplosions[index].life) {
          meteorExplosions.splice(index, 1);
        } else {
          index += 1;
        }
      }
    }

    function updateTrailCleanups(deltaSeconds) {
      var index = 0;
      while (index < trailCleanups.length) {
        trailCleanups[index].age += deltaSeconds;
        if (trailCleanups[index].age >= trailCleanups[index].life) {
          trailCleanups.splice(index, 1);
        } else {
          index += 1;
        }
      }
      if (grounded && isPlaying()) {
        if (Math.random() < 0.35) addTrailCleanup();
      }
    }

    function updateGameOver(deltaSeconds) {
      updateJump(deltaSeconds);
      updateFlyingObstacles(deltaSeconds);
      updateSmokeParticles(deltaSeconds);
      updateDustParticles(deltaSeconds);
      updateDamageParticles(deltaSeconds);
      if (screenShakeTimer > 0) screenShakeTimer -= deltaSeconds;
      positionRunnerDom();
    }

    function updateStart(deltaSeconds) {
      updateJump(deltaSeconds);
      updateDustParticles(deltaSeconds);
      positionRunnerDom();
      positionClickHint();
    }

    function update(deltaSeconds) {
      updateSkyMeteors(deltaSeconds);
      meteorObstaclePulseTime += deltaSeconds;
      updateHerdMemberMotions(deltaSeconds);
      if (isGameOver()) {
        updateGameOver(deltaSeconds);
        return;
      }
      if (isStart()) {
        updateStart(deltaSeconds);
        return;
      }

      scrollSpeed = getScrollSpeedForDistance(distanceMeters);
      worldScroll += scrollSpeed * deltaSeconds;
      playerWorldX = worldScroll + playerScreenX;
      distanceMeters += scrollSpeed * deltaSeconds * METERS_PER_UNIT;
      hudDistance.textContent = formatMeters(distanceMeters);
      setSpeedHud();
      updateHerdMilestones();

      herdShuffleTime += deltaSeconds;

      var layerIndex;
      for (layerIndex = 0; layerIndex < parallaxPhase.length; layerIndex++) {
        parallaxPhase[layerIndex] += scrollSpeed * parallaxSpeeds[layerIndex] * deltaSeconds;
      }

      rebaseWorldCoordinates();

      updateJump(deltaSeconds);
      updateFlyingObstacles(deltaSeconds);
      updateSmokeParticles(deltaSeconds);
      updateDustParticles(deltaSeconds);
      updateTrailCleanups(deltaSeconds);
      updateDamageParticles(deltaSeconds);
      updateFallingMeteors(deltaSeconds);
      trySpawnFallingMeteor(deltaSeconds);

      if (screenShakeTimer > 0) screenShakeTimer -= deltaSeconds;

      if (invincibleTimer > 0) invincibleTimer -= deltaSeconds;

      cleanupBehindPlayer();

      if (worldScroll + width + 120 >= nextObstacleAt) {
        spawnObstacle();
      }

      checkCollisions();
      positionRunnerDom();
    }

    function positionRunnerDom() {
      var groundY = getPlayerGroundY() + playerYOffset;
      var slope = groundSlope(playerWorldX);
      var runnerHeight = 68;
      var runnerWidth = 84;
      var left = playerScreenX - runnerWidth * 0.48;
      var top = groundY - runnerHeight + 6;
      runnerHerd.style.left = left + "px";
      runnerHerd.style.top = top + "px";
      if (!isGameOver()) {
        runnerTilt.style.transform = "rotate(" + (slope * 0.35) + "rad)";
      }
      positionHerdFollowers(slope);
      if (invincibleTimer > 0 && Math.floor(invincibleTimer * 10) % 2 === 0) {
        runnerHerd.style.opacity = "0.45";
      } else {
        runnerHerd.style.opacity = "1";
      }
    }

    function getScreenShakeOffset() {
      if (screenShakeTimer <= 0) return { x: 0, y: 0 };
      var shake = screenShakeStrength * (screenShakeTimer / 0.22);
      return {
        x: (Math.random() - 0.5) * shake * 2,
        y: (Math.random() - 0.5) * shake * 1.4
      };
    }

    function drawSky() {
      var gradient = context.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, "#08041a");
      gradient.addColorStop(0.35, "#1a0e32");
      gradient.addColorStop(0.7, "#2a1848");
      gradient.addColorStop(1, "#3d2860");
      context.fillStyle = gradient;
      context.fillRect(0, 0, width, height);

      var vapor = context.createRadialGradient(width * 0.3, height * 0.2, 20, width * 0.3, height * 0.35, width * 0.55);
      vapor.addColorStop(0, "rgba(140, 80, 200, 0.22)");
      vapor.addColorStop(1, "transparent");
      context.fillStyle = vapor;
      context.fillRect(0, 0, width, height);

      var vapor2 = context.createRadialGradient(width * 0.75, height * 0.15, 10, width * 0.8, height * 0.4, width * 0.45);
      vapor2.addColorStop(0, "rgba(100, 60, 180, 0.18)");
      vapor2.addColorStop(1, "transparent");
      context.fillStyle = vapor2;
      context.fillRect(0, 0, width, height);
    }

    function initSkyStars() {
      var index;
      var starCount = 56;
      skyStars.length = 0;
      for (index = 0; index < starCount; index++) {
        var hashX = (index * 7919 + 104729) % 9973;
        var hashY = (index * 1301 + 49297) % 9973;
        skyStars.push({
          x: (hashX / 9973) * SKY_TILE_WIDTH,
          y: (hashY / 9973) * (SKY_TILE_HEIGHT * 0.46),
          size: (index % 3 === 0) ? 1.4 : 0.9
        });
      }
    }

    function initSkyMeteors() {
      var index;
      skyMeteors.length = 0;
      for (index = 0; index < SKY_METEOR_COUNT; index += 1) {
        skyMeteors.push({
          phase: Math.random(),
          speed: 0.04 + Math.random() * 0.1,
          lane: Math.random(),
          tailLength: 42 + Math.random() * 88,
          thickness: 1.1 + Math.random() * 2.4,
          headSize: 1.5 + Math.random() * 3.2,
          red: 235 + Math.floor(Math.random() * 20),
          green: 80 + Math.floor(Math.random() * 85),
          blue: 30 + Math.floor(Math.random() * 50),
          alpha: 0.22 + Math.random() * 0.42,
          depth: 0.5 + Math.random() * 0.5
        });
      }
    }

    function updateSkyMeteors(deltaSeconds) {
      skyMeteorAnimTime += deltaSeconds;
    }

    function getSkyMeteorHeadPosition(meteor) {
      var loopDistance = (width + height) * 1.4 * meteor.depth;
      var progress = skyMeteorAnimTime * meteor.speed + meteor.phase;
      progress = progress - Math.floor(progress);
      var travel = progress * loopDistance;
      var laneSpan = width * 0.92;
      var laneOffset = (meteor.lane - 0.5) * laneSpan;
      var spawnX = -width * 0.45;
      var spawnY = -height * 0.24;
      return {
        x: spawnX + SKY_METEOR_DIR_X * travel + SKY_METEOR_PERP_X * laneOffset,
        y: spawnY + SKY_METEOR_DIR_Y * travel + SKY_METEOR_PERP_Y * laneOffset
      };
    }

    function drawSkyMeteor(meteor, headX, headY) {
      var tailX = headX - SKY_METEOR_DIR_X * meteor.tailLength;
      var tailY = headY - SKY_METEOR_DIR_Y * meteor.tailLength;
      var gradient;
      var glowRadius;

      gradient = context.createLinearGradient(tailX, tailY, headX, headY);
      gradient.addColorStop(0, "rgba(" + meteor.red + "," + meteor.green + "," + meteor.blue + ",0)");
      gradient.addColorStop(0.45, "rgba(" + meteor.red + "," + meteor.green + "," + meteor.blue + "," + (meteor.alpha * 0.35) + ")");
      gradient.addColorStop(0.82, "rgba(255," + (meteor.green + 40) + "," + (meteor.blue + 20) + "," + (meteor.alpha * 0.85) + ")");
      gradient.addColorStop(1, "rgba(255, 245, 220, " + meteor.alpha + ")");
      context.strokeStyle = gradient;
      context.lineWidth = meteor.thickness;
      context.lineCap = "round";
      context.beginPath();
      context.moveTo(tailX, tailY);
      context.lineTo(headX, headY);
      context.stroke();

      glowRadius = meteor.headSize * 2.8;
      gradient = context.createRadialGradient(headX, headY, 0, headX, headY, glowRadius);
      gradient.addColorStop(0, "rgba(255, 240, 210, " + (meteor.alpha * 0.95) + ")");
      gradient.addColorStop(0.35, "rgba(" + meteor.red + "," + meteor.green + "," + meteor.blue + "," + (meteor.alpha * 0.55) + ")");
      gradient.addColorStop(1, "rgba(" + meteor.red + "," + meteor.green + "," + meteor.blue + ",0)");
      context.fillStyle = gradient;
      context.beginPath();
      context.arc(headX, headY, glowRadius, 0, Math.PI * 2);
      context.fill();
    }

    function drawSkyMeteors() {
      var index;
      var meteor;
      var headPos;
      var skyClipHeight = height * SKY_METEOR_MAX_Y_RATIO;

      context.save();
      context.beginPath();
      context.rect(0, 0, width, skyClipHeight);
      context.clip();

      for (index = 0; index < skyMeteors.length; index += 1) {
        meteor = skyMeteors[index];
        headPos = getSkyMeteorHeadPosition(meteor);
        if (headPos.y < -meteor.tailLength || headPos.y > skyClipHeight + meteor.tailLength) {
          continue;
        }
        if (headPos.x < -meteor.tailLength || headPos.x > width + meteor.tailLength) {
          continue;
        }
        drawSkyMeteor(meteor, headPos.x, headPos.y);
      }

      context.restore();
    }

    function drawMoon() {
      var moonPos = getMoonScreenPosition();
      var moonX = moonPos.x;
      var moonY = moonPos.y;
      var moonRadius = getMoonRadius();
      var glowRadius = getMoonGlowRadius();

      var glow = context.createRadialGradient(moonX, moonY, moonRadius * 0.4, moonX, moonY, glowRadius);
      glow.addColorStop(0, "rgba(230, 215, 255, 0.38)");
      glow.addColorStop(0.35, "rgba(190, 160, 230, 0.14)");
      glow.addColorStop(1, "transparent");
      context.fillStyle = glow;
      context.beginPath();
      context.arc(moonX, moonY, glowRadius, 0, Math.PI * 2);
      context.fill();

      var body = context.createRadialGradient(
        moonX - moonRadius * 0.3,
        moonY - moonRadius * 0.35,
        moonRadius * 0.15,
        moonX,
        moonY,
        moonRadius
      );
      body.addColorStop(0, "#f4eeff");
      body.addColorStop(0.5, "#e2d4f8");
      body.addColorStop(1, "#c4aed8");
      context.fillStyle = body;
      context.beginPath();
      context.arc(moonX, moonY, moonRadius, 0, Math.PI * 2);
      context.fill();

      context.fillStyle = "rgba(120, 100, 160, 0.22)";
      context.beginPath();
      context.arc(moonX - moonRadius * 0.25, moonY + moonRadius * 0.2, moonRadius * 0.2, 0, Math.PI * 2);
      context.fill();
      context.beginPath();
      context.arc(moonX + moonRadius * 0.3, moonY - moonRadius * 0.1, moonRadius * 0.14, 0, Math.PI * 2);
      context.fill();
      context.beginPath();
      context.arc(moonX + moonRadius * 0.05, moonY + moonRadius * 0.35, moonRadius * 0.1, 0, Math.PI * 2);
      context.fill();
    }

    function drawStars() {
      var tileX;
      var tileY;
      var index;
      var star;
      var screenX;
      var screenY;
      var distX;
      var distY;
      var starScroll = parallaxPhase[0];
      var starScrollWrapped = starScroll % SKY_TILE_WIDTH;
      if (starScrollWrapped < 0) {
        starScrollWrapped += SKY_TILE_WIDTH;
      }
      var tilesX = Math.ceil(width / SKY_TILE_WIDTH) + 2;
      var tilesY = Math.ceil(height / SKY_TILE_HEIGHT) + 1;
      var moonPos = getMoonScreenPosition();
      var moonX = moonPos.x;
      var moonY = moonPos.y;
      var moonBlockRadius = getMoonGlowRadius() + 10;
      context.fillStyle = "rgba(220, 200, 255, 0.75)";
      for (tileY = 0; tileY < tilesY; tileY++) {
        for (tileX = -1; tileX < tilesX; tileX++) {
          for (index = 0; index < skyStars.length; index++) {
            star = skyStars[index];
            screenX = star.x + tileX * SKY_TILE_WIDTH - starScrollWrapped;
            screenY = star.y + tileY * SKY_TILE_HEIGHT;
            if (screenX < -4 || screenX > width + 4 || screenY < -4 || screenY > height + 4) {
              continue;
            }
            distX = screenX - moonX;
            distY = screenY - moonY;
            if (distX * distX + distY * distY < moonBlockRadius * moonBlockRadius) {
              continue;
            }
            context.beginPath();
            context.arc(screenX, screenY, star.size, 0, Math.PI * 2);
            context.fill();
          }
        }
      }
    }

    function drawParallaxHills(layerIndex, topColor, bottomColor, colorStroke, amplitude, frequency, yBase) {
      var shift = parallaxPhase[layerIndex];
      var hillGradient = context.createLinearGradient(0, yBase - amplitude * 1.6, 0, height);
      hillGradient.addColorStop(0, topColor);
      hillGradient.addColorStop(0.55, bottomColor);
      hillGradient.addColorStop(1, "rgba(8, 4, 18, 0.95)");
      context.fillStyle = hillGradient;
      context.strokeStyle = colorStroke;
      context.lineWidth = 1;
      context.beginPath();
      var x = -40;
      context.moveTo(x, height);
      while (x < width + 40) {
        var hillY = yBase +
          Math.sin((x + shift) * frequency + layerIndex) * amplitude +
          Math.sin((x + shift * 0.7) * frequency * 0.45) * amplitude * 0.5;
        context.lineTo(x, hillY);
        x += 16;
      }
      context.lineTo(width + 40, height);
      context.closePath();
      context.fill();
      context.stroke();
    }

    function drawTrailCleanups() {
      var index;
      for (index = 0; index < trailCleanups.length; index++) {
        var trail = trailCleanups[index];
        var screenX = trail.x - worldScroll;
        if (screenX < -60 || screenX > width + 60) continue;
        var groundY = groundWave(trail.x);
        var fade = 1 - trail.age / trail.life;
        var radius = trail.radius * (0.6 + fade * 0.5);
        var gradient = context.createRadialGradient(screenX, groundY, 2, screenX, groundY - 8, radius);
        gradient.addColorStop(0, "rgba(60, 40, 90, " + (0.35 * fade) + ")");
        gradient.addColorStop(0.5, "rgba(40, 28, 65, " + (0.2 * fade) + ")");
        gradient.addColorStop(1, "transparent");
        context.fillStyle = gradient;
        context.beginPath();
        context.ellipse(screenX, groundY - 4, radius * 1.2, radius * 0.45, 0, 0, Math.PI * 2);
        context.fill();
      }
    }

    function drawGround() {
      var startX = worldScroll - 20;
      var endX = worldScroll + width + 20;
      var groundTopY = height * GROUND_PEAK_Y_RATIO;
      var groundGradient = context.createLinearGradient(0, groundTopY, 0, height);
      groundGradient.addColorStop(0, "#4a3270");
      groundGradient.addColorStop(0.18, "#352450");
      groundGradient.addColorStop(0.55, "#221633");
      groundGradient.addColorStop(1, "#0e0818");
      context.fillStyle = groundGradient;
      context.strokeStyle = "#5c4088";
      context.lineWidth = 2;
      context.beginPath();
      var x = startX;
      context.moveTo(startX - worldScroll, groundWave(startX));
      while (x <= endX) {
        context.lineTo(x - worldScroll, groundWave(x));
        x += 5;
      }
      context.lineTo(endX - worldScroll, height + 40);
      context.lineTo(startX - worldScroll, height + 40);
      context.closePath();
      context.fill();
      context.stroke();

      context.strokeStyle = "rgba(180, 120, 220, 0.25)";
      context.lineWidth = 1;
      context.beginPath();
      x = startX;
      context.moveTo(startX - worldScroll, groundWave(startX) - 2);
      while (x <= endX) {
        context.lineTo(x - worldScroll, groundWave(x) - 2);
        x += 5;
      }
      context.stroke();
    }

    function drawObstacleAt(screenX, groundY, obstacle, rotation) {
      context.save();
      context.translate(screenX, groundY);
      if (rotation) context.rotate(rotation);
      if (obstacle.type === "cactus") {
        drawObstacleCactusShape(obstacle);
      } else if (obstacle.type === "bush") {
        drawObstacleBushShape(obstacle);
      } else if (obstacle.type === "bomb") {
        drawObstacleBombShape(obstacle);
      } else if (obstacle.type === "crystal") {
        drawObstacleCrystalShape(obstacle);
      } else if (obstacle.type === "meteor") {
        drawObstacleMeteorShape(obstacle);
      } else {
        drawObstacleRockShape(obstacle);
      }
      context.restore();
    }

    function drawObstacleMeteorShape(obstacle) {
      var meteorW = obstacle.width;
      var meteorH = obstacle.height;
      var pulse = 0.5 + 0.5 * Math.sin(meteorObstaclePulseTime * 4.2);
      var crackAlpha = 0.55 + pulse * 0.35;
      context.fillStyle = "#3a2838";
      context.strokeStyle = "#221820";
      context.lineWidth = 1.2;
      context.beginPath();
      context.moveTo(-meteorW * 0.42, 0);
      context.lineTo(-meteorW * 0.38, -meteorH * 0.45);
      context.lineTo(-meteorW * 0.08, -meteorH * 0.88);
      context.lineTo(meteorW * 0.22, -meteorH * 0.82);
      context.lineTo(meteorW * 0.44, -meteorH * 0.38);
      context.lineTo(meteorW * 0.36, -meteorH * 0.08);
      context.closePath();
      context.fill();
      context.stroke();
      context.strokeStyle = "rgba(255, 120, 50, " + crackAlpha + ")";
      context.lineWidth = 1.4 + pulse * 0.4;
      context.beginPath();
      context.moveTo(-meteorW * 0.18, -meteorH * 0.62);
      context.lineTo(meteorW * 0.06, -meteorH * 0.48);
      context.moveTo(-meteorW * 0.04, -meteorH * 0.78);
      context.lineTo(meteorW * 0.2, -meteorH * 0.58);
      context.stroke();
      context.fillStyle = "rgba(255, 180, 80, " + (0.45 + pulse * 0.35) + ")";
      context.beginPath();
      context.arc(-meteorW * 0.06, -meteorH * 0.55, meteorW * (0.06 + pulse * 0.025), 0, Math.PI * 2);
      context.fill();
    }

    function drawObstacleRockShape(obstacle) {
      var rockW = obstacle.width;
      var rockH = obstacle.height;
      context.fillStyle = "#4a3d58";
      context.strokeStyle = "#2e2438";
      context.lineWidth = 1.2;
      context.beginPath();
      context.moveTo(-rockW * 0.45, 0);
      context.lineTo(-rockW * 0.35, -rockH * 0.5);
      context.lineTo(-rockW * 0.05, -rockH * 0.85);
      context.lineTo(rockW * 0.25, -rockH * 0.75);
      context.lineTo(rockW * 0.42, -rockH * 0.35);
      context.lineTo(rockW * 0.38, -rockH * 0.1);
      context.closePath();
      context.fill();
      context.stroke();
      context.fillStyle = "rgba(120, 90, 140, 0.35)";
      context.beginPath();
      context.ellipse(-rockW * 0.1, -rockH * 0.55, rockW * 0.15, rockH * 0.12, 0, 0, Math.PI * 2);
      context.fill();
    }

    function drawObstacleCactusShape(obstacle) {
      var cactusH = obstacle.height;
      var cactusW = obstacle.width * 0.5;
      context.fillStyle = "#3d6a4a";
      context.strokeStyle = "#254832";
      context.lineWidth = 1.2;
      context.lineCap = "round";
      context.beginPath();
      context.moveTo(-cactusW * 0.15 + 3, -cactusH);
      context.lineTo(cactusW * 0.15 - 3, -cactusH);
      context.quadraticCurveTo(cactusW * 0.15, -cactusH, cactusW * 0.15, -cactusH + 3);
      context.lineTo(cactusW * 0.15, 0);
      context.lineTo(-cactusW * 0.15, 0);
      context.lineTo(-cactusW * 0.15, -cactusH + 3);
      context.quadraticCurveTo(-cactusW * 0.15, -cactusH, -cactusW * 0.15 + 3, -cactusH);
      context.closePath();
      context.fill();
      context.stroke();
      if (obstacle.sizeTier === "large") {
        context.beginPath();
        context.moveTo(-cactusW * 0.15, -cactusH * 0.55);
        context.lineTo(-cactusW * 0.55, -cactusH * 0.5);
        context.lineTo(-cactusW * 0.55, -cactusH * 0.35);
        context.lineTo(-cactusW * 0.15, -cactusH * 0.38);
        context.fill();
        context.stroke();
        context.beginPath();
        context.moveTo(cactusW * 0.15, -cactusH * 0.7);
        context.lineTo(cactusW * 0.5, -cactusH * 0.62);
        context.lineTo(cactusW * 0.5, -cactusH * 0.48);
        context.lineTo(cactusW * 0.15, -cactusH * 0.52);
        context.fill();
        context.stroke();
      }
    }

    function drawObstacleBushShape(obstacle) {
      var bushW = obstacle.width;
      var bushH = obstacle.height;
      context.fillStyle = "#2d5a38";
      context.strokeStyle = "#1a3824";
      context.lineWidth = 1.2;
      context.beginPath();
      context.ellipse(0, -bushH * 0.45, bushW * 0.42, bushH * 0.38, 0, 0, Math.PI * 2);
      context.fill();
      context.stroke();
      context.beginPath();
      context.ellipse(-bushW * 0.22, -bushH * 0.55, bushW * 0.28, bushH * 0.32, -0.3, 0, Math.PI * 2);
      context.fill();
      context.stroke();
      context.beginPath();
      context.ellipse(bushW * 0.2, -bushH * 0.52, bushW * 0.26, bushH * 0.3, 0.25, 0, Math.PI * 2);
      context.fill();
      context.stroke();
      context.fillStyle = "#3a7048";
      context.beginPath();
      context.arc(-bushW * 0.1, -bushH * 0.62, bushW * 0.12, 0, Math.PI * 2);
      context.fill();
    }

    function drawObstacleBombShape(obstacle) {
      var bombW = obstacle.width;
      var bombH = obstacle.height;
      var radius = bombW * 0.38;
      context.fillStyle = "#c82838";
      context.strokeStyle = "#6a1420";
      context.lineWidth = 1.3;
      context.beginPath();
      context.arc(0, -bombH * 0.42, radius, 0, Math.PI * 2);
      context.fill();
      context.stroke();
      context.fillStyle = "#8a1828";
      context.beginPath();
      context.arc(-radius * 0.25, -bombH * 0.52, radius * 0.22, 0, Math.PI * 2);
      context.fill();
      context.strokeStyle = "#4a3018";
      context.lineWidth = 2;
      context.beginPath();
      context.moveTo(0, -bombH * 0.42 - radius);
      context.quadraticCurveTo(6, -bombH * 0.78, 4, -bombH * 0.88);
      context.stroke();
      context.fillStyle = "#ffb040";
      context.beginPath();
      context.arc(5, -bombH * 0.9, 4, 0, Math.PI * 2);
      context.fill();
      context.fillStyle = "#ff9040";
      context.beginPath();
      context.arc(5, -bombH * 0.9, 2.5, 0, Math.PI * 2);
      context.fill();
    }

    function drawObstacleCrystalShape(obstacle) {
      var spikeW = obstacle.width;
      var spikeH = obstacle.height;
      var index;
      context.lineWidth = 1.2;
      context.lineJoin = "miter";
      var spikes = [
        { tipX: 0, tipY: -spikeH * 0.98, baseL: -7, baseR: 7, baseY: -spikeH * 0.22, fill: "#e83848", stroke: "#8a1828" },
        { tipX: -spikeW * 0.3, tipY: -spikeH * 0.72, baseL: -5, baseR: 5, baseY: -spikeH * 0.12, fill: "#c82838", stroke: "#6a1420" },
        { tipX: spikeW * 0.28, tipY: -spikeH * 0.78, baseL: -5, baseR: 5, baseY: -spikeH * 0.1, fill: "#d43040", stroke: "#721828" },
        { tipX: -spikeW * 0.12, tipY: -spikeH * 0.48, baseL: -4, baseR: 4, baseY: -2, fill: "#b82030", stroke: "#5a1018" },
        { tipX: spikeW * 0.14, tipY: -spikeH * 0.42, baseL: -3.5, baseR: 3.5, baseY: -1, fill: "#cc2838", stroke: "#641018" }
      ];
      for (index = 0; index < spikes.length; index++) {
        var spike = spikes[index];
        context.fillStyle = spike.fill;
        context.strokeStyle = spike.stroke;
        context.beginPath();
        context.moveTo(spike.tipX, spike.tipY);
        context.lineTo(spike.tipX + spike.baseL, spike.baseY);
        context.lineTo(spike.tipX + spike.baseR, spike.baseY);
        context.closePath();
        context.fill();
        context.stroke();
      }
    }

    function drawObstacles() {
      var index;
      for (index = 0; index < obstacles.length; index++) {
        var obstacle = obstacles[index];
        var screenX = obstacle.x - worldScroll;
        if (screenX < -80 || screenX > width + 80) continue;
        var groundY = groundWave(obstacle.x);
        drawObstacleAt(screenX, groundY, obstacle, 0);
      }
    }

    function drawFlyingObstacles() {
      var index;
      for (index = 0; index < flyingObstacles.length; index++) {
        var piece = flyingObstacles[index];
        var screenX = piece.x - worldScroll;
        if (screenX < -120 || screenX > width + 120) continue;
        var groundY = groundWave(piece.x);
        drawObstacleAt(screenX, groundY + piece.fallY, piece, piece.rotation);
      }
    }

    function drawFallingMeteorStreak(meteor, headX, headY, tailX, tailY) {
      var gradient;
      var glowRadius;
      gradient = context.createLinearGradient(tailX, tailY, headX, headY);
      gradient.addColorStop(0, "rgba(180, 60, 30, 0)");
      gradient.addColorStop(0.4, "rgba(255, 100, 40, 0.35)");
      gradient.addColorStop(0.82, "rgba(255, 180, 80, 0.88)");
      gradient.addColorStop(1, "rgba(255, 245, 220, 0.95)");
      context.strokeStyle = gradient;
      context.lineWidth = meteor.size * 0.22;
      context.lineCap = "round";
      context.beginPath();
      context.moveTo(tailX, tailY);
      context.lineTo(headX, headY);
      context.stroke();
      glowRadius = meteor.size * 1.8;
      gradient = context.createRadialGradient(headX, headY, 0, headX, headY, glowRadius);
      gradient.addColorStop(0, "rgba(255, 240, 210, 0.95)");
      gradient.addColorStop(0.35, "rgba(255, 120, 50, 0.55)");
      gradient.addColorStop(1, "rgba(200, 60, 30, 0)");
      context.fillStyle = gradient;
      context.beginPath();
      context.arc(headX, headY, glowRadius, 0, Math.PI * 2);
      context.fill();
      context.fillStyle = "#3a2838";
      context.beginPath();
      context.arc(headX, headY, meteor.size * 0.38, 0, Math.PI * 2);
      context.fill();
    }

    function drawFallingMeteors() {
      var index;
      var meteor;
      var headPos;
      var prevProgress;
      var prevEase;
      var prevX;
      var prevY;
      var targetGroundY;
      for (index = 0; index < fallingMeteors.length; index += 1) {
        meteor = fallingMeteors[index];
        if (meteor.state !== "falling") continue;
        headPos = getFallingMeteorScreenPosition(meteor);
        prevProgress = Math.max(0, meteor.progress - 0.14);
        prevEase = prevProgress * prevProgress;
        prevX = meteor.startScreenX + (meteor.targetScreenX - meteor.startScreenX) * prevEase;
        targetGroundY = getFallingMeteorGroundY(meteor.targetScreenX);
        prevY = meteor.startScreenY + (targetGroundY - meteor.startScreenY) * prevEase;
        drawFallingMeteorStreak(meteor, headPos.x, headPos.y, prevX, prevY);
      }
    }

    function drawMeteorExplosions() {
      var index;
      var explosion;
      var fade;
      var expand;
      var radius;
      var gradient;
      for (index = 0; index < meteorExplosions.length; index += 1) {
        explosion = meteorExplosions[index];
        fade = 1 - explosion.age / explosion.life;
        expand = explosion.age / explosion.life;
        radius = explosion.radius + (explosion.maxRadius - explosion.radius) * expand;
        context.globalAlpha = fade * 0.85;
        gradient = context.createRadialGradient(
          explosion.screenX,
          explosion.groundY - 6,
          radius * 0.08,
          explosion.screenX,
          explosion.groundY - 6,
          radius
        );
        gradient.addColorStop(0, "rgba(255, 220, 140, 0.95)");
        gradient.addColorStop(0.35, "rgba(255, 120, 40, 0.65)");
        gradient.addColorStop(0.72, "rgba(220, 60, 20, 0.28)");
        gradient.addColorStop(1, "rgba(120, 30, 10, 0)");
        context.fillStyle = gradient;
        context.beginPath();
        context.ellipse(explosion.screenX, explosion.groundY - 4, radius, radius * 0.42, 0, 0, Math.PI * 2);
        context.fill();
        context.strokeStyle = "rgba(255, 180, 80, " + (fade * 0.7) + ")";
        context.lineWidth = 2.5 * fade;
        context.beginPath();
        context.ellipse(explosion.screenX, explosion.groundY - 2, radius * 0.72, radius * 0.28, 0, 0, Math.PI * 2);
        context.stroke();
      }
      context.globalAlpha = 1;
    }

    function drawDamageParticles() {
      var index;
      for (index = 0; index < damageParticles.length; index++) {
        var particle = damageParticles[index];
        var fade = 1 - particle.age / particle.life;
        context.globalAlpha = fade;
        context.fillStyle = "hsla(" + particle.hue + ", 85%, 68%, 0.9)";
        context.beginPath();
        context.arc(particle.x, particle.y, particle.size * fade, 0, Math.PI * 2);
        context.fill();
      }
      context.globalAlpha = 1;
    }

    function drawDustParticles() {
      var index;
      for (index = 0; index < dustParticles.length; index++) {
        var particle = dustParticles[index];
        var fade = 1 - particle.age / particle.life;
        var alpha = particle.alpha * fade;
        context.fillStyle = "rgba(210, 185, 240, " + alpha + ")";
        context.beginPath();
        context.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
        context.fill();
      }
    }

    function drawSmokeParticles() {
      var index;
      for (index = 0; index < smokeParticles.length; index++) {
        var particle = smokeParticles[index];
        var screenX = particle.worldX - worldScroll;
        if (screenX < -80 || screenX > width + 80) continue;
        var fade = 1 - particle.age / particle.life;
        var alpha = fade * 0.38;
        var radius = particle.radius;
        var gradient = context.createRadialGradient(
          screenX,
          particle.y,
          radius * 0.15,
          screenX,
          particle.y,
          radius
        );
        gradient.addColorStop(0, "rgba(255, 255, 255, " + (alpha * 0.95) + ")");
        gradient.addColorStop(0.45, "rgba(230, 228, 240, " + (alpha * 0.55) + ")");
        gradient.addColorStop(1, "rgba(200, 198, 210, 0)");
        context.fillStyle = gradient;
        context.beginPath();
        context.arc(screenX, particle.y, radius, 0, Math.PI * 2);
        context.fill();
      }
    }

    function render() {
      var shake = getScreenShakeOffset();
      context.save();
      context.translate(shake.x, shake.y);
      context.clearRect(0, 0, width, height);
      drawSky();
      drawMoon();
      drawStars();
      drawSkyMeteors();
      drawParallaxHills(0, "rgba(58, 38, 88, 0.92)", "rgba(28, 18, 48, 0.88)", "rgba(80, 52, 112, 0.45)", 42, 0.0014, height * 0.52);
      drawParallaxHills(1, "rgba(72, 46, 108, 0.94)", "rgba(36, 22, 58, 0.9)", "rgba(96, 62, 132, 0.48)", 52, 0.002, height * 0.58);
      drawParallaxHills(2, "rgba(88, 56, 128, 0.96)", "rgba(44, 28, 68, 0.92)", "rgba(112, 72, 152, 0.52)", 62, 0.0026, height * 0.64);
      drawParallaxHills(3, "rgba(104, 68, 148, 0.98)", "rgba(52, 34, 82, 0.94)", "rgba(128, 84, 172, 0.55)", 72, 0.0032, height * 0.68);
      drawDustParticles();
      drawTrailCleanups();
      drawFallingMeteors();
      drawGround();
      drawMeteorExplosions();
      drawObstacles();
      drawFlyingObstacles();
      if (isPlaying() || isGameOver()) {
        drawSmokeParticles();
      }
      drawDamageParticles();
      context.restore();
      positionRunnerDom();
      if (isStart()) {
        positionClickHint();
      }
    }

    var lastFrameTime = 0;
    function gameLoop(timestamp) {
      if (!lastFrameTime) lastFrameTime = timestamp;
      var deltaSeconds = Math.min(0.05, (timestamp - lastFrameTime) / 1000);
      lastFrameTime = timestamp;
      update(deltaSeconds);
      render();
      window.requestAnimationFrame(gameLoop);
    }

    window.addEventListener("resize", resizeCanvas);
    canvas.addEventListener("pointerdown", onPointerDown);
    gameScreen.addEventListener("pointerdown", onPointerDown);
    window.addEventListener("pointerup", onPointerUp);
    window.addEventListener("pointercancel", onPointerUp);

    initSkyStars();
    initSkyMeteors();
    bindLocaleListener();
    loadHighScore();
    herdHp = START_HP;
    syncHerdFollowerElements();
    resizeCanvas();
    randomizeMoonPosition();
    showStartScreen();
    applyGameLocale();
    positionRunnerDom();
    render();
    window.requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
