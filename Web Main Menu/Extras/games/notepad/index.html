<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notepad</title>
  <script src="../iframe-game-locale.js"></script>
  <script src="../extras-game-synth-audio.js"></script>
  <link rel="stylesheet" href="notepad.css" />
</head>
<body>
  <div class="notepad-shell" id="notepadShell">
    <header class="notepad-header">
      <span class="notepad-header-brand" id="notepadBrand">INDUSTRIAL FIELD LOG</span>
      <span class="notepad-header-title" id="notepadTitle">NOTEPAD</span>
    </header>
    <div class="notepad-scroll" id="notepadScroll">
      <div class="notepad-sheet" id="notepadSheet">
        <textarea class="notepad-body-input" id="bodyInput" spellcheck="false" rows="1"></textarea>
      </div>
    </div>
  </div>
  <script src="notepad.js"></script>
</body>
</html>
