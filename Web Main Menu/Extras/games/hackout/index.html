<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hackout</title>
  <script src="../iframe-game-locale.js"></script>
  <script src="../iframe-game-input.js"></script>
  <script src="../extras-game-start-music-notify.js"></script>
  <script src="../extras-game-synth-audio.js"></script>
  <link rel="stylesheet" href="hackout.css" />
</head>
<body>
  <div class="hack-shell" id="hackShell">
    <header class="hack-header">
      <span class="hack-header-prompt">ROBCO INDUSTRIES (TM) TERMLINK</span>
      <span class="hack-header-title" id="hackTitle">HACKOUT</span>
      <span class="hack-header-spacer"></span>
    </header>
    <div class="hack-main">
      <div class="hack-content">
        <div class="hack-terminal-wrap" id="terminalWrap">
          <span id="hackMeasureProbe" class="hack-measure-probe" aria-hidden="true">M</span>
          <div class="hack-terminal" id="hackTerminal" aria-live="polite"></div>
        </div>
        <footer class="hack-footer">
          <div class="hack-footer-col hack-footer-col-lives">
            <div class="hack-footer-lives-row">
              <span class="hack-footer-label" id="attemptsLabel">ATTEMPTS</span>
              <div class="hack-lives" id="hackLives" aria-hidden="true"></div>
            </div>
            <div class="hack-match-display" id="matchDisplay"></div>
          </div>
          <div class="hack-footer-col hack-footer-col-log">
            <h3 class="hack-footer-log-title" id="attemptLogTitle">ATTEMPT LOG</h3>
            <div class="hack-footer-log" id="attemptLogList" aria-live="polite"></div>
          </div>
          <div class="hack-footer-col hack-footer-col-score">
            <div class="hack-footer-score-row">
              <span class="hack-footer-label" id="scoreLabel">SCORE</span>
              <span class="hack-footer-value" id="scoreValue">0</span>
            </div>
            <div class="hack-footer-score-row">
              <span class="hack-footer-label" id="bestLabel">BEST</span>
              <span class="hack-footer-value" id="bestValue">0</span>
            </div>
          </div>
        </footer>
        <div class="hack-overlay hidden" id="hackOverlay">
          <h2 class="hack-overlay-title" id="overlayTitle"></h2>
          <p class="hack-overlay-sub" id="overlaySub"></p>
        </div>
      </div>
    </div>
    <div id="gameScreen">
      <h1 id="screenTitle">HACKOUT</h1>
      <p id="tutorialHint" class="game-screen-tutorial"></p>
      <p id="controlHint" class="game-screen-start"></p>
    </div>
  </div>
  <script src="hackout.js"></script>
</body>
</html>
