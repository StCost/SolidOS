      var extra;
      if (extraSteps < 0) {
        extraSteps = 0;
      }
      extra = extraSteps * ROCK_DEFLECT_STREAK_STEP;
      if (extra > ROCK_DEFLECT_STREAK_MAX) {
        extra = ROCK_DEFLECT_STREAK_MAX;
      }
      return baseStrength + extra;
    }

    function getRockDeflectStrengthOnEntity(entity, baseStrength) {
      registerRockDeflectStreakEntity(entity);
      return getRockDeflectStrengthForStreak(entity.rockDeflectStreak, baseStrength);
    }

    function updateRockDeflectStreakEntity(entity, deltaSeconds) {
      if (entity.rockDeflectStreakTimer <= 0) {
        return;
      }
      entity.rockDeflectStreakTimer -= deltaSeconds;
      if (entity.rockDeflectStreakTimer <= 0) {
        entity.rockDeflectStreakTimer = 0;
        entity.rockDeflectStreak = 0;
      }
    }

    function applyRockAngleDeflection(entity, currentAngle, angleDiff, baseStrength) {
      var deflectStrength = getRockDeflectStrengthOnEntity(entity, baseStrength);
      return currentAngle + angleDiff * deflectStrength;
    }

    function resolveRockCollision(collision) {
      var normalX = collision.normalX;
      var normalY = collision.normalY;
      var pushDist = collision.penetration + ROCK_PUSH_EXTRA;
      var pushAngle;
      var angleDiff;

      carWorldX += normalX * pushDist;
      carWorldY += normalY * pushDist;

      pushAngle = Math.atan2(normalY, normalX);
      angleDiff = normalizeAngleDiff(pushAngle - carAngle);
      carAngle = applyRockAngleDeflection(carRockDeflectEntity, carAngle, angleDiff, ROCK_DEFLECT_STRENGTH);
      setCarWrapTransform();
    }

    function resolveEnemyRockCollision(enemy, collision) {
      var normalX = collision.normalX;
      var normalY = collision.normalY;
      var pushDist = collision.penetration + ROCK_PUSH_EXTRA;
      var pushAngle;
      var angleDiff;

      enemy.x += normalX * pushDist;
      enemy.y += normalY * pushDist;

      pushAngle = Math.atan2(normalY, normalX);
      angleDiff = normalizeAngleDiff(pushAngle - enemy.angle);
      enemy.angle = applyRockAngleDeflection(enemy, enemy.angle, angleDiff, ROCK_DEFLECT_STRENGTH);
    }

    function isRockBlockingPoint(worldX, worldY, probeRadius) {
      var chunkX = worldToChunk(worldX);
      var chunkY = worldToChunk(worldY);
      var offsetX;
      var offsetY;
      var chunk;
      var rockIndex;
      var rock;
      var collision;

      for (offsetY = -1; offsetY <= 1; offsetY += 1) {
        for (offsetX = -1; offsetX <= 1; offsetX += 1) {
          chunk = getLoadedChunk(chunkX + offsetX, chunkY + offsetY);
          if (!chunk) {
            continue;
          }
          for (rockIndex = 0; rockIndex < chunk.rocks.length; rockIndex += 1) {
            rock = chunk.rocks[rockIndex];
            collision = getRockCarCollisionAt(worldX, worldY, 0, probeRadius, rock);
            if (collision) {
              return true;
            }
          }
        }
      }
      return false;
    }

    function shouldDespawnEnemy(enemy) {
      var enemyChunkX = worldToChunk(enemy.x);
      var enemyChunkY = worldToChunk(enemy.y);
      var carChunkX = worldToChunk(carWorldX);
      var carChunkY = worldToChunk(carWorldY);

      if (Math.abs(enemyChunkX - carChunkX) > CHUNK_UNLOAD_RADIUS) {
        return true;
      }
      if (Math.abs(enemyChunkY - carChunkY) > CHUNK_UNLOAD_RADIUS) {
        return true;
      }
      return !getLoadedChunk(enemyChunkX, enemyChunkY);
    }

    function isEnemyWorldBeyondLoadRadius(worldX, worldY) {
      var worldChunkX = worldToChunk(worldX);
      var worldChunkY = worldToChunk(worldY);
      var carChunkX = worldToChunk(carWorldX);
      var carChunkY = worldToChunk(carWorldY);

      if (Math.abs(worldChunkX - carChunkX) > CHUNK_LOAD_RADIUS) {
        return true;
      }
      if (Math.abs(worldChunkY - carChunkY) > CHUNK_LOAD_RADIUS) {
        return true;
      }
      return false;
    }

    function enemyHasClearSightToPlayer(enemy) {
      var deltaX = carWorldX - enemy.x;
      var deltaY = carWorldY - enemy.y;
      var dist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
      var stepCount;
      var stepIndex;
      var probeX;
      var probeY;
      var t;

      if (dist < 1) {
        return true;
      }
      stepCount = Math.floor(dist / ENEMY_LOS_STEP_SIZE);
      if (stepCount < 2) {
        return !isRockBlockingPoint(
          enemy.x + deltaX * 0.5,
          enemy.y + deltaY * 0.5,
          ENEMY_LOS_PROBE_RADIUS
        );
      }
      for (stepIndex = 1; stepIndex < stepCount; stepIndex += 1) {
        t = stepIndex / stepCount;
        probeX = enemy.x + deltaX * t;
        probeY = enemy.y + deltaY * t;
        if (isRockBlockingPoint(probeX, probeY, ENEMY_LOS_PROBE_RADIUS)) {
          return false;
        }
      }
      return true;
    }

    function enemyCanSeePlayer(enemy) {
      var deltaX = carWorldX - enemy.x;
      var deltaY = carWorldY - enemy.y;
      var dist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
      var forwardX;
      var forwardY;
      var dot;

      if (dist > ENEMY_SIGHT_RANGE || dist < 1) {
        return false;
      }
      forwardX = Math.cos(enemy.angle);
      forwardY = Math.sin(enemy.angle);
      dot = (deltaX * forwardX + deltaY * forwardY) / dist;
      if (dot < ENEMY_SIGHT_DOT_MIN) {
        return false;
      }
      return enemyHasClearSightToPlayer(enemy);
    }

    function isPlayerInEnemySightCone(enemy) {
      var deltaX = carWorldX - enemy.x;
      var deltaY = carWorldY - enemy.y;
      var dist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
      var forwardX;
      var forwardY;
      var dot;

      if (dist > ENEMY_SIGHT_RANGE || dist < 1) {
        return false;
      }
      forwardX = Math.cos(enemy.angle);
      forwardY = Math.sin(enemy.angle);
      dot = (deltaX * forwardX + deltaY * forwardY) / dist;
      return dot >= ENEMY_SIGHT_DOT_MIN;
    }

    function isEnemySpawnClear(worldX, worldY) {
      var chunkX = worldToChunk(worldX);
      var chunkY = worldToChunk(worldY);
      var offsetX;
      var offsetY;
      var chunk;
      var rockIndex;
      var rock;
      var collision;
      var distToPlayer;
      var deltaX;
      var deltaY;

      deltaX = worldX - carWorldX;
      deltaY = worldY - carWorldY;
      distToPlayer = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
      if (distToPlayer < CAR_RADIUS + ENEMY_CAR_RADIUS_MAX + 48) {
        return false;
      }

      if (isEnemyWorldBeyondLoadRadius(worldX, worldY)) {
        return false;
      }

      for (offsetY = -1; offsetY <= 1; offsetY += 1) {
        for (offsetX = -1; offsetX <= 1; offsetX += 1) {
          chunk = getLoadedChunk(chunkX + offsetX, chunkY + offsetY);
          if (!chunk) {
            continue;
          }
          for (rockIndex = 0; rockIndex < chunk.rocks.length; rockIndex += 1) {
            rock = chunk.rocks[rockIndex];
            collision = getRockCarCollisionAt(worldX, worldY, 0, ENEMY_CAR_RADIUS_MAX, rock);
            if (collision) {
              return false;
            }
          }
        }
      }
      return true;
    }

    function trySpawnEnemyCar() {
      var attemptIndex;
      var side;
      var inset;
      var spawnScreenX;
      var spawnScreenY;
      var spawnWorld;
      var spawnX;
      var spawnY;
      var enemy;

      if (enemyCars.length >= ENEMY_CAR_MAX_COUNT) {
        return;
      }

      for (attemptIndex = 0; attemptIndex < 10; attemptIndex += 1) {
        side = Math.floor(Math.random() * 4);
        inset = 50 + Math.random() * 70;
        if (side === 0) {
          spawnScreenX = -inset;
          spawnScreenY = Math.random() * height;
        } else if (side === 1) {
          spawnScreenX = width + inset;
          spawnScreenY = Math.random() * height;
        } else if (side === 2) {
          spawnScreenX = Math.random() * width;
          spawnScreenY = -inset;
        } else {
          spawnScreenX = Math.random() * width;
          spawnScreenY = height + inset;
        }
        spawnWorld = screenToWorld(spawnScreenX, spawnScreenY);
        spawnX = spawnWorld.x;
        spawnY = spawnWorld.y;
        if (!isEnemySpawnClear(spawnX, spawnY)) {
          continue;
        }
        enemy = {
          x: spawnX,
          y: spawnY,
          angle: Math.random() * Math.PI * 2,
          speed: 0,
          targetSpeed: 0,
          wanderTimer: ENEMY_WANDER_TURN_MIN + Math.random() * (ENEMY_WANDER_TURN_MAX - ENEMY_WANDER_TURN_MIN),
          chasing: false,
          rememberPlayerTimer: 0,
          sizeScale: Math.random(),
          radius: 0,
          health: ENEMY_MAX_HEALTH,
          rockHitCooldown: 0,
          rockDeflectStreak: 0,
          rockDeflectStreakTimer: 0,
          turnLockTimer: 0,
          frontSteerAngle: 0,
          frontSteerTarget: 0
        };
        enemy.radius = ENEMY_CAR_RADIUS_MIN +
          enemy.sizeScale * (ENEMY_CAR_RADIUS_MAX - ENEMY_CAR_RADIUS_MIN);
        setEnemyWanderTargetSpeed(enemy);
        enemy.speed = enemy.targetSpeed;
        enemyCars.push(enemy);
        return;
      }
    }

    function checkEnemyRockCollisions(enemy) {
      var enemyChunkX = worldToChunk(enemy.x);
      var enemyChunkY = worldToChunk(enemy.y);
      var offsetX;
      var offsetY;
      var chunk;
      var rockIndex;
      var rock;
      var collision;
      var tookDamage = false;
      var enemyDied = false;

      for (offsetY = -1; offsetY <= 1; offsetY += 1) {
        for (offsetX = -1; offsetX <= 1; offsetX += 1) {
          chunk = getLoadedChunk(enemyChunkX + offsetX, enemyChunkY + offsetY);
          if (!chunk) {
            continue;
          }
          for (rockIndex = 0; rockIndex < chunk.rocks.length; rockIndex += 1) {
            rock = chunk.rocks[rockIndex];
            collision = getRockCarCollisionAt(enemy.x, enemy.y, enemy.angle, enemy.radius, rock);
            if (!collision) {
              continue;
            }
            resolveEnemyRockCollision(enemy, collision);
            if (!tookDamage) {
              enemyDied = applyEnemyDamage(enemy, collision, COLLISION_KIND_ROCK);
              tookDamage = true;
            }
          }
        }
      }
      return enemyDied;
    }

    function updateEnemyCars(deltaSeconds) {
      var enemyIndex;
      var enemy;
      var targetAngle;
      var angleDiff;
      var speedLerp;
      var turnBlend;
      var enemyDied;
      var deltaX;
      var deltaY;
      var distSq;
      var useSimpleUpdate;

      enemySpawnCooldown -= deltaSeconds;
      if (enemySpawnCooldown <= 0) {
        trySpawnEnemyCar();
        enemySpawnCooldown = ENEMY_SPAWN_COOLDOWN_MIN +
          Math.random() * (ENEMY_SPAWN_COOLDOWN_MAX - ENEMY_SPAWN_COOLDOWN_MIN);
      }

      for (enemyIndex = enemyCars.length - 1; enemyIndex >= 0; enemyIndex -= 1) {
        enemy = enemyCars[enemyIndex];

        if (shouldDespawnEnemy(enemy)) {
          enemyCars.splice(enemyIndex, 1);
          continue;
        }

        if (enemy.health <= 0) {
          enemyCars.splice(enemyIndex, 1);
          continue;
        }

        deltaX = enemy.x - carWorldX;
        deltaY = enemy.y - carWorldY;
        distSq = deltaX * deltaX + deltaY * deltaY;
        useSimpleUpdate = distSq > 640000;
        if (useSimpleUpdate && simulationFrameIndex % 2 === 0) {
          enemy.x += Math.cos(enemy.angle) * enemy.speed * deltaSeconds;
          enemy.y += Math.sin(enemy.angle) * enemy.speed * deltaSeconds;
          continue;
        }

        if (enemy.rockHitCooldown > 0) {
          enemy.rockHitCooldown -= deltaSeconds;
          if (enemy.rockHitCooldown < 0) {
            enemy.rockHitCooldown = 0;
          }
        }
        updateRockDeflectStreakEntity(enemy, deltaSeconds);

        if (enemyCanSeePlayer(enemy)) {
          enemy.rememberPlayerTimer = ENEMY_REMEMBER_PLAYER_SECONDS;
        }

        if (enemy.rememberPlayerTimer > 0) {
          enemy.rememberPlayerTimer -= deltaSeconds;
          if (enemy.rememberPlayerTimer < 0) {
            enemy.rememberPlayerTimer = 0;
          }
        }

        if (enemy.turnLockTimer > 0) {
          enemy.turnLockTimer -= deltaSeconds;
          if (enemy.turnLockTimer < 0) {
            enemy.turnLockTimer = 0;
          }
        }

        if (enemy.turnLockTimer <= 0) {
          if (enemy.rememberPlayerTimer > 0) {
            targetAngle = Math.atan2(carWorldY - enemy.y, carWorldX - enemy.x);
            if (!enemy.chasing) {
              enemy.chasing = true;
              setEnemyChaseTargetSpeed(enemy);
            }
          } else {
            if (enemy.chasing) {
              enemy.chasing = false;
            }
            enemy.wanderTimer -= deltaSeconds;
            if (enemy.wanderTimer <= 0) {
              enemy.wanderTimer = ENEMY_WANDER_TURN_MIN +
                Math.random() * (ENEMY_WANDER_TURN_MAX - ENEMY_WANDER_TURN_MIN);
              enemy.angle += (Math.random() - 0.5) * 1.35;
              setEnemyWanderTargetSpeed(enemy);
            }
            targetAngle = enemy.angle;
          }

          angleDiff = normalizeAngleDiff(targetAngle - enemy.angle);
          if (enemy.chasing) {
            turnBlend = 1 - Math.exp(-ENEMY_CHASE_TURN_SMOOTH * deltaSeconds);
          } else {
            turnBlend = 1 - Math.exp(-ENEMY_WANDER_TURN_SMOOTH * deltaSeconds);
          }
          if (turnBlend > 1) {
            turnBlend = 1;
          }
          enemy.angle += angleDiff * turnBlend;

          enemy.frontSteerTarget = angleDiff * 0.58;
          if (enemy.frontSteerTarget > CAR_FRONT_STEER_MAX) {
            enemy.frontSteerTarget = CAR_FRONT_STEER_MAX;
          }
          if (enemy.frontSteerTarget < -CAR_FRONT_STEER_MAX) {
            enemy.frontSteerTarget = -CAR_FRONT_STEER_MAX;
          }
          enemy.frontSteerAngle += (enemy.frontSteerTarget - enemy.frontSteerAngle) * turnBlend;
        } else {
          enemy.frontSteerTarget = 0;
          turnBlend = 1 - Math.exp(-CAR_FRONT_STEER_SMOOTH * deltaSeconds);
          if (turnBlend > 1) {
            turnBlend = 1;
          }
          enemy.frontSteerAngle += (enemy.frontSteerTarget - enemy.frontSteerAngle) * turnBlend;
        }

        if (enemy.chasing) {
          speedLerp = Math.min(1, deltaSeconds * 4.2);
        } else {
          speedLerp = Math.min(1, deltaSeconds * 2.4);
        }
        enemy.speed += (enemy.targetSpeed - enemy.speed) * speedLerp;
        if (enemy.speed < ENEMY_SPEED_MIN * 0.55) {
          enemy.speed = ENEMY_SPEED_MIN * 0.55;
        }

        var moveDistance = enemy.speed * deltaSeconds;
        var nextX = enemy.x + Math.cos(enemy.angle) * moveDistance;
        var nextY = enemy.y + Math.sin(enemy.angle) * moveDistance;
        if (!isEnemyWorldBeyondLoadRadius(nextX, nextY)) {
          enemy.x = nextX;
          enemy.y = nextY;
        }
        enemyDied = checkEnemyRockCollisions(enemy);
        if (enemyDied) {
          enemyCars.splice(enemyIndex, 1);
        }
      }
    }

    function resolveEnemyPlayerCollision(enemy, collision) {
      var normalX = collision.normalX;
      var normalY = collision.normalY;
      var pushDist = collision.penetration + ROCK_PUSH_EXTRA;
      var pushAngle;
      var angleDiff;

      enemy.x -= normalX * pushDist;
      enemy.y -= normalY * pushDist;

      pushAngle = Math.atan2(-normalY, -normalX);
      angleDiff = normalizeAngleDiff(pushAngle - enemy.angle);
      enemy.angle = applyRockAngleDeflection(enemy, enemy.angle, angleDiff, ENEMY_HIT_DEFLECT_STRENGTH);
      enemy.chasing = true;
      enemy.rememberPlayerTimer = ENEMY_REMEMBER_PLAYER_SECONDS;
      if (enemy.targetSpeed < getEnemyChaseSpeedMin(enemy)) {
        setEnemyChaseTargetSpeed(enemy);
      }
      setEnemyPlayerCollisionTurnLock(enemy);
    }

    function checkEnemyPlayerCollisions() {
      var enemyIndex;
      var enemy;
      var collision;
      var tookPlayerDamage = false;
      var tookEnemyDamage = false;
      var enemyDied = false;

      for (enemyIndex = enemyCars.length - 1; enemyIndex >= 0; enemyIndex -= 1) {
        enemy = enemyCars[enemyIndex];
        collision = getEnemyCarCollision(enemy);
        if (!collision) {
          continue;
        }
        resolveRockCollision(collision);
        resolveEnemyPlayerCollision(enemy, collision);
        if (!tookPlayerDamage && rockHitCooldown <= 0) {
          applyRockDamage(collision, COLLISION_KIND_VEHICLE);
          tookPlayerDamage = true;
        }
        if (!tookEnemyDamage) {
          enemyDied = applyEnemyDamage(enemy, collision, COLLISION_KIND_VEHICLE);
          tookEnemyDamage = true;
          if (enemyDied) {
            enemyCars.splice(enemyIndex, 1);
          }
        }
      }
    }

    function getEnemySightScanProgress(enemyPhase, scanSpeed) {
      var phase = enemyPhase * scanSpeed;
      phase = phase - Math.floor(phase);
      if (phase < 0.5) {
        return phase * 2;
      }
      return (1 - phase) * 2;
    }

    function drawVehicleWheelsCanvas(frontSteerAngle, isEnemy) {
      var wheelFill = "#424a54";
      var wheelStroke = "#222830";
      var rearY = 17;
      var frontY = -11;
      var rearX = 14;
      var frontX = 13;
      var wheelHalfW = 3.5;
      var wheelHalfH = 7;

      if (isEnemy) {
        wheelFill = "#3a3030";
        wheelStroke = "#1a1010";
      }

      context.fillStyle = wheelFill;
      context.strokeStyle = wheelStroke;
      context.lineWidth = 1;

      context.fillRect(-rearX - wheelHalfW, rearY - wheelHalfH, wheelHalfW * 2, wheelHalfH * 2);
      context.strokeRect(-rearX - wheelHalfW, rearY - wheelHalfH, wheelHalfW * 2, wheelHalfH * 2);
      context.fillRect(rearX - wheelHalfW, rearY - wheelHalfH, wheelHalfW * 2, wheelHalfH * 2);
      context.strokeRect(rearX - wheelHalfW, rearY - wheelHalfH, wheelHalfW * 2, wheelHalfH * 2);

      context.save();
      context.translate(-frontX, frontY);
      context.rotate(frontSteerAngle);
      context.fillRect(-wheelHalfW, -wheelHalfH, wheelHalfW * 2, wheelHalfH * 2);
      context.strokeRect(-wheelHalfW, -wheelHalfH, wheelHalfW * 2, wheelHalfH * 2);
      context.restore();

      context.save();
      context.translate(frontX, frontY);
      context.rotate(frontSteerAngle);
      context.fillRect(-wheelHalfW, -wheelHalfH, wheelHalfW * 2, wheelHalfH * 2);
      context.strokeRect(-wheelHalfW, -wheelHalfH, wheelHalfW * 2, wheelHalfH * 2);
      context.restore();
    }

    function buildEnemySightConePath(enemy, halfAngle, range) {
      var segmentIndex;
      var worldAngle;
      var worldX;
      var worldY;
      var apexScreen = worldToScreen(enemy.x, enemy.y);
      var pointScreen;

      context.beginPath();
      context.moveTo(apexScreen.x, apexScreen.y);
      for (segmentIndex = 0; segmentIndex <= ENEMY_SIGHT_CONE_SEGMENTS; segmentIndex += 1) {
        worldAngle = enemy.angle - halfAngle +
          (segmentIndex / ENEMY_SIGHT_CONE_SEGMENTS) * (halfAngle * 2);
        worldX = enemy.x + Math.cos(worldAngle) * range;
        worldY = enemy.y + Math.sin(worldAngle) * range;
        pointScreen = worldToScreen(worldX, worldY);
        context.lineTo(pointScreen.x, pointScreen.y);
      }
      context.closePath();
    }

    function drawEnemySightConeHazardStripes(enemy, halfAngle, range, isAttack) {
      var stripeIndex;
      var stripeAngle;
      var innerDist;
      var outerDist;
      var innerScreen;
      var outerScreen;
      var stripeSpacing = (halfAngle * 2) / ENEMY_SIGHT_CONE_STRIPE_COUNT;
      var lightAlpha = isAttack ? 0.1 : 0.14;
      var darkAlpha = isAttack ? 0.05 : 0.07;

      context.save();
      buildEnemySightConePath(enemy, halfAngle, range);
      context.clip();

      for (stripeIndex = 0; stripeIndex <= ENEMY_SIGHT_CONE_STRIPE_COUNT; stripeIndex += 1) {
        stripeAngle = enemy.angle - halfAngle + stripeIndex * stripeSpacing;
        innerDist = range * 0.12;
        outerDist = range * 0.96;
        innerScreen = worldToScreen(
          enemy.x + Math.cos(stripeAngle) * innerDist,
          enemy.y + Math.sin(stripeAngle) * innerDist
        );
        outerScreen = worldToScreen(
          enemy.x + Math.cos(stripeAngle) * outerDist,
          enemy.y + Math.sin(stripeAngle) * outerDist
        );
        if (stripeIndex % 2 === 0) {
          context.strokeStyle = "rgba(255, 210, 120, " + lightAlpha + ")";
        } else {
          context.strokeStyle = "rgba(40, 28, 12, " + darkAlpha + ")";
        }
        context.lineWidth = isAttack ? 2.2 : 1.6;
        context.beginPath();
        context.moveTo(innerScreen.x, innerScreen.y);
        context.lineTo(outerScreen.x, outerScreen.y);
        context.stroke();
      }
      context.restore();
    }

    function drawEnemySightCones() {
      var enemyIndex;
      var enemy;
      var halfAngle = Math.acos(ENEMY_SIGHT_DOT_MIN);
      var range = ENEMY_SIGHT_RANGE;
      var segmentIndex;
      var worldAngle;
      var worldX;
      var worldY;
      var apexScreen;
      var pointScreen;
      var coneTipScreen;
      var gradientRadius;
      var gradient;
      var fillAlpha;
      var strokeAlpha;
      var playerInCone;
      var enemyPhase;
      var flicker;
      var scanProgress;
      var scanAngle;
      var scanEndScreen;
      var scanLineAlpha;
      var isAttack;
      var scanSpeed;
      var fillInnerR;
      var fillInnerG;
      var fillInnerB;
      var fillOuterR;
      var fillOuterG;
      var fillOuterB;
      var strokeR;
      var strokeG;
      var strokeB;

      for (enemyIndex = 0; enemyIndex < enemyCars.length; enemyIndex += 1) {

          continue;

        isAttack = enemy.chasing || enemy.rememberPlayerTimer > 0;
        enemyPhase = gameAnimTime + enemyIndex * 1.37;
        flicker = 0.88 + Math.sin(enemyPhase * ENEMY_SIGHT_CONE_FLICKER_SPEED) * 0.1 +
          Math.sin(enemyPhase * ENEMY_SIGHT_CONE_FLICKER_SPEED * 2.15) * 0.05;

        playerInCone = isPlayerInEnemySightCone(enemy);
        if (isAttack) {
          fillAlpha = ENEMY_SIGHT_CONE_FILL_ALPHA_ALERT * flicker;
          strokeAlpha = ENEMY_SIGHT_CONE_STROKE_ALPHA_ALERT * flicker;
          fillInnerR = 255;
          fillInnerG = 70;
          fillInnerB = 45;
          fillOuterR = 170;
          fillOuterG = 25;
          fillOuterB = 18;
          strokeR = 255;
          strokeG = 55;
          strokeB = 40;
          scanSpeed = ENEMY_SIGHT_CONE_ATTACK_SCAN_SPEED;
        } else {
          fillAlpha = ENEMY_SIGHT_CONE_FILL_ALPHA * flicker;
          strokeAlpha = ENEMY_SIGHT_CONE_STROKE_ALPHA * flicker;
          fillInnerR = 255;
          fillInnerG = 155;
          fillInnerB = 55;
          fillOuterR = 200;
          fillOuterG = 95;
          fillOuterB = 25;
          strokeR = 255;
          strokeG = 130;
          strokeB = 50;
          scanSpeed = ENEMY_SIGHT_CONE_SCAN_SPEED;
        }
        if (playerInCone) {
          fillAlpha = fillAlpha * 1.25;
          strokeAlpha = strokeAlpha * 1.2;
        }

        buildEnemySightConePath(enemy, halfAngle, range);

        coneTipScreen = worldToScreen(
          enemy.x + Math.cos(enemy.angle) * range * 0.72,
          enemy.y + Math.sin(enemy.angle) * range * 0.72
        );
        gradientRadius = Math.sqrt(
          (coneTipScreen.x - apexScreen.x) * (coneTipScreen.x - apexScreen.x) +
          (coneTipScreen.y - apexScreen.y) * (coneTipScreen.y - apexScreen.y)
        );
        if (gradientRadius < 8) {
          gradientRadius = 8;
        }
        gradient = context.createRadialGradient(
          apexScreen.x,
          apexScreen.y,
          0,
          apexScreen.x,
          apexScreen.y,
          gradientRadius
        );
        gradient.addColorStop(0, "rgba(" + fillInnerR + "," + fillInnerG + "," + fillInnerB + "," + (fillAlpha * 1.35) + ")");
        gradient.addColorStop(1, "rgba(" + fillOuterR + "," + fillOuterG + "," + fillOuterB + ",0)");
        context.fillStyle = gradient;
        context.fill();

        drawEnemySightConeHazardStripes(enemy, halfAngle, range, isAttack);

        buildEnemySightConePath(enemy, halfAngle, range);
        context.strokeStyle = "rgba(" + strokeR + "," + strokeG + "," + strokeB + "," + strokeAlpha + ")";
        context.lineWidth = 1.2;
        context.stroke();

        scanProgress = getEnemySightScanProgress(enemyPhase, scanSpeed);
        scanAngle = enemy.angle - halfAngle + scanProgress * (halfAngle * 2);
        scanEndScreen = worldToScreen(
          enemy.x + Math.cos(scanAngle) * range,
          enemy.y + Math.sin(scanAngle) * range
        );
        scanLineAlpha = 0.2 + Math.sin(enemyPhase * 14) * 0.1;
        if (isAttack) {
          scanLineAlpha = 0.38 + Math.sin(enemyPhase * 18) * 0.14;
        } else if (playerInCone) {
          scanLineAlpha = 0.3 + Math.sin(enemyPhase * 14) * 0.12;
        }
        context.beginPath();
        context.moveTo(apexScreen.x, apexScreen.y);
        context.lineTo(scanEndScreen.x, scanEndScreen.y);
        if (isAttack) {
          context.strokeStyle = "rgba(255, 90, 70, " + scanLineAlpha + ")";
        } else {
          context.strokeStyle = "rgba(255, 190, 90, " + scanLineAlpha + ")";
        }
        context.lineWidth = isAttack ? 2.4 : 2;
        context.stroke();
        context.beginPath();
        context.moveTo(apexScreen.x, apexScreen.y);
        context.lineTo(scanEndScreen.x, scanEndScreen.y);
        context.strokeStyle = "rgba(255, 240, 210, " + (scanLineAlpha * 0.45) + ")";
        context.lineWidth = 0.8;
        context.stroke();
      }
    }

    function drawEnemyRotatingBeacon(centerX, centerY, spinAngle, isLit, isAttackMode) {
      var housingRadius = ENEMY_ATTACK_LIGHT_RADIUS;
      var lensAlpha;
      var beamAlpha;
      var hotAlpha;
      var mirrorAlpha;

      context.save();
      context.translate(centerX, centerY);

      context.fillStyle = "#1a0505";
      context.beginPath();
      context.arc(0, 0, housingRadius + 0.7, 0, Math.PI * 2);
      context.fill();

      context.fillStyle = "#320808";
      context.beginPath();
      context.arc(0, 0, housingRadius, 0, Math.PI * 2);
      context.fill();

      if (!isAttackMode) {
        context.fillStyle = "#8a2020";
        context.beginPath();
        context.arc(0, 0, housingRadius * 0.78, 0, Math.PI * 2);
        context.fill();
        context.fillStyle = "#4a1010";
        context.beginPath();
        context.arc(0, 0, housingRadius * 0.44, 0, Math.PI * 2);
        context.fill();
        context.restore();
        return;
      }

      context.rotate(spinAngle);

      if (isLit) {
        lensAlpha = 1;
        beamAlpha = 0.42;
        hotAlpha = 0.95;
        mirrorAlpha = 0.14;
        context.shadowColor = "rgba(255, 45, 30, 0.95)";
        context.shadowBlur = 16;
      } else {
        lensAlpha = 0.28;
        beamAlpha = 0.07;
        hotAlpha = 0.2;
        mirrorAlpha = 0.38;
        context.shadowBlur = 0;
      }

      context.fillStyle = "rgba(255, 55, 38, " + beamAlpha + ")";
      context.beginPath();
      context.moveTo(0, 0);
      context.arc(0, 0, ENEMY_ATTACK_LIGHT_BEAM_LENGTH, -0.58, 0.58);
      context.closePath();
      context.fill();

      context.fillStyle = "rgba(255, 58, 40, " + (beamAlpha * 0.55) + ")";
      context.beginPath();
      context.moveTo(0, 0);
      context.arc(0, 0, ENEMY_ATTACK_LIGHT_BEAM_LENGTH, Math.PI - 0.58, Math.PI + 0.58);
      context.closePath();
      context.fill();

      context.fillStyle = "rgba(255, " + (isLit ? "70" : "35") + ", " + (isLit ? "50" : "28") + ", " + lensAlpha + ")";
      context.beginPath();
      context.arc(0, 0, housingRadius * 0.92, -Math.PI * 0.4, Math.PI * 0.4);
      context.lineTo(0, 0);
      context.closePath();
      context.fill();

      context.fillStyle = "rgba(255, " + (isLit ? "220" : "120") + ", " + (isLit ? "190" : "90") + ", " + hotAlpha + ")";
      context.beginPath();
      context.arc(0, -housingRadius * 0.12, housingRadius * 0.52, 0, Math.PI * 2);
      context.fill();

      context.shadowBlur = 0;

      context.fillStyle = "rgba(220, 200, 190, " + mirrorAlpha + ")";
      context.beginPath();
      context.arc(0, 0, housingRadius * 0.88, Math.PI * 0.55, Math.PI * 1.45);
      context.lineTo(0, 0);
      context.closePath();
      context.fill();

      context.restore();
    }

    function drawEnemyAttackLights(enemyIndex, isAttackMode) {
      var enemyPhase = gameAnimTime + enemyIndex * 1.37;
      var leftSpin = enemyPhase * ENEMY_ATTACK_LIGHT_ROTATION_SPEED;
      var rightSpin = -enemyPhase * ENEMY_ATTACK_LIGHT_ROTATION_SPEED;
      var leftLit = Math.sin(leftSpin * 2) > 0;
      var rightLit = Math.sin(rightSpin * 2) > 0;
      var roofGlowAlpha = 0;

      context.fillStyle = "#180404";
      context.fillRect(-9, -13.8, 18, 2.8);

      if (!isAttackMode) {
        drawEnemyRotatingBeacon(ENEMY_ATTACK_LIGHT_LEFT_X, ENEMY_ATTACK_LIGHT_Y, 0, false, false);
        drawEnemyRotatingBeacon(ENEMY_ATTACK_LIGHT_RIGHT_X, ENEMY_ATTACK_LIGHT_Y, 0, false, false);
        return;
      }

      drawEnemyRotatingBeacon(ENEMY_ATTACK_LIGHT_LEFT_X, ENEMY_ATTACK_LIGHT_Y, leftSpin, leftLit, true);
      drawEnemyRotatingBeacon(ENEMY_ATTACK_LIGHT_RIGHT_X, ENEMY_ATTACK_LIGHT_Y, rightSpin, rightLit, true);

        context.fillStyle = "rgba(255, 50, 35, " + roofGlowAlpha + ")";
        context.fillRect(-12, -13, 24, 6);

    function drawEnemyCars() {
      var enemyIndex;
      var enemy;
      var screenPos;

      for (enemyIndex = 0; enemyIndex < enemyCars.length; enemyIndex += 1) {
        enemy = enemyCars[enemyIndex];
        screenPos = worldToScreen(enemy.x, enemy.y);
        if (screenPos.x < -80 || screenPos.x > width + 80 ||

        var drawScale = enemy.radius / ENEMY_CAR_DRAW_REFERENCE_RADIUS;

        context.save();
        context.translate(screenPos.x, screenPos.y);
        context.rotate(enemy.angle + Math.PI / 2);
        context.scale(drawScale, drawScale);
        context.filter = "saturate(" + enemySaturation + ")";
        drawVehicleWheelsCanvas(enemy.frontSteerAngle, true);
        context.shadowColor = "rgba(240, 50, 35, 0.65)";
        context.shadowBlur = 20;
        context.fillStyle = "#3a0606";
        context.beginPath();
        context.moveTo(0, -24);
        context.lineTo(17, 15);
        context.lineTo(0, 7);
        context.lineTo(-17, 15);
        context.closePath();
        context.fill();
        context.shadowBlur = 0;
        context.fillStyle = "#9c1414";
        context.fillRect(-14, -7, 28, 21);
        context.fillStyle = "#c82018";
        context.fillRect(-11, -11, 22, 8);
        context.fillStyle = "#120303";
        context.fillRect(-8, 2, 16, 8);
        context.fillStyle = "#ff3a28";
        context.beginPath();
        context.arc(-10, 17, 4, 0, Math.PI * 2);
        context.arc(10, 17, 4, 0, Math.PI * 2);
        context.fill();
        context.fillStyle = "rgba(255, 80, 60, 0.45)";

    function applyRockDamage(collision, collisionKind) {
      health -= 1;
      rockHitCooldown = ROCK_HIT_COOLDOWN;
      carSpeed = Math.max(MIN_SPEED, carSpeed - ROCK_SPEED_PENALTY);
      carShake.classList.remove("is-hit");
      void carShake.offsetWidth;
      carShake.classList.add("is-hit");
      spawnCollisionEffectsAtWorld(
        collision.closestWorldX,
        collision.closestWorldY,
        collision.normalX,
        collision.normalY,
        collisionKind
      );
      updateDamageVignette(true);

      if (health <= 0) {
        spawnDeathExplosionAtWorld(carWorldX, carWorldY, false);
        triggerGameOver();
      }
    }

    function checkCollisions() {
      var carChunkX = worldToChunk(carWorldX);
      var carChunkY = worldToChunk(carWorldY);
      var offsetX;
      var offsetY;
      var chunk;
      var rockIndex;
      var rock;
      var collision;
      var tookDamage = false;

      for (offsetY = -1; offsetY <= 1; offsetY += 1) {
        for (offsetX = -1; offsetX <= 1; offsetX += 1) {
          chunk = getChunk(carChunkX + offsetX, carChunkY + offsetY);

          for (rockIndex = 0; rockIndex < chunk.rocks.length; rockIndex += 1) {
            rock = chunk.rocks[rockIndex];
            collision = getRockCarCollision(rock);
            if (!collision) {
              continue;
            }
            resolveRockCollision(collision);
            if (!tookDamage && rockHitCooldown <= 0) {
              applyRockDamage(collision, COLLISION_KIND_ROCK);
              tookDamage = true;
            }
          }
        }
      }

      checkEnemyPlayerCollisions();
    }

    function triggerGameOver() {
      gamePhase = PHASE_GAME_OVER;
      carSpeed = 0;
      carWrap.classList.add("is-dead");
      clearKeysDown();
      hudDashboard.classList.add("hidden");
      saveHighScoreIfNeeded();
      saveBestDistanceIfNeeded();
      gameScreen.classList.remove("hidden");
      screenDistance.classList.remove("hidden");
      screenScore.classList.remove("hidden");
      screenTitle.textContent = getLocalized(LOCALE_KEY_GAME_OVER, "Game Over");
      screenDistance.textContent = formatMeters(distanceMeters);
      screenScore.textContent = String(score);
      controlHint.textContent = getGameOverHintText();
      setCrystalPreviewRowVisible(false);
      if (Math.floor(distanceMeters) >= bestDistanceMeters && distanceMeters > 0) {
        gameScreen.classList.add("is-record");
      } else {
        gameScreen.classList.remove("is-record");
      }
      updateDamageVignette(false);
      damageVignette.style.setProperty("--vignette-inner", "0%");
      damageVignette.classList.add("is-visible");

    function startGame() {
      gamePhase = PHASE_PLAYING;
      gameScreen.classList.add("hidden");
      hudDashboard.classList.remove("hidden");
      if (carSpeed < MIN_SPEED) {
        carSpeed = START_SPEED;
      }
      updateSpeedGauge();
      updateCheckEngineHud();
      focusGameInput();
      if (window.WebExtrasGameStartMusicNotify && window.WebExtrasGameStartMusicNotify.notifyGameplayStarted) {
        window.WebExtrasGameStartMusicNotify.notifyGameplayStarted();
      }
    }

    function tryStartFromInput() {
      if (isGameOver()) {
        resetGame();
        startGame();
        return;
      }
      if (isStart()) {
        startGame();
      }
    }

    function setPointerHeld(isHeld, clientX, clientY) {
      pointerHeld = isHeld;
      if (!isHeld) {
        pointerSteeringTurning = false;
      }
      if (clientX !== undefined) {
        lastPointerX = clientX;
      }
      if (clientY !== undefined) {
        lastPointerY = clientY;
      }
    }

    function onPointerDown(event) {
      event.preventDefault();
      focusGameInput();
      tryStartFromInput();
      if (isPlaying()) {
        setPointerHeld(true, event.clientX, event.clientY);
        if (gameRoot.setPointerCapture) {
          try {
            gameRoot.setPointerCapture(event.pointerId);
          } catch (captureError) {
          }
        }
      }
    }

    function onPointerMove(event) {
      lastPointerX = event.clientX;
      lastPointerY = event.clientY;
    }

    function onPointerUp(event) {
      setPointerHeld(false);
      if (gameRoot.releasePointerCapture) {
        try {
          if (gameRoot.hasPointerCapture && gameRoot.hasPointerCapture(event.pointerId)) {
            gameRoot.releasePointerCapture(event.pointerId);
          }
        } catch (releaseError) {
        }
      }
    }

      worldSeed = pickWorldSeed();

    function onMovementKeyDown(code) {
      if (isStart()) {
        tryStartFromInput();
      }
      if (!isPlaying()) {
        return;
      }
      setKeyFromCode(code, true);
    }

    function onMovementKeyUp(code) {
      if (!isPlaying()) {
        return;
      }
      setKeyFromCode(code, false);
    }

    function onKeyDown(event) {
      var code = event.code;
      if (code === "KeyW" || code === "KeyA" || code === "KeyS" || code === "KeyD") {
        event.preventDefault();
        onMovementKeyDown(code);
        return;
      }
      var key = event.key;
      if (key === "w" || key === "W") {
        event.preventDefault();
        if (isStart()) {
          tryStartFromInput();
        }
        if (isPlaying()) {
          keysDown.w = true;
        }
      } else if (key === "a" || key === "A") {
        event.preventDefault();
        if (isStart()) {
          tryStartFromInput();
        }
        if (isPlaying()) {
          keysDown.a = true;
        }
      } else if (key === "s" || key === "S") {
        event.preventDefault();
        if (isStart()) {
          tryStartFromInput();
        }
        if (isPlaying()) {
          keysDown.s = true;
        }
      } else if (key === "d" || key === "D") {
        event.preventDefault();
        if (isStart()) {
          tryStartFromInput();
        }
        if (isPlaying()) {
          keysDown.d = true;
        }
      }
    }

    function onKeyUp(event) {
      var code = event.code;
      if (code === "KeyW" || code === "KeyA" || code === "KeyS" || code === "KeyD") {
        event.preventDefault();
        onMovementKeyUp(code);
        return;
      }
      var key = event.key;
      if (key === "w" || key === "W") {
        keysDown.w = false;
      } else if (key === "a" || key === "A") {
        keysDown.a = false;
      } else if (key === "s" || key === "S") {
        keysDown.s = false;
      } else if (key === "d" || key === "D") {
        keysDown.d = false;
      }
    }

    function updatePointerSteering(deltaSeconds) {
      var carCenter;
      var targetAngle;
      var angleDiff;
      var turnRate;
      var maxTurn;

      if (!pointerHeld || !isPlaying()) {
        pointerSteeringTurning = false;
        return;
      }
      carCenter = getCarScreenCenter();
      targetAngle = Math.atan2(lastPointerY - carCenter.y, lastPointerX - carCenter.x);
      angleDiff = targetAngle - carAngle;
      while (angleDiff > Math.PI) {
        angleDiff -= Math.PI * 2;
      }
      while (angleDiff < -Math.PI) {
        angleDiff += Math.PI * 2;
      }
      pointerSteeringTurning = Math.abs(angleDiff) > POINTER_STEER_ALIGNED_ANGLE;
      carFrontSteerTarget = angleDiff * 0.58;
      turnRate = getTurnRateForSpeed(carSpeed);
      maxTurn = turnRate * deltaSeconds;
      if (angleDiff > maxTurn) {
        angleDiff = maxTurn;
      }
      if (angleDiff < -maxTurn) {
        angleDiff = -maxTurn;
      }
      carAngle += angleDiff;
    }

    function updateCar(deltaSeconds) {
      var turnAmount = 0;
      var turnRate = getTurnRateForSpeed(carSpeed);

      if (pointerHeld) {
        updatePointerSteering(deltaSeconds);
      } else {
        carFrontSteerTarget = 0;
        if (keysDown.a) {
          turnAmount -= turnRate * deltaSeconds;
          carFrontSteerTarget = -CAR_FRONT_STEER_MAX * 0.82;
        }
        if (keysDown.d) {
          turnAmount += turnRate * deltaSeconds;
          carFrontSteerTarget = CAR_FRONT_STEER_MAX * 0.82;
        }
        carAngle += turnAmount;
      }

      updateCarFrontWheelSteer(deltaSeconds);

      if (keysDown.w) {
        carSpeed += ACCEL_RATE * deltaSeconds;
      } else if (keysDown.s) {
        carSpeed -= BRAKE_RATE * deltaSeconds;
      } else if (pointerHeld && !pointerSteeringTurning) {
        carSpeed += POINTER_HOLD_CRUISE_ACCEL * deltaSeconds;
      } else {
        carSpeed -= COAST_DRAG * deltaSeconds;
      }

      if (carSpeed > MAX_SPEED) {
        carSpeed = MAX_SPEED;
      }
      if (carSpeed < MIN_SPEED) {
        carSpeed = MIN_SPEED;
      }

      carWorldX += Math.cos(carAngle) * carSpeed * deltaSeconds;
      carWorldY += Math.sin(carAngle) * carSpeed * deltaSeconds;
      updateTireTrails(carSpeed * deltaSeconds);
      distanceMeters += carSpeed * deltaSeconds * METERS_PER_UNIT;
      updateDistanceHud();

      updateCamera(deltaSeconds);
      setCarWrapTransform();
      updateSpeedGauge();
    }

    function updateCollectArcs(deltaSeconds) {
      var arcIndex;
      var arc;
      var progress;
      var carCenter;
      var radius;
      var angle;
      var wobble;

      carCenter = getCarScreenCenter();

      for (arcIndex = collectArcs.length - 1; arcIndex >= 0; arcIndex -= 1) {
        arc = collectArcs[arcIndex];
        arc.age += deltaSeconds;
        progress = arc.age / arc.duration;
        if (progress >= 1) {
          collectArcs.splice(arcIndex, 1);
          continue;
        }
        radius = Math.sin(progress * Math.PI) * arc.radiusPeak;
        wobble = Math.sin(progress * Math.PI) * arc.arcWobble;
        angle = arc.baseAngle + wobble;
        arc.x = carCenter.x + Math.cos(angle) * radius;
        arc.y = carCenter.y + Math.sin(angle) * radius;
      }
    }

    function updateCollectEffects(deltaSeconds) {
      if (collectEffectsDebounceTimer > 0) {
        collectEffectsDebounceTimer -= deltaSeconds;
        if (collectEffectsDebounceTimer < 0) {
          collectEffectsDebounceTimer = 0;
        }
      }
      var flashIndex;
      var burstIndex;
      var sparkIndex;
      var streakIndex;
      var flash;
      var burst;
      var spark;
      var streak;

      for (flashIndex = collectFlashes.length - 1; flashIndex >= 0; flashIndex -= 1) {
        flash = collectFlashes[flashIndex];
        flash.age += deltaSeconds;
        if (flash.age >= flash.duration) {
          collectFlashes.splice(flashIndex, 1);
        }
      }

      for (burstIndex = collectBursts.length - 1; burstIndex >= 0; burstIndex -= 1) {
        burst = collectBursts[burstIndex];
        burst.age += deltaSeconds;
        if (burst.age >= burst.duration) {
          collectBursts.splice(burstIndex, 1);
        }
      }

      for (sparkIndex = collectSparks.length - 1; sparkIndex >= 0; sparkIndex -= 1) {
        spark = collectSparks[sparkIndex];
        spark.age += deltaSeconds;
        spark.velX *= 0.91;
        spark.velY *= 0.91;
        spark.x += spark.velX * deltaSeconds;
        spark.y += spark.velY * deltaSeconds;
        if (spark.age >= spark.life) {
          releaseCollectSpark(collectSparks[sparkIndex]);
          collectSparks.splice(sparkIndex, 1);
        }
      }

      for (streakIndex = collectStreaks.length - 1; streakIndex >= 0; streakIndex -= 1) {
        streak = collectStreaks[streakIndex];
        streak.age += deltaSeconds;
        streak.x += streak.velX * deltaSeconds;
        streak.y += streak.velY * deltaSeconds;
        if (streak.age >= streak.life) {
          releaseCollectStreak(collectStreaks[streakIndex]);
          collectStreaks.splice(streakIndex, 1);
        }
      }
    }

    function updateParticles(deltaSeconds) {
      updateCollectArcs(deltaSeconds);
      updateCollectEffects(deltaSeconds);
      var targetX = getScoreTargetX();
      var targetY = getScoreTargetY();
      var particleIndex;
      var particle;
      var toTargetX;
      var toTargetY;
      var dist;
      var timeLeft;
      var dustIndex;
      var dust;
      var impactIndex;
      var impact;

      for (particleIndex = particles.length - 1; particleIndex >= 0; particleIndex -= 1) {
        particle = particles[particleIndex];
        particle.age += deltaSeconds;
        toTargetX = targetX - particle.x;
        toTargetY = targetY - particle.y;
        dist = toTargetX * toTargetX + toTargetY * toTargetY;
        if (dist < SCORE_ARRIVE_DIST_SQ) {
          releaseScoreParticle(particles[particleIndex]);
          particles.splice(particleIndex, 1);
          continue;
        }
        timeLeft = particle.travelTime - particle.age;
        if (timeLeft < 0.04) {
          timeLeft = 0.04;
        }
        particle.velX = toTargetX / timeLeft;
        particle.velY = toTargetY / timeLeft;
        particle.x += particle.velX * deltaSeconds;
        particle.y += particle.velY * deltaSeconds;
      }

      for (dustIndex = dustParticles.length - 1; dustIndex >= 0; dustIndex -= 1) {
        dust = dustParticles[dustIndex];
        dust.life -= deltaSeconds;
        dust.velX *= 0.94;
        dust.velY *= 0.94;
        dust.worldX += dust.velX * deltaSeconds;
        dust.worldY += dust.velY * deltaSeconds;
        dust.size += 18 * deltaSeconds;
        dust.alpha -= 0.7 * deltaSeconds;
        if (dust.life <= 0 || dust.alpha <= 0) {
          releaseDustParticle(dustParticles[dustIndex]);
          dustParticles.splice(dustIndex, 1);
        }
      }

      for (impactIndex = impactParticles.length - 1; impactIndex >= 0; impactIndex -= 1) {
        impact = impactParticles[impactIndex];
        impact.life -= deltaSeconds;
        if (impact.drag !== undefined) {
          impact.velX *= impact.drag;
          impact.velY *= impact.drag;
        } else {
          impact.velX *= 0.9;
          impact.velY *= 0.9;
        }
        if (impact.kind === "death") {
          impact.velY += 120 * deltaSeconds;
        } else if (impact.kind === "collision" && impact.size > 5) {
          impact.velY += 95 * deltaSeconds;
        }
        impact.worldX += impact.velX * deltaSeconds;
        impact.worldY += impact.velY * deltaSeconds;
        if (impact.kind === "death" && impact.maxLife > 0) {
          impact.size += deltaSeconds * 6;
        } else if (impact.kind === "collision" && impact.maxLife > 0 && !impact.glow) {
          impact.size += deltaSeconds * 3.5;
        }
        if (impact.life <= 0) {
          releaseImpactParticle(impactParticles[impactIndex]);
          impactParticles.splice(impactIndex, 1);
        }
      }

      var labelIndex;
      var label;
      var targetX;
      var targetY;
      var progress;
      var oneMinusT;
      var dist;

      for (labelIndex = scoreFlyLabels.length - 1; labelIndex >= 0; labelIndex -= 1) {
        label = scoreFlyLabels[labelIndex];
        label.age += deltaSeconds;
        progress = label.age / label.flightTime;
        if (progress >= 1) {
          scoreFlyLabels.splice(labelIndex, 1);
          continue;
        }
        targetX = getScoreTargetX() + label.targetOffsetX;
        targetY = getScoreTargetY();
        oneMinusT = 1 - progress;
        label.x = oneMinusT * oneMinusT * label.originX + 2 * oneMinusT * progress * label.controlX + progress * progress * targetX;
        label.y = oneMinusT * oneMinusT * label.originY + 2 * oneMinusT * progress * label.controlY + progress * progress * targetY;
        dist = Math.sqrt((targetX - label.x) * (targetX - label.x) + (targetY - label.y) * (targetY - label.y));
        if (dist < SCORE_LABEL_ARRIVE_DIST && progress > 0.55) {
          scoreFlyLabels.splice(labelIndex, 1);
          continue;
        }
        if (progress > 0.35) {
          label.scale = label.scale * (1 - deltaSeconds * 0.22);
          if (label.scale < 0.55) {
            label.scale = 0.55;
          }
        }
        if (label.age > 3.5) {
          scoreFlyLabels.splice(labelIndex, 1);
        }
      }
    }

    function drawWorld() {
      var carChunkX = worldToChunk(carWorldX);
      var carChunkY = worldToChunk(carWorldY);
      var offsetX;
      var offsetY;
      var chunk;
      var screenX;
      var screenY;
      var screenPos;
      var chunkDrawSize;
      var keyIndex;
      var key;

      context.save();
      context.fillStyle = "#1a1410";
      context.fillRect(0, 0, width, height);

      chunkDrawSize = CHUNK_SIZE;
      for (keyIndex = 0; keyIndex < chunkKeys.length; keyIndex += 1) {
        key = chunkKeys[keyIndex];
        chunk = chunks[key];
        if (!chunk || !chunk.surfaceCanvas) {
          continue;
        }
        screenPos = worldToScreen(chunk.chunkX * CHUNK_SIZE, chunk.chunkY * CHUNK_SIZE);
        screenX = screenPos.x;
        screenY = screenPos.y;
        if (screenX + chunkDrawSize < -CHUNK_SIZE || screenX > width + CHUNK_SIZE ||
          screenY + chunkDrawSize < -CHUNK_SIZE || screenY > height + CHUNK_SIZE) {
          continue;
        }
        context.drawImage(chunk.surfaceCanvas, screenX, screenY, chunkDrawSize, chunkDrawSize);
      }

      drawTireTrails();

      for (offsetY = -CHUNK_LOAD_RADIUS; offsetY <= CHUNK_LOAD_RADIUS; offsetY += 1) {
        for (offsetX = -CHUNK_LOAD_RADIUS; offsetX <= CHUNK_LOAD_RADIUS; offsetX += 1) {
          chunk = getChunk(carChunkX + offsetX, carChunkY + offsetY);
          drawChunkEntities(chunk);
        }
      }

      drawEnemySightCones();
      drawEnemyCars();

      context.restore();
    }

    function drawChunkEntities(chunk) {
      var crystalIndex;
      var crystal;
      var screenPos;
      var rockIndex;
      var rock;

      for (rockIndex = 0; rockIndex < chunk.rocks.length; rockIndex += 1) {
        rock = chunk.rocks[rockIndex];
        screenPos = worldToScreen(rock.x, rock.y);
        var cullRadius = getRockExtentRadius(rock) + 24;
        if (screenPos.x + cullRadius < -220 || screenPos.x - cullRadius > width + 220 ||
          screenPos.y + cullRadius < -220 || screenPos.y - cullRadius > height + 220) {
          continue;
        }
        context.save();
        context.translate(screenPos.x, screenPos.y);
        context.rotate(rock.rotation);
        var shade = rock.shade;
        var bodyR = Math.floor(88 * shade);
        var bodyG = Math.floor(80 * shade);
        var bodyB = Math.floor(72 * shade);
        var edgeR = Math.floor(58 * shade);
        var edgeG = Math.floor(52 * shade);
        var edgeB = Math.floor(46 * shade);
        var pointIndex;
        var polygonPoint;
        context.fillStyle = "rgb(" + bodyR + "," + bodyG + "," + bodyB + ")";
        context.beginPath();
        for (pointIndex = 0; pointIndex < rock.polygonPoints.length; pointIndex += 1) {
          polygonPoint = rock.polygonPoints[pointIndex];
          if (pointIndex === 0) {
            context.moveTo(polygonPoint.x, polygonPoint.y);
          } else {
            context.lineTo(polygonPoint.x, polygonPoint.y);
          }
        }
        context.closePath();
        context.fill();
        context.strokeStyle = "rgba(" + edgeR + "," + edgeG + "," + edgeB + ",0.78)";
        context.lineWidth = rock.kind === "wall" ? 1.8 : 1.5;
        context.stroke();
        context.strokeStyle = "rgba(40, 36, 30, 0.38)";
        context.lineWidth = 1;
        context.beginPath();
        if (rock.kind === "wall") {
          context.moveTo(-rock.halfLength * 0.72, -rock.halfWidth * 0.2);
          context.lineTo(rock.halfLength * 0.68, rock.halfWidth * 0.28);
          context.moveTo(-rock.halfLength * 0.35, rock.halfWidth * 0.42);
          context.lineTo(rock.halfLength * 0.5, -rock.halfWidth * 0.22);
        } else {
          context.moveTo(-rock.radius * 0.45, -rock.radius * 0.15);
          context.lineTo(rock.radius * 0.35, rock.radius * 0.4);
        }
        context.stroke();
        context.restore();
      }

      for (crystalIndex = 0; crystalIndex < chunk.crystals.length; crystalIndex += 1) {
        crystal = chunk.crystals[crystalIndex];
        if (crystal.collected) {
          continue;
        }
        screenPos = worldToScreen(crystal.x, crystal.y);
        if (screenPos.x < -40 || screenPos.x > width + 40 ||
          screenPos.y < -40 || screenPos.y > height + 40) {
          continue;
        }
        var rgb = getCrystalColorRgb(crystal.rarity);
        var twinkleScale = 0.72 + Math.sin(crystal.twinkle) * 0.28;
        var sparkSize = crystal.size * twinkleScale;
        var glowAlpha = 0.12 + RARITY_GLOW[crystal.rarity] * 0.28;
        var glowRadius = sparkSize * RARITY_GLOW_RADIUS[crystal.rarity];
        var gradient = context.createRadialGradient(screenPos.x, screenPos.y, 0, screenPos.x, screenPos.y, glowRadius);
        gradient.addColorStop(0, "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + "," + glowAlpha + ")");
        gradient.addColorStop(1, "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ",0)");
        context.fillStyle = gradient;
        context.beginPath();
        context.arc(screenPos.x, screenPos.y, glowRadius, 0, Math.PI * 2);
        context.fill();
        context.fillStyle = "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")";
        context.beginPath();
        context.arc(screenPos.x, screenPos.y, sparkSize, 0, Math.PI * 2);
        context.fill();
        context.fillStyle = "rgba(255, 255, 255, " + (0.35 + twinkleScale * 0.35) + ")";
        context.beginPath();
        context.arc(screenPos.x - sparkSize * 0.25, screenPos.y - sparkSize * 0.25, sparkSize * 0.35, 0, Math.PI * 2);
        context.fill();
      }
    }

    function drawParticles() {
      var dustIndex;
      var dust;
      var impactIndex;
      var impact;
      var particleIndex;
      var particle;

      for (dustIndex = 0; dustIndex < dustParticles.length; dustIndex += 1) {
        dust = dustParticles[dustIndex];
        var dustScreen = worldToScreen(dust.worldX, dust.worldY);
        context.fillStyle = "rgba(160, 130, 95, " + dust.alpha + ")";
        context.beginPath();
        context.arc(dustScreen.x, dustScreen.y, dust.size, 0, Math.PI * 2);
        context.fill();
      }

      for (impactIndex = 0; impactIndex < impactParticles.length; impactIndex += 1) {
        impact = impactParticles[impactIndex];
        var impactScreen = worldToScreen(impact.worldX, impact.worldY);
        var impactAlpha = impact.life * 1.8;
        var streakScale;
        var streakEndScreen;
        if (impact.maxLife > 0) {
          impactAlpha = impact.life / impact.maxLife;
        }
        if (impactAlpha > 1) {
          impactAlpha = 1;
        }
        if (impactAlpha < 0) {
          impactAlpha = 0;
        }
        if (impact.red !== undefined) {
          context.fillStyle = "rgba(" + impact.red + "," + impact.green + "," + impact.blue + "," + impactAlpha + ")";
        } else {
          context.fillStyle = "rgba(200, 120, 70, " + impactAlpha + ")";
        }
        if (impact.glow) {
          context.shadowColor = "rgba(" + impact.red + "," + impact.green + "," + impact.blue + ",0.95)";
          context.shadowBlur = 14;
        }
        context.beginPath();
        context.arc(impactScreen.x, impactScreen.y, impact.size, 0, Math.PI * 2);
        context.fill();
        if (impact.glow && (impact.kind === "death" || impact.kind === "collision")) {
          context.fillStyle = "rgba(255, 245, 220, " + (impactAlpha * 0.45) + ")";
          context.beginPath();
          context.arc(impactScreen.x, impactScreen.y, impact.size * 1.65, 0, Math.PI * 2);
          context.fill();
        }
        context.shadowBlur = 0;
        if (
          (impact.kind === "death" || impact.kind === "collision") &&
          impact.maxLife > 0 &&
          impact.life / impact.maxLife > 0.28
        ) {
          streakScale = impact.life / impact.maxLife;
          streakEndScreen = worldToScreen(
            impact.worldX - impact.velX * 0.028 * streakScale,
            impact.worldY - impact.velY * 0.028 * streakScale
          );
          context.strokeStyle = "rgba(" + impact.red + "," + impact.green + "," + impact.blue + "," + (impactAlpha * 0.55) + ")";
          context.lineWidth = Math.max(1, impact.size * 0.35);
          context.beginPath();
          context.moveTo(impactScreen.x, impactScreen.y);
          context.lineTo(streakEndScreen.x, streakEndScreen.y);
          context.stroke();
        }
      }

      for (particleIndex = 0; particleIndex < particles.length; particleIndex += 1) {
        particle = particles[particleIndex];
        context.fillStyle = "rgb(" + particle.red + "," + particle.green + "," + particle.blue + ")";
        context.shadowColor = "rgba(" + particle.red + "," + particle.green + "," + particle.blue + ",0.9)";
        context.shadowBlur = 6;
        context.beginPath();
        context.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
        context.fill();
        context.shadowBlur = 0;
      }

      var flashIndex;
      var flash;
      var flashProgress;
      var flashRadius;
      var flashAlpha;
      var flashGradient;
      for (flashIndex = 0; flashIndex < collectFlashes.length; flashIndex += 1) {
        flash = collectFlashes[flashIndex];
        var flashScreenX = flash.x;
        var flashScreenY = flash.y;
        if (flash.worldX !== undefined) {
          var flashScreen = worldToScreen(flash.worldX, flash.worldY);
          flashScreenX = flashScreen.x;
          flashScreenY = flashScreen.y;
        }
        flashProgress = flash.age / flash.duration;
        if (flashProgress > 1) {
          flashProgress = 1;
        }
        flashRadius = flash.maxRadius * flashProgress;
        if (flash.isCollision) {
          flashAlpha = (1 - flashProgress) * 0.78;
        } else {
          flashAlpha = (1 - flashProgress) * 0.55;
        }
        flashGradient = context.createRadialGradient(flashScreenX, flashScreenY, 0, flashScreenX, flashScreenY, flashRadius);
        flashGradient.addColorStop(0, "rgba(255, 255, 255, " + (flashAlpha * 0.85) + ")");
        flashGradient.addColorStop(0.35, "rgba(" + flash.red + "," + flash.green + "," + flash.blue + "," + flashAlpha + ")");
        flashGradient.addColorStop(1, "rgba(" + flash.red + "," + flash.green + "," + flash.blue + ",0)");
        context.fillStyle = flashGradient;
        context.beginPath();
        context.arc(flashScreenX, flashScreenY, flashRadius, 0, Math.PI * 2);
        context.fill();
      }

      var burstIndex;
      var burst;
      var burstProgress;
      var burstRadius;
      var burstAlpha;
      for (burstIndex = 0; burstIndex < collectBursts.length; burstIndex += 1) {
        burst = collectBursts[burstIndex];
        burstProgress = burst.age / burst.duration;
        if (burstProgress > 1) {
          burstProgress = 1;
        }
        burstRadius = burst.maxRadius * burstProgress;
        burstAlpha = (1 - burstProgress) * 0.88;
        context.strokeStyle = "rgba(" + burst.red + "," + burst.green + "," + burst.blue + "," + burstAlpha + ")";
        context.lineWidth = 3.2 * (1 - burstProgress * 0.55);
        context.beginPath();
        context.arc(burst.x, burst.y, burstRadius, 0, Math.PI * 2);
        context.stroke();
      }

      var sparkIndex;
      var spark;
      var sparkLifeLeft;
      var sparkAlpha;
      for (sparkIndex = 0; sparkIndex < collectSparks.length; sparkIndex += 1) {
        spark = collectSparks[sparkIndex];
        sparkLifeLeft = 1 - spark.age / spark.life;
        if (sparkLifeLeft < 0) {
          sparkLifeLeft = 0;
        }
        sparkAlpha = sparkLifeLeft * 0.95;
        context.fillStyle = "rgba(" + spark.red + "," + spark.green + "," + spark.blue + "," + sparkAlpha + ")";
        context.shadowColor = "rgba(" + spark.red + "," + spark.green + "," + spark.blue + ",0.85)";
        context.shadowBlur = 8;
        context.beginPath();
        context.arc(spark.x, spark.y, spark.size * sparkLifeLeft, 0, Math.PI * 2);
        context.fill();
        context.shadowBlur = 0;
      }

      var streakIndex;
      var streak;
      var streakLifeLeft;
      var streakAlpha;
      var tailX;
      var tailY;
      for (streakIndex = 0; streakIndex < collectStreaks.length; streakIndex += 1) {
        streak = collectStreaks[streakIndex];
        streakLifeLeft = 1 - streak.age / streak.life;
        if (streakLifeLeft < 0) {
          streakLifeLeft = 0;
        }
        streakAlpha = streakLifeLeft;
        tailX = streak.x - streak.velX * 0.028;
        tailY = streak.y - streak.velY * 0.028;
        context.strokeStyle = "rgba(" + streak.red + "," + streak.green + "," + streak.blue + "," + (streakAlpha * 0.9) + ")";
        context.lineWidth = streak.size * streakLifeLeft;
        context.lineCap = "round";
        context.beginPath();
        context.moveTo(tailX, tailY);
        context.lineTo(streak.x, streak.y);
        context.stroke();
        context.fillStyle = "rgba(255, 255, 255, " + (streakAlpha * 0.7) + ")";
        context.beginPath();
        context.arc(streak.x, streak.y, streak.size * 0.55, 0, Math.PI * 2);
        context.fill();
      }

      var arcIndex;
      var arc;
      for (arcIndex = 0; arcIndex < collectArcs.length; arcIndex += 1) {
        arc = collectArcs[arcIndex];
        if (arc.x === undefined) {
          continue;
        }
        var arcGlow = arc.size * 2.8;
        var arcGradient = context.createRadialGradient(arc.x, arc.y, 0, arc.x, arc.y, arcGlow);
        arcGradient.addColorStop(0, "rgba(" + arc.red + "," + arc.green + "," + arc.blue + ",0.75)");
        arcGradient.addColorStop(1, "rgba(" + arc.red + "," + arc.green + "," + arc.blue + ",0)");
        context.fillStyle = arcGradient;
        context.beginPath();
        context.arc(arc.x, arc.y, arcGlow, 0, Math.PI * 2);
        context.fill();
        context.fillStyle = "rgb(" + arc.red + "," + arc.green + "," + arc.blue + ")";
        context.beginPath();
        context.arc(arc.x, arc.y, arc.size, 0, Math.PI * 2);
        context.fill();
        context.fillStyle = "rgba(255, 255, 255, 0.7)";
        context.beginPath();
        context.arc(arc.x - arc.size * 0.2, arc.y - arc.size * 0.2, arc.size * 0.35, 0, Math.PI * 2);
        context.fill();
      }

      var labelIndex;
      var label;
      var drawAlpha;
      var drawScale;
      var progress;
      for (labelIndex = 0; labelIndex < scoreFlyLabels.length; labelIndex += 1) {
        label = scoreFlyLabels[labelIndex];
        progress = label.age / label.flightTime;
        if (progress > 1) {
          progress = 1;
        }
        if (progress < SCORE_LABEL_FADE_END_PROGRESS) {
          drawAlpha = SCORE_LABEL_START_ALPHA + (1 - SCORE_LABEL_START_ALPHA) * (progress / SCORE_LABEL_FADE_END_PROGRESS);
        } else {
          drawAlpha = 1;
        }
        drawScale = label.scale;
        if (progress < 0.22) {
          drawScale = label.scale * (1 + (1 - progress / 0.22) * 0.35);
        }
        context.save();
        context.translate(label.x, label.y);
        context.scale(drawScale, drawScale);
        context.font = "bold " + label.fontSize + "px Courier New, monospace";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillStyle = "rgba(0, 0, 0, " + (drawAlpha * 0.6) + ")";
        context.fillText(label.text, 1, 2);
        context.fillStyle = "rgba(" + label.red + "," + label.green + "," + label.blue + "," + drawAlpha + ")";
        context.fillText(label.text, 0, 0);
        context.fillStyle = "rgba(255, 255, 255, " + (drawAlpha * 0.45) + ")";
        context.fillText(label.text, -1, -1);
        context.restore();
      }
    }

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      devicePixelRatioScale = window.devicePixelRatio || 1;
      canvas.width = Math.floor(width * devicePixelRatioScale);
      canvas.height = Math.floor(height * devicePixelRatioScale);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      context.setTransform(devicePixelRatioScale, 0, 0, devicePixelRatioScale, 0, 0);
    }

    function hasActiveParticles() {
      return particles.length > 0 ||
        dustParticles.length > 0 ||
        impactParticles.length > 0 ||
        collectArcs.length > 0 ||
        collectFlashes.length > 0 ||
        collectBursts.length > 0 ||
        collectSparks.length > 0 ||
        collectStreaks.length > 0 ||
        scoreFlyLabels.length > 0;
    }

    function update(deltaSeconds) {
      gameAnimTime += deltaSeconds;
      simulationFrameIndex += 1;
      if (isPlaying()) {
        updateCar(deltaSeconds);
        updateChunksAroundCar();
        updateCrystalAnimations(deltaSeconds);
        updateCrystalMagnet(deltaSeconds);
        updateEnemyCars(deltaSeconds);
        checkCollisions();
        spawnDustTrail(deltaSeconds);
        if (rockHitCooldown > 0) {
          rockHitCooldown -= deltaSeconds;
        }
        updateRockDeflectStreakEntity(carRockDeflectEntity, deltaSeconds);
      }
      if (isPlaying() || hasActiveParticles()) {
        updateParticles(deltaSeconds);
      }
      updateStartCrystalPreviews(deltaSeconds);
    }

    function render() {
      drawWorld();
      drawParticles();
    }

    function frame(timestamp) {
      if (!lastFrameTime) {
        lastFrameTime = timestamp;
      }
      var deltaSeconds = (timestamp - lastFrameTime) / 1000;
      if (deltaSeconds > 0.05) {
        deltaSeconds = 0.05;
      }
      lastFrameTime = timestamp;
      fpsSampleFrames += 1;
      fpsSampleTime += deltaSeconds;
      if (fpsSampleTime >= 0.35) {
        fpsValue.textContent = String(Math.round(fpsSampleFrames / fpsSampleTime));
        fpsSampleFrames = 0;
        fpsSampleTime = 0;
      }
      update(deltaSeconds);
      render();
      window.requestAnimationFrame(frame);
    }

    function init() {
      resizeCanvas();
      buildSpeedGaugeTicks();
      loadHighScore();
      loadBestDistance();
      applyGameLocale();
      bindLocaleListener();
      buildCrystalPreviewRow();
      resetGame();
      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("blur", clearKeysDown);
      document.addEventListener("keydown", onKeyDown, true);
      document.addEventListener("keyup", onKeyUp, true);
      window.addEventListener("keydown", onKeyDown);
      window.addEventListener("keyup", onKeyUp);
      canvas.addEventListener("pointerdown", onPointerDown);
      canvas.addEventListener("pointermove", onPointerMove);
      canvas.addEventListener("pointerup", onPointerUp);
      canvas.addEventListener("pointercancel", onPointerUp);
      gameScreen.addEventListener("pointerdown", onPointerDown);
      gameRoot.addEventListener("pointerdown", onPointerDown);
      gameRoot.addEventListener("pointermove", onPointerMove);
      gameRoot.addEventListener("pointerup", onPointerUp);
      gameRoot.addEventListener("pointercancel", onPointerUp);
      window.addEventListener("pointerup", onPointerUp);
      window.addEventListener("pointercancel", onPointerUp);
      window.requestAnimationFrame(frame);
    }

    init();
  </script>
</body>

</html>
