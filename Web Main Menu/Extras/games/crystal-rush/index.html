<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crystal Rush</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #1a1410;
      color: #e8dcc8;
      font-family: "Courier New", Courier, monospace;
      cursor: url("../../../cursor-pointer.svg") 2.1 0, pointer;
    }

    #gameRoot {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #gameRoot:focus {
      outline: none;
    }

    #gameCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #damageVignette {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 50% 50%, transparent var(--vignette-inner, 62%), rgba(40, 8, 4, 0.92) 100%);
      transition: opacity 0.35s ease, --vignette-inner 0.45s ease;
    }

    #damageVignette.is-visible {
      opacity: 1;
    }

    #damageVignette.is-flash {
      animation: damage-vignette-flash 0.38s ease-out forwards;
    }

    @keyframes damage-vignette-flash {
      0% {
        opacity: 1;
        filter: brightness(1.6);
      }

      100% {
        opacity: var(--vignette-opacity, 0.75);
        filter: brightness(1);
      }
    }

    #carWrap {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 56px;
      height: 72px;
      margin-left: -28px;
      margin-top: -36px;
      pointer-events: none;
      z-index: 4;
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.55));
    }

    #carShake {
      width: 100%;
      height: 100%;
    }

    #carShake.is-hit {
      animation: car-hit-shake 0.32s ease-out;
    }

    #carWrap.is-collect #carShake {
      animation: car-collect-pulse 0.42s ease-out;
    }

    @keyframes car-collect-pulse {
      0% {
        transform: scale(1);
        filter: brightness(1);
      }

      28% {
        transform: scale(1.07);
        filter: brightness(1.55) drop-shadow(0 0 16px var(--collect-glow, rgba(160, 230, 255, 0.9)));
      }

      100% {
        transform: scale(1);
        filter: brightness(1);
      }
    }

    @keyframes car-hit-shake {
      0% {
        transform: translate(0, 0);
        filter: brightness(1.8) drop-shadow(0 0 12px rgba(255, 80, 40, 0.8));
      }

      35% {
        transform: translate(-4px, 3px);
      }

      70% {
        transform: translate(3px, -2px);
      }

      100% {
        transform: translate(0, 0);
      }
    }

    #carSvg {
      width: 100%;
      height: 100%;
    }

    #hudScore {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      pointer-events: none;
      text-align: center;
    }

    #hudDistance {
      position: absolute;
      top: 12px;
      left: 14px;
      z-index: 6;
      pointer-events: none;
      text-align: left;
    }

    #distanceValue {
      font-size: 1.55rem;
      font-weight: bold;
      letter-spacing: 0.1em;
      color: #e8dcc8;
      text-shadow: 0 0 10px rgba(200, 170, 120, 0.45), 0 2px 6px rgba(0, 0, 0, 0.85);
    }

    #distanceLabel {
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(200, 180, 150, 0.55);
      margin-top: 2px;
    }

    #scoreValue {
      font-size: 1.55rem;
      font-weight: bold;
      letter-spacing: 0.12em;
      color: #c8f0ff;
      text-shadow: 0 0 12px rgba(120, 200, 255, 0.55), 0 2px 6px rgba(0, 0, 0, 0.85);
      transition: transform 0.14s ease-out;
    }

    #scoreValue.is-pop {
      transform: scale(1.14);
      color: #e8ffff;
    }

    #scoreLabel {
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(180, 210, 220, 0.55);
      margin-top: 2px;
    }

    #hudBest {
      position: absolute;
      top: 12px;
      right: 14px;
      z-index: 6;
      pointer-events: none;
      text-align: right;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: rgba(180, 170, 150, 0.6);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
    }

    #bestValue {
      display: block;
      font-size: 1rem;
      font-weight: bold;
      color: #fff4d8;
    }

    #gameScreen {
      position: absolute;
      inset: 0;
      z-index: 7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      pointer-events: auto;
      cursor: url("../../../cursor-pointer.svg") 2.1 0, pointer;
      background: rgba(12, 8, 6, 0.42);
    }

    #gameScreen.hidden {
      display: none;
    }

    #screenTitle {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #e8dcc8;
      text-shadow: 0 0 16px rgba(200, 180, 140, 0.45);
    }

    #screenScore {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.14em;
      color: #c8b898;
    }

    #screenScore.hidden,
    #screenDistance.hidden {
      display: none;
    }

    #controlHint {
      margin: 0.4rem 0 0;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      color: rgba(200, 180, 150, 0.65);
      animation: hint-pulse 1.6s ease-in-out infinite;
    }

    @keyframes hint-pulse {

      0%,
      100% {
        opacity: 0.45;
      }

      50% {
        opacity: 1;
      }
    }

    #gameScreen.is-record #screenTitle {
      color: #ffe8a8;
      animation: record-glow 0.8s ease-in-out infinite alternate;
    }

    #hudSpeed {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      z-index: 6;
      pointer-events: none;
      width: min(300px, 72vw);
    }

    #speedGaugeLabels {
      display: flex;
      justify-content: space-between;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(180, 170, 150, 0.55);
      margin-bottom: 4px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
    }

    #speedGaugeTrack {
      height: 5px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 3px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.45);
    }

    #speedGaugeFill {
      height: 100%;
      width: 0%;
      border-radius: 3px;
      background: linear-gradient(90deg, #88a8c8, #c8e8ff, #ffaa66);
      transition: width 0.06s linear;
    }

    #hudSpeed.hidden {
      display: none;
    }

    #fpsHud {
      position: absolute;
      right: 12px;
      bottom: 14px;
      top: auto;
      left: auto;
      z-index: 6;
      pointer-events: none;
      font-size: 11px;
      color: rgba(180, 170, 150, 0.55);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
    }
  </style>
</head>

<body>
  <div id="gameRoot" tabindex="0">
    <canvas id="gameCanvas" aria-hidden="true"></canvas>
    <div id="damageVignette" aria-hidden="true"></div>
    <div id="carWrap" aria-hidden="true">
      <div id="carShake">
        <svg id="carSvg" viewBox="0 0 56 72" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#8a9098" />

              <stop offset="100%" stop-color="#687078" />

              <stop offset="0%" stop-color="#e8f4ff" />

            </linearGradient>
          </defs>
          <ellipse cx="28" cy="58" rx="20" ry="8" fill="rgba(0,0,0,0.22)" />
          <rect x="10" y="14" width="36" height="46" rx="8" fill="url(#carBodyGrad)" stroke="#3a4048"
            stroke-width="1.4" />
          <rect x="14" y="18" width="28" height="18" rx="4" fill="url(#carAccentGrad)" opacity="0.85" stroke="#506878"
            stroke-width="1" />
          <rect x="12" y="38" width="10" height="18" rx="3" fill="#505860" stroke="#2a3038" stroke-width="1" />
          <rect x="34" y="38" width="10" height="18" rx="3" fill="#505860" stroke="#2a3038" stroke-width="1" />
          <rect x="22" y="6" width="12" height="10" rx="3" fill="#687078" stroke="#3a4048" stroke-width="1" />
          <circle cx="28" cy="11" r="2.5" fill="#a8e8ff" opacity="0.9" />
          <path d="M18 52 L14 66 M38 52 L42 66" stroke="#2a3038" stroke-width="3" stroke-linecap="round" />
          <path d="M20 52 L16 64 M36 52 L40 64" stroke="#687078" stroke-width="2" stroke-linecap="round" />
          <line x1="28" y1="72" x2="28" y2="62" stroke="#ff8844" stroke-width="2" stroke-linecap="round"
            opacity="0.7" />
        </svg>
      </div>
    </div>
    <div id="hudDistance">
      <div id="distanceValue">0m</div>
      <div id="distanceLabel">distance</div>
    </div>
    <div id="hudScore">
      <div id="scoreValue">0</div>
      <div id="scoreLabel">score</div>
    </div>
    <div id="hudBest">best<span id="bestValue">0</span></div>
    <div id="hudSpeed" class="hidden">
      <div id="speedGaugeLabels">
        <span id="speedMinLabel">min</span>
        <span id="speedMaxLabel">max</span>
      </div>
      <div id="speedGaugeTrack">
        <div id="speedGaugeFill"></div>
      </div>
    </div>
    <div id="fpsHud">fps <span id="fpsValue">--</span></div>
    <div id="gameScreen">
      <h1 id="screenTitle">Crystal Rush</h1>
      <p id="screenDistance" class="hidden">0m</p>
      <p id="screenScore" class="hidden">0</p>
      <p id="controlHint">click and hold or WASD</p>
    </div>
  </div>
  <script>
    var HIGH_SCORE_STORAGE_KEY = "cm-crystal-rush-high-score";
    var DISTANCE_BEST_STORAGE_KEY = "cm-crystal-rush-best-distance";
    var LOCALE_KEY_START = "web.game.crystal-rush.start";
    var LOCALE_KEY_GAME_OVER = "web.game.crystal-rush.game-over";
    var LOCALE_KEY_BEST_LABEL = "web.game.best-label";
    var LOCALE_KEY_SCORE_LABEL = "web.game.score-label";
    var LOCALE_KEY_START_HINT = "web.game.crystal-rush.start-hint";
    var LOCALE_KEY_GAME_OVER_HINT = "web.game.crystal-rush.game-over-hint";
    var LOCALE_KEY_METERS_SUFFIX = "web.game.meters-suffix";
    var LOCALE_KEY_DISTANCE_LABEL = "web.game.crystal-rush.distance-label";
    var METERS_PER_UNIT = 0.08;

    var PHASE_START = "start";
    var PHASE_PLAYING = "playing";
    var PHASE_GAME_OVER = "gameover";

    var CHUNK_SIZE = 512;
    var CHUNK_LOAD_RADIUS = 2;
    var CHUNK_UNLOAD_RADIUS = 4;
    var WORLD_REBASE_THRESHOLD = 80000;
    var WORLD_REBASE_TARGET = 0;
    var DUST_PARTICLE_MAX = 140;
    var IMPACT_PARTICLE_MAX = 48;
    var SCORE_PARTICLE_MAX = 64;
    var COLLECT_SPARK_MAX = 80;
    var COLLECT_STREAK_MAX = 56;
    var CAR_RADIUS = 15;
    var CRYSTAL_PICKUP_RADIUS = 10;
    var CRYSTAL_MAGNET_RADIUS = 34;
    var ROCK_RADIUS = 24;
    var ENTITY_MIN_DIST = 130;
    var ROCK_BOULDER_MIN_DIST = 72;
    var ROCK_WALL_HALF_LENGTH_START_MIN = 78;
    var ROCK_WALL_HALF_LENGTH_START_RANGE = 102;
    var ROCK_WALL_HALF_WIDTH_START_MIN = 14;
    var ROCK_WALL_HALF_WIDTH_START_RANGE = 16;
    var ROCK_WALL_HALF_LENGTH_CHAIN_MIN = 64;
    var ROCK_WALL_HALF_LENGTH_CHAIN_RANGE = 96;
    var ROCK_WALL_HALF_WIDTH_CHAIN_MIN = 12;
    var ROCK_WALL_HALF_WIDTH_CHAIN_RANGE = 14;
    var CHUNK_ROCK_DENSITY_MIN = 0.4;
    var CHUNK_ROCK_DENSITY_MAX = 1.85;
    var BOULDER_PER_CHUNK_MIN = 0;
    var BOULDER_PER_CHUNK_MAX = 8;
    var WALL_CHAIN_PER_CHUNK_MIN = 0;
    var WALL_CHAIN_PER_CHUNK_MAX = 4;
    var WALL_BRANCH_CHANCE_MIN = 0.62;
    var WALL_BRANCH_CHANCE_MAX = 0.92;
    var WALL_SEGMENT_COUNT_MIN = 1;
    var WALL_SEGMENT_COUNT_MAX = 6;
    var ROCK_PUSH_EXTRA = 14;
    var ROCK_DEFLECT_STRENGTH = 0.72;
    var TIRE_TRACK_LATERAL_OFFSET = 13;
    var TIRE_TRACK_REAR_OFFSET = 20;
    var TIRE_TRACK_STEP_DISTANCE = 7;
    var TIRE_TRACK_MAX_PATH_LENGTH = 520;
    var TIRE_TRACK_MIN_SPEED = 28;
    var TIRE_TRACK_LINE_WIDTH = 2.5;

    var RARITY_COLORS = [
      [48, 198, 82],
      [72, 140, 255],
      [180, 90, 255],
      [255, 160, 64],
      [255, 72, 72]
    ];
    var RARITY_SCORE = [1, 3, 6, 12, 25];
    var RARITY_GLOW = [0.35, 0.5, 0.7, 0.9, 1.15];
    var RARITY_SIZE = [0.7, 1.0, 1.35, 1.75, 2.25];
    var RARITY_GLOW_RADIUS = [2.0, 2.7, 3.5, 4.4, 5.5];
    var RARITY_WEIGHTS = [0.42, 0.28, 0.17, 0.09, 0.04];
    var CRYSTAL_RARITY_COUNT = 5;
    var COLLECT_ARC_DURATION = 0.42;
    var COLLECT_ARC_RADIUS = 52;
    var COLLECT_FLASH_DURATION = 0.38;
    var COLLECT_EFFECTS_DEBOUNCE = 0.2;
    var COLLECT_RING_DURATION = 0.48;
    var COLLECT_BURST_COUNT = 2;
    var COLLECT_SPARK_COUNT_BASE = 10;
    var COLLECT_STREAK_COUNT_BASE = 6;
    var SCORE_LABEL_FADE_END_PROGRESS = 0.3;
    var SCORE_LABEL_START_ALPHA = 0.07;

    var MAX_SPEED = 440;
    var MIN_SPEED = 58;
    var START_SPEED = 140;
    var ACCEL_RATE = 300;
    var BRAKE_RATE = 360;
    var COAST_DRAG = 18;
    var POINTER_HOLD_CRUISE_ACCEL = 43;
    var POINTER_STEER_ALIGNED_ANGLE = 0.11;
    var TURN_RATE_AT_MIN_CAR_SPEED = 3.2;
    var TURN_RATE_SPEED_DROP = 1.6;
    var TURN_RATE_AT_MAX_CAR_SPEED = TURN_RATE_AT_MIN_CAR_SPEED - TURN_RATE_SPEED_DROP;
    var ROCK_SPEED_PENALTY = 95;
    var ROCK_HIT_COOLDOWN = 0.55;

    var MAX_HEALTH = 5;
    var HEALTH_REGEN_DELAY = 3.5;
    var HEALTH_REGEN_RATE = 0.55;
    var SCORE_ARRIVE_DIST = 14;
    var SCORE_LABEL_ARRIVE_DIST = 18;
    var SCORE_LABEL_RISE_MIN = 36;
    var SCORE_LABEL_RISE_RANGE = 32;
    var SCORE_LABEL_SPREAD_MIN = 26;
    var SCORE_LABEL_SPREAD_RANGE = 38;
    var SCORE_LABEL_FLIGHT_MIN = 0.72;
    var SCORE_LABEL_FLIGHT_RANGE = 0.26;

    var canvas = document.getElementById("gameCanvas");
    var context = canvas.getContext("2d");
    var gameRoot = document.getElementById("gameRoot");
    var damageVignette = document.getElementById("damageVignette");
    var carWrap = document.getElementById("carWrap");
    var carShake = document.getElementById("carShake");
    var scoreValue = document.getElementById("scoreValue");
    var scoreLabel = document.getElementById("scoreLabel");
    var distanceValue = document.getElementById("distanceValue");
    var distanceLabel = document.getElementById("distanceLabel");
    var hudBest = document.getElementById("hudBest");
    var bestValue = document.getElementById("bestValue");
    var hudSpeed = document.getElementById("hudSpeed");
    var speedGaugeFill = document.getElementById("speedGaugeFill");
    var speedMinLabel = document.getElementById("speedMinLabel");
    var speedMaxLabel = document.getElementById("speedMaxLabel");
    var gameScreen = document.getElementById("gameScreen");
    var screenTitle = document.getElementById("screenTitle");
    var screenDistance = document.getElementById("screenDistance");
    var screenScore = document.getElementById("screenScore");
    var controlHint = document.getElementById("controlHint");
    var fpsValue = document.getElementById("fpsValue");

    var width = 0;
    var height = 0;
    var devicePixelRatioScale = 1;

    var gamePhase = PHASE_START;
    var keysDown = { w: false, a: false, s: false, d: false };
    var pointerHeld = false;
    var pointerSteeringTurning = false;
    var lastPointerX = 0;
    var lastPointerY = 0;

    var carWorldX = 0;
    var carWorldY = 0;
    var carAngle = -Math.PI / 2;
    var carSpeed = 0;

    var health = MAX_HEALTH;
    var healthRegenTimer = 0;
    var rockHitCooldown = 0;

    var score = 0;
    var bestScore = 0;
    var distanceMeters = 0;
    var bestDistanceMeters = 0;

    var chunks = {};
    var chunkKeys = [];
    var particles = [];
    var dustParticles = [];
    var tireTrailLeft = [];
    var tireTrailRight = [];
    var tireTrailDistanceSinceLastPoint = 0;
    var impactParticles = [];
    var collectArcs = [];
    var collectFlashes = [];
    var collectBursts = [];
    var collectSparks = [];
    var collectStreaks = [];
    var scoreFlyLabels = [];
    var collectEffectsDebounceTimer = 0;

    var lastFrameTime = 0;
    var fpsSampleTime = 0;
    var fpsSampleFrames = 0;
    var chunkSurfaceCanvasPool = [];
    var dustParticlePool = [];
    var impactParticlePool = [];
    var scoreParticlePool = [];
    var collectSparkPool = [];
    var collectStreakPool = [];

    function isPlaying() {
      return gamePhase === PHASE_PLAYING;
    }

    function isGameOver() {
      return gamePhase === PHASE_GAME_OVER;
    }

    function isStart() {
      return gamePhase === PHASE_START;
    }

    function hashSeed(value) {
      var seed = value | 0;
      seed = ((seed << 13) ^ seed) | 0;
      seed = (seed * (seed * seed * 15731 + 789221) + 1376312589) | 0;
      return (seed & 2147483647) / 2147483647;
    }

    function chunkKey(chunkX, chunkY) {
      return chunkX + "," + chunkY;
    }

    function worldToChunk(worldValue) {
      return Math.floor(worldValue / CHUNK_SIZE);
    }

    function acquireChunkSurfaceCanvas() {
      var surfaceCanvas;
      if (chunkSurfaceCanvasPool.length > 0) {
        surfaceCanvas = chunkSurfaceCanvasPool.pop();
        if (surfaceCanvas.width !== CHUNK_SIZE || surfaceCanvas.height !== CHUNK_SIZE) {
          surfaceCanvas.width = CHUNK_SIZE;
          surfaceCanvas.height = CHUNK_SIZE;
        }
        return surfaceCanvas;
      }
      surfaceCanvas = document.createElement("canvas");
      surfaceCanvas.width = CHUNK_SIZE;
      surfaceCanvas.height = CHUNK_SIZE;
      return surfaceCanvas;
    }

    function releaseChunkSurfaceCanvas(surfaceCanvas) {
      if (surfaceCanvas) {
        chunkSurfaceCanvasPool.push(surfaceCanvas);
      }
    }

    function acquireDustParticle() {
      if (dustParticlePool.length > 0) {
        return dustParticlePool.pop();
      }
      return { x: 0, y: 0, velX: 0, velY: 0, life: 0, size: 0, alpha: 0 };
    }

    function releaseDustParticle(particle) {
      dustParticlePool.push(particle);
    }

    function acquireImpactParticle() {
      if (impactParticlePool.length > 0) {
        return impactParticlePool.pop();
      }
      return { x: 0, y: 0, velX: 0, velY: 0, life: 0, size: 0 };
    }

    function releaseImpactParticle(particle) {
      impactParticlePool.push(particle);
    }

    function acquireScoreParticle() {
      if (scoreParticlePool.length > 0) {
        return scoreParticlePool.pop();
      }
      return {
        kind: "score",
        x: 0,
        y: 0,
        velX: 0,
        velY: 0,
        age: 0,
        travelTime: 0,
        size: 0,
        red: 0,
        green: 0,
        blue: 0
      };
    }

    function releaseScoreParticle(particle) {
      scoreParticlePool.push(particle);
    }

    function acquireCollectSpark() {
      if (collectSparkPool.length > 0) {
        return collectSparkPool.pop();
      }
      return { x: 0, y: 0, velX: 0, velY: 0, age: 0, life: 0, size: 0, red: 0, green: 0, blue: 0 };
    }

    function releaseCollectSpark(spark) {
      collectSparkPool.push(spark);
    }

    function acquireCollectStreak() {
      if (collectStreakPool.length > 0) {
        return collectStreakPool.pop();
      }
      return { x: 0, y: 0, velX: 0, velY: 0, age: 0, life: 0, size: 0, red: 0, green: 0, blue: 0 };
    }

    function releaseCollectStreak(streak) {
      collectStreakPool.push(streak);
    }

    function releaseAllDustParticles() {
      var dustIndex;
      for (dustIndex = 0; dustIndex < dustParticles.length; dustIndex += 1) {
        releaseDustParticle(dustParticles[dustIndex]);
      }
      dustParticles.length = 0;
    }

    function releaseAllImpactParticles() {
      var impactIndex;
      for (impactIndex = 0; impactIndex < impactParticles.length; impactIndex += 1) {
        releaseImpactParticle(impactParticles[impactIndex]);
      }
      impactParticles.length = 0;
    }

    function releaseAllScoreParticles() {
      var particleIndex;
      for (particleIndex = 0; particleIndex < particles.length; particleIndex += 1) {
        releaseScoreParticle(particles[particleIndex]);
      }
      particles.length = 0;
    }

    function releaseAllCollectSparks() {
      var sparkIndex;
      for (sparkIndex = 0; sparkIndex < collectSparks.length; sparkIndex += 1) {
        releaseCollectSpark(collectSparks[sparkIndex]);
      }
      collectSparks.length = 0;
    }

    function releaseAllCollectStreaks() {
      var streakIndex;
      for (streakIndex = 0; streakIndex < collectStreaks.length; streakIndex += 1) {
        releaseCollectStreak(collectStreaks[streakIndex]);
      }
      collectStreaks.length = 0;
    }

    function releaseChunkResources(chunk) {
      if (!chunk) {
        return;
      }
      chunk.rocks.length = 0;
      chunk.crystals.length = 0;
      if (chunk.surfaceCanvas) {
        releaseChunkSurfaceCanvas(chunk.surfaceCanvas);
        chunk.surfaceCanvas = null;
      }
    }

    function rebaseWorldCoordinates() {
      if (Math.abs(carWorldX) < WORLD_REBASE_THRESHOLD && Math.abs(carWorldY) < WORLD_REBASE_THRESHOLD) {
        return;
      }
      var shiftX = carWorldX - WORLD_REBASE_TARGET;
      var shiftY = carWorldY - WORLD_REBASE_TARGET;
      var keyIndex;
      var key;
      var chunk;
      var rocksToRedistribute = [];
      var crystalsToRedistribute = [];
      var rockIndex;
      var crystalIndex;
      var rock;
      var crystal;
      var trailIndex;
      var targetChunkX;
      var targetChunkY;

      carWorldX = WORLD_REBASE_TARGET;
      carWorldY = WORLD_REBASE_TARGET;

      for (keyIndex = 0; keyIndex < chunkKeys.length; keyIndex += 1) {
        key = chunkKeys[keyIndex];
        chunk = chunks[key];
        if (!chunk) {
          continue;
        }
        for (rockIndex = 0; rockIndex < chunk.rocks.length; rockIndex += 1) {
          rocksToRedistribute.push(chunk.rocks[rockIndex]);
        }
        for (crystalIndex = 0; crystalIndex < chunk.crystals.length; crystalIndex += 1) {
          crystalsToRedistribute.push(chunk.crystals[crystalIndex]);
        }
        chunk.rocks.length = 0;
        chunk.crystals.length = 0;
      }

      for (rockIndex = 0; rockIndex < rocksToRedistribute.length; rockIndex += 1) {
        rock = rocksToRedistribute[rockIndex];
        rock.x -= shiftX;
        rock.y -= shiftY;
        targetChunkX = worldToChunk(rock.x);
        targetChunkY = worldToChunk(rock.y);
        chunk = getChunk(targetChunkX, targetChunkY);
        chunk.rocks.push(rock);
      }

      for (crystalIndex = 0; crystalIndex < crystalsToRedistribute.length; crystalIndex += 1) {
        crystal = crystalsToRedistribute[crystalIndex];
        crystal.x -= shiftX;
        crystal.y -= shiftY;
        targetChunkX = worldToChunk(crystal.x);
        targetChunkY = worldToChunk(crystal.y);
        chunk = getChunk(targetChunkX, targetChunkY);
        chunk.crystals.push(crystal);
      }

      for (trailIndex = 0; trailIndex < tireTrailLeft.length; trailIndex += 1) {
        tireTrailLeft[trailIndex].x -= shiftX;
        tireTrailLeft[trailIndex].y -= shiftY;
      }
      for (trailIndex = 0; trailIndex < tireTrailRight.length; trailIndex += 1) {
        tireTrailRight[trailIndex].x -= shiftX;
        tireTrailRight[trailIndex].y -= shiftY;
      }
    }

    function createChunkRandom(chunkX, chunkY) {
      var state = (chunkX * 73856093) ^ (chunkY * 19349663) ^ 83492791;
      return function () {
        state = (state * 1664525 + 1013904223) | 0;
        return (state >>> 0) / 4294967296;
      };
    }

    function isFarEnoughFromEntities(entities, x, y, minDist) {
      var index;
      var entity;
      var deltaX;
      var deltaY;
      var distSq;
      var minDistSq = minDist * minDist;
      for (index = 0; index < entities.length; index += 1) {
        entity = entities[index];
        deltaX = entity.x - x;
        deltaY = entity.y - y;
        distSq = deltaX * deltaX + deltaY * deltaY;
        if (distSq < minDistSq) {
          return false;
        }
      }
      return true;
    }

    function pickCrystalRarity(random) {
      var roll = random();
      var rarityIndex;
      var accumulated = 0;
      for (rarityIndex = 0; rarityIndex < CRYSTAL_RARITY_COUNT; rarityIndex += 1) {
        accumulated += RARITY_WEIGHTS[rarityIndex];
        if (roll <= accumulated) {
          return rarityIndex;
        }
      }
      return 0;
    }

    function pickSecondCrystalRarity(random, firstRarity) {
      var secondRarity = pickCrystalRarity(random);
      var attemptIndex;
      for (attemptIndex = 0; attemptIndex < 10; attemptIndex += 1) {
        if (secondRarity !== firstRarity) {
          return secondRarity;
        }
        secondRarity = pickCrystalRarity(random);
      }
      return (firstRarity + 1 + Math.floor(random() * (CRYSTAL_RARITY_COUNT - 1))) % CRYSTAL_RARITY_COUNT;
    }

    function getCrystalSparkSize(rarity, random) {
      return (0.85 + random() * 0.75) * RARITY_SIZE[rarity];
    }

    function getRockExtentRadius(rock) {
      if (rock.kind === "boulder") {
        return rock.radius;
      }
      return Math.sqrt(rock.halfLength * rock.halfLength + rock.halfWidth * rock.halfWidth);
    }

    function isFarEnoughFromRocks(rocks, x, y, minDist) {
      var rockIndex;
      var rock;
      var deltaX;
      var deltaY;
      var dist;
      var neededDist;
      for (rockIndex = 0; rockIndex < rocks.length; rockIndex += 1) {
        rock = rocks[rockIndex];
        deltaX = rock.x - x;
        deltaY = rock.y - y;
        dist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
        neededDist = minDist + getRockExtentRadius(rock);
        if (dist < neededDist) {
          return false;
        }
      }
      return true;
    }

    function buildBoulderPolygon(radius, random) {
      var points = [];
      var vertexCount = 5 + Math.floor(random() * 3);
      var vertexIndex;
      var angle;
      var distance;
      for (vertexIndex = 0; vertexIndex < vertexCount; vertexIndex += 1) {
        angle = vertexIndex / vertexCount * Math.PI * 2 + (random() - 0.5) * 0.55;
        distance = radius * (0.68 + random() * 0.42);
        points.push({
          x: Math.cos(angle) * distance,
          y: Math.sin(angle) * distance
        });
      }
      return points;
    }

    function buildWallCapsulePolygon(halfLength, halfWidth, random) {
      var points = [];
      var halfLen = halfLength;
      var halfWid = halfWidth;
      var straightLen = halfLen * 2 - halfWid * 2;
      var topCount = 7 + Math.floor(random() * 5);
      var bottomCount = 7 + Math.floor(random() * 5);
      var capCount = 5;
      var index;
      var t;
      var x;
      var y;
      var angle;
      var jitterX;
      var jitterY;

      if (straightLen < 4) {
        straightLen = 4;
      }

      for (index = 0; index <= topCount; index += 1) {
        t = index / topCount;
        x = -halfLen + halfWid + straightLen * t;
        jitterY = (random() - 0.5) * halfWid * 0.7;
        points.push({ x: x, y: -halfWid + jitterY });
      }
      for (index = 1; index <= capCount; index += 1) {
        t = index / capCount;
        angle = -Math.PI / 2 + Math.PI * t;
        jitterX = (random() - 0.5) * halfWid * 0.45;
        jitterY = (random() - 0.5) * halfWid * 0.45;
        points.push({
          x: halfLen - halfWid + Math.cos(angle) * halfWid + jitterX,
          y: Math.sin(angle) * halfWid + jitterY
        });
      }
      for (index = bottomCount; index >= 0; index -= 1) {
        t = index / bottomCount;
        x = -halfLen + halfWid + straightLen * t;
        jitterY = (random() - 0.5) * halfWid * 0.7;
        points.push({ x: x, y: halfWid + jitterY });
      }
      for (index = capCount - 1; index >= 1; index -= 1) {
        t = index / capCount;
        angle = Math.PI / 2 + Math.PI * t;
        jitterX = (random() - 0.5) * halfWid * 0.45;
        jitterY = (random() - 0.5) * halfWid * 0.45;
        points.push({
          x: -halfLen + halfWid + Math.cos(angle) * halfWid + jitterX,
          y: Math.sin(angle) * halfWid + jitterY
        });
      }
      return points;
    }

    function createBoulderRock(worldX, worldY, random) {
      var radius = 16 + random() * 14;
      var rotation = random() * Math.PI * 2;
      var shade = 0.55 + random() * 0.35;
      return {
        kind: "boulder",
        x: worldX,
        y: worldY,
        radius: radius,
        rotation: rotation,
        shade: shade,
        polygonPoints: buildBoulderPolygon(radius, random)
      };
    }

    function buildChunkBoulders(random, chunkX, chunkY, rocks, entities, margin, boulderCount) {
      var boulders = [];
      var attemptIndex;
      var localX;
      var localY;
      var worldX;
      var worldY;

      for (attemptIndex = 0; attemptIndex < boulderCount * 10; attemptIndex += 1) {
        if (boulders.length >= boulderCount) {
          break;
        }
        localX = margin + random() * (CHUNK_SIZE - margin * 2);
        localY = margin + random() * (CHUNK_SIZE - margin * 2);
        worldX = chunkX * CHUNK_SIZE + localX;
        worldY = chunkY * CHUNK_SIZE + localY;
        if (!isFarEnoughFromEntities(entities, worldX, worldY, ROCK_BOULDER_MIN_DIST)) {
          continue;
        }
        if (!isFarEnoughFromRocks(rocks, worldX, worldY, ROCK_BOULDER_MIN_DIST * 0.45)) {
          continue;
        }
        if (!isFarEnoughFromRocks(boulders, worldX, worldY, ROCK_BOULDER_MIN_DIST * 0.55)) {
          continue;
        }
        boulders.push(createBoulderRock(worldX, worldY, random));
        entities.push({ x: worldX, y: worldY });
      }

      return boulders;
    }

    function getRockEndWorldPosition(rock, endSign) {
      return {
        x: rock.x + Math.cos(rock.rotation) * rock.halfLength * endSign,
        y: rock.y + Math.sin(rock.rotation) * rock.halfLength * endSign
      };
    }

    function createRockWallSegment(worldX, worldY, rotation, halfLength, halfWidth, shade, random) {
      return {
        kind: "wall",
        x: worldX,
        y: worldY,
        rotation: rotation,
        halfLength: halfLength,
        halfWidth: halfWidth,
        shade: shade,
        polygonPoints: buildWallCapsulePolygon(halfLength, halfWidth, random)
      };
    }

    function isRockWallInsideChunk(worldX, worldY, chunkX, chunkY, margin) {
      var minX = chunkX * CHUNK_SIZE + margin;
      var minY = chunkY * CHUNK_SIZE + margin;
      var maxX = (chunkX + 1) * CHUNK_SIZE - margin;
      var maxY = (chunkY + 1) * CHUNK_SIZE - margin;
      return worldX >= minX && worldX <= maxX && worldY >= minY && worldY <= maxY;
    }

    function getChunkRockDensity(random) {
      return CHUNK_ROCK_DENSITY_MIN + random() * (CHUNK_ROCK_DENSITY_MAX - CHUNK_ROCK_DENSITY_MIN);
    }

    function getBoulderCountForDensity(density, random) {
      var densityNormalized = (density - CHUNK_ROCK_DENSITY_MIN) / (CHUNK_ROCK_DENSITY_MAX - CHUNK_ROCK_DENSITY_MIN);
      var count = Math.floor(BOULDER_PER_CHUNK_MIN + densityNormalized * (BOULDER_PER_CHUNK_MAX - BOULDER_PER_CHUNK_MIN) * (0.55 + random() * 0.65));
      if (count < BOULDER_PER_CHUNK_MIN) {
        count = BOULDER_PER_CHUNK_MIN;
      }
      if (count > BOULDER_PER_CHUNK_MAX) {
        count = BOULDER_PER_CHUNK_MAX;
      }
      return count;
    }

    function getWallChainCountForDensity(density, random) {
      var densityNormalized = (density - CHUNK_ROCK_DENSITY_MIN) / (CHUNK_ROCK_DENSITY_MAX - CHUNK_ROCK_DENSITY_MIN);
      var count = Math.floor(WALL_CHAIN_PER_CHUNK_MIN + densityNormalized * (WALL_CHAIN_PER_CHUNK_MAX - WALL_CHAIN_PER_CHUNK_MIN) * (0.45 + random() * 0.75));
      if (count < WALL_CHAIN_PER_CHUNK_MIN) {
        count = WALL_CHAIN_PER_CHUNK_MIN;
      }
      if (count > WALL_CHAIN_PER_CHUNK_MAX) {
        count = WALL_CHAIN_PER_CHUNK_MAX;
      }
      return count;
    }

    function getWallBranchChanceForDensity(density, random) {
      var densityNormalized = (density - CHUNK_ROCK_DENSITY_MIN) / (CHUNK_ROCK_DENSITY_MAX - CHUNK_ROCK_DENSITY_MIN);
      var branchChance = WALL_BRANCH_CHANCE_MIN + densityNormalized * (WALL_BRANCH_CHANCE_MAX - WALL_BRANCH_CHANCE_MIN);
      branchChance += (random() - 0.5) * 0.06;
      if (branchChance < WALL_BRANCH_CHANCE_MIN) {
        branchChance = WALL_BRANCH_CHANCE_MIN;
      }
      if (branchChance > WALL_BRANCH_CHANCE_MAX) {
        branchChance = WALL_BRANCH_CHANCE_MAX;
      }
      return branchChance;
    }

    function getWallMaxSegmentsForDensity(density, random) {
      var densityNormalized = (density - CHUNK_ROCK_DENSITY_MIN) / (CHUNK_ROCK_DENSITY_MAX - CHUNK_ROCK_DENSITY_MIN);
      var segmentSpan = WALL_SEGMENT_COUNT_MAX - WALL_SEGMENT_COUNT_MIN;
      var maxSegments = WALL_SEGMENT_COUNT_MIN + Math.floor(densityNormalized * segmentSpan * (0.5 + random() * 0.75));
      if (maxSegments < WALL_SEGMENT_COUNT_MIN) {
        maxSegments = WALL_SEGMENT_COUNT_MIN;
      }
      if (maxSegments > WALL_SEGMENT_COUNT_MAX) {
        maxSegments = WALL_SEGMENT_COUNT_MAX;
      }
      return maxSegments;
    }

    function buildRockWallChain(random, chunkX, chunkY, entities, margin, branchChance, maxSegments) {
      var walls = [];
      var localX = margin + random() * (CHUNK_SIZE - margin * 2);
      var localY = margin + random() * (CHUNK_SIZE - margin * 2);
      var worldX = chunkX * CHUNK_SIZE + localX;
      var worldY = chunkY * CHUNK_SIZE + localY;
      var currentRotation = random() * Math.PI * 2;
      var currentHalfLength = ROCK_WALL_HALF_LENGTH_START_MIN + random() * ROCK_WALL_HALF_LENGTH_START_RANGE;
      var currentHalfWidth = ROCK_WALL_HALF_WIDTH_START_MIN + random() * ROCK_WALL_HALF_WIDTH_START_RANGE;
      var shade = 0.55 + random() * 0.35;
      var segmentIndex;
      var currentX = worldX;
      var currentY = worldY;
      var endSign;
      var endPos;
      var newRotation;
      var lastWall;

      if (!isFarEnoughFromEntities(entities, worldX, worldY, ENTITY_MIN_DIST)) {
        return walls;
      }

      walls.push(createRockWallSegment(currentX, currentY, currentRotation, currentHalfLength, currentHalfWidth, shade, random));
      entities.push({ x: currentX, y: currentY });

      for (segmentIndex = 1; segmentIndex < maxSegments; segmentIndex += 1) {
        if (random() >= branchChance) {
          break;
        }
        lastWall = walls[walls.length - 1];
        endSign = random() < 0.5 ? 1 : -1;
        endPos = getRockEndWorldPosition(lastWall, endSign);
        newRotation = lastWall.rotation + (random() * 2.2 - 1.1);
        currentHalfLength = ROCK_WALL_HALF_LENGTH_CHAIN_MIN + random() * ROCK_WALL_HALF_LENGTH_CHAIN_RANGE;
        currentHalfWidth = ROCK_WALL_HALF_WIDTH_CHAIN_MIN + random() * ROCK_WALL_HALF_WIDTH_CHAIN_RANGE;
        currentX = endPos.x + Math.cos(newRotation) * currentHalfLength;
        currentY = endPos.y + Math.sin(newRotation) * currentHalfLength;
        currentRotation = newRotation;
        if (!isRockWallInsideChunk(currentX, currentY, chunkX, chunkY, margin)) {
          break;
        }
        if (!isFarEnoughFromEntities(entities, currentX, currentY, ENTITY_MIN_DIST * 0.65)) {
          break;
        }
        shade = 0.55 + random() * 0.35;
        walls.push(createRockWallSegment(currentX, currentY, currentRotation, currentHalfLength, currentHalfWidth, shade, random));
        entities.push({ x: currentX, y: currentY });
      }

      return walls;
    }

    function getTurnRateForSpeed(speed) {
      var speedRange = MAX_SPEED - MIN_SPEED;
      var speedFactor = 0;
      if (speedRange > 0) {
        speedFactor = (speed - MIN_SPEED) / speedRange;
      }
      if (speedFactor < 0) {
        speedFactor = 0;
      }
      if (speedFactor > 1) {
        speedFactor = 1;
      }
      return TURN_RATE_AT_MIN_CAR_SPEED + (TURN_RATE_AT_MAX_CAR_SPEED - TURN_RATE_AT_MIN_CAR_SPEED) * speedFactor;
    }

    function getBoulderCarCollision(rock) {
      var deltaX = carWorldX - rock.x;
      var deltaY = carWorldY - rock.y;
      var dist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
      var hitRadius = CAR_RADIUS + rock.radius * 0.72;
      var normalX;
      var normalY;

      if (dist >= hitRadius) {
        return null;
      }
      if (dist > 0.001) {
        normalX = deltaX / dist;
        normalY = deltaY / dist;
      } else {
        normalX = Math.cos(carAngle);
        normalY = Math.sin(carAngle);
        dist = 1;
      }
      return {
        normalX: normalX,
        normalY: normalY,
        closestWorldX: rock.x + normalX * rock.radius,
        closestWorldY: rock.y + normalY * rock.radius,
        penetration: hitRadius - dist
      };
    }

    function getWallCarCollision(rock) {
      var deltaX = carWorldX - rock.x;
      var deltaY = carWorldY - rock.y;
      var cosR = Math.cos(rock.rotation);
      var sinR = Math.sin(rock.rotation);
      var localX = deltaX * cosR + deltaY * sinR;
      var localY = -deltaX * sinR + deltaY * cosR;
      var closestX = localX;
      var closestY = localY;
      var distX;
      var distY;
      var distSq;
      var dist;
      var normalLocalX;
      var normalLocalY;
      var normalX;
      var normalY;
      var closestWorldX;
      var closestWorldY;

      if (closestX > rock.halfLength) {
        closestX = rock.halfLength;
      }
      if (closestX < -rock.halfLength) {
        closestX = -rock.halfLength;
      }
      if (closestY > rock.halfWidth) {
        closestY = rock.halfWidth;
      }
      if (closestY < -rock.halfWidth) {
        closestY = -rock.halfWidth;
      }
      distX = localX - closestX;
      distY = localY - closestY;
      distSq = distX * distX + distY * distY;
      if (distSq >= CAR_RADIUS * CAR_RADIUS) {
        return null;
      }
      dist = Math.sqrt(distSq);
      if (dist > 0.001) {
        normalLocalX = distX / dist;
        normalLocalY = distY / dist;
      } else {
        normalLocalX = 1;
        normalLocalY = 0;
      }
      normalX = normalLocalX * cosR - normalLocalY * sinR;
      normalY = normalLocalX * sinR + normalLocalY * cosR;
      closestWorldX = rock.x + closestX * cosR - closestY * sinR;
      closestWorldY = rock.y + closestX * sinR + closestY * cosR;
      return {
        normalX: normalX,
        normalY: normalY,
        closestWorldX: closestWorldX,
        closestWorldY: closestWorldY,
        penetration: CAR_RADIUS - dist
      };
    }

    function getRockCarCollision(rock) {
      if (rock.kind === "boulder") {
        return getBoulderCarCollision(rock);
      }
      return getWallCarCollision(rock);
    }

    function buildCrystalDeposit(random, chunkX, chunkY, depositIndex, entities, rocks) {
      var margin = 56;
      var centerLocalX = margin + random() * (CHUNK_SIZE - margin * 2);
      var centerLocalY = margin + random() * (CHUNK_SIZE - margin * 2);
      var centerWorldX = chunkX * CHUNK_SIZE + centerLocalX;
      var centerWorldY = chunkY * CHUNK_SIZE + centerLocalY;
      var depositRadius = 72 + random() * 88;
      var densityMultiplier = 1 + random();
      var sparkCount = Math.floor((90 + random() * 110) * densityMultiplier);
      var rarityPrimary = pickCrystalRarity(random);
      var raritySecondary = pickSecondCrystalRarity(random, rarityPrimary);
      var crystals = [];
      var sparkIndex;
      var angle;
      var distance;
      var localX;
      var localY;
      var worldX;
      var worldY;
      var rockIndex;
      var rock;
      var deltaX;
      var deltaY;
      var rockDist;
      var tooCloseToRock;
      var sparkRarity;

      if (!isFarEnoughFromEntities(entities, centerWorldX, centerWorldY, depositRadius + 40)) {
        return crystals;
      }

      for (rockIndex = 0; rockIndex < rocks.length; rockIndex += 1) {
        rock = rocks[rockIndex];
        deltaX = rock.x - centerWorldX;
        deltaY = rock.y - centerWorldY;
        rockDist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
        if (rockDist < depositRadius + getRockExtentRadius(rock) + 24) {
          return crystals;
        }
      }

      entities.push({ x: centerWorldX, y: centerWorldY });

      for (sparkIndex = 0; sparkIndex < sparkCount; sparkIndex += 1) {
        angle = random() * Math.PI * 2;
        distance = Math.pow(random(), 1.85) * depositRadius;
        localX = centerLocalX + Math.cos(angle) * distance;
        localY = centerLocalY + Math.sin(angle) * distance;
        if (localX < 8 || localY < 8 || localX > CHUNK_SIZE - 8 || localY > CHUNK_SIZE - 8) {
          continue;
        }
        worldX = chunkX * CHUNK_SIZE + localX;
        worldY = chunkY * CHUNK_SIZE + localY;
        tooCloseToRock = false;
        for (rockIndex = 0; rockIndex < rocks.length; rockIndex += 1) {
          rock = rocks[rockIndex];
          deltaX = rock.x - worldX;
          deltaY = rock.y - worldY;
          rockDist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
          if (rockDist < getRockExtentRadius(rock) + 10) {
            tooCloseToRock = true;
            break;
          }
        }
        if (tooCloseToRock) {
          continue;
        }
        if (random() < 0.5) {
          sparkRarity = rarityPrimary;
        } else {
          sparkRarity = raritySecondary;
        }
        crystals.push({
          x: worldX,
          y: worldY,
          size: getCrystalSparkSize(sparkRarity, random),
          twinkle: random() * Math.PI * 2,
          twinkleSpeed: 2.5 + random() * 4,
          rarity: sparkRarity,
          collected: false,
          collecting: false
        });
      }

      return crystals;
    }

    function buildChunkEntities(chunkX, chunkY) {
      var random = createChunkRandom(chunkX, chunkY);
      var crystals = [];
      var rocks = [];
      var entities = [];
      var margin = 64;
      var rockDensity = getChunkRockDensity(random);
      var wallChainCount = getWallChainCountForDensity(rockDensity, random);
      var boulderCount = getBoulderCountForDensity(rockDensity, random);
      var wallChainIndex;
      var wallChain;
      var branchChance;
      var maxWallSegments;
      var boulderIndex;
      var chunkBoulders;
      var depositCount = 0;
      var depositIndex;
      var depositCrystals;

      for (wallChainIndex = 0; wallChainIndex < wallChainCount; wallChainIndex += 1) {
        branchChance = getWallBranchChanceForDensity(rockDensity, random);
        maxWallSegments = getWallMaxSegmentsForDensity(rockDensity, random);
        wallChain = buildRockWallChain(random, chunkX, chunkY, entities, margin, branchChance, maxWallSegments);
        var wallIndex;
        for (wallIndex = 0; wallIndex < wallChain.length; wallIndex += 1) {
          rocks.push(wallChain[wallIndex]);
        }
      }

      chunkBoulders = buildChunkBoulders(random, chunkX, chunkY, rocks, entities, margin, boulderCount);
      for (boulderIndex = 0; boulderIndex < chunkBoulders.length; boulderIndex += 1) {
        rocks.push(chunkBoulders[boulderIndex]);
      }

      if (random() < 0.82) {
        depositCount = 1;
      }
      if (random() < 0.34) {
        depositCount = 2;
      }

      for (depositIndex = 0; depositIndex < depositCount; depositIndex += 1) {
        depositCrystals = buildCrystalDeposit(random, chunkX, chunkY, depositIndex, entities, rocks);
        var crystalIndex;
        for (crystalIndex = 0; crystalIndex < depositCrystals.length; crystalIndex += 1) {
          crystals.push(depositCrystals[crystalIndex]);
        }
      }

      return {
        chunkX: chunkX,
        chunkY: chunkY,
        seed: hashSeed(chunkX * 991 + chunkY * 997),
        crystals: crystals,
        rocks: rocks,
        surfaceCanvas: null
      };
    }

    function getChunk(chunkX, chunkY) {
      var key = chunkKey(chunkX, chunkY);
      var chunk = chunks[key];
      if (!chunk) {
        chunk = buildChunkEntities(chunkX, chunkY);
        chunks[key] = chunk;
        chunkKeys.push(key);
        buildChunkSurface(chunk);
        paintCrystalGroundTints(chunk);
      }
      return chunk;
    }

    function buildChunkSurface(chunk) {
      var surfaceCanvas = acquireChunkSurfaceCanvas();
      var surfaceContext = surfaceCanvas.getContext("2d");
      var random = createChunkRandom(chunk.chunkX * 17 + 3, chunk.chunkY * 31 + 7);
      var baseHue = 28 + chunk.seed * 14;
      var baseR = 130 + chunk.seed * 35;
      var baseG = 105 + chunk.seed * 25;
      var baseB = 72 + chunk.seed * 18;
      var patchCount;
      var patchIndex;
      var crackCount;
      var crackIndex;
      var pebbleCount;
      var pebbleIndex;
      var x;
      var y;
      var radius;
      var shade;

      surfaceContext.fillStyle = "rgb(" + Math.floor(baseR) + "," + Math.floor(baseG) + "," + Math.floor(baseB) + ")";
      surfaceContext.fillRect(0, 0, CHUNK_SIZE, CHUNK_SIZE);

      patchCount = 18 + Math.floor(random() * 14);
      for (patchIndex = 0; patchIndex < patchCount; patchIndex += 1) {
        x = random() * CHUNK_SIZE;
        y = random() * CHUNK_SIZE;
        radius = 20 + random() * 80;
        shade = 0.75 + random() * 0.35;
        surfaceContext.fillStyle = "rgba(" +
          Math.floor(baseR * shade) + "," +
          Math.floor(baseG * shade) + "," +
          Math.floor(baseB * shade) + ",0.45)";
        surfaceContext.beginPath();
        surfaceContext.ellipse(x, y, radius, radius * (0.6 + random() * 0.5), random() * Math.PI, 0, Math.PI * 2);
        surfaceContext.fill();
      }

      crackCount = 6 + Math.floor(random() * 8);
      for (crackIndex = 0; crackIndex < crackCount; crackIndex += 1) {
        x = random() * CHUNK_SIZE;
        y = random() * CHUNK_SIZE;
        surfaceContext.strokeStyle = "rgba(" +
          Math.floor(baseR * 0.55) + "," +
          Math.floor(baseG * 0.5) + "," +
          Math.floor(baseB * 0.42) + ",0.35)";
        surfaceContext.lineWidth = 1 + random() * 1.5;
        surfaceContext.beginPath();
        surfaceContext.moveTo(x, y);
        var segment;
        for (segment = 0; segment < 3 + Math.floor(random() * 4); segment += 1) {
          x += (random() - 0.5) * 70;
          y += (random() - 0.5) * 70;
          surfaceContext.lineTo(x, y);
        }
        surfaceContext.stroke();
      }

      pebbleCount = 40 + Math.floor(random() * 50);
      for (pebbleIndex = 0; pebbleIndex < pebbleCount; pebbleIndex += 1) {
        x = random() * CHUNK_SIZE;
        y = random() * CHUNK_SIZE;
        shade = 0.5 + random() * 0.5;
        surfaceContext.fillStyle = "rgba(" +
          Math.floor(baseR * shade) + "," +
          Math.floor(baseG * shade) + "," +
          Math.floor(baseB * shade) + ",0.55)";
        surfaceContext.beginPath();
        surfaceContext.arc(x, y, 1 + random() * 2.5, 0, Math.PI * 2);
        surfaceContext.fill();
      }

      chunk.surfaceCanvas = surfaceCanvas;
    }

    function paintCrystalGroundTints(chunk) {
      var surfaceContext;
      var crystalIndex;
      var crystal;
      var localX;
      var localY;
      var rgb;
      var radius;
      if (!chunk.surfaceCanvas) {
        return;
      }
      surfaceContext = chunk.surfaceCanvas.getContext("2d");
      for (crystalIndex = 0; crystalIndex < chunk.crystals.length; crystalIndex += 1) {
        crystal = chunk.crystals[crystalIndex];
        localX = crystal.x - chunk.chunkX * CHUNK_SIZE;
        localY = crystal.y - chunk.chunkY * CHUNK_SIZE;
        rgb = getCrystalColorRgb(crystal.rarity);
        radius = 3 + crystal.size * 2.2;
        surfaceContext.fillStyle = "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ",0.09)";
        surfaceContext.beginPath();
        surfaceContext.arc(localX, localY, radius, 0, Math.PI * 2);
        surfaceContext.fill();
      }
    }

    function updateChunksAroundCar() {
      rebaseWorldCoordinates();
      var carChunkX = worldToChunk(carWorldX);
      var carChunkY = worldToChunk(carWorldY);
      var offsetX;
      var offsetY;
      var chunkX;
      var chunkY;

      for (offsetY = -CHUNK_LOAD_RADIUS; offsetY <= CHUNK_LOAD_RADIUS; offsetY += 1) {
        for (offsetX = -CHUNK_LOAD_RADIUS; offsetX <= CHUNK_LOAD_RADIUS; offsetX += 1) {
          chunkX = carChunkX + offsetX;
          chunkY = carChunkY + offsetY;
          getChunk(chunkX, chunkY);
        }
      }

      var keyIndex;
      var key;
      var chunk;
      var removeKeys = [];
      for (keyIndex = chunkKeys.length - 1; keyIndex >= 0; keyIndex -= 1) {
        key = chunkKeys[keyIndex];
        chunk = chunks[key];
        if (!chunk) {
          chunkKeys.splice(keyIndex, 1);
          continue;
        }
        if (Math.abs(chunk.chunkX - carChunkX) > CHUNK_UNLOAD_RADIUS ||
          Math.abs(chunk.chunkY - carChunkY) > CHUNK_UNLOAD_RADIUS) {
          removeKeys.push(key);
        }
      }

      var removeIndex;
      for (removeIndex = 0; removeIndex < removeKeys.length; removeIndex += 1) {
        key = removeKeys[removeIndex];
        chunk = chunks[key];
        releaseChunkResources(chunk);
        delete chunks[key];
        keyIndex = chunkKeys.indexOf(key);
        if (keyIndex >= 0) {
          chunkKeys.splice(keyIndex, 1);
        }
      }
    }

      collectEffectsDebounceTimer = COLLECT_EFFECTS_DEBOUNCE;
      var rarityScale = 0.8 + RARITY_SIZE[rarity] * 0.4;
      var sparkCount = COLLECT_SPARK_COUNT_BASE + Math.floor(rarity * 2.5);

      for (particleIndex = 0; particleIndex < sparkCount; particleIndex += 1) {
        angle = (particleIndex / sparkCount) * Math.PI * 2 + Math.random() * 0.5;
        speed = 80 + Math.random() * 150 * rarityScale;

        spark.size = 1.8 + rarityScale * 1.6;
        spark.red = red;
        spark.green = green;
        spark.blue = blue;

      deltaY = carCenterY - crystalScreenY;

        dist = 1;

        streak.size = 2 + rarityScale * 1.2;

        streak.green = green;
        streak.blue = blue;

    function getTireTrailPathLength(trail) {
      var totalLength = 0;
      var pointIndex;
      var deltaX;
      var deltaY;
      for (pointIndex = 1; pointIndex < trail.length; pointIndex += 1) {
        deltaX = trail[pointIndex].x - trail[pointIndex - 1].x;
        deltaY = trail[pointIndex].y - trail[pointIndex - 1].y;
        totalLength += Math.sqrt(deltaX * deltaX + deltaY * deltaY);
      }
      return totalLength;
    }

    function trimTireTrail(trail) {
      while (trail.length > 2 && getTireTrailPathLength(trail) > TIRE_TRACK_MAX_PATH_LENGTH) {
        trail.shift();
      }
    }

    function appendTireTrailPoints() {
      var backAngle = carAngle + Math.PI;
      var leftAngle = carAngle - Math.PI * 0.5;
      var rightAngle = carAngle + Math.PI * 0.5;
      var rearWorldX = Math.cos(backAngle) * TIRE_TRACK_REAR_OFFSET;
      var rearWorldY = Math.sin(backAngle) * TIRE_TRACK_REAR_OFFSET;

      tireTrailLeft.push({
        x: carWorldX + rearWorldX + Math.cos(leftAngle) * TIRE_TRACK_LATERAL_OFFSET,
        y: carWorldY + rearWorldY + Math.sin(leftAngle) * TIRE_TRACK_LATERAL_OFFSET
      });
      tireTrailRight.push({
        x: carWorldX + rearWorldX + Math.cos(rightAngle) * TIRE_TRACK_LATERAL_OFFSET,
        y: carWorldY + rearWorldY + Math.sin(rightAngle) * TIRE_TRACK_LATERAL_OFFSET
      });
    }

    function updateTireTrails(moveDistance) {
      if (moveDistance < 0.01 || carSpeed < TIRE_TRACK_MIN_SPEED) {
        return;
      }
      tireTrailDistanceSinceLastPoint += moveDistance;
      if (tireTrailDistanceSinceLastPoint < TIRE_TRACK_STEP_DISTANCE) {
        return;
      }
      tireTrailDistanceSinceLastPoint = 0;
      appendTireTrailPoints();
      trimTireTrail(tireTrailLeft);
      trimTireTrail(tireTrailRight);
    }

    function drawTireTrail(trail) {
      var segmentCount;
      var segmentIndex;
      var startScreen;
      var endScreen;
      var alpha;

      if (trail.length < 2) {
        return;
      }

      segmentCount = trail.length - 1;
      context.save();
      context.lineCap = "round";
      context.lineJoin = "round";
      context.lineWidth = TIRE_TRACK_LINE_WIDTH;

      for (segmentIndex = 0; segmentIndex < segmentCount; segmentIndex += 1) {
        alpha = 0.18 + (segmentIndex / segmentCount) * 0.32;
        context.strokeStyle = "rgba(95, 78, 58, " + alpha + ")";
        startScreen = worldToScreen(trail[segmentIndex].x, trail[segmentIndex].y);
        endScreen = worldToScreen(trail[segmentIndex + 1].x, trail[segmentIndex + 1].y);
        context.beginPath();
        context.moveTo(startScreen.x, startScreen.y);
        context.lineTo(endScreen.x, endScreen.y);
        context.stroke();
      }

      context.restore();
    }

    function drawTireTrails() {
      drawTireTrail(tireTrailLeft);
      drawTireTrail(tireTrailRight);
    }

    function worldToScreen(worldX, worldY) {
      return {
        x: width * 0.5 + (worldX - carWorldX),
        y: height * 0.5 + (worldY - carWorldY)
      };
