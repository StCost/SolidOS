<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trouble Drivers</title>
  <script src="../iframe-game-locale.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #1a1410;
      color: #e8dcc8;
      font-family: "Courier New", Courier, monospace;
      cursor: url("../../../cursor-pointer.svg") 2.1 0, pointer;
    }

    #gameRoot {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #gameRoot:focus {
      outline: none;
    }

    #gameCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #damageVignette {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 50% 50%, transparent var(--vignette-inner, 62%), var(--vignette-edge, rgba(40, 8, 4, 0.92)) 100%);
      transition: opacity 0.35s ease, --vignette-inner 0.45s ease;
      opacity: 0;
    }

    #damageVignette.is-visible {
      opacity: var(--vignette-opacity, 1);
    }

    #damageVignette.is-flash {
      animation: damage-vignette-flash 0.38s ease-out forwards;
    }

    @keyframes damage-vignette-flash {
      0% {
        opacity: 1;
        filter: brightness(1.6);
      }

      100% {
        opacity: var(--vignette-opacity, 0.75);
        filter: brightness(1);
      }
    }

    #carWrap {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 56px;
      height: 72px;
      margin-left: -28px;
      margin-top: -36px;
      pointer-events: none;
      z-index: 4;
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.55));
    }

    #carShake {
      width: 100%;
      height: 100%;
    }

    #carShake.is-hit {
      animation: car-hit-shake 0.32s ease-out;
    }

    #carWrap.is-collect #carShake {
      animation: car-collect-pulse 0.42s ease-out;
    }

    @keyframes car-collect-pulse {
      0% {
        transform: scale(1);
        filter: brightness(1);
      }

      28% {
        transform: scale(1.07);
        filter: brightness(1.55) drop-shadow(0 0 16px var(--collect-glow, rgba(160, 230, 255, 0.9)));
      }

      100% {
        transform: scale(1);
        filter: brightness(1);
      }
    }

    @keyframes car-hit-shake {
      0% {
        transform: translate(0, 0);
        filter: brightness(1.8) drop-shadow(0 0 12px rgba(255, 80, 40, 0.8));
      }

      35% {
        transform: translate(-4px, 3px);
      }

      70% {
        transform: translate(3px, -2px);
      }

      100% {
        transform: translate(0, 0);
      }
    }

    #carSvg {
      width: 100%;
      height: 100%;
    }

    #carCracks {
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    #carWrap.is-damaged-light #carCracks {
      opacity: 0.62;
    }

    #carWrap.is-damaged-light #carCracks .crack-heavy {
      display: none;
    }

    #carWrap.is-damaged-critical #carCracks {
      opacity: 0.95;
    }

    #carWrap.is-damaged-critical #carCracks .crack-heavy {
      display: block;
    }

    .car-wheel {
      fill: #525a64;
      stroke: #1a2028;
      stroke-width: 1.2;
    }

    .car-wheel-rear {
      stroke: #141820;
      stroke-width: 1.35;
    }

    #carWrap.is-dead {
      opacity: 0;
      visibility: hidden;
    }

    #hudDashboard {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      z-index: 6;
      pointer-events: none;
    }

    #hudDashboard.hidden {
      display: none;
    }

    #speedGaugeSvg {
      width: 148px;
      height: 88px;
      display: block;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.65));
    }

    .speed-gauge-arc-bg {
      fill: none;
      stroke: rgba(12, 14, 18, 0.92);
      stroke-width: 9;
      stroke-linecap: round;
    }

    .speed-gauge-arc-face {
      fill: none;
      stroke: rgba(48, 54, 64, 0.98);
      stroke-width: 5;
      stroke-linecap: round;
    }

    .speed-gauge-arc-fill {
      fill: none;
      stroke-width: 9;
      stroke-linecap: round;
      transition: stroke-dasharray 0.07s linear;
    }

    .speed-gauge-tick {
      stroke: rgba(120, 132, 148, 0.42);
      stroke-width: 1.2;
      stroke-linecap: round;
    }

    #speedGaugeNeedle {
      transition: transform 0.07s linear;
    }

    #speedGaugeNeedle line {
      stroke: #dce8f4;
      stroke-width: 2.5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 4px rgba(180, 210, 255, 0.35));
    }

    #speedGaugeNeedle circle {
      fill: #5c6874;
      stroke: #222830;
      stroke-width: 1.1;
    }

    #checkEngineIcon {
      pointer-events: none;
    }

    #checkEngineShape {
      transition: fill 0.35s ease, filter 0.35s ease, opacity 0.35s ease;
    }

    #checkEngineIcon.check-engine-off #checkEngineShape {
      fill: rgba(110, 118, 128, 0.42);
      filter: none;
      opacity: 0.55;
    }

    #checkEngineIcon.check-engine-warn #checkEngineShape {
      fill: #e89428;
      opacity: 1;
      filter: drop-shadow(0 0 5px rgba(255, 160, 50, 0.75)) drop-shadow(0 0 12px rgba(255, 120, 30, 0.45));
    }

    #checkEngineIcon.check-engine-crit #checkEngineShape {
      fill: #e83828;
      opacity: 1;
      filter: drop-shadow(0 0 6px rgba(255, 70, 40, 0.9)) drop-shadow(0 0 14px rgba(255, 40, 20, 0.55));
    }

    #hudScore {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      pointer-events: none;
      text-align: center;
    }

    #hudDistance {
      position: absolute;
      top: 12px;
      left: 14px;
      z-index: 6;
      pointer-events: none;
      text-align: left;
    }

    #distanceValue {
      font-size: 1.55rem;
      font-weight: bold;
      letter-spacing: 0.1em;
      color: #e8dcc8;
      text-shadow: 0 0 10px rgba(200, 170, 120, 0.45), 0 2px 6px rgba(0, 0, 0, 0.85);
    }

    #distanceLabel {
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(200, 180, 150, 0.55);
      margin-top: 2px;
    }

    #scoreValue {
      font-size: 1.55rem;
      font-weight: bold;
      letter-spacing: 0.12em;
      color: #c8f0ff;
      text-shadow: 0 0 12px rgba(120, 200, 255, 0.55), 0 2px 6px rgba(0, 0, 0, 0.85);
      transition: transform 0.14s ease-out;
    }

    #scoreValue.is-pop {
      transform: scale(1.14);
      color: #e8ffff;
    }

    #scoreLabel {
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(180, 210, 220, 0.55);
      margin-top: 2px;
    }

    #hudBest {
      position: absolute;
      top: 12px;
      right: 14px;
      z-index: 6;
      pointer-events: none;
      text-align: right;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: rgba(180, 170, 150, 0.6);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
    }

    #bestValue {
      display: block;
      font-size: 1rem;
      font-weight: bold;
      color: #fff4d8;
    }

    #gameScreen {
      position: absolute;
      inset: 0;
      z-index: 7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      pointer-events: auto;
      cursor: url("../../../cursor-pointer.svg") 2.1 0, pointer;
      background: transparent;
    }

    #gameScreen.hidden {
      display: none;
    }

    #startScreenMask {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(16, 12, 10, 0.58) 0%, rgba(12, 8, 6, 0.72) 100%);
    }

    #startScreenPanel {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      padding: 1.15rem 1.45rem 1.05rem;
      background: rgba(42, 30, 20, 0.2);
      border: 1px solid rgba(200, 180, 140, 0.36);
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.55), inset 0 0 22px rgba(200, 160, 100, 0.05);
    }

    #screenTitle {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #e8dcc8;
      text-shadow: 0 0 16px rgba(200, 180, 140, 0.45);
    }

    #screenScore {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.14em;
      color: #c8b898;
    }

    #screenScore.hidden,
    #screenDistance.hidden {
      display: none;
    }

    #controlHint {
      margin: 0;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      color: #e8dcc8;
    }

    #crystalPreviewRow {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.65rem 1.1rem;
      margin: 0;
      max-width: min(88vw, 460px);
    }

    #crystalPreviewRow.hidden {
      display: none;
    }

    .crystal-preview-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }

    .crystal-preview-canvas {
      width: 52px;
      height: 52px;
      display: block;
    }

    .crystal-preview-cost {
      margin: 0;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      color: #e8dcc8;
    }

    @keyframes hint-pulse {

      0%,
      100% {
        opacity: 0.45;
      }

      50% {
        opacity: 1;
      }
    }

    #gameScreen.is-record #screenTitle {
      color: #ffe8a8;
      animation: record-glow 0.8s ease-in-out infinite alternate;
    }

    #fpsHud {
      position: absolute;
      right: 12px;
      bottom: 14px;
      top: auto;
      left: auto;
      z-index: 6;
      pointer-events: none;
      font-size: 11px;
      color: rgba(180, 170, 150, 0.55);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
    }
  </style>
</head>

<body>
  <div id="gameRoot" tabindex="0">
    <canvas id="gameCanvas" aria-hidden="true"></canvas>
    <div id="damageVignette" aria-hidden="true"></div>
    <div id="carWrap" aria-hidden="true">
      <div id="carShake">
        <svg id="carSvg" viewBox="0 0 56 72" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#8a9098" />
              <stop offset="45%" stop-color="#c8d0d8" />
              <stop offset="100%" stop-color="#687078" />
            </linearGradient>
            <linearGradient id="carAccentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#e8f4ff" />
              <stop offset="100%" stop-color="#88b8d8" />
            </linearGradient>
          </defs>
          <ellipse cx="28" cy="58" rx="20" ry="8" fill="rgba(0,0,0,0.22)" />
          <g id="carWheels">
            <g transform="translate(9, 58) rotate(180)">
              <rect class="car-wheel car-wheel-rear" x="-3.5" y="-7" width="7" height="14" rx="1.8" />
            </g>
            <g transform="translate(47, 58) rotate(180)">
              <rect class="car-wheel car-wheel-rear" x="-3.5" y="-7" width="7" height="14" rx="1.8" />
            </g>
            <g id="carFrontWheelLeft" transform="translate(11, 12)">
              <rect class="car-wheel" x="-3.5" y="-7" width="7" height="14" rx="1.8" />
            </g>
            <g id="carFrontWheelRight" transform="translate(45, 12)">
              <rect class="car-wheel" x="-3.5" y="-7" width="7" height="14" rx="1.8" />
            </g>
          </g>
          <rect x="10" y="14" width="36" height="46" rx="8" fill="url(#carBodyGrad)" stroke="#3a4048"
            stroke-width="1.4" />
          <rect x="14" y="18" width="28" height="18" rx="4" fill="url(#carAccentGrad)" opacity="0.85" stroke="#506878"
            stroke-width="1" />
          <rect x="12" y="38" width="10" height="18" rx="3" fill="#505860" stroke="#2a3038" stroke-width="1" />
          <rect x="34" y="38" width="10" height="18" rx="3" fill="#505860" stroke="#2a3038" stroke-width="1" />
          <rect x="19" y="6" width="8" height="10" rx="3" fill="#687078" stroke="#3a4048" stroke-width="1" />
          <rect x="29" y="6" width="8" height="10" rx="3" fill="#687078" stroke="#3a4048" stroke-width="1" />
          <circle cx="23" cy="11" r="2.5" fill="#a8e8ff" opacity="0.9" />
          <circle cx="33" cy="11" r="2.5" fill="#a8e8ff" opacity="0.9" />
          <path d="M18 52 L14 66 M38 52 L42 66" stroke="#2a3038" stroke-width="3" stroke-linecap="round" />

          <line x1="28" y1="72" x2="28" y2="62" stroke="#ff8844" stroke-width="2" stroke-linecap="round"

          <g id="carCracks">
            <path class="crack crack-light" d="M18 20 L26 30 L22 38" fill="none" stroke="#1a1008" stroke-width="1.3"

            <path class="crack crack-light" d="M38 22 L32 34 L36 44" fill="none" stroke="#1a1008" stroke-width="1.2"

            <path class="crack crack-light" d="M24 24 L28 32" fill="none" stroke="#2a1810" stroke-width="1"

            <path class="crack crack-heavy" d="M14 28 L22 42 L18 52" fill="none" stroke="#120a06" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round" />
            <path class="crack crack-heavy" d="M42 26 L34 40 L38 50" fill="none" stroke="#120a06" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round" />
            <path class="crack crack-heavy" d="M20 16 L28 26 L24 36 M36 18 L30 28" fill="none" stroke="#1a1008"
              stroke-width="1.2" stroke-linecap="round" opacity="0.85" />

              stroke-linecap="round" opacity="0.65" />
          </g>
        </svg>
      </div>
    </div>
    <div id="hudDashboard" class="hidden">
      <svg id="speedGaugeSvg" viewBox="0 0 140 84" aria-hidden="true">
        <defs>
          <linearGradient id="speedGaugeArcGradient" gradientUnits="userSpaceOnUse" x1="16" y1="72" x2="124"
            y2="72">
            <stop offset="0%" stop-color="#42d45e" />
            <stop offset="50%" stop-color="#f0a028" />
            <stop offset="100%" stop-color="#e83828" />
          </linearGradient>
        </defs>
        <path class="speed-gauge-arc-bg" d="M 16 72 A 54 54 0 0 1 124 72" />
        <path id="speedGaugeArcFill" class="speed-gauge-arc-fill" stroke="url(#speedGaugeArcGradient)"
          d="M 16 72 A 54 54 0 0 1 124 72" />
        <path class="speed-gauge-arc-face" d="M 22 72 A 48 48 0 0 1 118 72" />
        <g id="speedGaugeTicks" aria-hidden="true"></g>
        <g id="checkEngineIcon" class="check-engine-off" transform="translate(70 49) scale(0.74) translate(-12 -12)"

        </g>

          <line x1="70" y1="72" x2="70" y2="24" />
          <circle cx="70" cy="72" r="5" />
        </g>
      </svg>
    </div>
    <div id="hudDistance">
      <div id="distanceValue">0m</div>
      <div id="distanceLabel">distance</div>
    </div>
    <div id="hudScore">
      <div id="scoreValue">0</div>
      <div id="scoreLabel">score</div>
    </div>
    <div id="hudBest">best<span id="bestValue">0</span></div>
    <div id="fpsHud">fps <span id="fpsValue">--</span></div>
    <div id="gameScreen">
      <div id="startScreenMask" aria-hidden="true"></div>
      <div id="startScreenPanel">
        <h1 id="screenTitle">Trouble Drivers</h1>
        <p id="screenDistance" class="hidden">0m</p>
        <p id="screenScore" class="hidden">0</p>
        <div id="crystalPreviewRow"></div>
        <p id="controlHint">click and hold or WASD</p>
      </div>
    </div>
  </div>
  <script src="../extras-game-start-music-notify.js"></script>

        rock.x -= shiftX;
        rock.y -= shiftY;
        targetChunkX = worldToChunk(rock.x);
        targetChunkY = worldToChunk(rock.y);
        chunk = getChunk(targetChunkX, targetChunkY);
        chunk.rocks.push(rock);

        crystal.y -= shiftY;
        targetChunkX = worldToChunk(crystal.x);

        chunk = getChunk(targetChunkX, targetChunkY);

    function buildBoulderPolygon(radius, random) {
      var points = [];

      var vertexIndex;
      var angle;
      var distance;
      for (vertexIndex = 0; vertexIndex < vertexCount; vertexIndex += 1) {
        angle = vertexIndex / vertexCount * Math.PI * 2 + (random() - 0.5) * 0.55;
        distance = radius * (0.68 + random() * 0.42);
        points.push({
          x: Math.cos(angle) * distance,
          y: Math.sin(angle) * distance
        });
      }
      return points;

    function buildWallCapsulePolygon(halfLength, halfWidth, random) {
      var points = [];
      var halfLen = halfLength;
      var halfWid = halfWidth;
      var straightLen = halfLen * 2 - halfWid * 2;
      var topCount = 7 + Math.floor(random() * 5);
      var bottomCount = 7 + Math.floor(random() * 5);
      var capCount = 5;
      var index;
      var t;
      var x;
      var y;
      var angle;
      var jitterX;
      var jitterY;

      if (straightLen < 4) {
        straightLen = 4;
      }

      for (index = 0; index <= topCount; index += 1) {
        t = index / topCount;
        x = -halfLen + halfWid + straightLen * t;
        jitterY = (random() - 0.5) * halfWid * 0.7;
        points.push({ x: x, y: -halfWid + jitterY });
      }
      for (index = 1; index <= capCount; index += 1) {
        t = index / capCount;
        angle = -Math.PI / 2 + Math.PI * t;
        jitterX = (random() - 0.5) * halfWid * 0.45;
        jitterY = (random() - 0.5) * halfWid * 0.45;
        points.push({
          x: halfLen - halfWid + Math.cos(angle) * halfWid + jitterX,
          y: Math.sin(angle) * halfWid + jitterY
        });
      }
      for (index = bottomCount; index >= 0; index -= 1) {
        t = index / bottomCount;
        x = -halfLen + halfWid + straightLen * t;
        jitterY = (random() - 0.5) * halfWid * 0.7;
        points.push({ x: x, y: halfWid + jitterY });
      }
      for (index = capCount - 1; index >= 1; index -= 1) {
        t = index / capCount;
        angle = Math.PI / 2 + Math.PI * t;
        jitterX = (random() - 0.5) * halfWid * 0.45;
        jitterY = (random() - 0.5) * halfWid * 0.45;
        points.push({
          x: -halfLen + halfWid + Math.cos(angle) * halfWid + jitterX,
          y: Math.sin(angle) * halfWid + jitterY
        });
      }
      return points;
    }

      var boulders = [];

      for (attemptIndex = 0; attemptIndex < boulderCount * 10; attemptIndex += 1) {

        localX = margin + random() * (CHUNK_SIZE - margin * 2);
        localY = margin + random() * (CHUNK_SIZE - margin * 2);
        worldX = chunkX * CHUNK_SIZE + localX;
        worldY = chunkY * CHUNK_SIZE + localY;
        if (!isFarEnoughFromEntities(entities, worldX, worldY, ROCK_BOULDER_MIN_DIST)) {
          continue;
        }
        if (!isFarEnoughFromRocks(rocks, worldX, worldY, ROCK_BOULDER_MIN_DIST * 0.45)) {
          continue;
        }
        if (!isFarEnoughFromRocks(boulders, worldX, worldY, ROCK_BOULDER_MIN_DIST * 0.55)) {
          continue;

        boulders.push(createBoulderRock(worldX, worldY, random));
        entities.push({ x: worldX, y: worldY });

      return {
        x: rock.x + Math.cos(rock.rotation) * rock.halfLength * endSign,
        y: rock.y + Math.sin(rock.rotation) * rock.halfLength * endSign
      };
    }

    function createRockWallSegment(worldX, worldY, rotation, halfLength, halfWidth, shade, random) {
      return {
        kind: "wall",
        x: worldX,
        y: worldY,
        rotation: rotation,
        halfLength: halfLength,
        halfWidth: halfWidth,
        shade: shade,
        polygonPoints: buildWallCapsulePolygon(halfLength, halfWidth, random)
      };
    }

    function isRockWallInsideChunk(worldX, worldY, chunkX, chunkY, margin) {
      var minX = chunkX * CHUNK_SIZE + margin;
      var minY = chunkY * CHUNK_SIZE + margin;
      var maxX = (chunkX + 1) * CHUNK_SIZE - margin;
      var maxY = (chunkY + 1) * CHUNK_SIZE - margin;
      return worldX >= minX && worldX <= maxX && worldY >= minY && worldY <= maxY;
    }

    function getChunkRockDensity(random) {
      return CHUNK_ROCK_DENSITY_MIN + random() * (CHUNK_ROCK_DENSITY_MAX - CHUNK_ROCK_DENSITY_MIN);
    }

    function getBoulderCountForDensity(density, random) {
      var densityNormalized = (density - CHUNK_ROCK_DENSITY_MIN) / (CHUNK_ROCK_DENSITY_MAX - CHUNK_ROCK_DENSITY_MIN);
      var count = Math.floor(BOULDER_PER_CHUNK_MIN + densityNormalized * (BOULDER_PER_CHUNK_MAX - BOULDER_PER_CHUNK_MIN) * (0.55 + random() * 0.65));
      if (count < BOULDER_PER_CHUNK_MIN) {
        count = BOULDER_PER_CHUNK_MIN;
      }
      if (count > BOULDER_PER_CHUNK_MAX) {
        count = BOULDER_PER_CHUNK_MAX;
      }
      return count;
    }

    function getWallChainCountForDensity(density, random) {
      var densityNormalized = (density - CHUNK_ROCK_DENSITY_MIN) / (CHUNK_ROCK_DENSITY_MAX - CHUNK_ROCK_DENSITY_MIN);
      var count = Math.floor(WALL_CHAIN_PER_CHUNK_MIN + densityNormalized * (WALL_CHAIN_PER_CHUNK_MAX - WALL_CHAIN_PER_CHUNK_MIN) * (0.45 + random() * 0.75));
      if (count < WALL_CHAIN_PER_CHUNK_MIN) {
        count = WALL_CHAIN_PER_CHUNK_MIN;
      }
      if (count > WALL_CHAIN_PER_CHUNK_MAX) {
        count = WALL_CHAIN_PER_CHUNK_MAX;
      }
      return count;
    }

    function getWallBranchChanceForDensity(density, random) {
      var densityNormalized = (density - CHUNK_ROCK_DENSITY_MIN) / (CHUNK_ROCK_DENSITY_MAX - CHUNK_ROCK_DENSITY_MIN);
      var branchChance = WALL_BRANCH_CHANCE_MIN + densityNormalized * (WALL_BRANCH_CHANCE_MAX - WALL_BRANCH_CHANCE_MIN);
      branchChance += (random() - 0.5) * 0.06;
      if (branchChance < WALL_BRANCH_CHANCE_MIN) {
        branchChance = WALL_BRANCH_CHANCE_MIN;
      }
      if (branchChance > WALL_BRANCH_CHANCE_MAX) {
        branchChance = WALL_BRANCH_CHANCE_MAX;
      }
      return branchChance;
    }

    function getWallMaxSegmentsForDensity(density, random) {
      var densityNormalized = (density - CHUNK_ROCK_DENSITY_MIN) / (CHUNK_ROCK_DENSITY_MAX - CHUNK_ROCK_DENSITY_MIN);
      var segmentSpan = WALL_SEGMENT_COUNT_MAX - WALL_SEGMENT_COUNT_MIN;
      var maxSegments = WALL_SEGMENT_COUNT_MIN + Math.floor(densityNormalized * segmentSpan * (0.5 + random() * 0.75));
      if (maxSegments < WALL_SEGMENT_COUNT_MIN) {
        maxSegments = WALL_SEGMENT_COUNT_MIN;
      }
      if (maxSegments > WALL_SEGMENT_COUNT_MAX) {
        maxSegments = WALL_SEGMENT_COUNT_MAX;
      }
      return maxSegments;
    }

    function buildRockWallChain(random, chunkX, chunkY, entities, margin, branchChance, maxSegments) {
      var walls = [];
      var localX = margin + random() * (CHUNK_SIZE - margin * 2);
      var localY = margin + random() * (CHUNK_SIZE - margin * 2);
      var worldX = chunkX * CHUNK_SIZE + localX;
      var worldY = chunkY * CHUNK_SIZE + localY;
      var currentRotation = random() * Math.PI * 2;
      var currentHalfLength = ROCK_WALL_HALF_LENGTH_START_MIN + random() * ROCK_WALL_HALF_LENGTH_START_RANGE;
      var currentHalfWidth = ROCK_WALL_HALF_WIDTH_START_MIN + random() * ROCK_WALL_HALF_WIDTH_START_RANGE;
      var shade = 0.55 + random() * 0.35;
      var segmentIndex;
      var currentX = worldX;
      var currentY = worldY;
      var endSign;
      var endPos;
      var newRotation;
      var lastWall;

      if (!isFarEnoughFromEntities(entities, worldX, worldY, ENTITY_MIN_DIST)) {
        return walls;
      }

      walls.push(createRockWallSegment(currentX, currentY, currentRotation, currentHalfLength, currentHalfWidth, shade, random));
      entities.push({ x: currentX, y: currentY });

      for (segmentIndex = 1; segmentIndex < maxSegments; segmentIndex += 1) {
        if (random() >= branchChance) {
          break;
        }
        lastWall = walls[walls.length - 1];
        endSign = random() < 0.5 ? 1 : -1;
        endPos = getRockEndWorldPosition(lastWall, endSign);
        newRotation = lastWall.rotation + (random() * 2.2 - 1.1);
        currentHalfLength = ROCK_WALL_HALF_LENGTH_CHAIN_MIN + random() * ROCK_WALL_HALF_LENGTH_CHAIN_RANGE;
        currentHalfWidth = ROCK_WALL_HALF_WIDTH_CHAIN_MIN + random() * ROCK_WALL_HALF_WIDTH_CHAIN_RANGE;
        currentX = endPos.x + Math.cos(newRotation) * currentHalfLength;
        currentY = endPos.y + Math.sin(newRotation) * currentHalfLength;
        currentRotation = newRotation;
        if (!isRockWallInsideChunk(currentX, currentY, chunkX, chunkY, margin)) {
          break;
        }
        if (!isFarEnoughFromEntities(entities, currentX, currentY, ENTITY_MIN_DIST * 0.65)) {
          break;
        }
        shade = 0.55 + random() * 0.35;
        walls.push(createRockWallSegment(currentX, currentY, currentRotation, currentHalfLength, currentHalfWidth, shade, random));
        entities.push({ x: currentX, y: currentY });
      }

      return walls;
    }

    function getTurnRateForSpeed(speed) {
      var speedRange = MAX_SPEED - MIN_SPEED;
      var speedFactor = 0;
      if (speedRange > 0) {
        speedFactor = (speed - MIN_SPEED) / speedRange;
      }
      if (speedFactor < 0) {
        speedFactor = 0;
      }
      if (speedFactor > 1) {
        speedFactor = 1;
      }
      return TURN_RATE_AT_MIN_CAR_SPEED + (TURN_RATE_AT_MAX_CAR_SPEED - TURN_RATE_AT_MIN_CAR_SPEED) * speedFactor;
    }

    function getBoulderCarCollisionAt(bodyX, bodyY, bodyAngle, bodyRadius, rock) {
      var deltaX = bodyX - rock.x;
      var deltaY = bodyY - rock.y;
      var dist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
      var hitRadius = bodyRadius + rock.radius * 0.72;
      var normalX;
      var normalY;

      if (dist >= hitRadius) {
        return null;
      }
      if (dist > 0.001) {
        normalX = deltaX / dist;
        normalY = deltaY / dist;
      } else {
        normalX = Math.cos(bodyAngle);
        normalY = Math.sin(bodyAngle);
        dist = 1;
      }
      return {
        normalX: normalX,
        normalY: normalY,
        closestWorldX: rock.x + normalX * rock.radius,
        closestWorldY: rock.y + normalY * rock.radius,
        penetration: hitRadius - dist
      };
    }

    function getWallCarCollisionAt(bodyX, bodyY, bodyRadius, rock) {
      var deltaX = bodyX - rock.x;
      var deltaY = bodyY - rock.y;
      var cosR = Math.cos(rock.rotation);
      var sinR = Math.sin(rock.rotation);
      var localX = deltaX * cosR + deltaY * sinR;
      var localY = -deltaX * sinR + deltaY * cosR;
      var closestX = localX;
      var closestY = localY;
      var distX;
      var distY;
      var distSq;
      var dist;
      var normalLocalX;
      var normalLocalY;
      var normalX;
      var normalY;
      var closestWorldX;
      var closestWorldY;

      if (closestX > rock.halfLength) {
        closestX = rock.halfLength;
      }
      if (closestX < -rock.halfLength) {
        closestX = -rock.halfLength;
      }
      if (closestY > rock.halfWidth) {
        closestY = rock.halfWidth;
      }
      if (closestY < -rock.halfWidth) {
        closestY = -rock.halfWidth;
      }
      distX = localX - closestX;
      distY = localY - closestY;
      distSq = distX * distX + distY * distY;
      if (distSq >= bodyRadius * bodyRadius) {
        return null;
      }
      dist = Math.sqrt(distSq);
      if (dist > 0.001) {
        normalLocalX = distX / dist;
        normalLocalY = distY / dist;
      } else {
        normalLocalX = 1;
        normalLocalY = 0;
      }
      normalX = normalLocalX * cosR - normalLocalY * sinR;
      normalY = normalLocalX * sinR + normalLocalY * cosR;
      closestWorldX = rock.x + closestX * cosR - closestY * sinR;
      closestWorldY = rock.y + closestX * sinR + closestY * cosR;
      return {
        normalX: normalX,
        normalY: normalY,
        closestWorldX: closestWorldX,
        closestWorldY: closestWorldY,
        penetration: bodyRadius - dist
      };
    }

    function getRockCarCollisionAt(bodyX, bodyY, bodyAngle, bodyRadius, rock) {
      if (rock.kind === "boulder") {
        return getBoulderCarCollisionAt(bodyX, bodyY, bodyAngle, bodyRadius, rock);
      }
      return getWallCarCollisionAt(bodyX, bodyY, bodyRadius, rock);
    }

    function getRockCarCollision(rock) {
      return getRockCarCollisionAt(carWorldX, carWorldY, carAngle, CAR_RADIUS, rock);
    }

    function getEnemyCarCollision(enemy) {
      return getBoulderCarCollisionAt(carWorldX, carWorldY, carAngle, CAR_RADIUS, {
        x: enemy.x,
        y: enemy.y,
        radius: enemy.radius
      });
    }

    function getEnemySizeSpeedMultiplier(sizeScale) {
      return ENEMY_SPEED_AT_LARGE_SIZE +
        (1 - sizeScale) * (ENEMY_SPEED_AT_SMALL_SIZE - ENEMY_SPEED_AT_LARGE_SIZE);
    }

    function getEnemyChaseSpeedMax(enemy) {
      return MAX_SPEED * getEnemySizeSpeedMultiplier(enemy.sizeScale);
    }

    function getEnemyChaseSpeedMin(enemy) {
      return getEnemyChaseSpeedMax(enemy) * ENEMY_CHASE_SPEED_SPREAD;
    }

    function setEnemyWanderTargetSpeed(enemy) {
      var speedMin = getEnemyChaseSpeedMin(enemy);
      var speedMax = getEnemyChaseSpeedMax(enemy) * ENEMY_WANDER_SPEED_MAX_FRACTION;
      if (speedMax < speedMin) {
        speedMax = speedMin;
      }
      enemy.targetSpeed = speedMin + Math.random() * (speedMax - speedMin);
    }

    function setEnemyChaseTargetSpeed(enemy) {
      var chaseMin = getEnemyChaseSpeedMin(enemy);
      var chaseMax = getEnemyChaseSpeedMax(enemy);
      enemy.targetSpeed = chaseMin + Math.random() * (chaseMax - chaseMin);
    }

    function setEnemyPlayerCollisionTurnLock(enemy) {
      if (enemy.turnLockTimer < ENEMY_COLLISION_TURN_LOCK_SECONDS) {
        enemy.turnLockTimer = ENEMY_COLLISION_TURN_LOCK_SECONDS;
      }
    }

    function applyEnemyDamage(enemy, collision, collisionKind) {
      if (enemy.rockHitCooldown > 0) {
        return false;
      }
      enemy.health -= 1;
      enemy.rockHitCooldown = ROCK_HIT_COOLDOWN;
      enemy.speed = Math.max(ENEMY_SPEED_MIN * 0.55, enemy.speed - ROCK_SPEED_PENALTY);
      spawnCollisionEffectsAtWorld(
        collision.closestWorldX,
        collision.closestWorldY,
        collision.normalX,
        collision.normalY,
        collisionKind
      );
      if (enemy.health <= 0) {
        spawnDeathExplosionAtWorld(enemy.x, enemy.y, true);
        return true;
      }
      return false;
    }

    function pickCrystalDepositPattern(random, depositIndex) {
      var roll = random() + depositIndex * 0.173;
      while (roll >= 1) {
        roll -= 1;
      }
      while (roll < 0) {
        roll += 1;
      }
      if (roll < 0.3) {
        return CRYSTAL_DEPOSIT_PATTERN_BLOB;
      }
      if (roll < 0.5) {
        return CRYSTAL_DEPOSIT_PATTERN_LINE;
      }
      if (roll < 0.67) {
        return CRYSTAL_DEPOSIT_PATTERN_ARC;
      }
      if (roll < 0.82) {
        return CRYSTAL_DEPOSIT_PATTERN_RING;
      }
      return CRYSTAL_DEPOSIT_PATTERN_VEIN;
    }

    function isCrystalLocalInChunkBounds(localX, localY) {
      if (localX < 8 || localY < 8) {
        return false;
      }
      if (localX > CHUNK_SIZE - 8 || localY > CHUNK_SIZE - 8) {
        return false;
      }
      return true;
    }

    function collectCrystalSparkLocations(random, centerLocalX, centerLocalY, depositRadius, sparkCount, pattern) {
      var locations = [];
      var sparkIndex;
      var angle;
      var distance;
      var localX;
      var localY;
      var lineAngle;
      var lineLength;
      var cosA;
      var sinA;
      var perpX;
      var perpY;
      var alongT;
      var along;
      var perp;
      var arcSpan;
      var startAngle;
      var arcRadius;
      var ringRadius;
      var segmentCount;
      var veinHeading;
      var segmentIndex;
      var segmentLength;
      var pointCount;
      var pointIndex;
      var pointsX;
      var pointsY;
      var totalLength;
      var targetDistance;
      var walked;
      var segIndex;
      var segDx;
      var segDy;
      var segLength;

      if (pattern === CRYSTAL_DEPOSIT_PATTERN_LINE) {
        lineAngle = random() * Math.PI * 2;
        lineLength = depositRadius * (1.35 + random() * 0.95);
        cosA = Math.cos(lineAngle);
        sinA = Math.sin(lineAngle);
        perpX = -sinA;
        perpY = cosA;
        for (sparkIndex = 0; sparkIndex < sparkCount; sparkIndex += 1) {
          alongT = sparkCount > 1 ? sparkIndex / (sparkCount - 1) : 0.5;
          along = (alongT - 0.5) * lineLength;
          perp = (random() - 0.5) * 18;
          localX = centerLocalX + cosA * along + perpX * perp;
          localY = centerLocalY + sinA * along + perpY * perp;
          if (!isCrystalLocalInChunkBounds(localX, localY)) {
            continue;
          }
          locations.push({ localX: localX, localY: localY });
        }
        return locations;
      }

      if (pattern === CRYSTAL_DEPOSIT_PATTERN_ARC) {
        arcSpan = Math.PI * (0.5 + random() * 0.85);
        startAngle = random() * Math.PI * 2;
        arcRadius = depositRadius * (0.72 + random() * 0.38);
        for (sparkIndex = 0; sparkIndex < sparkCount; sparkIndex += 1) {
          alongT = sparkCount > 1 ? sparkIndex / (sparkCount - 1) : 0.5;
          angle = startAngle + alongT * arcSpan;
          distance = arcRadius * (0.86 + random() * 0.18);
          localX = centerLocalX + Math.cos(angle) * distance;
          localY = centerLocalY + Math.sin(angle) * distance;
          if (!isCrystalLocalInChunkBounds(localX, localY)) {
            continue;
          }
          locations.push({ localX: localX, localY: localY });
        }
        return locations;
      }

      if (pattern === CRYSTAL_DEPOSIT_PATTERN_RING) {
        ringRadius = depositRadius * (0.55 + random() * 0.42);
        for (sparkIndex = 0; sparkIndex < sparkCount; sparkIndex += 1) {
          angle = (sparkIndex / sparkCount) * Math.PI * 2 + random() * 0.22;
          distance = ringRadius + (random() - 0.5) * 14;
          localX = centerLocalX + Math.cos(angle) * distance;
          localY = centerLocalY + Math.sin(angle) * distance;
          if (!isCrystalLocalInChunkBounds(localX, localY)) {
            continue;
          }
          locations.push({ localX: localX, localY: localY });
        }
        return locations;
      }

      if (pattern === CRYSTAL_DEPOSIT_PATTERN_VEIN) {
        segmentCount = 2 + Math.floor(random() * 2);
        veinHeading = random() * Math.PI * 2;
        pointCount = segmentCount + 1;
        pointsX = [];
        pointsY = [];
        pointsX[0] = centerLocalX;
        pointsY[0] = centerLocalY;
        localX = centerLocalX;
        localY = centerLocalY;
        for (segmentIndex = 0; segmentIndex < segmentCount; segmentIndex += 1) {
          segmentLength = depositRadius * (0.3 + random() * 0.26);
          localX += Math.cos(veinHeading) * segmentLength;
          localY += Math.sin(veinHeading) * segmentLength;
          pointsX[segmentIndex + 1] = localX;
          pointsY[segmentIndex + 1] = localY;
          if (random() < 0.5) {
            veinHeading -= 0.95 + random() * 0.65;
          } else {
            veinHeading += 0.95 + random() * 0.65;
          }
        }
        totalLength = 0;
        for (pointIndex = 1; pointIndex < pointCount; pointIndex += 1) {
          segDx = pointsX[pointIndex] - pointsX[pointIndex - 1];
          segDy = pointsY[pointIndex] - pointsY[pointIndex - 1];
          totalLength += Math.sqrt(segDx * segDx + segDy * segDy);
        }
        if (totalLength < 1) {
          return locations;
        }
        for (sparkIndex = 0; sparkIndex < sparkCount; sparkIndex += 1) {
          targetDistance = (sparkIndex / sparkCount) * totalLength;
          walked = 0;
          for (segIndex = 1; segIndex < pointCount; segIndex += 1) {
            segDx = pointsX[segIndex] - pointsX[segIndex - 1];
            segDy = pointsY[segIndex] - pointsY[segIndex - 1];
            segLength = Math.sqrt(segDx * segDx + segDy * segDy);
            if (segLength < 0.001) {
              continue;
            }
            if (walked + segLength >= targetDistance) {
              alongT = (targetDistance - walked) / segLength;
              localX = pointsX[segIndex - 1] + segDx * alongT + (random() - 0.5) * 8;
              localY = pointsY[segIndex - 1] + segDy * alongT + (random() - 0.5) * 8;
              if (isCrystalLocalInChunkBounds(localX, localY)) {
                locations.push({ localX: localX, localY: localY });
              }
              break;
            }
            walked += segLength;
          }
        }
        return locations;
      }

      for (sparkIndex = 0; sparkIndex < sparkCount; sparkIndex += 1) {
        angle = random() * Math.PI * 2;
        distance = Math.pow(random(), 1.85) * depositRadius;
        localX = centerLocalX + Math.cos(angle) * distance;
        localY = centerLocalY + Math.sin(angle) * distance;
        if (!isCrystalLocalInChunkBounds(localX, localY)) {
          continue;
        }
        locations.push({ localX: localX, localY: localY });
      }
      return locations;
    }

    function buildCrystalDeposit(random, chunkX, chunkY, depositIndex, entities, rocks) {
      var margin = 56;
      var centerLocalX = margin + random() * (CHUNK_SIZE - margin * 2);
      var centerLocalY = margin + random() * (CHUNK_SIZE - margin * 2);
      var centerWorldX = chunkX * CHUNK_SIZE + centerLocalX;
      var centerWorldY = chunkY * CHUNK_SIZE + centerLocalY;
      var depositRadius = 72 + random() * 88;
      var densityMultiplier = 1 + random();
      var sparkCount = Math.floor((90 + random() * 110) * densityMultiplier);
      var rarityPrimary = pickCrystalRarity(random);
      var raritySecondary = pickSecondCrystalRarity(random, rarityPrimary);
      var pattern = pickCrystalDepositPattern(random, depositIndex);
      var locations = [];
      var locationIndex;
      var crystals = [];
      var localX;
      var localY;
      var worldX;
      var worldY;
      var rockIndex;
      var rock;
      var deltaX;
      var deltaY;
      var rockDist;
      var tooCloseToRock;
      var sparkRarity;

      if (!isFarEnoughFromEntities(entities, centerWorldX, centerWorldY, depositRadius + 40)) {
        return crystals;
      }

      for (rockIndex = 0; rockIndex < rocks.length; rockIndex += 1) {
        rock = rocks[rockIndex];
        deltaX = rock.x - centerWorldX;
        deltaY = rock.y - centerWorldY;
        rockDist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
        if (rockDist < depositRadius + getRockExtentRadius(rock) + 24) {
          return crystals;
        }
      }

      entities.push({ x: centerWorldX, y: centerWorldY });
      locations = collectCrystalSparkLocations(
        random,
        centerLocalX,
        centerLocalY,
        depositRadius,
        sparkCount,
        pattern
      );

      for (locationIndex = 0; locationIndex < locations.length; locationIndex += 1) {
        localX = locations[locationIndex].localX;
        localY = locations[locationIndex].localY;
        worldX = chunkX * CHUNK_SIZE + localX;
        worldY = chunkY * CHUNK_SIZE + localY;
        tooCloseToRock = false;
        for (rockIndex = 0; rockIndex < rocks.length; rockIndex += 1) {
          rock = rocks[rockIndex];
          deltaX = rock.x - worldX;
          deltaY = rock.y - worldY;
          rockDist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
          if (rockDist < getRockExtentRadius(rock) + 10) {
            tooCloseToRock = true;
            break;
          }
        }
        if (tooCloseToRock) {
          continue;
        }
        if (random() < 0.5) {
          sparkRarity = rarityPrimary;
        } else {
          sparkRarity = raritySecondary;
        }
        crystals.push({
          x: worldX,
          y: worldY,
          size: getCrystalSparkSize(sparkRarity, random),
          twinkle: random() * Math.PI * 2,
          twinkleSpeed: 2.5 + random() * 4,
          rarity: sparkRarity,
          collected: false,
          collecting: false
        });
      }

      return crystals;
    }

    function buildChunkEntities(chunkX, chunkY) {
      var random = createChunkRandom(chunkX, chunkY);
      var crystals = [];
      var rocks = [];
      var entities = [];
      var margin = 64;
      var rockDensity = getChunkRockDensity(random);
      var wallChainCount = getWallChainCountForDensity(rockDensity, random);
      var boulderCount = getBoulderCountForDensity(rockDensity, random);
      var wallChainIndex;
      var wallChain;
      var branchChance;
      var maxWallSegments;
      var boulderIndex;
      var chunkBoulders;
      var depositCount = 0;
      var depositIndex;
      var depositCrystals;

      for (wallChainIndex = 0; wallChainIndex < wallChainCount; wallChainIndex += 1) {
        branchChance = getWallBranchChanceForDensity(rockDensity, random);
        maxWallSegments = getWallMaxSegmentsForDensity(rockDensity, random);
        wallChain = buildRockWallChain(random, chunkX, chunkY, entities, margin, branchChance, maxWallSegments);
        var wallIndex;
        for (wallIndex = 0; wallIndex < wallChain.length; wallIndex += 1) {
          rocks.push(wallChain[wallIndex]);
        }
      }

      chunkBoulders = buildChunkBoulders(random, chunkX, chunkY, rocks, entities, margin, boulderCount);
      for (boulderIndex = 0; boulderIndex < chunkBoulders.length; boulderIndex += 1) {
        rocks.push(chunkBoulders[boulderIndex]);
      }

      if (random() < 0.82) {
        depositCount = 1;
      }
      if (random() < 0.34) {
        depositCount = 2;
      }

      for (depositIndex = 0; depositIndex < depositCount; depositIndex += 1) {
        depositCrystals = buildCrystalDeposit(random, chunkX, chunkY, depositIndex, entities, rocks);
        var crystalIndex;
        for (crystalIndex = 0; crystalIndex < depositCrystals.length; crystalIndex += 1) {
          crystals.push(depositCrystals[crystalIndex]);
        }
      }

      return {
        chunkX: chunkX,
        chunkY: chunkY,
        seed: hashSeed(chunkX * 991 + chunkY * 997 + worldSeed),
        crystals: crystals,
        rocks: rocks,
        surfaceCanvas: null
      };
    }

    function getLoadedChunk(chunkX, chunkY) {
      return chunks[chunkKey(chunkX, chunkY)] || null;
    }

    function preloadChunksAroundWorld(worldX, worldY) {
      var centerChunkX = worldToChunk(worldX);
      var centerChunkY = worldToChunk(worldY);
      var offsetX;
      var offsetY;
      for (offsetY = -CHUNK_LOAD_RADIUS; offsetY <= CHUNK_LOAD_RADIUS; offsetY += 1) {
        for (offsetX = -CHUNK_LOAD_RADIUS; offsetX <= CHUNK_LOAD_RADIUS; offsetX += 1) {
          getChunk(centerChunkX + offsetX, centerChunkY + offsetY);
        }
      }
    }

    function getChunk(chunkX, chunkY) {
      var key = chunkKey(chunkX, chunkY);
      var chunk = chunks[key];
      if (!chunk) {
        chunk = buildChunkEntities(chunkX, chunkY);
        chunks[key] = chunk;
        chunkKeys.push(key);
        buildChunkSurface(chunk);
        paintCrystalGroundTints(chunk);
      }
      return chunk;
    }

    function buildChunkSurface(chunk) {
      var surfaceCanvas = acquireChunkSurfaceCanvas();
      var surfaceContext = surfaceCanvas.getContext("2d");
      var random = createChunkRandom(chunk.chunkX * 17 + 3, chunk.chunkY * 31 + 7);
      var baseHue = 28 + chunk.seed * 14;
      var baseR = 130 + chunk.seed * 35;
      var baseG = 105 + chunk.seed * 25;
      var baseB = 72 + chunk.seed * 18;
      var patchCount;
      var patchIndex;
      var crackCount;
      var crackIndex;
      var pebbleCount;
      var pebbleIndex;
      var x;
      var y;
      var radius;
      var shade;

      surfaceContext.fillStyle = "rgb(" + Math.floor(baseR) + "," + Math.floor(baseG) + "," + Math.floor(baseB) + ")";
      surfaceContext.fillRect(0, 0, CHUNK_SIZE, CHUNK_SIZE);

      patchCount = 18 + Math.floor(random() * 14);
      for (patchIndex = 0; patchIndex < patchCount; patchIndex += 1) {
        x = random() * CHUNK_SIZE;
        y = random() * CHUNK_SIZE;
        radius = 20 + random() * 80;
        shade = 0.75 + random() * 0.35;
        surfaceContext.fillStyle = "rgba(" +
          Math.floor(baseR * shade) + "," +
          Math.floor(baseG * shade) + "," +
          Math.floor(baseB * shade) + ",0.45)";
        surfaceContext.beginPath();
        surfaceContext.ellipse(x, y, radius, radius * (0.6 + random() * 0.5), random() * Math.PI, 0, Math.PI * 2);
        surfaceContext.fill();
      }

      crackCount = 6 + Math.floor(random() * 8);
      for (crackIndex = 0; crackIndex < crackCount; crackIndex += 1) {
        x = random() * CHUNK_SIZE;
        y = random() * CHUNK_SIZE;
        surfaceContext.strokeStyle = "rgba(" +
          Math.floor(baseR * 0.55) + "," +
          Math.floor(baseG * 0.5) + "," +
          Math.floor(baseB * 0.42) + ",0.35)";
        surfaceContext.lineWidth = 1 + random() * 1.5;
        surfaceContext.beginPath();
        surfaceContext.moveTo(x, y);
        var segment;
        for (segment = 0; segment < 3 + Math.floor(random() * 4); segment += 1) {
          x += (random() - 0.5) * 70;
          y += (random() - 0.5) * 70;
          surfaceContext.lineTo(x, y);
        }
        surfaceContext.stroke();
      }

      pebbleCount = 40 + Math.floor(random() * 50);
      for (pebbleIndex = 0; pebbleIndex < pebbleCount; pebbleIndex += 1) {
        x = random() * CHUNK_SIZE;
        y = random() * CHUNK_SIZE;
        shade = 0.5 + random() * 0.5;
        surfaceContext.fillStyle = "rgba(" +
          Math.floor(baseR * shade) + "," +
          Math.floor(baseG * shade) + "," +
          Math.floor(baseB * shade) + ",0.55)";
        surfaceContext.beginPath();
        surfaceContext.arc(x, y, 1 + random() * 2.5, 0, Math.PI * 2);
        surfaceContext.fill();
      }

      chunk.surfaceCanvas = surfaceCanvas;
    }

    function paintCrystalGroundTints(chunk) {
      var surfaceContext;
      var crystalIndex;
      var crystal;
      var localX;
      var localY;
      var rgb;
      var radius;
      if (!chunk.surfaceCanvas) {
        return;
      }
      surfaceContext = chunk.surfaceCanvas.getContext("2d");
      for (crystalIndex = 0; crystalIndex < chunk.crystals.length; crystalIndex += 1) {
        crystal = chunk.crystals[crystalIndex];
        localX = crystal.x - chunk.chunkX * CHUNK_SIZE;
        localY = crystal.y - chunk.chunkY * CHUNK_SIZE;
        rgb = getCrystalColorRgb(crystal.rarity);
        radius = 3 + crystal.size * 2.2;
        surfaceContext.fillStyle = "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ",0.09)";
        surfaceContext.beginPath();
        surfaceContext.arc(localX, localY, radius, 0, Math.PI * 2);
        surfaceContext.fill();
      }
    }

    function updateChunksAroundCar() {
      rebaseWorldCoordinates();
      var carChunkX = worldToChunk(carWorldX);
      var carChunkY = worldToChunk(carWorldY);
      var offsetX;
      var offsetY;
      var chunkX;
      var chunkY;

      for (offsetY = -CHUNK_LOAD_RADIUS; offsetY <= CHUNK_LOAD_RADIUS; offsetY += 1) {
        for (offsetX = -CHUNK_LOAD_RADIUS; offsetX <= CHUNK_LOAD_RADIUS; offsetX += 1) {
          chunkX = carChunkX + offsetX;
          chunkY = carChunkY + offsetY;
          getChunk(chunkX, chunkY);
        }
      }

      var keyIndex;
      var key;
      var chunk;
      var removeKeys = [];
      for (keyIndex = chunkKeys.length - 1; keyIndex >= 0; keyIndex -= 1) {
        key = chunkKeys[keyIndex];
        chunk = chunks[key];
        if (!chunk) {
          chunkKeys.splice(keyIndex, 1);
          continue;
        }
        if (Math.abs(chunk.chunkX - carChunkX) > CHUNK_UNLOAD_RADIUS ||
          Math.abs(chunk.chunkY - carChunkY) > CHUNK_UNLOAD_RADIUS) {
          removeKeys.push(key);
        }
      }

      var removeIndex;
      for (removeIndex = 0; removeIndex < removeKeys.length; removeIndex += 1) {
        key = removeKeys[removeIndex];
        chunk = chunks[key];
        releaseChunkResources(chunk);
        delete chunks[key];
        keyIndex = chunkKeys.indexOf(key);
        if (keyIndex >= 0) {
          chunkKeys.splice(keyIndex, 1);
        }
      }
    }

    function getHealthDamageFraction() {
      var halfHealth;
      if (health <= 0) {
        return 1;
      }
      halfHealth = MAX_HEALTH * HEALTH_VIGNETTE_FRACTION;
      if (health > halfHealth) {
        return 0;
      }
      return 1 - health / halfHealth;
    }

    function getVignetteInnerPercent(damageFraction) {
      return 58 - damageFraction * 54;
    }

    function getVignetteOpacity(damageFraction) {
      return 0.68 + damageFraction * 0.3;
    }

    function getVignetteEdgeColor(damageFraction) {
      var red = Math.floor(48 + damageFraction * 72);
      var alpha = 0.86 + damageFraction * 0.13;
      return "rgba(" + red + ", 8, 4, " + alpha + ")";
    }

    function updateCheckEngineHud() {

      checkEngineIcon.classList.remove("check-engine-off", "check-engine-warn", "check-engine-crit");

        checkEngineIcon.classList.add("check-engine-crit");
      } else if (healthFraction <= CHECK_ENGINE_WARN_HEALTH_FRACTION) {
        checkEngineIcon.classList.add("check-engine-warn");
      } else {

    function buildSpeedGaugeTicks() {
      var tickIndex;
      var tickCount = 9;
      var tickAngle;
      var tickRadians;
      var innerRadius = 40;
      var outerRadius = 46;
      var centerX = SPEED_GAUGE_PIVOT_X;
      var centerY = SPEED_GAUGE_PIVOT_Y;
      var tickLine;
      var angleStep = (SPEED_GAUGE_NEEDLE_ANGLE_MAX - SPEED_GAUGE_NEEDLE_ANGLE_MIN) / (tickCount - 1);
      speedGaugeTicks.textContent = "";
      for (tickIndex = 0; tickIndex < tickCount; tickIndex += 1) {
        tickAngle = SPEED_GAUGE_NEEDLE_ANGLE_MIN + angleStep * tickIndex;
        tickRadians = tickAngle * Math.PI / 180;
        tickLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
        tickLine.setAttribute("class", "speed-gauge-tick");
        tickLine.setAttribute(
          "x1",
          String(centerX + Math.sin(tickRadians) * innerRadius)
        );
        tickLine.setAttribute(
          "y1",
          String(centerY - Math.cos(tickRadians) * innerRadius)
        );
        tickLine.setAttribute(
          "x2",
          String(centerX + Math.sin(tickRadians) * outerRadius)
        );
        tickLine.setAttribute(
          "y2",
          String(centerY - Math.cos(tickRadians) * outerRadius)
        );
        speedGaugeTicks.appendChild(tickLine);
      }
    }

    function updateCarFrontWheelSteer(deltaSeconds) {
      var steerBlend;
      var steerDegrees;
      if (carFrontSteerTarget > CAR_FRONT_STEER_MAX) {
        carFrontSteerTarget = CAR_FRONT_STEER_MAX;
      }
      if (carFrontSteerTarget < -CAR_FRONT_STEER_MAX) {
        carFrontSteerTarget = -CAR_FRONT_STEER_MAX;
      }
      steerBlend = 1 - Math.exp(-CAR_FRONT_STEER_SMOOTH * deltaSeconds);
      if (steerBlend > 1) {
        steerBlend = 1;
      }
      carFrontSteerAngle += (carFrontSteerTarget - carFrontSteerAngle) * steerBlend;
      steerDegrees = carFrontSteerAngle * (180 / Math.PI);
      carFrontWheelLeft.setAttribute(
        "transform",
        "translate(" + CAR_FRONT_WHEEL_LEFT_X + ", " + CAR_FRONT_WHEEL_LEFT_Y + ") rotate(" + steerDegrees + ")"
      );
      carFrontWheelRight.setAttribute(
        "transform",
        "translate(" + CAR_FRONT_WHEEL_RIGHT_X + ", " + CAR_FRONT_WHEEL_RIGHT_Y + ") rotate(" + steerDegrees + ")"

    function updateDamageVignette(flash) {
      var damageFraction = getHealthDamageFraction();
      var innerPercent = getVignetteInnerPercent(damageFraction);
      var vignetteOpacity = getVignetteOpacity(damageFraction);
      var vignetteEdge = getVignetteEdgeColor(damageFraction);

      updateCarDamageVisuals();
      updateCheckEngineHud();

      if (damageFraction > 0) {
        damageVignette.style.setProperty("--vignette-inner", innerPercent + "%");
        damageVignette.style.setProperty("--vignette-opacity", String(vignetteOpacity));
        damageVignette.style.setProperty("--vignette-edge", vignetteEdge);
        damageVignette.classList.add("is-visible");
      } else if (health <= 0) {
        damageVignette.style.setProperty("--vignette-inner", "0%");
        damageVignette.style.setProperty("--vignette-opacity", "1");
        damageVignette.style.setProperty("--vignette-edge", getVignetteEdgeColor(1));
        damageVignette.classList.add("is-visible");
      } else {
        damageVignette.classList.remove("is-visible");
      }
      if (flash) {
        damageVignette.classList.remove("is-flash");
        void damageVignette.offsetWidth;
        damageVignette.classList.add("is-flash");
      } else {
        damageVignette.classList.remove("is-flash");
        damageVignette.style.removeProperty("opacity");
        damageVignette.style.removeProperty("filter");
      }
    }

    function drawCrystalPreviewOnCanvas(canvas, rarity, twinkle) {
      var previewContext = canvas.getContext("2d");
      var canvasSize = canvas.width;
      var center = canvasSize * 0.5;
      var rgb = getCrystalColorRgb(rarity);
      var twinkleScale = 0.72 + Math.sin(twinkle) * 0.28;
      var sparkSize = RARITY_SIZE[rarity] * twinkleScale * 3.1;
      var glowAlpha = 0.12 + RARITY_GLOW[rarity] * 0.28;
      var glowRadius = sparkSize * RARITY_GLOW_RADIUS[rarity];
      var gradient;
      previewContext.clearRect(0, 0, canvasSize, canvasSize);
      gradient = previewContext.createRadialGradient(center, center, 0, center, center, glowRadius);
      gradient.addColorStop(0, "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + "," + glowAlpha + ")");
      gradient.addColorStop(1, "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ",0)");
      previewContext.fillStyle = gradient;
      previewContext.beginPath();
      previewContext.arc(center, center, glowRadius, 0, Math.PI * 2);
      previewContext.fill();
      previewContext.fillStyle = "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")";
      previewContext.beginPath();
      previewContext.arc(center, center, sparkSize, 0, Math.PI * 2);
      previewContext.fill();
      previewContext.fillStyle = "rgba(255, 255, 255, " + (0.35 + twinkleScale * 0.35) + ")";
      previewContext.beginPath();
      previewContext.arc(center - sparkSize * 0.25, center - sparkSize * 0.25, sparkSize * 0.35, 0, Math.PI * 2);
      previewContext.fill();
    }

    function updateSpeedGauge() {
      var speedRange = MAX_SPEED - MIN_SPEED;
      var speedFactor = 0;
      var needleAngle;
      var arcFillLength = 0;
      var arcGapLength = SPEED_GAUGE_ARC_FILL_LENGTH;
      if (speedRange > 0) {
        speedFactor = (carSpeed - MIN_SPEED) / speedRange;
      }
      if (speedFactor < 0) {
        speedFactor = 0;
      }
      if (speedFactor > 1) {
        speedFactor = 1;
      }
      needleAngle =
        SPEED_GAUGE_NEEDLE_ANGLE_MIN +
        (SPEED_GAUGE_NEEDLE_ANGLE_MAX - SPEED_GAUGE_NEEDLE_ANGLE_MIN) * speedFactor;
      speedGaugeNeedle.setAttribute(
        "transform",
        "rotate(" + needleAngle + " " + SPEED_GAUGE_PIVOT_X + " " + SPEED_GAUGE_PIVOT_Y + ")"
      );
      arcFillLength = SPEED_GAUGE_ARC_FILL_LENGTH * speedFactor;
      arcGapLength = SPEED_GAUGE_ARC_FILL_LENGTH - arcFillLength;
      if (arcGapLength < 0) {
        arcGapLength = 0;

    function spawnScoreParticles(screenX, screenY, red, green, blue, sparkSize, particleCount) {
      var count = particleCount;
      var particleIndex;
      var angle;
      var speed;
      var particle;
      if (count === undefined) {
        count = 2;
      }
      if (count > 12) {
        count = 12;
      }
      for (particleIndex = 0; particleIndex < count; particleIndex += 1) {
        angle = Math.random() * Math.PI * 2;
        speed = 25 + Math.random() * 60;
        if (particles.length >= SCORE_PARTICLE_MAX) {
          releaseScoreParticle(particles.shift());
        }
        particle = acquireScoreParticle();
        particle.kind = "score";

    function getTireTrailPathLength(trail) {
      var totalLength = 0;
      var pointIndex;
      var deltaX;
      var deltaY;
      for (pointIndex = 1; pointIndex < trail.length; pointIndex += 1) {
        deltaX = trail[pointIndex].x - trail[pointIndex - 1].x;
        deltaY = trail[pointIndex].y - trail[pointIndex - 1].y;
        totalLength += Math.sqrt(deltaX * deltaX + deltaY * deltaY);
      }
      return totalLength;
    }

    function trimTireTrail(trail) {
      while (trail.length > 2 && getTireTrailPathLength(trail) > TIRE_TRACK_MAX_PATH_LENGTH) {
        trail.shift();
      }
    }

    function getCarWheelWorldPosition(wheelSvgX, wheelSvgY) {
      var lateralSvg = wheelSvgX - CAR_SVG_CENTER_X;
      var rearSvg = wheelSvgY - CAR_SVG_CENTER_Y;
      var backAngle = carAngle + Math.PI;
      var rightAngle = carAngle + Math.PI * 0.5;
      var rearWorldDistance = rearSvg * CAR_WHEEL_SVG_TO_WORLD;
      var lateralWorldDistance = lateralSvg * CAR_WHEEL_SVG_TO_WORLD;
      return {
        x: carWorldX + Math.cos(backAngle) * rearWorldDistance + Math.cos(rightAngle) * lateralWorldDistance,
        y: carWorldY + Math.sin(backAngle) * rearWorldDistance + Math.sin(rightAngle) * lateralWorldDistance
      };
    }

    function getCarRearWheelTrailPosition(isLeftWheel) {
      var wheelSvgX = isLeftWheel ? CAR_REAR_WHEEL_LEFT_SVG_X : CAR_REAR_WHEEL_RIGHT_SVG_X;
      var wheelCenter = getCarWheelWorldPosition(wheelSvgX, CAR_REAR_WHEEL_SVG_Y);
      var backAngle = carAngle + Math.PI;
      var halfWheelBack = CAR_WHEEL_HALF_LENGTH_SVG * CAR_WHEEL_SVG_TO_WORLD;
      return {
        x: wheelCenter.x + Math.cos(backAngle) * halfWheelBack,
        y: wheelCenter.y + Math.sin(backAngle) * halfWheelBack
      };
    }

    function appendTireTrailPoints() {
      var leftWheelCenter = getCarWheelWorldPosition(CAR_REAR_WHEEL_LEFT_SVG_X, CAR_REAR_WHEEL_SVG_Y);
      var rightWheelCenter = getCarWheelWorldPosition(CAR_REAR_WHEEL_RIGHT_SVG_X, CAR_REAR_WHEEL_SVG_Y);

      tireTrailLeft.push({
        x: leftWheelCenter.x,
        y: leftWheelCenter.y
      });
      tireTrailRight.push({
        x: rightWheelCenter.x,
        y: rightWheelCenter.y
      });

    function updateTireTrails(moveDistance) {
      if (moveDistance < 0.01 || carSpeed < TIRE_TRACK_MIN_SPEED) {
        return;
      }
      tireTrailDistanceSinceLastPoint += moveDistance;
      if (tireTrailDistanceSinceLastPoint < TIRE_TRACK_STEP_DISTANCE) {
        return;
      }
      tireTrailDistanceSinceLastPoint = 0;
      appendTireTrailPoints();
      trimTireTrail(tireTrailLeft);
      trimTireTrail(tireTrailRight);
    }

    function drawTireTrail(trail) {
      var segmentCount;
      var segmentIndex;
      var startScreen;
      var endScreen;
      var alpha;

      if (trail.length < 2) {
        return;
      }

      segmentCount = trail.length - 1;
      context.save();
      context.lineCap = "round";
      context.lineJoin = "round";
      context.lineWidth = TIRE_TRACK_LINE_WIDTH;

      for (segmentIndex = 0; segmentIndex < segmentCount; segmentIndex += 1) {
        alpha = 0.18 + (segmentIndex / segmentCount) * 0.32;
        context.strokeStyle = "rgba(95, 78, 58, " + alpha + ")";
        startScreen = worldToScreen(trail[segmentIndex].x, trail[segmentIndex].y);
        endScreen = worldToScreen(trail[segmentIndex + 1].x, trail[segmentIndex + 1].y);
        context.beginPath();
        context.moveTo(startScreen.x, startScreen.y);
        context.lineTo(endScreen.x, endScreen.y);
        context.stroke();
      }

      context.restore();
    }

    function drawTireTrails() {
      drawTireTrail(tireTrailLeft);
      drawTireTrail(tireTrailRight);
    }

    function updateCrystalAnimations(deltaSeconds) {
      var carChunkX = worldToChunk(carWorldX);
      var carChunkY = worldToChunk(carWorldY);
      var offsetX;
      var offsetY;
      var chunk;
      var crystalIndex;
      var crystal;

      for (offsetY = -CHUNK_LOAD_RADIUS; offsetY <= CHUNK_LOAD_RADIUS; offsetY += 1) {
        for (offsetX = -CHUNK_LOAD_RADIUS; offsetX <= CHUNK_LOAD_RADIUS; offsetX += 1) {
          chunk = getChunk(carChunkX + offsetX, carChunkY + offsetY);
          for (crystalIndex = 0; crystalIndex < chunk.crystals.length; crystalIndex += 1) {
            crystal = chunk.crystals[crystalIndex];
            if (!crystal.collected && !crystal.collecting) {
              crystal.twinkle += crystal.twinkleSpeed * deltaSeconds;
            }
          }
        }
      }
    }

    function updateCrystalMagnet(deltaSeconds) {
      var carChunkX = worldToChunk(carWorldX);
      var carChunkY = worldToChunk(carWorldY);
      var offsetX;
      var offsetY;
      var chunk;
      var crystalIndex;
      var crystal;
      var deltaX;
      var deltaY;
      var dist;
      var pullStrength;
      var magnetRange = CAR_RADIUS + CRYSTAL_MAGNET_RADIUS;

      for (offsetY = -1; offsetY <= 1; offsetY += 1) {
        for (offsetX = -1; offsetX <= 1; offsetX += 1) {
          chunk = getChunk(carChunkX + offsetX, carChunkY + offsetY);
          for (crystalIndex = 0; crystalIndex < chunk.crystals.length; crystalIndex += 1) {
            crystal = chunk.crystals[crystalIndex];
            if (crystal.collected || crystal.collecting) {
              continue;
            }
            deltaX = crystal.x - carWorldX;
            deltaY = crystal.y - carWorldY;
            dist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            if (dist < CAR_RADIUS + CRYSTAL_PICKUP_RADIUS) {
              collectCrystal(crystal);
            } else if (dist < magnetRange) {
              pullStrength = (1 - dist / magnetRange) * 160 * deltaSeconds;
              if (dist > 0.001) {
                crystal.x -= (deltaX / dist) * pullStrength;
                crystal.y -= (deltaY / dist) * pullStrength;
              }
            }
          }
        }
      }
    }

      }
      return angleDiff;
    }
