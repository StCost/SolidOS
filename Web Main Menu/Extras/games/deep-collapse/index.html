          burn = burns[burnIndex];
          if (burn.col === col && burn.row === row) {
            if (heat > burn.heat) {
              burn.heat = heat;
            }
            return;
          }
        }
        addBurn(col, row, heat, red, green, blue, 0);
      }

      function canBurnSpreadDiagonal(burnCol, burnRow, dirCol, dirRow) {
        var sideCol;
        var sideRow;
        var sideIndex;
        sideCol = burnCol + dirCol;
        sideRow = burnRow;
        if (sideCol < 0 || sideCol >= gridCols || sideRow < 0 || sideRow >= gridRows) {
          return false;
        }
        sideIndex = cellIndex(sideCol, sideRow);
        if (cells[sideIndex] !== CELL_EMPTY) {
          return false;
        }
        sideCol = burnCol;
        sideRow = burnRow + dirRow;
        if (sideCol < 0 || sideCol >= gridCols || sideRow < 0 || sideRow >= gridRows) {
          return false;
        }
        sideIndex = cellIndex(sideCol, sideRow);
        if (cells[sideIndex] !== CELL_EMPTY) {
          return false;
        }
        return true;
      }

      function ensureTunnelPathBuffers() {
        if (!tunnelPathCol || tunnelPathCol.length < BURN_TUNNEL_MAX_WALL + 1) {
          tunnelPathCol = new Int16Array(BURN_TUNNEL_MAX_WALL + 1);
          tunnelPathRow = new Int16Array(BURN_TUNNEL_MAX_WALL + 1);
        }
      }

      function trySpreadBurnThroughWall(burnCol, burnRow, dirCol, dirRow, isDiagonal, burnHeat, burnRed, burnGreen, burnBlue, spreadSeen, dirtyCount) {
        var step;
        var scanCol;
        var scanRow;
        var index;
        var cell;
        var wallCount;
        var maxWall;
        var pathCount;
        var pathIndex;
        var spreadKey;
        var spreadHeat;
        var pathCol;
        var pathRow;
        var rarity;
        var clusterPickup;
        var collectResult;
        var cellsSpread;
        var totalBoostGain;
        var totalScoreEarned;
        var effectSumX;
        var effectSumY;
        var effectWeight;
        var endCol;
        var endRow;
        var endHeat;

        cellsSpread = 0;
        totalBoostGain = 0;
        totalScoreEarned = 0;
        effectSumX = 0;
        effectSumY = 0;
        effectWeight = 0;
        endCol = burnCol;
        endRow = burnRow;
        endHeat = burnHeat;
        maxWall = isDiagonal ? 1 : BURN_TUNNEL_MAX_WALL;
        if (isDiagonal && !canBurnSpreadDiagonal(burnCol, burnRow, dirCol, dirRow)) {
          return null;
        }
        ensureTunnelPathBuffers();
        wallCount = 0;
        pathCount = 0;
        scanCol = burnCol + dirCol;
        scanRow = burnRow + dirRow;
        for (step = 1; step <= maxWall + 1; step += 1) {
          if (scanCol < 0 || scanCol >= gridCols || scanRow < 0 || scanRow >= gridRows) {
            return null;
          }
          if (isDiagonal && step > 1 && !canBurnSpreadDiagonal(scanCol - dirCol, scanRow - dirRow, dirCol, dirRow)) {
            return null;
          }
          spreadKey = scanCol * 4099 + scanRow;
          if (spreadSeen[spreadKey]) {
            return null;
          }
          index = cellIndex(scanCol, scanRow);
          cell = cells[index];
          if (cell === CELL_EMPTY) {
            return null;
          }
          if (isCrystalCell(cell)) {
            spreadHeat = burnHeat;
            for (pathIndex = 0; pathIndex < pathCount; pathIndex += 1) {
              pathCol = tunnelPathCol[pathIndex];
              pathRow = tunnelPathRow[pathIndex];
              if (isDiagonal) {
                spreadHeat = spreadHeat * BURN_DIAGONAL_PASS_HEAT_MULT;
              } else {
                spreadHeat = spreadHeat * BURN_DIRT_PASS_HEAT_MULT;
              }
              spreadKey = pathCol * 4099 + pathRow;
              spreadSeen[spreadKey] = 1;
              index = cellIndex(pathCol, pathRow);
              cells[index] = CELL_EMPTY;
              crystalClusterId[index] = 0;
              dirtyCount = markDirtyPaintCell(pathCol, pathRow, dirtyCount);
              addBurnOrRefresh(pathCol, pathRow, spreadHeat, burnRed, burnGreen, burnBlue);
              cellsSpread += 1;
            }
            spreadKey = scanCol * 4099 + scanRow;
            spreadSeen[spreadKey] = 1;
            rarity = cell - CELL_CRYSTAL_BASE;
            clusterPickup = collectCrystalCluster(scanCol, scanRow, rarity, crystalMarksBuffer, dirtyCount);
            dirtyCount = clusterPickup.dirtyCount;
            if (clusterPickup.pixelCount > 0) {
              collectResult = collectCrystal(clusterPickup);
              totalBoostGain = collectResult.boostGain;
              totalScoreEarned = collectResult.earned;
              playCrystalCollectSounds(1);
            }
            effectSumX = clusterPickup.worldX * clusterPickup.pixelCount;
            effectSumY = clusterPickup.worldY * clusterPickup.pixelCount;
            effectWeight = clusterPickup.pixelCount;
            endCol = scanCol;
            endRow = scanRow;
            endHeat = BURN_ORE_REFRESH_HEAT;
            addBurnOrRefresh(scanCol, scanRow, endHeat, burnRed, burnGreen, burnBlue);
            cellsSpread += 1;
            return {
              cellsSpread: cellsSpread,
              dirtyCount: dirtyCount,
              boostGain: totalBoostGain,
              scoreEarned: totalScoreEarned,
              effectSumX: effectSumX,
              effectSumY: effectSumY,
              effectWeight: effectWeight,
              endCol: endCol,
              endRow: endRow,
              endHeat: endHeat
            };
          }
          if (wallCount >= maxWall) {
            return null;
          }
          tunnelPathCol[pathCount] = scanCol;
          tunnelPathRow[pathCount] = scanRow;
          pathCount += 1;
          wallCount += 1;
          scanCol += dirCol;
          scanRow += dirRow;
        }
        return null;
      }

      function enqueueBurnSpread(col, row, heat, red, green, blue, queueCount) {
        if (queueCount >= BURN_SPREAD_QUEUE_SIZE) {
          return queueCount;
        }
        burnSpreadQueueCol[queueCount] = col;
        burnSpreadQueueRow[queueCount] = row;
        burnSpreadQueueHeat[queueCount] = heat;
        burnSpreadQueueRed[queueCount] = red;
        burnSpreadQueueGreen[queueCount] = green;
        burnSpreadQueueBlue[queueCount] = blue;
        return queueCount + 1;
      }

      function processBurnChainReaction() {
        var spreadCount = 0;
        var burnIndex;
        var burn;
        var queueIndex;
        var queueCount;
        var burnCol;
        var burnRow;
        var burnHeat;
        var burnRed;
        var burnGreen;
        var burnBlue;
        var directionIndex;
        var direction;
        var neighborCol;
        var neighborRow;
        var index;
        var cell;
        var rarity;
        var clusterPickup;
        var collectResult;
        var totalBoostGain = 0;
        var totalScoreEarned = 0;
        var effectSumX = 0;
        var effectSumY = 0;
        var effectWeight = 0;
        var spreadHeat;
        var dirtyCount = 0;
        var spreadKey;
        var spreadSeen = {};
        var isDiagonal;
        var tunnelResult;
        if (burns.length === 0) {
          return;
        }
        ensureGridWorkBuffers();
        clearAllCrystalMarks();
        ensureBurnSpreadQueue();
        queueCount = 0;
        for (burnIndex = 0; burnIndex < burns.length; burnIndex += 1) {
          burn = burns[burnIndex];
          if (burn.heat < BURN_SPREAD_MIN_HEAT || burn.spreadDelay > 0) {
            continue;
          }
          queueCount = enqueueBurnSpread(burn.col, burn.row, burn.heat, burn.red, burn.green, burn.blue, queueCount);
        }
        queueIndex = 0;
        while (queueIndex < queueCount && spreadCount < MAX_BURN_SPREAD_PER_FRAME) {
          burnCol = burnSpreadQueueCol[queueIndex];
          burnRow = burnSpreadQueueRow[queueIndex];
          burnHeat = burnSpreadQueueHeat[queueIndex];
          burnRed = burnSpreadQueueRed[queueIndex];
          burnGreen = burnSpreadQueueGreen[queueIndex];
          burnBlue = burnSpreadQueueBlue[queueIndex];
          queueIndex += 1;
          if (burnHeat < BURN_SPREAD_MIN_HEAT) {
            continue;
          }
          for (directionIndex = 0; directionIndex < GROW_DIRECTIONS.length; directionIndex += 1) {
            if (spreadCount >= MAX_BURN_SPREAD_PER_FRAME) {
              break;
            }
            direction = GROW_DIRECTIONS[directionIndex];
            isDiagonal = directionIndex >= 4;
            tunnelResult = trySpreadBurnThroughWall(
              burnCol,
              burnRow,
              direction[0],
              direction[1],
              isDiagonal,
              burnHeat,
              burnRed,
              burnGreen,
              burnBlue,
              spreadSeen,
              dirtyCount
            );
            if (tunnelResult !== null) {
              dirtyCount = tunnelResult.dirtyCount;
              totalBoostGain += tunnelResult.boostGain;
              totalScoreEarned += tunnelResult.scoreEarned;
              effectSumX += tunnelResult.effectSumX;
              effectSumY += tunnelResult.effectSumY;
              effectWeight += tunnelResult.effectWeight;
              queueCount = enqueueBurnSpread(
                tunnelResult.endCol,
                tunnelResult.endRow,
                tunnelResult.endHeat,
                burnRed,
                burnGreen,
                burnBlue,
                queueCount
              );
              spreadCount += tunnelResult.cellsSpread;
              continue;
            }
            if (isDiagonal && !canBurnSpreadDiagonal(burnCol, burnRow, direction[0], direction[1])) {
              continue;
            }
            neighborCol = burnCol + direction[0];
            neighborRow = burnRow + direction[1];
            if (neighborCol < 0 || neighborCol >= gridCols || neighborRow < 0 || neighborRow >= gridRows) {
              continue;
            }
            spreadKey = neighborCol * 4099 + neighborRow;
            if (spreadSeen[spreadKey]) {
              continue;
            }
            index = cellIndex(neighborCol, neighborRow);
            cell = cells[index];
            if (cell === CELL_EMPTY) {
              continue;
            }
            spreadSeen[spreadKey] = 1;
            if (isCrystalCell(cell)) {
              spreadHeat = BURN_ORE_REFRESH_HEAT;
              rarity = cell - CELL_CRYSTAL_BASE;
              clusterPickup = collectCrystalCluster(neighborCol, neighborRow, rarity, crystalMarksBuffer, dirtyCount);
              dirtyCount = clusterPickup.dirtyCount;
              if (clusterPickup.pixelCount > 0) {
                collectResult = collectCrystal(clusterPickup);
                totalBoostGain += collectResult.boostGain;
                totalScoreEarned += collectResult.earned;
                effectSumX += clusterPickup.worldX * clusterPickup.pixelCount;
                effectSumY += clusterPickup.worldY * clusterPickup.pixelCount;
                effectWeight += clusterPickup.pixelCount;
                playCrystalCollectSounds(1);
              }
            } else if (isDiagonal) {
              spreadHeat = burnHeat * BURN_DIAGONAL_PASS_HEAT_MULT;
              cells[index] = CELL_EMPTY;
              crystalClusterId[index] = 0;
              dirtyCount = markDirtyPaintCell(neighborCol, neighborRow, dirtyCount);
            } else {
              spreadHeat = burnHeat * BURN_DIRT_PASS_HEAT_MULT;
              cells[index] = CELL_EMPTY;
              crystalClusterId[index] = 0;
              dirtyCount = markDirtyPaintCell(neighborCol, neighborRow, dirtyCount);
            }
            addBurnOrRefresh(neighborCol, neighborRow, spreadHeat, burnRed, burnGreen, burnBlue);
            queueCount = enqueueBurnSpread(neighborCol, neighborRow, spreadHeat, burnRed, burnGreen, burnBlue, queueCount);
            spreadCount += 1;
          }
        }
        if (dirtyCount > 0) {
          paintDirtyCells(dirtyCount);
        }
        if (totalBoostGain > 0.001 || totalScoreEarned > 0) {
          if (effectWeight > 0) {
            spawnCollapseBoostEffect(
              totalBoostGain,
              totalScoreEarned,
              effectSumX / effectWeight,
              effectSumY / effectWeight
            );
          }
          scorePopTimer = 0.18;
          updateHudDisplay();
        }
      }

      function tryDestroySun(collapseX, collapseY, collapseRadius) {
        var sunDx;
        var sunDy;
        var dist;
        var hitRadius;
        var sunScreen;
        var particleIndex;
        var angle;
        var speed;
        if (sunDestroyed) {
          return;
        }
        sunDx = collapseX - sunWorldX;
        sunDy = collapseY - sunWorldY;
        dist = Math.sqrt(sunDx * sunDx + sunDy * sunDy);
        hitRadius = collapseRadius + Math.min(window.innerWidth, window.innerHeight) * 0.14;
        if (dist > hitRadius) {
          return;
        }
        sunDestroyed = true;
        sunDestroyLife = SUN_DESTROY_DURATION;
        screenShake = Math.min(14, screenShake + 8);
        if (getSynth()) {
          getSynth().playExplosion(true);
        }
        pushImplodeRing(sunWorldX, sunWorldY, 48, 1, 255, 230, 120);
        pushImplodeRing(sunWorldX, sunWorldY, 110, 0.92, 255, 170, 50);
        pushImplodeRing(sunWorldX, sunWorldY, 190, 0.78, 255, 90, 25);
        pushImplodeRing(sunWorldX, sunWorldY, 320, 0.65, 255, 50, 10);
        pushImplodeRing(sunWorldX, sunWorldY, 520, 0.5, 180, 30, 80);
        sunScreen = worldToScreen(sunWorldX, sunWorldY);
        for (particleIndex = 0; particleIndex < 28; particleIndex += 1) {
          if (dirtParticleCount >= MAX_DIRT_PARTICLES) {
            break;
          }
          angle = rand() * Math.PI * 2;
          speed = 80 + rand() * 200;
          particles.push({
            kind: "dirt",
            x: sunScreen.x,
            y: sunScreen.y,
            velX: Math.cos(angle) * speed,
            velY: Math.sin(angle) * speed,
            life: 0.45 + rand() * 0.35,
            maxLife: 0.8,
            age: 0,
            mergeCount: 1,
            red: 255,
            green: 150 + Math.floor(rand() * 90),
            blue: 30 + Math.floor(rand() * 50),
            size: 2 + Math.floor(rand() * 2),
            gravity: 30
          });
          dirtParticleCount += 1;
        }
      }

      function beginHoleGrowCycle() {
        holeRadius = getStartHoleRadius();
        holeGrowing = true;
      }

      function triggerCollapse() {
        if (!canDigAtCurrentHoleSize()) {
          return;
        }
        var collapseX = holeX;
        var collapseY = holeY;
        var radius = holeRadius;
        if (radius < MIN_DIG_RADIUS) {
          radius = MIN_DIG_RADIUS;
        }
        var radiusSq = radius * radius;
        var centerCol = Math.floor(collapseX / PIXEL);
        var centerWorldRow = Math.floor(collapseY / PIXEL);
        var centerRow = getGridRow(centerWorldRow);
        var radiusCells = Math.ceil(radius / PIXEL) + 1;
        var minCol = centerCol - radiusCells;
        var maxCol = centerCol + radiusCells;
        var minRow = centerRow - radiusCells;
        var maxRow = centerRow + radiusCells;
        var col;
        var row;
        var dx;
        var dy;
        var distSq;
        var cell;
        var index;
        var rarity;
        var crystalsFound = [];
        var crystalMarks;
        var totalBoostGain = 0;
        var totalScoreEarned = 0;
        var dirtyCount = 0;
        var normalizedDist;
        var cellHeat;
        var burnRed;
        var burnGreen;
        var burnBlue;
        var clusterPickup;

        ensureGridWorkBuffers();
        clearCrystalMarksRegion(minCol, minRow, maxCol, maxRow);
        crystalMarks = crystalMarksBuffer;

        screenShake = Math.min(6, 2.2 + radius * 0.02);

        playCollapseSound();

        pushImplodeRing(collapseX, collapseY, radius, 1.15, 200, 80, 255);
        pushImplodeRing(collapseX, collapseY, radius * 0.82, 1, 255, 140, 220);
        pushImplodeRing(collapseX, collapseY, radius * 0.58, 0.9, 255, 180, 100);
        pushImplodeRing(collapseX, collapseY, radius * 0.32, 0.75, 140, 220, 255);

        tryDestroySun(collapseX, collapseY, radius);

        for (row = minRow; row <= maxRow; row += 1) {
          for (col = minCol; col <= maxCol; col += 1) {
            if (col < 0 || col >= gridCols || row < 0 || row >= gridRows) {
              continue;
            }
            dx = col * PIXEL + PIXEL * 0.5 - collapseX;
            dy = getWorldRow(row) * PIXEL + PIXEL * 0.5 - collapseY;
            distSq = dx * dx + dy * dy;
            if (distSq > radiusSq) {
              continue;
            }
            index = cellIndex(col, row);
            cell = cells[index];
            if (cell >= CELL_CRYSTAL_BASE && cell < CELL_CRYSTAL_BASE + CRYSTAL_COUNT) {
              if (crystalMarks[index] === 0) {
                rarity = cell - CELL_CRYSTAL_BASE;
                clusterPickup = collectCrystalCluster(col, row, rarity, crystalMarks, dirtyCount);
                dirtyCount = clusterPickup.dirtyCount;
                crystalsFound.push(clusterPickup);
              }
            }
            if (cell !== CELL_EMPTY) {
              cells[index] = CELL_EMPTY;
              crystalClusterId[index] = 0;
              dirtyCount = markDirtyPaintCell(col, row, dirtyCount);
              normalizedDist = Math.sqrt(distSq) / radius;
              spawnDebris(
                col * PIXEL + PIXEL * 0.5,
                getWorldRow(row) * PIXEL + PIXEL * 0.5,
                normalizedDist,
                collapseX,
                collapseY
              );
            }
          }
        }

        for (row = minRow; row <= maxRow; row += 1) {
          for (col = minCol; col <= maxCol; col += 1) {
            if (col < 0 || col >= gridCols || row < 0 || row >= gridRows) {
              continue;
            }
            if (cells[cellIndex(col, row)] !== CELL_EMPTY) {
              continue;
            }
            if (getCellFast(col - 1, row) !== CELL_EMPTY ||
              getCellFast(col + 1, row) !== CELL_EMPTY ||
              getCellFast(col, row - 1) !== CELL_EMPTY ||
              getCellFast(col, row + 1) !== CELL_EMPTY) {
              cellHeat = 0.7 + rand() * 0.3;
              burnRed = 255;
              burnGreen = 90 + Math.floor(rand() * 80);
              burnBlue = 30 + Math.floor(rand() * 40);
              addBurn(col, row, cellHeat, burnRed, burnGreen, burnBlue, BURN_COLLAPSE_SPREAD_DELAY + rand() * 0.06);
            }
          }
        }

        var crystalIndex;
        var collectResult;
        var collectedClusterCount = 0;
        for (crystalIndex = 0; crystalIndex < crystalsFound.length; crystalIndex += 1) {
          crystal = crystalsFound[crystalIndex];
          if (crystal.pixelCount < 1) {
            continue;
          }
          collectedClusterCount += 1;
          collectResult = collectCrystal(crystal);
          totalBoostGain += collectResult.boostGain;
          totalScoreEarned += collectResult.earned;
        }
        if (collectedClusterCount > 0) {
          playCrystalCollectSounds(collectedClusterCount);
        }

        if (totalBoostGain > 0.001 || totalScoreEarned > 0) {
          spawnCollapseBoostEffect(totalBoostGain, totalScoreEarned, collapseX, collapseY);
        }

        paintDirtyCells(dirtyCount);

        if (centerWorldRow > getWorldRow(deepestRow) - CHUNK_ROWS * 2) {
          generateChunkBelow();
        }
        targetCameraY = Math.max(targetCameraY, centerWorldRow * PIXEL - window.innerHeight * 0.35);
        updateSessionDepth();

        beginHoleGrowCycle();
      }

      function collectCrystalCluster(startCol, startRow, rarity, crystalMarks, dirtyCount) {
        var clusterId = crystalClusterId[cellIndex(startCol, startRow)];
        var sumX = 0;
        var sumY = 0;
        var count = 0;
        var stackSize = 1;
        var currentCol;
        var currentRow;
        var index;
        var directionIndex;
        var direction;
        var neighborCol;
        var neighborRow;
        var neighborIndex;

        clusterStackCol[0] = startCol;
        clusterStackRow[0] = startRow;

        while (stackSize > 0) {
          stackSize -= 1;
          currentCol = clusterStackCol[stackSize];
          currentRow = clusterStackRow[stackSize];
          index = cellIndex(currentCol, currentRow);
          if (crystalMarks[index] !== 0) {
            continue;
          }
          if (crystalClusterId[index] !== clusterId) {
            continue;
          }
          if (cells[index] < CELL_CRYSTAL_BASE) {
            continue;
          }

          crystalMarks[index] = 1;
          cells[index] = CELL_EMPTY;
          crystalClusterId[index] = 0;
          dirtyCount = markDirtyPaintCell(currentCol, currentRow, dirtyCount);
          sumX += currentCol * PIXEL + PIXEL * 0.5;
          sumY += getWorldRow(currentRow) * PIXEL + PIXEL * 0.5;
          count += 1;

          for (directionIndex = 0; directionIndex < 4; directionIndex += 1) {
            direction = GROW_DIRECTIONS[directionIndex];
            neighborCol = currentCol + direction[0];
            neighborRow = currentRow + direction[1];
            if (neighborCol < 0 || neighborCol >= gridCols || neighborRow < 0 || neighborRow >= gridRows) {
              continue;
            }
            neighborIndex = cellIndex(neighborCol, neighborRow);
            if (crystalMarks[neighborIndex] !== 0) {
              continue;
            }
            if (crystalClusterId[neighborIndex] !== clusterId) {
              continue;
            }
            clusterStackCol[stackSize] = neighborCol;
            clusterStackRow[stackSize] = neighborRow;
            stackSize += 1;
          }
        }

        registerOreUnitsCollected(count);

        return {
          rarity: rarity,
          worldX: sumX / Math.max(1, count),
          worldY: sumY / Math.max(1, count),
          pixelCount: count,
          dirtyCount: dirtyCount
        };
      }

      function collectCrystal(crystal) {
        if (!crystal || !crystal.pixelCount || crystal.pixelCount < 1) {
          return {
            boostGain: 0,
            earned: 0
          };
        }
        var rarity = crystal.rarity;
        var points = RARITY_SCORE[rarity];
        var sizeBonus = 1 + (crystal.pixelCount || 1) * 0.04;
        var earned = Math.floor(points * sizeBonus);
        var boostGain;
        var screen;
        var targetX;
        var targetY;
        var color;
        var count;
        var particleIndex;
        var offsetX;
        var offsetY;
        var startX;
        var startY;
        var travelTime;
        score += earned;
        setBestScoreIfHigher(score);
        updateHudDisplay();
        scorePopTimer = 0.18;
        boostGain = addCrystalSpeedBoost(crystal);

        screen = worldToScreen(crystal.worldX, crystal.worldY);
        targetX = getScoreTargetX();
        targetY = getScoreTargetY();
        color = RARITY_COLORS[rarity];
        count = 4 + rarity * 3 + Math.floor(Math.sqrt(crystal.pixelCount || 1) * 0.8);
        if (count > MAX_SCORE_PARTICLES_FROM_CLUSTER) {
          count = MAX_SCORE_PARTICLES_FROM_CLUSTER;
        }
        travelTime = SCORE_PARTICLE_TRAVEL_TIME;
        for (particleIndex = 0; particleIndex < count; particleIndex += 1) {
          offsetX = (rand() - 0.5) * SCORE_PARTICLE_SPAWN_SPREAD;
          offsetY = (rand() - 0.5) * SCORE_PARTICLE_SPAWN_SPREAD;
          startX = screen.x + offsetX;
          startY = screen.y + offsetY;
          particles.push({
            kind: "score",
            x: startX,
            y: startY,
            velX: (targetX - startX) / travelTime,
            velY: (targetY - startY) / travelTime,
            targetX: targetX,
            targetY: targetY,
            travelTime: travelTime,
            age: 0,
            mergeCount: 1,
            red: color[0],
            green: color[1],
            blue: color[2],
            size: 2 + rarity
          });
        }

        return {
          boostGain: boostGain,
          earned: earned
        };
      }

      function spawnDebris(worldX, worldY, normalizedDist, centerWorldX, centerWorldY) {
        if (rand() > DEBRIS_SPAWN_CHANCE) {
          return;
        }
        if (dirtParticleCount >= MAX_DIRT_PARTICLES) {
          return;
        }
        var screen = worldToScreen(worldX, worldY);
        var centerScreen = worldToScreen(centerWorldX, centerWorldY);
        var toCenterX = centerScreen.x - screen.x;
        var toCenterY = centerScreen.y - screen.y;
        var centerDist = Math.sqrt(toCenterX * toCenterX + toCenterY * toCenterY);
        var speed = 100 + (1 - normalizedDist) * 320;
        var velX;
        var velY;
        if (centerDist > 0.5) {
          velX = toCenterX / centerDist * speed;
          velY = toCenterY / centerDist * speed;
        } else {
          velX = (rand() - 0.5) * 30;
          velY = (rand() - 0.5) * 30;
        }
        particles.push({
          kind: "dirt",
          x: screen.x,
          y: screen.y,
          velX: velX,
          velY: velY,
          life: 0.4 + rand() * 0.35,
          maxLife: 0.75,
          age: 0,
          mergeCount: 1,
          red: 90 + Math.floor(rand() * 50),
          green: 55 + Math.floor(rand() * 30),
          blue: 35 + Math.floor(rand() * 20),
          size: 2,
          gravity: 40
        });
      }

      function mergeTwoParticles(primary, secondary) {
        var totalWeight = primary.mergeCount + secondary.mergeCount;
        var weightA = primary.mergeCount / totalWeight;
        var weightB = secondary.mergeCount / totalWeight;
        primary.x = primary.x * weightA + secondary.x * weightB;
        primary.y = primary.y * weightA + secondary.y * weightB;
        primary.velX = primary.velX * weightA + secondary.velX * weightB;
        primary.velY = primary.velY * weightA + secondary.velY * weightB;
        primary.red = Math.floor(primary.red * weightA + secondary.red * weightB);
        primary.green = Math.floor(primary.green * weightA + secondary.green * weightB);
        primary.blue = Math.floor(primary.blue * weightA + secondary.blue * weightB);
        primary.mergeCount = totalWeight;
        if (primary.kind === "dirt") {
          primary.life = Math.max(primary.life, secondary.life);
          primary.maxLife = Math.max(primary.maxLife, secondary.maxLife);
          primary.size = Math.min(6, 2 + Math.sqrt(totalWeight) * 0.55);
        } else {
          primary.size = Math.min(10, primary.size + Math.sqrt(totalWeight) * 0.35);
          primary.age = Math.max(primary.age, secondary.age);
          primary.travelTime = SCORE_PARTICLE_TRAVEL_TIME;
        }
      }

      function mergeParticles() {
        var indexA;
        var indexB;
        var particleA;
        var particleB;
        var deltaX;
        var deltaY;
        var dist;
        var mergeDist;

        for (indexA = 0; indexA < particles.length; indexA += 1) {
          particleA = particles[indexA];
          if (particleA.kind === "score") {
            continue;
          }
          if (particleA.age < PARTICLE_MERGE_AFTER) {
            continue;
          }
          mergeDist = PARTICLE_MERGE_DIST;
          for (indexB = indexA + 1; indexB < particles.length; indexB += 1) {
            particleB = particles[indexB];
            if (particleB.kind !== particleA.kind) {
              continue;
            }
            if (particleB.kind === "score") {
              continue;
            }
            if (particleB.age < PARTICLE_MERGE_AFTER) {
              continue;
            }
            deltaX = particleA.x - particleB.x;
            deltaY = particleA.y - particleB.y;
            dist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            if (dist > mergeDist) {
              continue;
            }
            mergeTwoParticles(particleA, particleB);
            particles.splice(indexB, 1);
            indexB -= 1;
          }
        }
      }

      function cleanupBurns() {
        var height = window.innerHeight;
        var margin = PIXEL * 8;
        var burnIndex = burns.length - 1;
        var screenY;
        while (burnIndex >= 0) {
          screenY = getWorldRow(burns[burnIndex].row) * PIXEL - cameraY;
          if (screenY < -margin || screenY > height + margin || burns[burnIndex].heat <= 0) {
            burns.splice(burnIndex, 1);
          }
          burnIndex -= 1;
        }
      }

      function cleanupParticles() {
        var width = window.innerWidth;
        var height = window.innerHeight;
        var margin = 48;
        var particleIndex = particles.length - 1;
        var particle;
        var scoreParticleCount = 0;
        var scoreCullIndex;
        var scoreCullParticle;
        while (particleIndex >= 0) {
          particle = particles[particleIndex];
          if (particle.kind === "score") {
            if (particle.age >= SCORE_PARTICLE_MAX_AGE ||
              particle.age >= particle.travelTime * 1.15) {
              particles.splice(particleIndex, 1);
            } else {
              scoreParticleCount += 1;
            }
          } else if (particle.kind === "dirt") {
            if (particle.life <= 0 ||
              particle.x < -margin ||
              particle.x > width + margin ||
              particle.y < -margin ||
              particle.y > height + margin) {
              particles.splice(particleIndex, 1);
              dirtParticleCount -= 1;
              if (dirtParticleCount < 0) {
                dirtParticleCount = 0;
              }
            }
          }
          particleIndex -= 1;
        }
        if (scoreParticleCount > MAX_SCORE_PARTICLES) {
          scoreCullIndex = particles.length - 1;
          while (scoreCullIndex >= 0 && scoreParticleCount > MAX_SCORE_PARTICLES) {
            scoreCullParticle = particles[scoreCullIndex];
            if (scoreCullParticle.kind === "score") {
              particles.splice(scoreCullIndex, 1);
              scoreParticleCount -= 1;
            }
            scoreCullIndex -= 1;
          }
        }
      }

      function restartSession() {
        score = 0;
        sessionMaxDepth = 0;
        bonus = 1;
        oreUnitsCollected = 0;
        oreUnitsDespawned = 0;
        burns = [];
        particles = [];
        floatingLabels = [];
        collapseRings = [];
        dirtParticleCount = 0;
        sunDestroyed = false;
        sunDestroyLife = 0;
        scoreValueEl.textContent = formatScoreTons(0);
        bonusHudEl.textContent = formatBonus(1);
        fpsSampleFrames = 0;
        fpsSampleTime = 0;
        fpsValueEl.textContent = "--";
        initWorld();
        showStartScreen();
      }

      function update(dt) {
        if (!sessionStarted) {
          return;
        }
        if (holeGrowing) {
          var growthRate = getHoleGrowthSpeed();
          var maxRadius = getMaxHoleRadius();
          holeRadius += growthRate * dt;
          if (holeRadius >= maxRadius) {
            holeRadius = maxRadius;
            holeGrowing = false;
          }
        }

        decayBonus(dt);

        updateSessionDepth();
        updateHudDisplay();

        cameraY += (targetCameraY - cameraY) * Math.min(1, dt * 2.5);
        pruneGridChunksAboveCamera();

        if (getWorldRow(deepestRow) * PIXEL - cameraY < window.innerHeight * 2) {
          generateChunkBelow();
        }

        var burnIndex;
        for (burnIndex = 0; burnIndex < burns.length; burnIndex += 1) {
          if (burns[burnIndex].spreadDelay > 0) {
            burns[burnIndex].spreadDelay -= dt;
            if (burns[burnIndex].spreadDelay < 0) {
              burns[burnIndex].spreadDelay = 0;
            }
          }
          burns[burnIndex].heat -= BURN_DECAY * dt;
        }
        processBurnChainReaction();
        cleanupBurns();

        if (sunDestroyLife > 0) {
          sunDestroyLife -= dt;
          if (sunDestroyLife <= 0) {
            sunDestroyLife = 0;
          }
        }

        if (particles.length > 12) {
          mergeParticles();
        }

        var particleIndex;
        var targetX = getScoreTargetX();
        var targetY = getScoreTargetY();
        var dist;
        var timeLeft;
        for (particleIndex = particles.length - 1; particleIndex >= 0; particleIndex -= 1) {
          var particle = particles[particleIndex];
          particle.age += dt;
          if (particle.kind === "score") {
            particle.targetX = targetX;
            particle.targetY = targetY;
            var toTargetX = particle.targetX - particle.x;
            var toTargetY = particle.targetY - particle.y;
            dist = Math.sqrt(toTargetX * toTargetX + toTargetY * toTargetY);
            if (dist < SCORE_ARRIVE_DIST ||
              particle.age >= particle.travelTime ||
              particle.age >= SCORE_PARTICLE_MAX_AGE) {
              particles.splice(particleIndex, 1);
              continue;
            }
            timeLeft = particle.travelTime - particle.age;
            if (timeLeft < 0.08) {
              particle.x = particle.targetX;
              particle.y = particle.targetY;
              particles.splice(particleIndex, 1);
              continue;
            }
            particle.velX = toTargetX / timeLeft;
            particle.velY = toTargetY / timeLeft;
          } else {
            particle.life -= dt;
            particle.velY += (particle.gravity || 0) * dt;
            particle.velX *= 0.96;
            particle.velY *= 0.96;
          }
          particle.x += particle.velX * dt;
          particle.y += particle.velY * dt;
          if (particle.kind === "score") {
            toTargetX = particle.targetX - particle.x;
            toTargetY = particle.targetY - particle.y;
            dist = Math.sqrt(toTargetX * toTargetX + toTargetY * toTargetY);
            if (dist < SCORE_ARRIVE_DIST) {
              particles.splice(particleIndex, 1);
            }
          }
        }
        cleanupParticles();

        var labelIndex;
        var label;
        for (labelIndex = floatingLabels.length - 1; labelIndex >= 0; labelIndex -= 1) {
          label = floatingLabels[labelIndex];
          label.life -= dt;
          if (label.homesToBonus) {
            label.targetX = getBonusTargetX();
            label.targetY = getBonusTargetY();
            var toBonusX = label.targetX - label.x;
            var toBonusY = label.targetY - label.y;
            var bonusDist = Math.sqrt(toBonusX * toBonusX + toBonusY * toBonusY);
            if (bonusDist < BONUS_ARRIVE_DIST) {
              floatingLabels.splice(labelIndex, 1);
              continue;
            }
            var bonusMove = BONUS_FLY_SPEED * dt;
            if (bonusMove > bonusDist) {
              bonusMove = bonusDist;
            }
            label.x += toBonusX / bonusDist * bonusMove;
            label.y += toBonusY / bonusDist * bonusMove;
          } else if (label.screenOffsetY !== undefined) {
            label.screenOffsetY -= 32 * dt;
          } else if (label.y !== undefined) {
            label.y -= 32 * dt;
          }
          if (label.life <= 0) {
            floatingLabels.splice(labelIndex, 1);
          }
        }

        var ringIndex;
        var height = window.innerHeight;
        var width = window.innerWidth;
        var ringMargin = 80;
        var ringScreen;
        for (ringIndex = collapseRings.length - 1; ringIndex >= 0; ringIndex -= 1) {
          var ring = collapseRings[ringIndex];
          ring.life -= dt * 1.05;
          if (ring.startRadius === undefined) {
            ring.startRadius = ring.radius;
          }
          ring.radius = ring.startRadius * Math.max(0, ring.life);
          ringScreen = worldToScreen(ring.worldX, ring.worldY);
          if (ring.life <= 0 ||
            ringScreen.x < -ringMargin ||
            ringScreen.x > width + ringMargin ||
            ringScreen.y < -ringMargin ||
            ringScreen.y > height + ringMargin) {
            collapseRings.splice(ringIndex, 1);
          }
        }

        if (screenShake > 0) {
          screenShake = Math.max(0, screenShake - dt * 14);
        }

        if (scorePopTimer > 0) {
          scorePopTimer -= dt;
          if (scorePopTimer <= 0) {
            scoreValueEl.classList.remove("is-pop");
          } else {
            scoreValueEl.classList.add("is-pop");
          }
        }
      }

      function getSkyColorAtScreenY(screenY, horizonScreenY, width) {
        var t = screenY / Math.max(1, horizonScreenY);
        if (t < 0) {
          t = 0;
        }
        if (t > 1) {
          t = 1;
        }
        var red;
        var green;
        var blue;
        if (t < 0.55) {
          var upperT = t / 0.55;
          red = SKY_TOP[0] + (SKY_MID[0] - SKY_TOP[0]) * upperT;
          green = SKY_TOP[1] + (SKY_MID[1] - SKY_TOP[1]) * upperT;
          blue = SKY_TOP[2] + (SKY_MID[2] - SKY_TOP[2]) * upperT;
        } else {
          var lowerT = (t - 0.55) / 0.45;
          red = SKY_MID[0] + (SKY_HORIZON[0] - SKY_MID[0]) * lowerT;
          green = SKY_MID[1] + (SKY_HORIZON[1] - SKY_MID[1]) * lowerT;
          blue = SKY_MID[2] + (SKY_HORIZON[2] - SKY_MID[2]) * lowerT;
        }
        var sunScreen = worldToScreen(sunWorldX, sunWorldY);
        if (!sunDestroyed) {
          var sunDx = width * 0.5 - sunScreen.x;
          var sunDy = screenY - sunScreen.y;
          var sunDist = Math.sqrt(sunDx * sunDx + sunDy * sunDy);
          var sunWarm = Math.max(0, 1 - sunDist / (width * 0.55));
          red += sunWarm * 40;
          green += sunWarm * 22;
        }
        return {
          red: Math.floor(Math.min(255, red)),
          green: Math.floor(Math.min(255, green)),
          blue: Math.floor(Math.min(255, blue))
        };
      }

      function drawWorldLayerSlice(width, height) {
        var startRow;
        var endRow;
        var sourceY;
        var sliceHeight;
        var destY;
        var layerWidth;
        if (!worldLayerCanvas) {
          return;
        }
        startRow = Math.max(0, getGridRow(Math.floor((cameraY - PIXEL) / PIXEL)));
        endRow = Math.min(gridRows, startRow + Math.ceil(height / PIXEL) + 4);
        sourceY = startRow * PIXEL;
        sliceHeight = (endRow - startRow) * PIXEL;
        destY = getWorldRow(startRow) * PIXEL - cameraY;
        layerWidth = gridCols * PIXEL;
        if (sliceHeight <= 0) {
          return;
        }
        ctx.drawImage(
          worldLayerCanvas,
          0, sourceY, layerWidth, sliceHeight,
          0, destY, layerWidth, sliceHeight
        );
      }

      function drawCrystalOverlay(width, height) {
        var startRow = Math.max(0, getGridRow(Math.floor((cameraY - PIXEL) / PIXEL)));
        var endRow = Math.min(gridRows, startRow + Math.ceil(height / PIXEL) + 4);
        var col;
        var row;
        var index;
        var cell;
        var screenY;
        var rarity;
        var color;
        var pulse;
        var innerRed;
        var innerGreen;
        var innerBlue;
        var red;
        var green;
        var blue;
        for (row = startRow; row < endRow; row += 1) {
          screenY = getWorldRow(row) * PIXEL - cameraY;
          if (screenY > height + PIXEL || screenY + PIXEL < 0) {
            continue;
          }
          for (col = 0; col < gridCols; col += 1) {
            index = cellIndex(col, row);
            cell = cells[index];
            if (!isCrystalCell(cell)) {
              continue;
            }
            rarity = cell - CELL_CRYSTAL_BASE;
            color = RARITY_COLORS[rarity];
            pulse = 0.85 + Math.sin((row + col) * 0.4 + glossPhase * CRYSTAL_GLOSS_SPEED) * 0.15;
            red = Math.floor(color[0] * pulse);
            green = Math.floor(color[1] * pulse);
            blue = Math.floor(color[2] * pulse);
            ctx.fillStyle = "rgb(" + red + "," + green + "," + blue + ")";
            ctx.fillRect(col * PIXEL, screenY, PIXEL, PIXEL);
            innerRed = Math.min(255, red + 40);
            innerGreen = Math.min(255, green + 40);
            innerBlue = Math.min(255, blue + 40);
            ctx.fillStyle = "rgb(" + innerRed + "," + innerGreen + "," + innerBlue + ")";
            ctx.fillRect(col * PIXEL + 1, screenY + 1, PIXEL - 2, PIXEL - 2);
          }
        }
      }

      function drawBurnOverlay(width, height) {
        var burnIndex;
        var burn;
        var screenY;
        var heat;
        for (burnIndex = 0; burnIndex < burns.length; burnIndex += 1) {
          burn = burns[burnIndex];
          screenY = getWorldRow(burn.row) * PIXEL - cameraY;
          if (screenY > height + PIXEL || screenY + PIXEL < 0) {
            continue;
          }
          heat = burn.heat;
          if (heat <= 0.01) {
            continue;
          }
          ctx.fillStyle = "rgba(" + burn.red + "," + burn.green + "," + burn.blue + "," + (heat * 0.85) + ")";
          ctx.fillRect(burn.col * PIXEL, screenY, PIXEL, PIXEL);
        }
      }

      function getSunDestroyLifeNorm() {
        if (sunDestroyLife <= 0) {
          return 0;
        }
        return sunDestroyLife / SUN_DESTROY_DURATION;
      }

      function drawSky(width, height) {
        var horizonScreenY = getHorizonScreenY();
        var gradient = ctx.createLinearGradient(0, 0, 0, Math.max(height, horizonScreenY + 40));
        if (sunDestroyed) {
          gradient.addColorStop(0, "rgba(6, 8, 20, 0.96)");
          gradient.addColorStop(0.45, "rgba(18, 10, 28, 0.94)");
          gradient.addColorStop(0.72, "rgba(42, 22, 38, 0.9)");
          gradient.addColorStop(1, "rgba(72, 38, 48, 0.88)");
        } else {
          gradient.addColorStop(0, "rgba(" + SKY_TOP[0] + "," + SKY_TOP[1] + "," + SKY_TOP[2] + ",0.92)");
          gradient.addColorStop(0.55, "rgba(" + SKY_MID[0] + "," + SKY_MID[1] + "," + SKY_MID[2] + ",0.88)");
          gradient.addColorStop(1, "rgba(" + SKY_HORIZON[0] + "," + SKY_HORIZON[1] + "," + SKY_HORIZON[2] + ",0.85)");
        }
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
        drawSunDestroySkyOverlay(width, height);
      }

      function drawSunDestroySkyOverlay(width, height) {
        var lifeNorm;
        var flashPeak;
        var sunScreen;
        var maxRadius;
        var burstRadius;
        var gradient;
        var horizonScreenY;
        var waveCenterY;
        var bandAlpha;
        var duskAlpha;
        var rayIndex;
        var rayAngle;
        var rayLength;
        var rayEndX;
        var rayEndY;
        if (sunDestroyLife <= 0) {
          return;
        }
        lifeNorm = getSunDestroyLifeNorm();
        flashPeak = lifeNorm * lifeNorm;
        sunScreen = worldToScreen(sunWorldX, sunWorldY);
        maxRadius = Math.sqrt(width * width + height * height) * 1.2;
        burstRadius = maxRadius * (0.35 + (1 - lifeNorm) * 0.75);
        gradient = ctx.createRadialGradient(
          sunScreen.x, sunScreen.y, 0,
          sunScreen.x, sunScreen.y, burstRadius
        );
        gradient.addColorStop(0, "rgba(255, 252, 230, " + (flashPeak * 0.95) + ")");
        gradient.addColorStop(0.08, "rgba(255, 220, 100, " + (flashPeak * 0.82) + ")");
        gradient.addColorStop(0.22, "rgba(255, 160, 40, " + (flashPeak * 0.58) + ")");
        gradient.addColorStop(0.45, "rgba(255, 90, 20, " + (flashPeak * 0.32) + ")");
        gradient.addColorStop(0.7, "rgba(120, 30, 60, " + (flashPeak * 0.14) + ")");
        gradient.addColorStop(1, "rgba(20, 8, 30, 0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        gradient = ctx.createRadialGradient(
          width * 0.5, height * 0.35, 0,
          width * 0.5, height * 0.35, maxRadius * 0.85
        );
        gradient.addColorStop(0, "rgba(255, 200, 120, " + (flashPeak * 0.28) + ")");
        gradient.addColorStop(0.5, "rgba(255, 100, 40, " + (flashPeak * 0.12) + ")");
        gradient.addColorStop(1, "rgba(255, 60, 10, 0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        horizonScreenY = getHorizonScreenY();
        waveCenterY = sunScreen.y + (horizonScreenY - sunScreen.y) * (1 - lifeNorm * 0.85);
        bandAlpha = flashPeak * 0.42;
        gradient = ctx.createLinearGradient(0, waveCenterY - height * 0.22, 0, waveCenterY + height * 0.28);
        gradient.addColorStop(0, "rgba(255, 200, 80, 0)");
        gradient.addColorStop(0.42, "rgba(255, 230, 160, " + bandAlpha + ")");
        gradient.addColorStop(0.5, "rgba(255, 255, 220, " + (bandAlpha * 1.15) + ")");
        gradient.addColorStop(0.58, "rgba(255, 120, 35, " + (bandAlpha * 0.9) + ")");
        gradient.addColorStop(1, "rgba(255, 50, 10, 0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        for (rayIndex = 0; rayIndex < 10; rayIndex += 1) {
          rayAngle = (rayIndex / 10) * Math.PI * 2 + lifeNorm * 0.4;
          rayLength = maxRadius * (0.45 + flashPeak * 0.55);
          rayEndX = sunScreen.x + Math.cos(rayAngle) * rayLength;
          rayEndY = sunScreen.y + Math.sin(rayAngle) * rayLength;
          gradient = ctx.createLinearGradient(sunScreen.x, sunScreen.y, rayEndX, rayEndY);
          gradient.addColorStop(0, "rgba(255, 240, 180, " + (flashPeak * 0.35) + ")");
          gradient.addColorStop(0.35, "rgba(255, 150, 50, " + (flashPeak * 0.14) + ")");
          gradient.addColorStop(1, "rgba(255, 80, 20, 0)");
          ctx.strokeStyle = gradient;
          ctx.lineWidth = 10 + flashPeak * 28;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(sunScreen.x, sunScreen.y);
          ctx.lineTo(rayEndX, rayEndY);
          ctx.stroke();
        }

        duskAlpha = (1 - lifeNorm) * 0.5;
        if (duskAlpha > 0.02) {
          gradient = ctx.createLinearGradient(0, 0, 0, height);
          gradient.addColorStop(0, "rgba(4, 6, 18, " + (duskAlpha * 0.75) + ")");
          gradient.addColorStop(0.55, "rgba(22, 10, 32, " + (duskAlpha * 0.55) + ")");
          gradient.addColorStop(1, "rgba(48, 26, 42, " + (duskAlpha * 0.4) + ")");
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, width, height);
        }
      }

      function drawSunDestroyFlash(width, height) {
        var sunScreen;
        var lifeNorm;
        var flashPeak;
        var coreRadius;
        var gradient;
        if (sunDestroyLife <= 0) {
          return;
        }
        sunScreen = worldToScreen(sunWorldX, sunWorldY);
        if (sunScreen.y > height + 200 || sunScreen.y < -200) {
          return;
        }
        lifeNorm = getSunDestroyLifeNorm();
        flashPeak = lifeNorm * lifeNorm;
        coreRadius = 24 + (1 - lifeNorm) * Math.min(width, height) * 0.12;
        gradient = ctx.createRadialGradient(
          sunScreen.x, sunScreen.y, 0,
          sunScreen.x, sunScreen.y, coreRadius
        );
        gradient.addColorStop(0, "rgba(255, 255, 240, " + (flashPeak * 0.9) + ")");
        gradient.addColorStop(0.25, "rgba(255, 180, 60, " + (flashPeak * 0.55) + ")");
        gradient.addColorStop(1, "rgba(255, 60, 10, 0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(sunScreen.x - coreRadius, sunScreen.y - coreRadius, coreRadius * 2, coreRadius * 2);
      }

      function drawSun(width, height) {
        if (sunDestroyed) {
          drawSunDestroyFlash(width, height);
          return;
        }
        var sunScreen = worldToScreen(sunWorldX, sunWorldY);
        if (sunScreen.y > height + 120 || sunScreen.y < -120) {
          return;
        }

        var glowRadius = Math.min(width, height) * 0.22;
        var glow = ctx.createRadialGradient(
          sunScreen.x, sunScreen.y, 0,
          sunScreen.x, sunScreen.y, glowRadius
        );
        glow.addColorStop(0, "rgba(" + SUN_CORE[0] + "," + SUN_CORE[1] + "," + SUN_CORE[2] + ",0.55)");
        glow.addColorStop(0.2, "rgba(" + SUN_GLOW[0] + "," + SUN_GLOW[1] + "," + SUN_GLOW[2] + ",0.28)");
        glow.addColorStop(0.55, "rgba(" + SUN_GLOW[0] + "," + SUN_GLOW[1] + "," + SUN_GLOW[2] + ",0.08)");
        glow.addColorStop(1, "rgba(" + SUN_GLOW[0] + "," + SUN_GLOW[1] + "," + SUN_GLOW[2] + ",0)");
        ctx.fillStyle = glow;
        ctx.fillRect(sunScreen.x - glowRadius, sunScreen.y - glowRadius, glowRadius * 2, glowRadius * 2);

        var coreRadius = 14 + Math.sin(lastTime * 0.8) * 1.5;
        var core = ctx.createRadialGradient(
          sunScreen.x, sunScreen.y, 0,
          sunScreen.x, sunScreen.y, coreRadius
        );
        core.addColorStop(0, "rgb(255, 248, 220)");
        core.addColorStop(0.45, "rgb(" + SUN_CORE[0] + "," + SUN_CORE[1] + "," + SUN_CORE[2] + ")");
        core.addColorStop(1, "rgba(" + SUN_GLOW[0] + "," + SUN_GLOW[1] + "," + SUN_GLOW[2] + ",0)");
        ctx.fillStyle = core;
        ctx.beginPath();
        ctx.arc(sunScreen.x, sunScreen.y, coreRadius, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawHorizonLine(width) {
        var horizonScreenY = getHorizonScreenY();
        if (horizonScreenY < -4 || horizonScreenY > window.innerHeight + 4) {
          return;
        }
        ctx.strokeStyle = "rgba(255, 200, 120, 0.2)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, horizonScreenY);
        ctx.lineTo(width, horizonScreenY);
        ctx.stroke();
      }

      function drawBlackHole(width, height) {
        var screen = worldToScreen(holeX, holeY);
        var maxRing = getMaxHoleRadius();
        var growProgress = 0;
        var warningAlpha;
        var readyPulse;
        var limitAlpha;
        var coreGrad;

        if (maxRing > 0) {
          growProgress = holeRadius / maxRing;
          if (growProgress > 1) {
            growProgress = 1;
          }
        }
        warningAlpha = 0.4 + Math.sin(lastTime * 6) * 0.14 + growProgress * 0.12;
        readyPulse = 0;
        if (canDigAtCurrentHoleSize()) {
          readyPulse = 0.1 + Math.sin(lastTime * 9) * 0.08;
        }

        ctx.strokeStyle = "rgba(120, 40, 255, " + (warningAlpha * 0.35) + ")";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(screen.x, screen.y, holeRadius + 3, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = "rgba(200, 90, 255, " + (warningAlpha + readyPulse) + ")";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(screen.x, screen.y, holeRadius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = "rgba(255, 150, 220, " + (warningAlpha * 0.75 + readyPulse) + ")";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(screen.x, screen.y, holeRadius * 0.72, 0, Math.PI * 2);
        ctx.stroke();

        coreGrad = ctx.createRadialGradient(
          screen.x, screen.y, 0,
          screen.x, screen.y, holeRadius * 0.55
        );
        coreGrad.addColorStop(0, "rgba(0, 0, 0, 0.97)");
        coreGrad.addColorStop(0.45, "rgba(50, 0, 80, 0.78)");
        coreGrad.addColorStop(1, "rgba(100, 30, 160, 0)");
        ctx.fillStyle = coreGrad;
        ctx.beginPath();
        ctx.arc(screen.x, screen.y, holeRadius * 0.58, 0, Math.PI * 2);
        ctx.fill();

        if (holeGrowing) {
          limitAlpha = 0.08 + growProgress * 0.1 + Math.sin(lastTime * 7) * 0.03;
          ctx.strokeStyle = "rgba(255, 120, 50, " + limitAlpha + ")";
          ctx.lineWidth = 2;
          ctx.setLineDash([5, 6]);
          ctx.beginPath();
          ctx.arc(screen.x, screen.y, maxRing, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.strokeStyle = "rgba(255, 200, 120, " + (limitAlpha * 0.35) + ")";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(screen.x, screen.y, maxRing, 0, Math.PI * 2);
          ctx.stroke();
        }

        if (growProgress > 0.72) {
          ctx.strokeStyle = "rgba(255, 220, 140, " + (0.2 + readyPulse * 1.5) + ")";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(screen.x, screen.y, holeRadius + 5, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      function drawCollapseRings() {
        var ringIndex;
        var ring;
        var screen;
        var alpha;
        var red;
        var green;
        var blue;
        for (ringIndex = 0; ringIndex < collapseRings.length; ringIndex += 1) {
          ring = collapseRings[ringIndex];
          screen = worldToScreen(ring.worldX, ring.worldY);
          alpha = ring.life;
          if (alpha > 1) {
            alpha = 1;
          }
          red = ring.red !== undefined ? ring.red : 120;
          green = ring.green !== undefined ? ring.green : 60;
          blue = ring.blue !== undefined ? ring.blue : 200;
          ctx.strokeStyle = "rgba(" + red + "," + green + "," + blue + "," + (alpha * 0.35) + ")";
          ctx.lineWidth = 9;
          ctx.beginPath();
          ctx.arc(screen.x, screen.y, ring.radius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.strokeStyle = "rgba(255, 255, 255, " + (alpha * 0.22) + ")";
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.arc(screen.x, screen.y, ring.radius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.strokeStyle = "rgba(" + red + "," + green + "," + blue + "," + alpha + ")";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(screen.x, screen.y, ring.radius, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      function drawFloatingLabels() {
        var labelIndex;
        var label;
        var alpha;
        var fontSize;
        var scale;
        var screen;
        var drawX;
        var drawY;
        for (labelIndex = 0; labelIndex < floatingLabels.length; labelIndex += 1) {
          label = floatingLabels[labelIndex];
          alpha = label.life / label.maxLife;
          fontSize = label.fontSize || 14;
          scale = label.scale || 1;
          if (label.homesToBonus || label.x !== undefined) {
            drawX = label.x;
            drawY = label.y;
          } else if (label.worldX !== undefined) {
            screen = worldToScreen(label.worldX, label.worldY);
            drawX = screen.x;
            drawY = screen.y + (label.screenOffsetY || 0);
          } else {
            drawX = label.x;
            drawY = label.y;
          }
          ctx.save();
          ctx.translate(drawX, drawY);
          ctx.scale(scale, scale);
          ctx.font = "bold " + fontSize + "px Courier New, monospace";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "rgba(0, 0, 0, " + (alpha * 0.55) + ")";
          ctx.fillText(label.text, 1, 1);
          ctx.fillStyle = "rgba(" + label.red + "," + label.green + "," + label.blue + "," + alpha + ")";
          ctx.fillText(label.text, 0, 0);
          ctx.restore();
        }
      }

      function drawParticles() {
        var particleIndex;
        var particle;
        var alpha;
        for (particleIndex = 0; particleIndex < particles.length; particleIndex += 1) {
          particle = particles[particleIndex];
          alpha = 1;
          if (particle.kind === "dirt") {
            alpha = particle.life / particle.maxLife;
          }
          if (particle.kind === "score") {
            ctx.shadowColor = "rgba(" + particle.red + "," + particle.green + "," + particle.blue + ",0.9)";
            ctx.shadowBlur = 8;
          }
          ctx.fillStyle = "rgba(" + particle.red + "," + particle.green + "," + particle.blue + "," + alpha + ")";
          ctx.fillRect(
            particle.x - particle.size * 0.5,
            particle.y - particle.size * 0.5,
            particle.size,
            particle.size
          );
          ctx.shadowBlur = 0;
        }
      }

      function draw() {
        var width = window.innerWidth;
        var height = window.innerHeight;
        var shakeX = 0;
        var shakeY = 0;
        if (screenShake > 0) {
          shakeX = (rand() - 0.5) * screenShake * 1.1;
          shakeY = (rand() - 0.5) * screenShake * 1.1;
        }

        ctx.save();
        ctx.translate(shakeX, shakeY);
        if (staticBgCanvas) {
          ctx.drawImage(staticBgCanvas, 0, 0, width, height);
        }
        drawSky(width, height);
        drawSun(width, height);
        drawHorizonLine(width);
        drawWorldLayerSlice(width, height);
        drawCrystalOverlay(width, height);
        drawBurnOverlay(width, height);
        drawBlackHole(width, height);
        drawCollapseRings();
        drawParticles();
        drawFloatingLabels();
        ctx.restore();
      }

      function frame(timestamp) {
        if (!lastTime) {
          lastTime = timestamp;
        }
        var dt = Math.min(0.05, (timestamp - lastTime) / 1000);
        lastTime = timestamp;
        glossPhase += dt;
        fpsSampleFrames += 1;
        fpsSampleTime += dt;
        if (fpsSampleTime >= 0.35) {
          fpsValueEl.textContent = String(Math.round(fpsSampleFrames / fpsSampleTime));
          fpsSampleFrames = 0;
          fpsSampleTime = 0;
        }
        update(dt);
        if (!sessionStarted) {
          updateStartCrystalPreviews();
        }
        draw();
        requestAnimationFrame(frame);
      }

      canvas.addEventListener("mousemove", function (event) {
        updatePointer(event.clientX, event.clientY);
      });

      window.addEventListener("mousemove", function (event) {
        updatePointer(event.clientX, event.clientY);
      });

      canvas.addEventListener("mousedown", function (event) {
        if (event.button !== 0) {
          return;
        }
        updatePointer(event.clientX, event.clientY);
        if (!sessionStarted) {
          startSession();
          return;
        }
        if (canDigAtCurrentHoleSize()) {
          triggerCollapse();
        } else {
          beginHoleGrowCycle();
        }
      });

      gameScreenEl.addEventListener("pointerdown", function (event) {
        event.preventDefault();
        startSession();
      });

      window.addEventListener("keydown", function (event) {
        if (event.key === "r" || event.key === "R") {
          restartSession();
        }
      });

      window.addEventListener("resize", scheduleViewportCommit);
      window.addEventListener("mouseup", flushViewportCommit);
      bindLocaleListener();
      bestScore = loadBestScore();
      bestDepth = loadBestDepth();
      applyGameLocale();
      buildCrystalPreviewRow();
      commitViewportSize();
      showStartScreen();
      updatePointer(window.innerWidth * 0.5, window.innerHeight * 0.65);
      requestAnimationFrame(frame);
    })();
  </script>
</body>

</html>
