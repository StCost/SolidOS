<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="../extras-game-ui-audio-paths.js"></script>
  <script src="../iframe-game-audio-volume.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0a0806;
      color: #e8dcc8;
      font-family: "Courier New", Courier, monospace;
      cursor: url("../../../cursor-pointer.svg") 2.1 0, pointer;
    }

    #gameRoot,
    #gameCanvas {
      cursor: url("../../../cursor-pointer.svg") 2.1 0, pointer;
    }

    #gameRoot {
      position: absolute;
      inset: 0;
    }

    #gameCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #hud {
      position: absolute;
      left: 50%;
      top: 10px;
      z-index: 2;
      pointer-events: none;
      text-align: center;
      transform: translateX(-50%);
      font-size: 14px;
      line-height: 1.45;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
    }

    #bestHud {
      position: absolute;
      right: 12px;
      top: 10px;
      z-index: 2;
      pointer-events: none;
      text-align: right;
      font-size: 12px;
      color: rgba(200, 180, 150, 0.65);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    #bestHud #bestValue {
      display: block;
      font-size: 18px;
      font-weight: bold;
      color: #fff4d8;
    }

    #depthHud {
      position: absolute;
      left: 12px;
      top: 10px;
      z-index: 2;
      pointer-events: none;
      text-align: left;
      font-size: 12px;
      color: rgba(200, 180, 150, 0.65);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    #depthHud #depthValue {
      display: block;
      font-size: 18px;
      font-weight: bold;
      color: #a8d8ff;
    }

    #depthHud #depthBestValue {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: rgba(168, 216, 255, 0.9);
      margin-top: 2px;
    }

    #scoreValue {
      font-size: 22px;
      font-weight: bold;
      color: #fff4d8;
      transition: transform 0.12s ease-out;
    }

    #scoreValue.is-pop {
      transform: scale(1.12);
    }

    #hud .dim {
      color: rgba(200, 180, 150, 0.65);
      font-size: 12px;
    }

    #bottomHud {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 2;
      pointer-events: none;
      text-align: center;
    }

    #bonusHud {
      font-size: 15px;
      font-weight: bold;
      color: rgba(255, 210, 140, 0.95);
      margin-bottom: 6px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    #bonusBarWrap {
      width: min(280px, 60vw);
      margin: 0 auto;
    }

    #bonusBarLabels {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      letter-spacing: 0.04em;
      color: rgba(180, 170, 150, 0.55);
      margin-bottom: 4px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
    }

    #bonusBar {
      height: 4px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 2px;
      overflow: hidden;
    }

    #bonusFill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4488ff, #aa44ff, #ff8844);
      border-radius: 2px;
      transition: width 0.08s linear;
    }

    #fpsHud {
      position: absolute;
      right: 12px;
      bottom: 14px;
      top: auto;
      left: auto;
      z-index: 2;
      pointer-events: none;
      font-size: 11px;
      color: rgba(180, 170, 150, 0.55);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
    }

    #gameScreen {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      pointer-events: auto;
      cursor: url("../../../cursor-pointer.svg") 2.1 0, pointer;
      background: transparent;
    }

    #gameScreen.hidden {
      display: none;
    }

    #startScreenMask {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(14, 10, 24, 0.62) 0%, rgba(10, 8, 6, 0.74) 48%, rgba(36, 18, 10, 0.68) 100%);
    }

    #startScreenPanel {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      width: auto;
      max-width: min(88vw, 420px);
      padding: 1.15rem 1.45rem 1.05rem;
      background: rgba(48, 28, 18, 0.2);
      border: 1px solid rgba(255, 168, 88, 0.38);
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.55), inset 0 0 24px rgba(255, 140, 60, 0.06);
    }

    #screenTitle {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #e8dcc8;
      text-shadow: 0 0 16px rgba(200, 180, 140, 0.45);
    }

    #controlHint {
      margin: 0;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      color: #e8dcc8;
    }

    #crystalPreviewRow {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem 0.75rem;
      margin: 0;
      max-width: min(88vw, 400px);
    }

    .crystal-preview-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }

    .crystal-preview-canvas {
      width: 20px;
      height: 20px;
      display: block;
      image-rendering: pixelated;
    }

    .crystal-preview-cost {
      margin: 0;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      color: #e8dcc8;
    }
  </style>
</head>

    (function () {
      function getSynth() { return window.WebExtrasGameSynthAudio; }

      var COLLAPSE_AUDIO_FILE = "ui-deep-collapse-collapse.wav";
      var COLLAPSE_AUDIO_PATH = "../../../../audio/ui-deep-collapse-collapse.wav";
      var collapseAudioElement = null;

      function getCollapseSoundPath() {
        if (window.WebExtrasGameUiAudioPaths && window.WebExtrasGameUiAudioPaths.getUiSoundPath) {
          return window.WebExtrasGameUiAudioPaths.getUiSoundPath(COLLAPSE_AUDIO_FILE);
        }
        return COLLAPSE_AUDIO_PATH;
      }

      function getArcadeGamesOutputVolume() {
        if (window.WebExtrasGameAudioVolume && window.WebExtrasGameAudioVolume.getArcadeGamesOutputVolume) {
          return window.WebExtrasGameAudioVolume.getArcadeGamesOutputVolume();
        }
        return 0.5;
      }

      function ensureCollapseAudio() {
        if (collapseAudioElement) {
          return true;
        }
        collapseAudioElement = new Audio(getCollapseSoundPath());
        collapseAudioElement.preload = "auto";
        return true;
      }

      function playCollapseSound() {
        var audio;
        var playPromise;
        if (!ensureCollapseAudio()) {
          return;
        }
        audio = collapseAudioElement.cloneNode();
        audio.volume = getArcadeGamesOutputVolume();
        playPromise = audio.play();
        if (playPromise && playPromise.catch) {
          playPromise.catch(function () {});
        }
      }

      var CRYSTAL_AUDIO_COUNT = 3;
      var CRYSTAL_AUDIO_FILES = [
        "ui-deep-collapse-crystal-01.wav",
        "ui-deep-collapse-crystal-02.wav",
        "ui-deep-collapse-crystal-03.wav"
      ];
      var CRYSTAL_AUDIO_PATHS = [
        "../../../../audio/ui-deep-collapse-crystal-01.wav",
        "../../../../audio/ui-deep-collapse-crystal-02.wav",
        "../../../../audio/ui-deep-collapse-crystal-03.wav"
      ];
      var CRYSTAL_COLLECT_BOOST_DB_MIN = 2;
      var CRYSTAL_COLLECT_BOOST_DB_MAX = 5;
      var crystalAudioElements = null;

      function getCrystalSoundPath(soundIndex) {
        if (window.WebExtrasGameUiAudioPaths && window.WebExtrasGameUiAudioPaths.getUiSoundPath) {
          return window.WebExtrasGameUiAudioPaths.getUiSoundPath(CRYSTAL_AUDIO_FILES[soundIndex]);
        }
        return CRYSTAL_AUDIO_PATHS[soundIndex];
      }

      function ensureCrystalAudio() {
        var soundIndex;
        var audioElement;
        if (crystalAudioElements) {
          return true;
        }
        crystalAudioElements = [];
        for (soundIndex = 0; soundIndex < CRYSTAL_AUDIO_COUNT; soundIndex += 1) {
          audioElement = new Audio(getCrystalSoundPath(soundIndex));
          audioElement.preload = "auto";
          crystalAudioElements.push(audioElement);
        }
        return true;
      }

      function getCrystalCollectBoostDb(soundCount) {
        if (soundCount <= 1) {
          return 0;
        }
        if (soundCount === 2) {
          return CRYSTAL_COLLECT_BOOST_DB_MIN;
        }
        return CRYSTAL_COLLECT_BOOST_DB_MAX;
      }

      function getCrystalSoundVolume(soundCount) {
        var baseVolume;
        var boostDb;
        var combinedGain;
        var perSoundVolume;
        baseVolume = getArcadeGamesOutputVolume();
        if (soundCount <= 1) {
          return baseVolume;
        }
        boostDb = getCrystalCollectBoostDb(soundCount);
        combinedGain = Math.pow(10, boostDb / 20);
        perSoundVolume = baseVolume * combinedGain / Math.sqrt(soundCount);
        if (perSoundVolume > 1) {
          perSoundVolume = 1;
        }
        return perSoundVolume;
      }

      function playCrystalSoundAtIndex(soundIndex, soundVolume) {
        var audio;
        var playPromise;
        if (!ensureCrystalAudio()) {
          return;
        }
        audio = crystalAudioElements[soundIndex].cloneNode();
        audio.volume = soundVolume;
        playPromise = audio.play();
        if (playPromise && playPromise.catch) {
          playPromise.catch(function () {});
        }
      }

      function playCrystalCollectSounds(clusterCount) {
        var soundIndex;
        var randomIndex;
        var playIndex;
        var playCount;
        var soundVolume;
        if (!clusterCount || clusterCount < 1) {
          return;
        }
        if (!ensureCrystalAudio()) {
          return;
        }
        if (clusterCount >= CRYSTAL_AUDIO_COUNT) {
          playCount = CRYSTAL_AUDIO_COUNT;
          soundVolume = getCrystalSoundVolume(playCount);
          for (soundIndex = 0; soundIndex < CRYSTAL_AUDIO_COUNT; soundIndex += 1) {
            playCrystalSoundAtIndex(soundIndex, soundVolume);
          }
          return;
        }
        playCount = clusterCount;
        soundVolume = getCrystalSoundVolume(playCount);
        for (playIndex = 0; playIndex < clusterCount; playIndex += 1) {
          randomIndex = Math.floor(rand() * CRYSTAL_AUDIO_COUNT);
          playCrystalSoundAtIndex(randomIndex, soundVolume);
        }
      }

      function rand() {
        seed = (seed * 16807 + 0) % 2147483647;
        return (seed & 2147483647) / 2147483647;
      }

      function randRange(min, max) {
        return min + rand() * (max - min);
      }

      function setRandomWorldSeed() {
        seed = 1 + Math.floor(Math.random() * 2147483646);
      }

      function hashNoise(x, y) {
        var n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
        return n - Math.floor(n);
      }

      function getMaterialSampleX(col) {
        return col * PIXEL / Math.max(1, window.innerWidth);
      }

      function getMaterialSampleY(row) {
        return row * PIXEL / Math.max(1, window.innerHeight);
      }

      function isCrystalCell(cell) {
        return cell >= CELL_CRYSTAL_BASE && cell < CELL_CRYSTAL_BASE + CRYSTAL_COUNT;
      }

      function getPatternWave(col, row) {
        var sampleX = getMaterialSampleX(col);
        var sampleY = getMaterialSampleY(row);
        var drift = hashNoise(sampleX * 1.4, sampleY * 1.1) * 0.35;
        var layerX = Math.sin((sampleX + drift) * Math.PI * 2);
        var layerY = Math.sin((sampleY + drift * 0.7) * Math.PI * 2 + 1.4);
        return (layerX + layerY) * 0.25 + 0.5;
      }

      function getDirtColor(col, row, shade) {
        var coarse = hashNoise(col * 0.31, row * 0.17);
        var fine = hashNoise(col * 0.63, row * 0.44);
        var wave = getPatternWave(col, row);
        var lightRed = 98 + shade * 0.62 + coarse * 12 + fine * 6;
        var lightGreen = 68 + shade * 0.38 + coarse * 8 + fine * 4;
        var lightBlue = 42 + shade * 0.22 + coarse * 5 + fine * 3;
        var darkRed = 58 + shade * 0.46 + coarse * 10 + fine * 5;
        var darkGreen = 38 + shade * 0.27 + coarse * 6 + fine * 3;
        var darkBlue = 24 + shade * 0.15 + coarse * 4 + fine * 2;
        return [
          Math.floor(lightRed + (darkRed - lightRed) * wave),
          Math.floor(lightGreen + (darkGreen - lightGreen) * wave),
          Math.floor(lightBlue + (darkBlue - lightBlue) * wave)
        ];
      }

      function getCaveColor(col, row) {
        var dirt = getDirtColor(col, row, 28);
        return [
          Math.floor(dirt[0] * 0.28),
          Math.floor(dirt[1] * 0.26),
          Math.floor(dirt[2] * 0.24)
        ];
      }

      function getRockColor(col, row, shade) {
        var coarse = hashNoise(col * 0.22, row * 0.16);
        var fine = hashNoise(col * 0.58, row * 0.41);
        var wave = getPatternWave(col + 19, row + 13);
        var lightBase = 78 + shade * 0.2;
        var darkBase = 46 + shade * 0.14;
        var base = lightBase + (darkBase - lightBase) * wave;
        return [
          Math.floor(base + coarse * 12 + fine * 5),
          Math.floor(base - 4 + coarse * 10 + fine * 4),
          Math.floor(base - 8 + coarse * 9 + fine * 4)
        ];
      }

      function getGroundType(col, row, depth) {
        if (depth < 4) {
          return CELL_DIRT;
        }
        var sampleX = getMaterialSampleX(col);
        var sampleY = getMaterialSampleY(row);
        var rockBand = hashNoise(sampleX * 1.15, sampleY * 0.95);
        var rockMix = hashNoise(sampleX * 0.72 + 5.4, sampleY * 0.58 + 2.8);
        if (rockBand > 0.54 && rockMix > 0.36) {
          return CELL_ROCK;
        }
        return CELL_DIRT;
      }

      function resizeCanvas(width, height) {
        var dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      function getViewportGridCols(width) {
        return Math.ceil(width / PIXEL) + 2;
      }

      function expandGridColsIfNeeded(neededCols) {
        var oldCols;
        var col;
        var row;
        var index;
        var oldIndex;
        var surfaceRow;
        var newCells;
        var newShade;
        var newClusterIds;
        if (neededCols <= gridCols) {
          return;
        }
        oldCols = gridCols;
        newCells = new Uint8Array(neededCols * gridRows);
        newShade = new Uint8Array(neededCols * gridRows);
        newClusterIds = new Uint16Array(neededCols * gridRows);
        for (row = 0; row < gridRows; row += 1) {
          for (col = 0; col < oldCols; col += 1) {
            oldIndex = row * oldCols + col;
            index = row * neededCols + col;
            newCells[index] = cells[oldIndex];
            newShade[index] = dirtShade[oldIndex];
            newClusterIds[index] = crystalClusterId[oldIndex];
          }
        }
        cells = newCells;
        dirtShade = newShade;
        crystalClusterId = newClusterIds;
        gridCols = neededCols;
        buildSurfaceRows();
        crystalMarksBuffer = new Uint8Array(gridCols * gridRows);
        ensureGridWorkBuffers();
        for (col = oldCols; col < gridCols; col += 1) {
          for (row = 0; row < gridRows; row += 1) {
            surfaceRow = getSurfaceRow(col);
            index = cellIndex(col, row);
            crystalClusterId[index] = 0;
            if (row < surfaceRow) {
              cells[index] = CELL_EMPTY;
              dirtShade[index] = 0;
            } else {
              setDirtCell(col, row, true);
            }
          }
        }
        ensureWorldLayerCanvas();
        rebuildWorldLayer();
      }

      function commitViewportSize() {
        var width = window.innerWidth;
        var height = window.innerHeight;
        var neededCols;
        viewportCommitTimer = null;
        resizeCanvas(width, height);
        baseMaxHoleRadius = Math.min(width, height) * 0.5;
        rebuildStaticBackground(width, height);
        neededCols = getViewportGridCols(width);
        if (!worldReady) {
          gridCols = neededCols;
          initWorld();
          worldReady = true;
          return;
        }
        expandGridColsIfNeeded(neededCols);
        sunWorldX = width * 0.68;
      }

      function scheduleViewportCommit() {
        if (viewportCommitTimer !== null) {
          clearTimeout(viewportCommitTimer);
        }
        viewportCommitTimer = setTimeout(commitViewportSize, VIEWPORT_COMMIT_DELAY_MS);
      }

      function flushViewportCommit() {
        if (viewportCommitTimer === null) {
          return;
        }
        clearTimeout(viewportCommitTimer);
        commitViewportSize();
      }

      function rebuildStaticBackground(width, height) {
        var block = 28;
        var col;
        var row;
        var px;
        var py;
        var noise;
        var red;
        var green;
        var blue;
        var stripeStep = 36;
        var stripeIndex;
        if (!staticBgCanvas) {
          staticBgCanvas = document.createElement("canvas");
          staticBgCtx = staticBgCanvas.getContext("2d");
        }
        staticBgCanvas.width = width;
        staticBgCanvas.height = height;
        staticBgCtx.fillStyle = "#06040c";
        staticBgCtx.fillRect(0, 0, width, height);
        for (row = 0; row < height + block; row += block) {
          for (col = 0; col < width + block; col += block) {
            px = col + block * 0.5;
            py = row + block * 0.5;
            noise = hashNoise(px * 0.07, py * 0.05);
            red = SKY_PATTERN[0] + noise * 18;
            green = SKY_PATTERN[1] + noise * 12;
            blue = SKY_PATTERN[2] + noise * 22;
            staticBgCtx.fillStyle = "rgba(" + Math.floor(red) + "," + Math.floor(green) + "," + Math.floor(blue) + ",0.55)";
            staticBgCtx.fillRect(col, row, block - 2, block - 2);
          }
        }
        staticBgCtx.strokeStyle = "rgba(20, 14, 32, 0.35)";
        staticBgCtx.lineWidth = 1;
        for (stripeIndex = -height; stripeIndex < width + height; stripeIndex += stripeStep) {
          staticBgCtx.beginPath();
          staticBgCtx.moveTo(stripeIndex, 0);
          staticBgCtx.lineTo(stripeIndex + height, height);
          staticBgCtx.stroke();
        }
      }

      function ensureWorldLayerCanvas() {
        var pixelWidth = gridCols * PIXEL;
        var pixelHeight = gridRows * PIXEL;
        var oldCanvas;
        var oldPixelWidth;
        var oldPixelHeight;
        if (!worldLayerCanvas) {
          worldLayerCanvas = document.createElement("canvas");
          worldLayerCtx = worldLayerCanvas.getContext("2d");
          worldLayerCols = 0;
          worldLayerRows = 0;
        }
        if (worldLayerCols !== gridCols || worldLayerRows !== gridRows) {
          oldCanvas = worldLayerCanvas;
          oldPixelWidth = worldLayerCols * PIXEL;
          oldPixelHeight = worldLayerRows * PIXEL;
          worldLayerCanvas = document.createElement("canvas");
          worldLayerCtx = worldLayerCanvas.getContext("2d");
          worldLayerCanvas.width = pixelWidth;
          worldLayerCanvas.height = pixelHeight;
          if (worldLayerRows > 0) {
            worldLayerCtx.drawImage(oldCanvas, 0, 0, oldPixelWidth, oldPixelHeight);
          }
          worldLayerCols = gridCols;
          worldLayerRows = gridRows;
        }
      }

      function getSurfaceRow(col) {
        if (!surfaceRowByCol || col < 0 || col >= gridCols) {
          return horizonRow;
        }
        return surfaceRowByCol[col];
      }

      function buildSurfaceRows() {
        var col;
        var wave;
        var row;
        surfaceRowByCol = new Uint16Array(gridCols);
        for (col = 0; col < gridCols; col += 1) {
          wave = Math.sin(col * 0.09) * 2.5 + Math.sin(col * 0.031 + 1.7) * 1.8 + hashNoise(col * 0.15, 42) * 2.2;
          row = Math.floor(horizonRow + wave);
          if (row < 3) {
            row = 3;
          }
          if (row > horizonRow + 6) {
            row = horizonRow + 6;
          }
          surfaceRowByCol[col] = row;
        }
      }

      function getBonusScaleT(bonusValue) {
        var scale = (bonusValue - 1) / (MAX_BONUS - 1);
        if (scale < 0) {
          scale = 0;
        }
        if (scale > 1) {
          scale = 1;
        }
        return scale;
      }

      function getStartHoleRadius() {
        return MIN_DIG_RADIUS;
      }

      function getMinHoleRadius() {
        return MIN_MAX_HOLE_RADIUS;
      }

      function canDigAtCurrentHoleSize() {
        return holeRadius >= MIN_DIG_RADIUS;
      }

      function getMaxHoleRadius() {
        var scale = getBonusScaleT(getBonus());
        var minRadius = getMinHoleRadius();
        var maxRadius = baseMaxHoleRadius * 0.5;
        return minRadius + (maxRadius - minRadius) * scale;
      }

      function getHoleGrowthSpeed() {
        var bonusScale = getBonusScaleT(getBonus());
        return BASE_GROWTH_SPEED * (1 + bonusScale * 5);
      }

      function paintWorldCell(col, row) {
        var index;
        var cell;
        var x;
        var y;
        var terrainColor;
        var shade;
        var rarity;
        var surfaceRow;
        if (row < 0 || row >= gridRows || col < 0 || col >= gridCols) {
          return;
        }
        surfaceRow = getSurfaceRow(col);
        index = cellIndex(col, row);
        cell = cells[index];
        if (cell === CELL_EMPTY && getWorldRow(row) < surfaceRow) {
          ensureWorldLayerCanvas();
          worldLayerCtx.clearRect(col * PIXEL, row * PIXEL, PIXEL, PIXEL);
          return;
        }
        if (getWorldRow(row) < surfaceRow && !isCrystalCell(cell)) {
          return;
        }
        x = col * PIXEL;
        y = row * PIXEL;
        if (cell === CELL_EMPTY) {
          terrainColor = getCaveColor(col, row);
        } else if (isCrystalCell(cell)) {
          rarity = cell - CELL_CRYSTAL_BASE;
          terrainColor = RARITY_COLORS[rarity];
        } else {
          shade = dirtShade[index];
          if (cell === CELL_ROCK) {
            terrainColor = getRockColor(col, row, shade);
          } else {
            terrainColor = getDirtColor(col, row, shade);
          }
        }
        ensureWorldLayerCanvas();
        worldLayerCtx.fillStyle = "rgb(" + terrainColor[0] + "," + terrainColor[1] + "," + terrainColor[2] + ")";
        worldLayerCtx.fillRect(x, y, PIXEL, PIXEL);
      }

      function paintWorldCellRegion(minCol, minRow, maxCol, maxRow) {
        var col;
        var row;
        if (minCol < 0) {
          minCol = 0;
        }
        if (minRow < 0) {
          minRow = 0;
        }
        if (maxCol >= gridCols) {
          maxCol = gridCols - 1;
        }
        if (maxRow >= gridRows) {
          maxRow = gridRows - 1;
        }
        for (row = minRow; row <= maxRow; row += 1) {
          for (col = minCol; col <= maxCol; col += 1) {
            paintWorldCell(col, row);
          }
        }
      }

      function rebuildWorldLayer() {
        var col;
        var row;
        ensureWorldLayerCanvas();
        for (row = 0; row < gridRows; row += 1) {
          for (col = 0; col < gridCols; col += 1) {
            paintWorldCell(col, row);
          }
        }
      }

      function initWorld() {
        setRandomWorldSeed();
        var width = window.innerWidth;
        var height = window.innerHeight;
        horizonWorldY = height * 0.5;
        horizonRow = Math.floor(horizonWorldY / PIXEL);
        sunWorldX = width * 0.68;
        sunWorldY = horizonWorldY - height * 0.22;
        nextClusterId = 1;
        gridRowBase = 0;

        gridRows = horizonRow + CHUNK_ROWS * 3;
        ensureGridWorkBuffers();
        cells = new Uint8Array(gridCols * gridRows);
        dirtShade = new Uint8Array(gridCols * gridRows);
        crystalClusterId = new Uint16Array(gridCols * gridRows);

        buildSurfaceRows();

        var index;
        var col;
        var row;
        var surfaceRow;
        for (row = 0; row < gridRows; row += 1) {
          for (col = 0; col < gridCols; col += 1) {
            index = cellIndex(col, row);
            crystalClusterId[index] = 0;
            surfaceRow = getSurfaceRow(col);
            if (row < surfaceRow) {
              cells[index] = CELL_EMPTY;
              dirtShade[index] = 0;
            } else {
              setDirtCell(col, row, true);
            }
          }
        }
        deepestRow = gridRows - 1;
        cameraY = 0;
        targetCameraY = 0;
        generateChunkBelow();
        spawnSurfaceCrystalPlants();
        rebuildWorldLayer();
      }

      function getStartHintText() {
        return getLocalized(LOCALE_KEY_START_HINT, "click to start");
      }

      function drawCrystalCellPreview(canvas, rarity) {
        var previewContext = canvas.getContext("2d");
        var displayScale = 3;
        var canvasSize = PIXEL * displayScale;
        var color = RARITY_COLORS[rarity];
        var pulse = 0.85 + Math.sin(glossPhase * CRYSTAL_GLOSS_SPEED) * 0.15;
        var red = Math.floor(color[0] * pulse);
        var green = Math.floor(color[1] * pulse);
        var blue = Math.floor(color[2] * pulse);
        var innerRed = Math.min(255, red + 40);
        var innerGreen = Math.min(255, green + 40);
        var innerBlue = Math.min(255, blue + 40);
        var inset = displayScale;
        canvas.width = canvasSize;
        canvas.height = canvasSize;
        previewContext.clearRect(0, 0, canvasSize, canvasSize);
        previewContext.fillStyle = "rgb(" + red + "," + green + "," + blue + ")";
        previewContext.fillRect(0, 0, canvasSize, canvasSize);
        previewContext.fillStyle = "rgb(" + innerRed + "," + innerGreen + "," + innerBlue + ")";
        previewContext.fillRect(inset, inset, canvasSize - inset * 2, canvasSize - inset * 2);
      }

      function buildCrystalPreviewRow() {
        var rarityIndex;
        var item;
        var canvas;
        var costLabel;
        crystalPreviewRowEl.innerHTML = "";
        startCrystalPreviewCanvases.length = 0;
        for (rarityIndex = 0; rarityIndex < CRYSTAL_COUNT; rarityIndex += 1) {
          item = document.createElement("div");
          item.className = "crystal-preview-item";
          canvas = document.createElement("canvas");
          canvas.className = "crystal-preview-canvas";
          costLabel = document.createElement("p");
          costLabel.className = "crystal-preview-cost";
          costLabel.textContent = formatScoreTons(RARITY_SCORE[rarityIndex]);
          item.appendChild(canvas);
          item.appendChild(costLabel);
          crystalPreviewRowEl.appendChild(item);
          startCrystalPreviewCanvases.push(canvas);
        }
      }

      function updateStartCrystalPreviews() {
        var rarityIndex;
        var canvas;
        if (sessionStarted) {
          return;
        }
        for (rarityIndex = 0; rarityIndex < startCrystalPreviewCanvases.length; rarityIndex += 1) {
          canvas = startCrystalPreviewCanvases[rarityIndex];
          drawCrystalCellPreview(canvas, rarityIndex);
        }
      }

      function showStartScreen() {
        sessionStarted = false;
        gameScreenEl.classList.remove("hidden");
        screenTitleEl.textContent = GAME_TITLE;
        controlHintEl.textContent = getStartHintText();
        holeGrowing = false;
        updateStartCrystalPreviews();
        if (window.WebExtrasGameStartMusicNotify && window.WebExtrasGameStartMusicNotify.notifyStartScreenReady) {
          window.WebExtrasGameStartMusicNotify.notifyStartScreenReady();
        }
      }

      function startSession() {
        if (sessionStarted) {
          return;
        }
        sessionStarted = true;
        gameScreenEl.classList.add("hidden");
        beginHoleGrowCycle();
        if (window.WebExtrasGameStartMusicNotify && window.WebExtrasGameStartMusicNotify.notifyGameplayStarted) {
          window.WebExtrasGameStartMusicNotify.notifyGameplayStarted();
        }
        if (getSynth()) {
          getSynth().ensureContext();
          getSynth().playGameStart();
        }
        ensureCollapseAudio();
        ensureCrystalAudio();
      }

      function placeSurfaceCrystal(col, row, cellType, clusterId) {
        var index;
        if (col < 0 || col >= gridCols || row < 0 || row >= gridRows) {
          return;
        }
        if (getWorldRow(row) >= getSurfaceRow(col)) {
          return;
        }
        index = cellIndex(col, row);
        if (cells[index] !== CELL_EMPTY) {
          return;
        }
        cells[index] = cellType;
        crystalClusterId[index] = clusterId;
        paintWorldCell(col, row);
      }

      function growSurfaceCactus(baseCol, surfaceRow, clusterId, rarity) {
        var height = 3 + Math.floor(rand() * 14);
        var row;
        var armRow;
        var cellType = CELL_CRYSTAL_BASE + rarity;
        for (row = 1; row <= height; row += 1) {
          placeSurfaceCrystal(baseCol, surfaceRow - row, cellType, clusterId);
        }
        if (height >= 5 && rand() < 0.55) {
          armRow = surfaceRow - height + 2;
          placeSurfaceCrystal(baseCol - 1, armRow, cellType, clusterId);
          if (rand() < 0.5) {
            placeSurfaceCrystal(baseCol + 1, armRow + 2, cellType, clusterId);
          }
        }
        if (height >= 9 && rand() < 0.4) {
          armRow = surfaceRow - Math.floor(height * 0.55);
          placeSurfaceCrystal(baseCol + 1, armRow, cellType, clusterId);
        }
      }

      function growSurfaceMushroom(baseCol, surfaceRow, clusterId, rarity) {
        var stemHeight = 2 + Math.floor(rand() * 11);
        var capRow;
        var cellType = CELL_CRYSTAL_BASE + rarity;
        var row;
        for (row = 1; row <= stemHeight; row += 1) {
          placeSurfaceCrystal(baseCol, surfaceRow - row, cellType, clusterId);
        }
        capRow = surfaceRow - stemHeight - 1;
        placeSurfaceCrystal(baseCol, capRow, cellType, clusterId);
        placeSurfaceCrystal(baseCol - 1, capRow, cellType, clusterId);
        placeSurfaceCrystal(baseCol + 1, capRow, cellType, clusterId);
        if (stemHeight >= 4 && rand() < 0.45) {
          placeSurfaceCrystal(baseCol, capRow - 1, cellType, clusterId);
        }
        if (stemHeight >= 7 && rand() < 0.3) {
          placeSurfaceCrystal(baseCol - 1, capRow - 1, cellType, clusterId);
          placeSurfaceCrystal(baseCol + 1, capRow - 1, cellType, clusterId);
        }
      }

      function spawnSurfaceCrystalPlants() {
        var col;
        var clusterId;
        var surfaceRow;
        var plantKind;
        var plantRarity;
        var nextGap;
        col = 6;
        nextGap = 9 + Math.floor(rand() * 9);
        while (col < gridCols - 6) {
          if (rand() > 0.58) {
            col += 1;
            continue;
          }
          surfaceRow = getSurfaceRow(col);
          if (surfaceRow < 3) {
            col += 1;
            continue;
          }
          clusterId = nextClusterId;
          nextClusterId += 1;
          if (nextClusterId > 65000) {
            nextClusterId = 1;
          }
          plantRarity = Math.floor(rand() * CRYSTAL_COUNT);
          plantKind = rand() < 0.5 ? 0 : 1;
          if (plantKind === 0) {
            growSurfaceCactus(col, surfaceRow, clusterId, plantRarity);
          } else {
            growSurfaceMushroom(col, surfaceRow, clusterId, plantRarity);
          }
          col += nextGap;
          nextGap = 9 + Math.floor(rand() * 9);
        }
      }

      function getHorizonScreenY() {
        return horizonWorldY - cameraY;
      }

      function getScoreTargetX() {
        return window.innerWidth * 0.5;
      }

      function getScoreTargetY() {
        return 22;
      }

      function getBonusTargetX() {
        return window.innerWidth * 0.5;
      }

      function getBonusTargetY() {
        if (bonusHudEl) {
          var rect = bonusHudEl.getBoundingClientRect();
          return rect.top + rect.height * 0.5;
        }
        return window.innerHeight - 42;
      }

      function getBonus() {
        if (bonus > MAX_BONUS) {
          return MAX_BONUS;
        }
        if (bonus < 1) {
          return 1;
        }
        return bonus;
      }

      function getBonusBarFillPercent(bonusValue) {
        return getBonusScaleT(getBonus()) * 100;
      }

      function decayBonus(dt) {
        var excess;
        var decayFactor;
        var logExcess;
        var shrink;
        if (bonus > MAX_BONUS) {
          excess = bonus - MAX_BONUS;
          logExcess = Math.log(1 + excess);
          shrink = Math.exp(-BONUS_OVERFLOW_DECAY * dt * logExcess / 20);
          excess = excess * shrink;
          if (excess < 0.5) {
            bonus = MAX_BONUS;
          } else {
            bonus = MAX_BONUS + excess;
          }
          return;
        }
        decayFactor = Math.pow(1 - BONUS_DECAY_PERCENT, dt);
        bonus = Math.max(1, bonus * decayFactor);
      }

      function getCrystalSpeedBoostGain(crystal) {
        var rarity = crystal.rarity;
        var pixelCount = crystal.pixelCount || 1;
        var rarityGain = RARITY_SPEED_GAIN[rarity];
        var powerGain = Math.sqrt(pixelCount) * RARITY_POWER_GAIN[rarity];
        return rarityGain + powerGain;
      }

      function getLocaleApi() {
        if (window.WebLocale) {
          return window.WebLocale;
        }
        return null;
      }

      function getLocalized(key, fallback) {
        var locale = getLocaleApi();
        if (locale) {
          return locale.get(key, fallback);
        }
        if (fallback != null) {
          return fallback;
        }
        return key;
      }

      function applyGameLocale() {
        if (bestLabelEl) {
          bestLabelEl.textContent = getLocalized(LOCALE_KEY_BEST_LABEL, "best");
        }
        if (depthLabelEl) {
          depthLabelEl.textContent = getLocalized(LOCALE_KEY_DEPTH_LABEL, "depth");
        }
        if (depthBestLabelEl) {
          depthBestLabelEl.textContent = getLocalized(LOCALE_KEY_BEST_LABEL, "best");
        }
        if (bonusBarLabelMinEl) {
          bonusBarLabelMinEl.textContent = formatBonus(1);
        }
        if (bonusBarLabelMaxEl) {
          bonusBarLabelMaxEl.textContent = formatBonus(MAX_BONUS);
        }
        if (!sessionStarted) {
          screenTitleEl.textContent = GAME_TITLE;
          controlHintEl.textContent = getStartHintText();
        }
        updateHudDisplay();
        if (bestScore > 0) {
          bestValueEl.textContent = formatScoreTons(bestScore);
        }
        if (bestDepth > 0) {
          depthBestValueEl.textContent = formatDepth(bestDepth);
        }
      }

      function bindLocaleListener() {
        window.addEventListener("web-locale-applied", applyGameLocale);
      }

      function formatScoreTons(value) {
        return String(Math.round(value)) + getLocalized(LOCALE_KEY_TONS_SUFFIX, "t");
      }

      function formatDepth(value) {
        return String(Math.round(value)) + getLocalized(LOCALE_KEY_METERS_SUFFIX, "m");
      }

      function getHoleDepth() {
        var worldRow = Math.floor(holeY / PIXEL);
        var depth = worldRow - horizonRow;
        if (depth < 0) {
          depth = 0;
        }
        return depth;
      }

      function updateSessionDepth() {
        var depth = getHoleDepth();
        if (depth > sessionMaxDepth) {
          sessionMaxDepth = depth;
          setBestDepthIfHigher(sessionMaxDepth);
        }
      }

      function formatScoreGainLabel(earned) {
        return "+" + formatScoreTons(earned);
      }

      function formatBonus(bonusValue) {
        var label = getLocalized(LOCALE_KEY_BONUS_LABEL, "bonus");
        var value = bonusValue;
        if (value < 1) {
          value = 1;
        }
        if (value >= 1000000) {
          return label + " " + (value / 1000000).toFixed(1) + "m";
        }
        if (value >= 1000) {
          return label + " " + (value / 1000).toFixed(1) + "k";
        }
        if (value >= 100) {
          return label + " " + String(Math.floor(value));
        }
        return label + " " + value.toFixed(1);
      }

      function formatBoostGainLabel(gain) {
        if (gain >= 100) {
          return "+" + gain.toFixed(0);
        }
        if (gain >= 10) {
          return "+" + gain.toFixed(1);
        }
        if (gain >= 1) {
          return "+" + gain.toFixed(1);
        }
        return "+" + gain.toFixed(2);
      }

      function formatOrePercent(collected, resolved) {
        if (resolved <= 0) {
          return 0;
        }
        return Math.floor(collected * 100 / resolved);
      }

      function formatOreHud() {
        var resolved = oreUnitsCollected + oreUnitsDespawned;
        var percent = formatOrePercent(oreUnitsCollected, resolved);
        return String(oreUnitsCollected) + "/" + String(resolved) + " (" + String(percent) + "%)";
      }

      function registerOreUnitsCollected(count) {
        if (count > 0) {
          oreUnitsCollected += count;
        }
      }

      function registerOreUnitsDespawned(count) {
        if (count > 0) {
          oreUnitsDespawned += count;
        }
      }

      function updateHudDisplay() {
        scoreValueEl.textContent = formatScoreTons(score);
        depthValueEl.textContent = formatDepth(sessionMaxDepth);
        depthBestValueEl.textContent = formatDepth(bestDepth);
        bonusHudEl.textContent = formatBonus(bonus);

      }

      function loadBestScore() {
        var stored = localStorage.getItem(BEST_SCORE_STORAGE_KEY);
        var parsed;
        if (stored === null) {
          return 0;
        }
        parsed = parseInt(stored, 10);
        if (isNaN(parsed) || parsed < 0) {
          return 0;
        }
        return parsed;
      }

      function saveBestScore() {
        localStorage.setItem(BEST_SCORE_STORAGE_KEY, String(bestScore));

      function setBestScoreIfHigher(value) {
        if (value > bestScore) {

      function loadBestDepth() {
        var stored = localStorage.getItem(BEST_DEPTH_STORAGE_KEY);
        var parsed;
        if (stored === null) {
          return 0;
        }
        parsed = parseInt(stored, 10);
        if (isNaN(parsed) || parsed < 0) {
          return 0;
        }
        return parsed;
      }

      function saveBestDepth() {
        localStorage.setItem(BEST_DEPTH_STORAGE_KEY, String(bestDepth));
      }

      function setBestDepthIfHigher(value) {
        if (value > bestDepth) {
