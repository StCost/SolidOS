<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demon Bastion</title>
  <script src="../iframe-game-locale.js"></script>
  <script src="../iframe-game-input.js"></script>
  <script src="../extras-game-start-music-notify.js"></script>
  <link rel="stylesheet" href="demon-bastion.css" />
</head>
<body>
  <div id="gameRoot" tabindex="0">
    <canvas id="gameCanvas" aria-hidden="true"></canvas>
    <div id="minimapPanel" class="hidden" aria-hidden="true">
      <canvas id="minimapCanvas" width="64" height="64"></canvas>
      <div id="minimapZoomControls">
        <button type="button" id="btnZoomOut" class="minimap-zoom-btn" aria-label="Zoom out">−</button>
        <button type="button" id="btnZoomIn" class="minimap-zoom-btn" aria-label="Zoom in">+</button>
      </div>
    </div>
    <div id="hudTop" class="hidden">
      <div class="hud-stat">
        <div class="hud-stat-label">CREDITS</div>
        <div class="hud-stat-value" id="hudMoney">0</div>
      </div>
      <div class="hud-stat">
        <div class="hud-stat-label">DEMON ANGER</div>
        <div class="hud-stat-bar"><div id="hudAngerFill"></div></div>
      </div>
      <div class="hud-stat">
        <div class="hud-stat-label">WAVE</div>
        <div class="hud-stat-value" id="hudWave">0</div>
      </div>
    </div>
    <div id="buildBar" class="hidden"></div>
    <div id="gameScreen">
      <h1 id="screenTitle">Demon Bastion</h1>
      <p id="controlHint">
        Top-down base defense. Pan with WASD, drag, or touch. Scroll to zoom. Mine ore, spend credits on defenses,
        and survive escalating demon waves.
      </p>
      <p id="gameOverLine" class="hidden"></p>
    </div>
  </div>
  <script src="demon-bastion.js"></script>
</body>
</html>
