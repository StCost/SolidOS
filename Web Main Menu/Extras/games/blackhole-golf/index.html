        celebrationCtx.clearRect(0, 0, celebrationWidth, celebrationHeight);
        for (particleIndex = 0; particleIndex < celebrationParticles.length; particleIndex += 1) {
          particle = celebrationParticles[particleIndex];
          alpha = particle.life / particle.maxLife;
          if (alpha < 0) {
            alpha = 0;
          }
          if (alpha > 1) {
            alpha = 1;
          }
          if (particle.kind === "confetti") {
            celebrationCtx.save();
            celebrationCtx.translate(particle.x, particle.y);
            celebrationCtx.rotate(particle.angle);
            celebrationCtx.fillStyle = "hsla(" + particle.hue + ", 88%, 62%, " + alpha + ")";
            halfWidth = particle.width * 0.5;
            halfHeight = particle.height * 0.5;
            celebrationCtx.fillRect(-halfWidth, -halfHeight, particle.width, particle.height);
            celebrationCtx.restore();
          } else {
            celebrationCtx.fillStyle = "hsla(" + particle.hue + ", 95%, 72%, " + alpha + ")";
            celebrationCtx.beginPath();
            celebrationCtx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
            celebrationCtx.fill();
          }
        }
      }

      function getCameraBaseZoom() {
        var width = canvas.clientWidth;
        var height = canvas.clientHeight;
        var minDimension = width;
        if (height < minDimension) {
          minDimension = height;
        }
        var zoom = minDimension / CAMERA_BASE_ZOOM_REFERENCE;
        if (zoom < CAMERA_BASE_ZOOM_MIN) {
          zoom = CAMERA_BASE_ZOOM_MIN;
        }
        if (zoom > CAMERA_BASE_ZOOM_MAX) {
          zoom = CAMERA_BASE_ZOOM_MAX;
        }
        return zoom;
      }

      function getCameraLeadDistance(speed) {
        var leadDistance = speed * CAMERA_LEAD_SPEED_SCALE;
        if (leadDistance > CAMERA_LEAD_MAX) {
          leadDistance = CAMERA_LEAD_MAX;
        }
        return leadDistance;
      }

      function getCameraZoomFromSpeed(speed) {
        var speedRatio = speed / KICK_POWER_DISPLAY_REFERENCE;
        if (speedRatio < 0) {
          speedRatio = 0;
        }
        if (speedRatio > 1) {
          speedRatio = 1;
        }
        return 1 + speedRatio * CAMERA_ZOOM_MAX_BOOST;
      }

      function getCameraSpeedModifier(speed) {
        if (speed <= REST_SPEED) {
          return 0;
        }
        var modifier = (speed - REST_SPEED) / (KICK_POWER_DISPLAY_REFERENCE - REST_SPEED);
        if (modifier > 1) {
          modifier = 1;
        }
        return modifier;
      }

      function syncBallDisplayPrevious() {
        ballPrevX = ballX;
        ballPrevY = ballY;
      }

      function getBallDisplayPosition() {
        if (gameState !== stateRolling || holeWarpActive) {
          return { x: ballX, y: ballY };
        }
        return {
          x: ballX + ballVelX * physicsTimeAccumulator,
          y: ballY + ballVelY * physicsTimeAccumulator
        };
      }

      function getCameraTarget() {
        var displayBall = getBallDisplayPosition();
        var targetCenterX = displayBall.x;
        var targetCenterY = displayBall.y;
        var baseZoom = getCameraBaseZoom();
        var targetZoom = baseZoom;
        if (gameState !== stateRolling) {
          return {
            centerX: targetCenterX,
            centerY: targetCenterY,
            zoom: targetZoom
          };
        }
        var speed = Math.sqrt(ballVelX * ballVelX + ballVelY * ballVelY);
        var speedModifier = getCameraSpeedModifier(speed);
        if (speedModifier <= 0) {
          return {
            centerX: targetCenterX,
            centerY: targetCenterY,
            zoom: targetZoom
          };
        }
        var dirX = ballVelX / speed;
        var dirY = ballVelY / speed;
        var leadDistance = getCameraLeadDistance(speed) * speedModifier;
        targetCenterX = displayBall.x + dirX * leadDistance;
        targetCenterY = displayBall.y + dirY * leadDistance;
        var zoomBoost = getCameraZoomFromSpeed(speed) - 1;
        targetZoom = baseZoom + zoomBoost * speedModifier;
        return {
          centerX: targetCenterX,
          centerY: targetCenterY,
          zoom: targetZoom
        };
      }

      function updateCamera(deltaSeconds) {
        var target = getCameraTarget();
        var baseZoom = getCameraBaseZoom();
        var positionBlend = 1 - Math.exp(-CAMERA_POSITION_SMOOTH * deltaSeconds);
        var zoomBlend = 1 - Math.exp(-CAMERA_ZOOM_SMOOTH * deltaSeconds);
        cameraCenterX += (target.centerX - cameraCenterX) * positionBlend;
        cameraCenterY += (target.centerY - cameraCenterY) * positionBlend;
        cameraZoom += (target.zoom - cameraZoom) * zoomBlend;
        if (cameraZoom < baseZoom) {
          cameraZoom = baseZoom;
        }
      }

      function setCameraToBall() {
        cameraCenterX = ballX;
        cameraCenterY = ballY;
        cameraZoom = getCameraBaseZoom();
      }

      function worldToScreen(worldX, worldY) {
        var width = canvas.clientWidth;
        var height = canvas.clientHeight;
        return {
          x: (worldX - cameraCenterX) * cameraZoom + width * 0.5,
          y: (worldY - cameraCenterY) * cameraZoom + height * 0.5
        };
      }

      function screenToWorld(screenX, screenY) {
        var width = canvas.clientWidth;
        var height = canvas.clientHeight;
        return {
          x: (screenX - width * 0.5) / cameraZoom + cameraCenterX,
          y: (screenY - height * 0.5) / cameraZoom + cameraCenterY
        };
      }

      function getLocaleApi() {
        if (window.parent && window.parent !== window && window.parent.WebLocale) {
          return window.parent.WebLocale;
        }
        if (window.WebLocale) {
          return window.WebLocale;
        }
        return null;
      }

      function getLocalized(key, fallback) {
        var locale = getLocaleApi();
        if (locale) {
          return locale.get(key, fallback);

        if (fallback != null) {
          return fallback;
        }
        return key;

      function formatLocalized(key, fallback, value) {

      function getBlackHoleParticleColor() {
        var pick = Math.floor(rand() * 3);
        if (pick === 0) {
          return { r: 8, g: 4, b: 12 };
        }
        if (pick === 1) {
          return { r: 120 + Math.floor(rand() * 70), g: 28, b: 185 };
        }
        return { r: 205 + Math.floor(rand() * 50), g: 22, b: 38 };
      }

      function trimWarpParticles() {
        while (finishParticles.length > WARP_PARTICLE_MAX_COUNT) {
          finishParticles.shift();
        }
      }

      function pushWarpParticle(particle) {
        finishParticles.push(particle);

      function spawnBlackHoleParticles(worldX, worldY) {
        var particleIndex;
        finishParticles.length = 0;
        for (particleIndex = 0; particleIndex < FINISH_PARTICLE_COUNT; particleIndex += 1) {
          var angle = rand() * Math.PI * 2;
          var orbitDistance = 12 + rand() * 36;
          var inwardSpeed = 90 + rand() * 200;
          var swirlSpeed = 40 + rand() * 80;
          var tangentX = -Math.sin(angle);
          var tangentY = Math.cos(angle);
          var color = getBlackHoleParticleColor();
          finishParticles.push({
            x: worldX + Math.cos(angle) * orbitDistance,
            y: worldY + Math.sin(angle) * orbitDistance,
            velX: -Math.cos(angle) * inwardSpeed + tangentX * swirlSpeed,
            velY: -Math.sin(angle) * inwardSpeed + tangentY * swirlSpeed,
            life: 0.5 + rand() * 0.55,
            maxLife: 1.05,
            size: 2 + rand() * 5,
            kind: "hole",
            red: color.r,
            green: color.g,
            blue: color.b
          });

            y: worldY + Math.sin(angle) * (6 + rand() * 14),

          });

      }

      function updateFinishParticles(deltaSeconds) {
        var particleIndex;
        for (particleIndex = finishParticles.length - 1; particleIndex >= 0; particleIndex -= 1) {
          var particle = finishParticles[particleIndex];
          particle.life -= deltaSeconds;
          if (particle.life <= 0) {
            finishParticles.splice(particleIndex, 1);
            continue;
          }
          if ((particle.kind === "hole" || particle.kind === "warp") && holeWarpActive) {
            var pullX = holeWarpParticlePullX - particle.x;
            var pullY = holeWarpParticlePullY - particle.y;
            var pullLength = Math.sqrt(pullX * pullX + pullY * pullY);
            if (pullLength > 0.001) {
              var pullStrength = 660 * deltaSeconds;
              if (particle.kind === "warp") {
                pullStrength = 860 * deltaSeconds;
              }
              particle.velX += (pullX / pullLength) * pullStrength;
              particle.velY += (pullY / pullLength) * pullStrength;
            }
            particle.velX *= 0.9;
            particle.velY *= 0.9;
          } else {
            particle.velX *= 0.96;
            particle.velY *= 0.96;
          }
          particle.x += particle.velX * deltaSeconds;
          particle.y += particle.velY * deltaSeconds;
        }
      }

            alpha = 0;

          if (particle.kind === "hole" || particle.kind === "warp") {
            ctx.fillStyle = "rgba(" + particle.red + ", " + particle.green + ", " + particle.blue + ", " + alpha + ")";
          } else {
            ctx.fillStyle = "hsla(" + particle.hue + ", 90%, 65%, " + alpha + ")";
          }
          ctx.beginPath();
          ctx.arc(screen.x, screen.y, particle.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function showLevelIntro(showImmediately) {
        levelIntroActive = true;
        levelIntroTimer = 0;
        refreshLevelIntroText();
        hideLevelIntroPrompt();
        if (showImmediately) {
          levelIntroCardOpacity = 1;
          levelIntroCardEl.style.opacity = "1";
        } else {
          levelIntroCardOpacity = 0;
          levelIntroCardEl.style.opacity = "0";
        }
        levelIntroOverlayEl.classList.remove("is-hidden");
        updateDistanceHud();
      }

      function hideLevelIntro() {
        levelIntroActive = false;
        levelIntroTimer = 0;
        levelIntroCardOpacity = 0;
        levelIntroCardEl.style.opacity = "0";
        levelIntroOverlayEl.classList.add("is-hidden");
        hideLevelIntroPrompt();
      }

      function updateLevelIntro(deltaSeconds) {
        if (!levelIntroActive) {
          return;
        }
        levelIntroTimer += deltaSeconds;
        if (levelIntroTimer < LEVEL_INTRO_FADE_IN_SECONDS) {
          levelIntroCardOpacity = levelIntroTimer / LEVEL_INTRO_FADE_IN_SECONDS;
        } else {
          levelIntroCardOpacity = 1;
        }
        levelIntroCardEl.style.opacity = String(levelIntroCardOpacity);
      }

      function updateLoseScreen(deltaSeconds) {
        if (!loseScreenActive) {
          return;
        }
        loseTimer += deltaSeconds;
        if (loseTimer < CONGRATS_FADE_IN_SECONDS) {
          loseCardOpacity = loseTimer / CONGRATS_FADE_IN_SECONDS;
        } else {
          loseCardOpacity = 1;
        }
        loseCardEl.style.opacity = String(loseCardOpacity);
      }

      function triggerLevelComplete() {
        if (congratsScreenActive) {
          return;
        }
        congratsScreenActive = true;
        congratsTimer = 0;
        congratsLevelDistance = maxRunDistance;
        congratsLevelMaxSpeed = maxRunSpeed;
        totalScore += Math.round(maxRunDistance);
        if (maxRunDistance > bestDistance) {
          bestDistance = maxRunDistance;
        }
        setCongratsContent(
          levelIndex,
          congratsLevelDistance,
          congratsLevelMaxSpeed,
          totalScore,
          bestDistance
        );
        finishFlashEl.classList.remove("is-active");
        void finishFlashEl.offsetWidth;
        finishFlashEl.classList.add("is-active");
        ballVelX = 0;
        ballVelY = 0;
        gameState = stateAiming;
        hideLevelIntro();
        showCongratsScreen();
        startCelebrationEffects();
        updateDistanceHud();
      }

      function updateCongratsScreen(deltaSeconds) {
        if (!congratsScreenActive) {
          return;
        }
        updateCelebrationEffects(deltaSeconds);
        congratsTimer += deltaSeconds;
        if (congratsTimer < CONGRATS_FADE_IN_SECONDS) {
          congratsCardOpacity = congratsTimer / CONGRATS_FADE_IN_SECONDS;
        } else {
          congratsCardOpacity = 1;
        }
        congratsCardEl.style.opacity = String(congratsCardOpacity);
      }

      function isPositionInFinishZone(positionX, positionY) {
        var offsetX = positionX - finishX;
        var offsetY = positionY - finishY;
        return offsetX * offsetX + offsetY * offsetY <= FINISH_ZONE_RADIUS * FINISH_ZONE_RADIUS;
      }

      function isBallInFinishZone() {
        return isPositionInFinishZone(ballX, ballY);
      }

      function setCursorPushHoldActive(isActive) {
        cursorPushHoldActive = isActive;
        if (!isActive) {
          cursorPushFieldStrength = 0;
        }
      }

      function updateCursorPushFieldStrength(deltaSeconds) {
        if (!cursorPushHoldActive) {
          return;
        }
        cursorPushFieldStrength -= CURSOR_PUSH_FIELD_SHRINK_RATE * deltaSeconds;
        if (cursorPushFieldStrength <= 0) {
          setCursorPushHoldActive(false);
        }
      }

      function applyCursorPushToBody(bodyX, bodyY, bodyVelX, bodyVelY, worldMouseX, worldMouseY, deltaSeconds, pushScale) {
        if (pushScale <= 0.001) {
          return { velX: bodyVelX, velY: bodyVelY };
        }
        var offsetX = bodyX - worldMouseX;
        var offsetY = bodyY - worldMouseY;
        var distanceSq = offsetX * offsetX + offsetY * offsetY;
        var radius = CURSOR_PUSH_RADIUS * pushScale;
        if (distanceSq >= radius * radius) {
          return { velX: bodyVelX, velY: bodyVelY };
        }
        var distance = Math.sqrt(distanceSq);
        if (distance < 10) {
          distance = 10;
        }
        var falloff = 1 - distance / radius;
        falloff = falloff * falloff;
        var pushDirX = offsetX / distance;
        var pushDirY = offsetY / distance;
        var proximityScale = falloff * falloff;
        var pushStrength = CURSOR_PUSH_FORCE * proximityScale * deltaSeconds * pushScale;
        bodyVelX += pushDirX * pushStrength;
        bodyVelY += pushDirY * pushStrength;
        var speedBoost = CURSOR_PUSH_SPEED_BOOST * proximityScale * deltaSeconds * pushScale;
        bodyVelX += pushDirX * speedBoost;
        bodyVelY += pushDirY * speedBoost;
        var speed = Math.sqrt(bodyVelX * bodyVelX + bodyVelY * bodyVelY);
        if (speed > 0.001) {
          var motionDirX = bodyVelX / speed;
          var motionDirY = bodyVelY / speed;
          var awayDot = motionDirX * pushDirX + motionDirY * pushDirY;
          if (awayDot > 0) {
            var carryBoost = CURSOR_PUSH_CARRY_BOOST * proximityScale * deltaSeconds * pushScale;
            bodyVelX += motionDirX * carryBoost;
            bodyVelY += motionDirY * carryBoost;
          }
        }
        return { velX: bodyVelX, velY: bodyVelY };
      }

      function applyCursorPushField(deltaSeconds) {
        var worldMouse = screenToWorld(screenMouseX, screenMouseY);
        var ballPush = applyCursorPushToBody(
          ballX,
          ballY,
          ballVelX,
          ballVelY,
          worldMouse.x,
          worldMouse.y,
          deltaSeconds,
          cursorPushFieldStrength
        );
        ballVelX = ballPush.velX;
        ballVelY = ballPush.velY;
        var speed = Math.sqrt(ballVelX * ballVelX + ballVelY * ballVelY);
        if (speed < REST_SPEED) {
          ballVelX = 0;
          ballVelY = 0;
        }
      }

      function drawCursorPushField() {
        if (!cursorPushHoldActive || gameState !== stateRolling || cursorPushFieldStrength <= 0.001) {
          return;
        }
        var worldMouse = screenToWorld(screenMouseX, screenMouseY);
        var screen = worldToScreen(worldMouse.x, worldMouse.y);
        var screenRadius = CURSOR_PUSH_RADIUS * cameraZoom * cursorPushFieldStrength;
        var pushRadiusWorld = CURSOR_PUSH_RADIUS * cursorPushFieldStrength;
        var time = Date.now() * 0.001;
        var pulse = 0.88 + Math.sin(time * 5.5) * 0.12;
        var ringIndex;
        ctx.lineCap = "round";
        for (ringIndex = 0; ringIndex < 3; ringIndex += 1) {
          var ringRadius = screenRadius * (0.45 + ringIndex * 0.22) * pulse;
          var ringAlpha = 0.22 - ringIndex * 0.05;
          ctx.strokeStyle = "rgba(180, 230, 255, " + ringAlpha + ")";
          ctx.lineWidth = Math.max(1, (2.2 - ringIndex * 0.4) * cameraZoom);
          ctx.setLineDash([5 * cameraZoom, 7 * cameraZoom]);
          ctx.beginPath();
          ctx.arc(screen.x, screen.y, ringRadius, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.setLineDash([]);
        var fieldGradient = ctx.createRadialGradient(screen.x, screen.y, 0, screen.x, screen.y, screenRadius * pulse);
        fieldGradient.addColorStop(0, "rgba(200, 240, 255, 0.2)");
        fieldGradient.addColorStop(0.45, "rgba(140, 200, 255, 0.1)");
        fieldGradient.addColorStop(1, "rgba(120, 180, 255, 0)");
        ctx.fillStyle = fieldGradient;
        ctx.beginPath();
        ctx.arc(screen.x, screen.y, screenRadius * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(230, 248, 255, 0.95)";
        ctx.beginPath();
        ctx.arc(screen.x, screen.y, 4 * cameraZoom, 0, Math.PI * 2);
        ctx.fill();
        var offsetX = ballX - worldMouse.x;
        var offsetY = ballY - worldMouse.y;
        var distance = Math.sqrt(offsetX * offsetX + offsetY * offsetY);
        if (distance < pushRadiusWorld && distance > 0.001) {
          var displayBall = getBallDisplayPosition();
          var ballScreen = worldToScreen(displayBall.x, displayBall.y);
          var pushT = 1 - distance / pushRadiusWorld;
          var lineAlpha = 0.15 + pushT * pushT * 0.45;
          ctx.strokeStyle = "rgba(190, 235, 255, " + lineAlpha + ")";
          ctx.lineWidth = Math.max(1, (1.2 + pushT * 2) * cameraZoom);
          ctx.setLineDash([3 * cameraZoom, 5 * cameraZoom]);
          ctx.beginPath();
          ctx.moveTo(ballScreen.x, ballScreen.y);
          ctx.lineTo(screen.x, screen.y);
          ctx.stroke();
          ctx.setLineDash([]);
          var sparkCount = 6;
          var sparkIndex;
          for (sparkIndex = 0; sparkIndex < sparkCount; sparkIndex += 1) {
            var sparkAngle = (sparkIndex / sparkCount) * Math.PI * 2 + time * 2.2;
            var sparkLength = screenRadius * 0.35 * pushT;
            var sparkStartX = screen.x + Math.cos(sparkAngle) * screenRadius * 0.2;
            var sparkStartY = screen.y + Math.sin(sparkAngle) * screenRadius * 0.2;
            var sparkEndX = screen.x + Math.cos(sparkAngle) * sparkLength;
            var sparkEndY = screen.y + Math.sin(sparkAngle) * sparkLength;
            ctx.strokeStyle = "rgba(220, 245, 255, " + (lineAlpha * 0.85) + ")";
            ctx.lineWidth = Math.max(1, 1.2 * cameraZoom);
            ctx.beginPath();
            ctx.moveTo(sparkStartX, sparkStartY);
            ctx.lineTo(sparkEndX, sparkEndY);
            ctx.stroke();
          }
        }
      }

      function sendBallToLevelStart(snapCamera) {
        var clearedPosition = setBallPositionClearOfWalls(levelStartX, levelStartY);
        ballX = clearedPosition.x;
        ballY = clearedPosition.y;
        levelStartX = clearedPosition.x;
        levelStartY = clearedPosition.y;
        syncBallDisplayPrevious();
        if (snapCamera) {
          setCameraToBall();
        }
        ballVelX = 0;
        ballVelY = 0;
        restTimer = 0;
        finishRestTimer = 0;
        gameState = stateAiming;
      }

      function warpEaseOut(progress) {
        if (progress < 0) {
          progress = 0;
        }
        if (progress > 1) {
          progress = 1;
        }
        var inverse = 1 - progress;
        return 1 - inverse * inverse * inverse * inverse * inverse;
      }

      function warpEaseInOut(progress) {
        if (progress < 0) {
          progress = 0;
        }
        if (progress > 1) {
          progress = 1;
        }
        return progress * progress * (3 - 2 * progress);
      }

      function beginHoleWarpTravel() {
        holeWarpPhase = HOLE_WARP_PHASE_TRAVEL;
        holeWarpTimer = 0;
        holeWarpTrailSpawnTimer = 0;
        holeWarpTravelFromX = holeWarpTargetX;
        holeWarpTravelFromY = holeWarpTargetY;
        holeWarpTravelToX = levelStartX;
        holeWarpTravelToY = levelStartY;
        ballX = holeWarpTravelFromX;
        ballY = holeWarpTravelFromY;
        spawnWarpTravelBurst(ballX, ballY);
      }

      function beginHoleWarpSettle() {
        holeWarpPhase = HOLE_WARP_PHASE_SETTLE;
        holeWarpTimer = 0;
        holeWarpTrailSpawnTimer = 0;
        holeWarpGlowStrength = 1;
        ballX = holeWarpTravelToX;
        ballY = holeWarpTravelToY;
        spawnWarpTrailParticles(ballX, ballY);
      }

      function finishBlackHoleWarp() {
        holeWarpActive = false;
        holeWarpTimer = 0;
        holeWarpPhase = HOLE_WARP_PHASE_SINK;
        holeWarpTrailSpawnTimer = 0;
        holeWarpGlowStrength = 1;
        sendBallToLevelStart(false);
      }

      function triggerBlackHoleWarp(holeX, holeY) {
        if (holeWarpActive) {
          return;
        }
        holeWarpActive = true;
        holeWarpPhase = HOLE_WARP_PHASE_SINK;
        holeWarpTimer = 0;
        holeWarpTrailSpawnTimer = 0;
        holeWarpTargetX = holeX;
        holeWarpTargetY = holeY;
        holeWarpParticlePullX = holeX;
        holeWarpParticlePullY = holeY;
        holeWarpGlowStrength = 1;
        ballVelX = 0;
        ballVelY = 0;
        physicsTimeAccumulator = 0;
        setCursorPushHoldActive(false);
        spawnBlackHoleParticles(holeX, holeY);
      }

      function updateBlackHoleWarp(deltaSeconds) {
        if (!holeWarpActive) {
          return;
        }
        holeWarpTimer += deltaSeconds;
        holeWarpParticlePullX = ballX;
        holeWarpParticlePullY = ballY;
        if (holeWarpPhase === HOLE_WARP_PHASE_SETTLE) {
          ballX = holeWarpTravelToX;
          ballY = holeWarpTravelToY;
          var settleProgress = holeWarpTimer / HOLE_WARP_SETTLE_DURATION;
          if (settleProgress > 1) {
            settleProgress = 1;
          }
          holeWarpGlowStrength = 1 - warpEaseInOut(settleProgress);
          holeWarpTrailSpawnTimer += deltaSeconds;
          if (holeWarpTrailSpawnTimer >= HOLE_WARP_TRAIL_SPAWN_INTERVAL * 1.8) {
            holeWarpTrailSpawnTimer = 0;
            spawnWarpTrailParticles(ballX, ballY);
          }
          if (holeWarpTimer >= HOLE_WARP_SETTLE_DURATION) {
            finishBlackHoleWarp();
          }
          return;
        }
        if (holeWarpPhase === HOLE_WARP_PHASE_SINK) {
          var pullX = holeWarpTargetX - ballX;
          var pullY = holeWarpTargetY - ballY;
          var pullLength = Math.sqrt(pullX * pullX + pullY * pullY);
          if (pullLength > 0.001) {
            var sinkStep = HOLE_WARP_SINK_SPEED * deltaSeconds;
            if (sinkStep > pullLength) {
              sinkStep = pullLength;
            }
            ballX += (pullX / pullLength) * sinkStep;
            ballY += (pullY / pullLength) * sinkStep;
          }
          if (holeWarpTimer >= HOLE_WARP_SINK_DURATION || pullLength < 10) {
            ballX = holeWarpTargetX;
            ballY = holeWarpTargetY;
            beginHoleWarpTravel();
          }
          return;
        }
        var travelProgress = holeWarpTimer / HOLE_WARP_TRAVEL_DURATION;
        if (travelProgress >= 1) {
          ballX = holeWarpTravelToX;
          ballY = holeWarpTravelToY;
          beginHoleWarpSettle();
          return;
        }
        var easedProgress = warpEaseOut(travelProgress);
        var previousBallX = ballX;
        var previousBallY = ballY;
        ballX = holeWarpTravelFromX + (holeWarpTravelToX - holeWarpTravelFromX) * easedProgress;
        ballY = holeWarpTravelFromY + (holeWarpTravelToY - holeWarpTravelFromY) * easedProgress;
        var frameTravelX = ballX - previousBallX;
        var frameTravelY = ballY - previousBallY;
        var frameTravelLength = Math.sqrt(frameTravelX * frameTravelX + frameTravelY * frameTravelY);
        if (frameTravelLength > 0.001) {
          ballRollAngle += frameTravelLength / BALL_RADIUS;
        }
        holeWarpTrailSpawnTimer += deltaSeconds;
        if (holeWarpTrailSpawnTimer >= HOLE_WARP_TRAIL_SPAWN_INTERVAL) {
          holeWarpTrailSpawnTimer = 0;
          spawnWarpTrailParticles(ballX, ballY);
        }
      }

      function applyBlackHolePullToVelocity(positionX, positionY, velocityX, velocityY, deltaSeconds, checkCapture) {
        var holeIndex;
        for (holeIndex = 0; holeIndex < blackHoles.length; holeIndex += 1) {
          var hole = blackHoles[holeIndex];
          var offsetX = hole.x - positionX;
          var offsetY = hole.y - positionY;
          var distanceSq = offsetX * offsetX + offsetY * offsetY;
          if (distanceSq < 0.001) {
            if (checkCapture) {
              return { velocityX: 0, velocityY: 0, captured: true, hole: hole };
            }
            continue;
          }
          var distance = Math.sqrt(distanceSq);
          if (distance < BLACK_HOLE_EVENT_RADIUS) {
            if (checkCapture) {
              return { velocityX: velocityX, velocityY: velocityY, captured: true, hole: hole };
            }
            continue;
          }
          if (distance < BLACK_HOLE_PULL_RADIUS) {
            var pullStrength = BLACK_HOLE_PULL_FORCE / (distanceSq * 0.038 + 5);
            velocityX += (offsetX / distance) * pullStrength * deltaSeconds;
            velocityY += (offsetY / distance) * pullStrength * deltaSeconds;
          }
        }
        return { velocityX: velocityX, velocityY: velocityY, captured: false, hole: null };
      }

      function applyBlackHolePull(deltaSeconds) {
        if (holeWarpActive) {
          return;
        }
        if (gameState !== stateRolling) {
          return;
        }
        var pullResult = applyBlackHolePullToVelocity(ballX, ballY, ballVelX, ballVelY, deltaSeconds, true);
        ballVelX = pullResult.velocityX;
        ballVelY = pullResult.velocityY;
        if (pullResult.captured && pullResult.hole) {
          triggerBlackHoleWarp(pullResult.hole.x, pullResult.hole.y);
        }
      }

      function segmentNormal(wall) {
        var dx = wall.x2 - wall.x1;
        var dy = wall.y2 - wall.y1;
        var length = Math.sqrt(dx * dx + dy * dy);
        if (length < 0.001) {
          return { x: 0, y: 1 };
        }
        return { x: -dy / length, y: dx / length };
      }

      function getKickPowerRatio(power) {
        var ratio = (power - MIN_KICK_SPEED) / (KICK_POWER_DISPLAY_REFERENCE - MIN_KICK_SPEED);
        if (ratio < 0) {
          ratio = 0;
        }
        if (ratio > 1) {
          ratio = 1;
        }
        return ratio;
      }

      function getKickFromCursor(worldTargetX, worldTargetY) {
        var pullX = ballX - worldTargetX;
        var pullY = ballY - worldTargetY;
        var pullLength = Math.sqrt(pullX * pullX + pullY * pullY);
        if (pullLength < 8) {
          return null;
        }
        var dirX = pullX / pullLength;
        var dirY = pullY / pullLength;
        var power = pullLength * KICK_POWER_SCALE;
        if (power < MIN_KICK_SPEED) {
          power = MIN_KICK_SPEED;
        }
        return {
          dirX: dirX,
          dirY: dirY,
          power: power,
          velX: dirX * power,
          velY: dirY * power
        };
      }

      function kickBall(worldTargetX, worldTargetY) {
        if (hitsLeft <= 0 || loseScreenActive || levelIntroActive) {
          return;
        }
        var kick = getKickFromCursor(worldTargetX, worldTargetY);
        if (!kick) {
          return;
        }
        hitsLeft -= 1;
        setCursorPushHoldActive(false);
        touchAimHoldActive = false;
        touchAimPointerId = -1;
        physicsTimeAccumulator = 0;
        ballVelX = kick.velX;
        ballVelY = kick.velY;
        syncBallDisplayPrevious();
        gameState = stateRolling;
        updateDistanceHud();
      }

      function updatePhysics(deltaSeconds) {
        updateCongratsScreen(deltaSeconds);
        updateLoseScreen(deltaSeconds);
        updateLevelIntro(deltaSeconds);
        if (!levelReady) {
          return;
        }
        updateFinishParticles(deltaSeconds);
        updateBlackHoleWarp(deltaSeconds);
        if (congratsScreenActive || loseScreenActive || levelIntroActive) {
          return;
        }
        if (holeWarpActive) {
          return;
        }
        if (gameState !== stateRolling) {
          physicsTimeAccumulator = 0;
          return;
        }
        updateCursorPushFieldStrength(deltaSeconds);
        physicsTimeAccumulator += deltaSeconds;
        var maxAccumulator = PHYSICS_FIXED_STEP_SECONDS * PHYSICS_MAX_SUB_STEPS;
        if (physicsTimeAccumulator > maxAccumulator) {
          physicsTimeAccumulator = maxAccumulator;
        }
        var subStepIndex = 0;
        var simulationOptions = getSimulationOptions(true);
        while (physicsTimeAccumulator >= PHYSICS_FIXED_STEP_SECONDS && subStepIndex < PHYSICS_MAX_SUB_STEPS) {
          physicsTimeAccumulator -= PHYSICS_FIXED_STEP_SECONDS;
          subStepIndex += 1;
          if (cursorPushHoldActive && cursorPushFieldStrength > 0.001) {
            applyCursorPushField(PHYSICS_FIXED_STEP_SECONDS);
          }
          var stepResult = stepBallPhysics(
            ballX,
            ballY,
            ballVelX,
            ballVelY,
            PHYSICS_FIXED_STEP_SECONDS,
            simulationOptions
          );
          ballX = stepResult.x;
          ballY = stepResult.y;
          ballVelX = stepResult.vx;
          ballVelY = stepResult.vy;
          if (stepResult.captured && stepResult.hole) {
            physicsTimeAccumulator = 0;
            triggerBlackHoleWarp(stepResult.hole.x, stepResult.hole.y);
            return;
          }
          if (isBallInFinishZone()) {
            physicsTimeAccumulator = 0;
            triggerLevelComplete();
            return;
          }
        }
        updateDistanceHud();
        var speed = Math.sqrt(ballVelX * ballVelX + ballVelY * ballVelY);
        if (speed > 0.5) {
          ballRollAngle += (speed * deltaSeconds) / BALL_RADIUS;
        }
        if (speed < REST_SPEED) {
          restTimer += deltaSeconds;
          if (restTimer >= REST_TIME) {
            restTimer = 0;
            if (hitsLeft > 0) {
              gameState = stateAiming;
            } else {
              triggerRunFailed();
            }
          }
        } else {
          restTimer = 0;
        }
      }

      function getWallOutwardNormal(wall) {
        var midX = (wall.x1 + wall.x2) * 0.5;
        var midY = (wall.y1 + wall.y2) * 0.5;
        var closest = getClosestOnPath(tunnelPath, midX, midY);
        var outwardX = midX - closest.closestX;
        var outwardY = midY - closest.closestY;
        var outwardLength = Math.sqrt(outwardX * outwardX + outwardY * outwardY);
        if (outwardLength < 0.001) {
          var segmentX = wall.x2 - wall.x1;
          var segmentY = wall.y2 - wall.y1;
          var segmentLength = Math.sqrt(segmentX * segmentX + segmentY * segmentY);
          if (segmentLength < 0.001) {
            return { x: 0, y: 1 };
          }
          return { x: -segmentY / segmentLength, y: segmentX / segmentLength };
        }
        return { x: outwardX / outwardLength, y: outwardY / outwardLength };
      }

      function drawWalls() {
        var wallLineWidth = 10 * cameraZoom;
        if (wallLineWidth < 6) {
          wallLineWidth = 6;
        }
        var wallSoftWidth = 26 * cameraZoom;
        var shadowPassCount = 3;
        var shadowPassOffsets = [4, 9, 15];
        var shadowPassAlphas = [0.24, 0.15, 0.08];
        var shadowPassWidthScales = [0.88, 1, 1.12];
        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.shadowBlur = 0;
        var wallIndex;
        var passIndex;
        for (passIndex = 0; passIndex < shadowPassCount; passIndex += 1) {
          ctx.strokeStyle = "rgba(6, 4, 14, " + shadowPassAlphas[passIndex] + ")";
          ctx.lineWidth = wallSoftWidth * shadowPassWidthScales[passIndex];
          for (wallIndex = 0; wallIndex < walls.length; wallIndex += 1) {
            var shadowWall = walls[wallIndex];
            var outward = getWallOutwardNormal(shadowWall);
            var offsetX = outward.x * shadowPassOffsets[passIndex];
            var offsetY = outward.y * shadowPassOffsets[passIndex];
            var shadowP1 = worldToScreen(shadowWall.x1 + offsetX, shadowWall.y1 + offsetY);
            var shadowP2 = worldToScreen(shadowWall.x2 + offsetX, shadowWall.y2 + offsetY);
            ctx.beginPath();
            ctx.moveTo(shadowP1.x, shadowP1.y);
            ctx.lineTo(shadowP2.x, shadowP2.y);
            ctx.stroke();
          }
        }
        ctx.strokeStyle = "rgba(42, 34, 28, 0.92)";
        ctx.lineWidth = wallLineWidth;
        for (wallIndex = 0; wallIndex < walls.length; wallIndex += 1) {
          var wall = walls[wallIndex];
          var p1 = worldToScreen(wall.x1, wall.y1);
          var p2 = worldToScreen(wall.x2, wall.y2);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
        ctx.strokeStyle = "rgba(92, 78, 62, 0.55)";
        ctx.lineWidth = 3 * cameraZoom;
        if (ctx.lineWidth < 2) {
          ctx.lineWidth = 2;
        }
        for (wallIndex = 0; wallIndex < walls.length; wallIndex += 1) {
          var innerWall = walls[wallIndex];
          var a = worldToScreen(innerWall.x1, innerWall.y1);
          var b = worldToScreen(innerWall.x2, innerWall.y2);
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
        ctx.restore();
      }

      function reflectVelocityOnNormal(velocityX, velocityY, normalX, normalY) {
        var velDot = velocityX * normalX + velocityY * normalY;
        if (velDot > 0) {
          normalX = -normalX;
          normalY = -normalY;
          velDot = -velDot;
        }
        return {
          x: velocityX - (1 + TRAJECTORY_PREVIEW_BOUNCE) * velDot * normalX,
          y: velocityY - (1 + TRAJECTORY_PREVIEW_BOUNCE) * velDot * normalY
        };
      }

      function raySphereIntersect(originX, originY, dirX, dirY, maxDistance, centerX, centerY, radius) {
        var offsetX = originX - centerX;
        var offsetY = originY - centerY;
        var b = 2 * (offsetX * dirX + offsetY * dirY);
        var c = offsetX * offsetX + offsetY * offsetY - radius * radius;
        var discriminant = b * b - 4 * c;
        if (discriminant < 0) {
          return null;
        }
        var sqrtDiscriminant = Math.sqrt(discriminant);
        var rayT = (-b - sqrtDiscriminant) * 0.5;
        if (rayT > 0.001 && rayT < maxDistance) {
          return rayT;
        }
        rayT = (-b + sqrtDiscriminant) * 0.5;
        if (rayT > 0.001 && rayT < maxDistance) {
          return rayT;
        }
        return null;
      }

      function rayCapsuleIntersect(originX, originY, dirX, dirY, maxDistance, ax, ay, bx, by, radius) {
        var bestDistance = maxDistance;
        var found = false;
        var capA = raySphereIntersect(originX, originY, dirX, dirY, maxDistance, ax, ay, radius);
        if (capA !== null && capA < bestDistance) {
          bestDistance = capA;
          found = true;
        }
        var capB = raySphereIntersect(originX, originY, dirX, dirY, maxDistance, bx, by, radius);
        if (capB !== null && capB < bestDistance) {
          bestDistance = capB;
          found = true;
        }
        var abx = bx - ax;
        var aby = by - ay;
        var abLengthSq = abx * abx + aby * aby;
        if (abLengthSq < 0.0001) {
          if (!found) {
            return null;
          }
          return bestDistance;
        }
        var abLength = Math.sqrt(abLengthSq);
        var axisX = abx / abLength;
        var axisY = aby / abLength;
        var normalX = -axisY;
        var normalY = axisX;
        var originOffsetX = originX - ax;
        var originOffsetY = originY - ay;
        var originAlong = originOffsetX * axisX + originOffsetY * axisY;
        var originSide = originOffsetX * normalX + originOffsetY * normalY;
        var dirAlong = dirX * axisX + dirY * axisY;
        var dirSide = dirX * normalX + dirY * normalY;
        var sideSign;
        for (sideSign = -1; sideSign <= 1; sideSign += 2) {
          if (Math.abs(dirSide) < 0.00001) {
            continue;
          }
          var targetSide = sideSign * radius;
          var rayT = (targetSide - originSide) / dirSide;
          if (rayT <= 0.001 || rayT >= bestDistance) {
            continue;
          }
          var hitAlong = originAlong + rayT * dirAlong;
          if (hitAlong >= 0 && hitAlong <= abLength) {
            bestDistance = rayT;
            found = true;
          }
        }
        if (!found) {
          return null;
        }
        return bestDistance;
      }

      function getCapsuleHitNormal(hitX, hitY, ax, ay, bx, by) {
        var abx = bx - ax;
        var aby = by - ay;
        var abLengthSq = abx * abx + aby * aby;
        if (abLengthSq < 0.0001) {
          return { x: 1, y: 0 };
        }
        var t = ((hitX - ax) * abx + (hitY - ay) * aby) / abLengthSq;
        if (t < 0) {
          t = 0;
        } else if (t > 1) {
          t = 1;
        }
        var closestX = ax + abx * t;
        var closestY = ay + aby * t;
        var normalX = hitX - closestX;
        var normalY = hitY - closestY;
        var normalLength = Math.sqrt(normalX * normalX + normalY * normalY);
        if (normalLength < 0.001) {
          return segmentNormal({ x1: ax, y1: ay, x2: bx, y2: by });
        }
        return { x: normalX / normalLength, y: normalY / normalLength };
      }

      function rayHitWall(originX, originY, dirX, dirY, maxDistance) {
        var bestDistance = maxDistance;
        var bestWall = null;
        var bestHitX = originX + dirX * maxDistance;
        var bestHitY = originY + dirY * maxDistance;
        var wallIndex;
        for (wallIndex = 0; wallIndex < walls.length; wallIndex += 1) {
          var wall = walls[wallIndex];
          var capsuleHit = rayCapsuleIntersect(
            originX,
            originY,
            dirX,
            dirY,
            maxDistance,
            wall.x1,
            wall.y1,
            wall.x2,
            wall.y2,
            collisionRadius
          );
          if (capsuleHit !== null && capsuleHit < bestDistance) {
            bestDistance = capsuleHit;
            bestWall = wall;
            bestHitX = originX + dirX * capsuleHit;
            bestHitY = originY + dirY * capsuleHit;
          }
        }
        return {
          distance: bestDistance,
          wall: bestWall,
          hitX: bestHitX,
          hitY: bestHitY
        };
      }

      function estimateKickTravelMeters(velocityX, velocityY) {
        var path = simulateBallPath(
          ballX,
          ballY,
          velocityX,
          velocityY,
          TRAJECTORY_MAX_CAP_METERS,
          true,
          PHYSICS_FIXED_STEP_SECONDS
        );
        var traveled = path.traveled;
        if (traveled < TRAJECTORY_MIN_METERS) {
          traveled = TRAJECTORY_MIN_METERS;
        }
        return traveled;
      }

      function getBlackHoleScreenRadius(worldRadius) {
        return worldRadius * cameraZoom;
      }

      function buildTrajectoryPreview(worldTargetX, worldTargetY) {
        var kick = getKickFromCursor(worldTargetX, worldTargetY);
        if (!kick) {
          return {
            segments: [],
            bounces: [],
            startDir: null,
            endPoint: null,
            endDir: null,
            endSpeed: 0,
            endStopped: false,
            endKeepsGoing: false,
            influenceSamples: [],
          };
        }
        var path = simulateBallPath(
          ballX,
          ballY,
          kick.velX,
          kick.velY,
          TRAJECTORY_MAX_CAP_METERS,
          true,
          PHYSICS_FIXED_STEP_SECONDS
        );
        return {
          segments: path.segments,
          bounces: path.bounces,
          startDir: { x: kick.dirX, y: kick.dirY },
          endPoint: path.endPoint,
          endDir: path.endDir,
          endSpeed: path.endSpeed,
          endStopped: path.endStopped,
          endKeepsGoing: path.endKeepsGoing,
          influenceSamples: buildTrajectoryHoleInfluences(path)
        };
      }

      function drawTrajectoryStopCircle(screenX, screenY) {
        var radius = 8;
        ctx.fillStyle = "rgba(180, 220, 255, 0.22)";
        ctx.strokeStyle = "rgba(210, 235, 255, 0.95)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(screenX, screenY, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "rgba(240, 248, 255, 0.9)";
        ctx.beginPath();
        ctx.arc(screenX, screenY, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      function getTrajectoryDashOffset() {
        var dashLength = TRAJECTORY_DASH_LENGTH_SCALE * cameraZoom;
        var dashGap = TRAJECTORY_DASH_GAP_SCALE * cameraZoom;
        var dashPeriod = dashLength + dashGap;
        return (Date.now() * TRAJECTORY_DASH_FLOW_PIXELS_PER_MS) % dashPeriod;
      }

      function drawTrajectoryContinueArrow(screenX, screenY, dirX, dirY, speed) {
        var extendLength = 28 + Math.min(speed * 0.06, 24);
        var chevronSpacing = 10;
        var chevronIndex;
        var tipX = screenX + dirX * extendLength;
        var tipY = screenY + dirY * extendLength;
        ctx.save();
        ctx.setLineDash([TRAJECTORY_DASH_LENGTH_SCALE * cameraZoom, TRAJECTORY_DASH_GAP_SCALE * cameraZoom]);
        ctx.lineDashOffset = -getTrajectoryDashOffset();
        ctx.strokeStyle = "rgba(120, 180, 255, 0.45)";
        ctx.lineWidth = Math.max(1.3, 1.3 * cameraZoom);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(screenX, screenY);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();
        ctx.restore();
        for (chevronIndex = 1; chevronIndex <= 2; chevronIndex += 1) {
          var chevronCenterX = screenX + dirX * chevronSpacing * chevronIndex;
          var chevronCenterY = screenY + dirY * chevronSpacing * chevronIndex;
          var sideX = -dirY;
          var sideY = dirX;
          var wing = 5;
          ctx.strokeStyle = "rgba(160, 220, 255, " + (0.7 + chevronIndex * 0.12) + ")";
          ctx.fillStyle = "rgba(190, 230, 255, " + (0.55 + chevronIndex * 0.15) + ")";
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(
            chevronCenterX - dirX * wing + sideX * wing * 0.55,
            chevronCenterY - dirY * wing + sideY * wing * 0.55
          );
          ctx.lineTo(chevronCenterX + dirX * wing, chevronCenterY + dirY * wing);
          ctx.lineTo(
            chevronCenterX - dirX * wing - sideX * wing * 0.55,
            chevronCenterY - dirY * wing - sideY * wing * 0.55
          );
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
      }

      function drawSmallDirectionArrow(screenX, screenY, dirX, dirY, strokeColor, fillColor) {
        var arrowLength = 14;
        var tipX = screenX + dirX * arrowLength;
        var tipY = screenY + dirY * arrowLength;
        var headSize = 3.5;
        var sideX = -dirY;
        var sideY = dirX;
        ctx.strokeStyle = strokeColor;
        ctx.fillStyle = fillColor;
        ctx.lineWidth = 1.1;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(screenX, screenY);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(tipX, tipY);
        ctx.lineTo(tipX - dirX * headSize + sideX * headSize * 0.55, tipY - dirY * headSize + sideY * headSize * 0.55);
        ctx.lineTo(tipX - dirX * headSize - sideX * headSize * 0.55, tipY - dirY * headSize - sideY * headSize * 0.55);
        ctx.closePath();
        ctx.fill();
      }

      function drawTrajectorySegment(worldPoints, segmentIndex, segmentCount) {
        if (worldPoints.length < 2) {
          return;
        }
        var fade = 1 - segmentIndex / (segmentCount + 1);
        var alpha = 0.45 + fade * 0.5;
        var pointIndex;
        var pathStarted = false;
        var dashLength = TRAJECTORY_DASH_LENGTH_SCALE * cameraZoom;
        var dashGap = TRAJECTORY_DASH_GAP_SCALE * cameraZoom;
        ctx.save();
        ctx.setLineDash([dashLength, dashGap]);
        ctx.lineDashOffset = -getTrajectoryDashOffset();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        for (pointIndex = 0; pointIndex < worldPoints.length; pointIndex += 1) {
          var screenPoint = worldToScreen(worldPoints[pointIndex].x, worldPoints[pointIndex].y);
          if (pointIndex === 0) {
            ctx.moveTo(screenPoint.x, screenPoint.y);
            pathStarted = true;
          } else {
            ctx.lineTo(screenPoint.x, screenPoint.y);
          }
        }
        if (!pathStarted) {
          ctx.restore();
          return;
        }
        ctx.strokeStyle = "rgba(100, 160, 255, " + (alpha * 0.28) + ")";
        ctx.lineWidth = Math.max(4, 5 * cameraZoom);
        ctx.stroke();
        ctx.strokeStyle = "rgba(180, 220, 255, " + alpha + ")";
        ctx.lineWidth = Math.max(1.4, 1.6 * cameraZoom);
        ctx.stroke();
        ctx.restore();
      }

      function drawTrajectoryPreview(preview) {
        var segmentIndex;
        var segmentCount = preview.segments.length;
        if (segmentCount === 0) {
          return;
        }
        for (segmentIndex = 0; segmentIndex < segmentCount; segmentIndex += 1) {
          var segment = preview.segments[segmentIndex];
          drawTrajectorySegment(segment.points, segmentIndex, segmentCount);
        }
        if (preview.startDir) {
          var startScreen = worldToScreen(ballX, ballY);
          drawSmallDirectionArrow(
            startScreen.x,
            startScreen.y,
            preview.startDir.x,
            preview.startDir.y,
            "rgba(255, 230, 170, 0.9)",
            "rgba(255, 210, 120, 0.85)"
          );
        }
        var bounceIndex;
        for (bounceIndex = 0; bounceIndex < preview.bounces.length; bounceIndex += 1) {
          var bounce = preview.bounces[bounceIndex];
          var screenBounce = worldToScreen(bounce.x, bounce.y);
          drawSmallDirectionArrow(
            screenBounce.x,
            screenBounce.y,
            bounce.dirX,
            bounce.dirY,
            "rgba(255, 200, 120, 0.88)",
            "rgba(255, 180, 90, 0.82)"
          );
        }
        if (preview.endPoint) {
          var endScreen = worldToScreen(preview.endPoint.x, preview.endPoint.y);
          if (preview.endStopped) {
            drawTrajectoryStopCircle(endScreen.x, endScreen.y);
          } else if (preview.endKeepsGoing && preview.endDir) {
            drawTrajectoryContinueArrow(
              endScreen.x,
              endScreen.y,
              preview.endDir.x,
              preview.endDir.y,
              preview.endSpeed
            );
          } else if (preview.endDir) {
            drawSmallDirectionArrow(
              endScreen.x,
              endScreen.y,
              preview.endDir.x,
              preview.endDir.y,
              "rgba(200, 230, 255, 0.9)",
              "rgba(170, 210, 255, 0.85)"
            );
          }
        }
      }

      function drawBlackHoles() {
        var time = Date.now() * 0.001;
        var width = canvas.clientWidth;
        var height = canvas.clientHeight;
        var aimPreview = cachedAimTrajectoryPreview;
        var holeIndex;
        for (holeIndex = 0; holeIndex < blackHoles.length; holeIndex += 1) {
          var hole = blackHoles[holeIndex];
          var screen = worldToScreen(hole.x, hole.y);
          var pullRadius = getBlackHoleScreenRadius(BLACK_HOLE_PULL_RADIUS);
          var cullMargin = pullRadius + 48;
          if (screen.x < -cullMargin || screen.x > width + cullMargin || screen.y < -cullMargin || screen.y > height + cullMargin) {
            continue;
          }
          var showPullOutline = shouldShowBlackHolePullOutline(hole, aimPreview);
          var spin = time * 2.4 + holeIndex * 1.7;
          var eventRadius = getBlackHoleScreenRadius(BLACK_HOLE_EVENT_RADIUS);
          var drawRadius = getBlackHoleScreenRadius(BLACK_HOLE_DRAW_RADIUS);
          var gravityPulse = 0.72 + Math.sin(time * 1.8 + holeIndex * 0.9) * 0.28;
          var gravityFill = ctx.createRadialGradient(screen.x, screen.y, eventRadius, screen.x, screen.y, pullRadius);
          gravityFill.addColorStop(0, "rgba(20, 8, 36, 0)");
          gravityFill.addColorStop(0.55, "rgba(48, 18, 78, " + (0.08 * gravityPulse) + ")");
          gravityFill.addColorStop(0.88, "rgba(72, 28, 112, " + (0.16 * gravityPulse) + ")");
          gravityFill.addColorStop(1, "rgba(96, 42, 140, " + (0.24 * gravityPulse) + ")");
          ctx.fillStyle = gravityFill;
          ctx.beginPath();
          ctx.arc(screen.x, screen.y, pullRadius, 0, Math.PI * 2);
          ctx.fill();
          if (showPullOutline) {
            ctx.strokeStyle = "rgba(110, 60, 170, " + (0.22 + gravityPulse * 0.28) + ")";
            ctx.lineWidth = Math.max(1, cameraZoom);
            ctx.setLineDash([3 * cameraZoom, 7 * cameraZoom]);
            ctx.beginPath();
            ctx.arc(screen.x, screen.y, pullRadius * 0.55, 0, Math.PI * 2);
            ctx.stroke();
            ctx.strokeStyle = "rgba(130, 80, 190, " + (0.3 + gravityPulse * 0.32) + ")";
            ctx.lineWidth = Math.max(1.5, 1.5 * cameraZoom);
            ctx.setLineDash([8 * cameraZoom, 6 * cameraZoom]);
            ctx.beginPath();
            ctx.arc(screen.x, screen.y, pullRadius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
          }
          var capturePulse = 0.8 + Math.sin(time * 3.2 + holeIndex) * 0.2;
          ctx.strokeStyle = "rgba(88, 48, 140, " + (0.42 * capturePulse) + ")";
          ctx.lineWidth = Math.max(1.2, 1.2 * cameraZoom);
          ctx.beginPath();
          ctx.arc(screen.x, screen.y, eventRadius * 1.15, 0, Math.PI * 2);
          ctx.stroke();
          var outerRadius = drawRadius;
          var gradient = ctx.createRadialGradient(screen.x, screen.y, 0, screen.x, screen.y, outerRadius * 1.35);
          gradient.addColorStop(0, "rgba(0, 0, 0, 1)");
          gradient.addColorStop(0.35, "rgba(8, 4, 18, 0.98)");
          gradient.addColorStop(0.65, "rgba(52, 20, 88, 0.5)");
          gradient.addColorStop(1, "rgba(72, 32, 112, 0)");
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(screen.x, screen.y, outerRadius * 1.35, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "rgba(120, 70, 180, 0.55)";
          ctx.lineWidth = Math.max(2, 2 * cameraZoom);
          ctx.beginPath();
          ctx.arc(screen.x, screen.y, outerRadius * 0.72, 0, Math.PI * 2);
          ctx.stroke();
          var ringIndex;
          for (ringIndex = 0; ringIndex < 3; ringIndex += 1) {
            var ringRadius = outerRadius * (0.45 + ringIndex * 0.18);
            ctx.strokeStyle = "rgba(140, 90, 200, " + (0.32 - ringIndex * 0.07) + ")";
            ctx.lineWidth = Math.max(1.2, 1.2 * cameraZoom);
            ctx.beginPath();
            ctx.arc(screen.x, screen.y, ringRadius, spin + ringIndex, spin + ringIndex + Math.PI * 1.35);
            ctx.stroke();
          }
          var corePulse = 0.55 + Math.sin(time * 4.2 + holeIndex * 1.3) * 0.45;
          var coreFlicker = 0.82 + Math.sin(time * 13 + holeIndex * 2.7) * 0.18;
          var coreSpin = spin * 2.8;
          var streakIndex;
          var streakColors = [
            "rgba(90, 40, 140, ",
            "rgba(120, 60, 180, ",
            "rgba(70, 30, 120, ",
            "rgba(100, 50, 160, ",
            "rgba(80, 35, 130, "
          ];
          ctx.save();
          ctx.translate(screen.x, screen.y);
          ctx.rotate(coreSpin);
          for (streakIndex = 0; streakIndex < 5; streakIndex += 1) {
            var streakAngle = streakIndex * (Math.PI * 2 / 5);
            var streakAlpha = (0.14 + corePulse * 0.34) * coreFlicker;
            ctx.strokeStyle = streakColors[streakIndex] + streakAlpha + ")";
            ctx.lineWidth = Math.max(1.4, 1.4 * cameraZoom);
            ctx.beginPath();
            ctx.arc(0, 0, eventRadius * (1.05 + streakIndex * 0.08), streakAngle, streakAngle + Math.PI * 0.42);
            ctx.stroke();
          }
          ctx.restore();
          var innerGlow = ctx.createRadialGradient(
            screen.x,
            screen.y,
            eventRadius * 0.15,
            screen.x,
            screen.y,
            eventRadius * 1.2
          );
          innerGlow.addColorStop(0, "rgba(72, 32, 120, " + (0.48 * corePulse * coreFlicker) + ")");
          innerGlow.addColorStop(0.35, "rgba(58, 24, 100, " + (0.38 * corePulse) + ")");
          innerGlow.addColorStop(0.7, "rgba(36, 12, 68, " + (0.28 * corePulse) + ")");
          innerGlow.addColorStop(1, "rgba(0, 0, 0, 0)");
          ctx.fillStyle = innerGlow;
          ctx.beginPath();
          ctx.arc(screen.x, screen.y, eventRadius * 1.2, 0, Math.PI * 2);
          ctx.fill();
          var holeCore = ctx.createRadialGradient(
            screen.x,
            screen.y,
            0,
            screen.x,
            screen.y,
            eventRadius * 1.05
          );
          holeCore.addColorStop(0, "rgba(12, 4, 24, " + (0.98 * coreFlicker) + ")");
          holeCore.addColorStop(0.22, "rgba(28, 10, 52, " + (0.92 * corePulse) + ")");
          holeCore.addColorStop(0.48, "rgba(52, 20, 88, " + (0.72 * corePulse) + ")");
          holeCore.addColorStop(0.72, "rgba(68, 28, 108, " + (0.45 * corePulse) + ")");
          holeCore.addColorStop(0.9, "rgba(24, 8, 44, " + (0.62 * corePulse) + ")");
          holeCore.addColorStop(1, "rgba(0, 0, 0, 0.98)");
          ctx.fillStyle = holeCore;
          ctx.beginPath();
          ctx.arc(screen.x, screen.y, eventRadius * 0.95, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(4, 0, 12, " + (0.62 + (1 - corePulse) * 0.32) + ")";
          ctx.beginPath();
          ctx.arc(screen.x, screen.y, eventRadius * 0.42, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(88, 40, 140, " + (0.18 * coreFlicker * corePulse) + ")";
          ctx.beginPath();
          ctx.arc(screen.x, screen.y, eventRadius * 0.18, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function getBlackHoleInfluenceProximity(pullStrength) {
        if (pullStrength <= 0) {
          return 0;
        }
        if (pullStrength >= 1) {
          return 1;
        }
        return Math.sqrt(pullStrength);
      }

      function getBlackHoleInfluenceGlowStrength(pullStrength, centerGlow) {
        var proximity = getBlackHoleInfluenceProximity(pullStrength);
        var glowStrength = proximity * BLACK_HOLE_INFLUENCE_GLOW_FROM_PULL_SCALE;
        if (centerGlow > glowStrength) {
          glowStrength = centerGlow;
        }
        if (glowStrength > 1) {
          glowStrength = 1;
        }
        return glowStrength;
      }

      function drawBlackHoleInfluenceLinePath(pointScreenX, pointScreenY, holeScreenX, holeScreenY, controlScreenX, controlScreenY) {
        ctx.beginPath();
        ctx.moveTo(pointScreenX, pointScreenY);
        if (controlScreenX === undefined || controlScreenY === undefined) {
          ctx.lineTo(holeScreenX, holeScreenY);
        } else {
          ctx.quadraticCurveTo(controlScreenX, controlScreenY, holeScreenX, holeScreenY);
        }
      }

      function drawBlackHoleInfluenceLine(pointScreenX, pointScreenY, holeScreenX, holeScreenY, pullStrength, centerGlow, controlScreenX, controlScreenY) {
        var proximity = getBlackHoleInfluenceProximity(pullStrength);
        var lineAlpha = 0.1 + proximity * 0.44;
        var lineWidthRange = BLACK_HOLE_INFLUENCE_LINE_WIDTH_MAX - BLACK_HOLE_INFLUENCE_LINE_WIDTH_MIN;
        var lineWidth = Math.max(
          0.75,
          (BLACK_HOLE_INFLUENCE_LINE_WIDTH_MIN + proximity * lineWidthRange) * cameraZoom
        );
        var glowStrength = getBlackHoleInfluenceGlowStrength(pullStrength, centerGlow);
        if (glowStrength > 0.05) {
          var pulse = 1;
          if (glowStrength > 0.28) {
            pulse = 0.82 + Math.sin(Date.now() * 0.014) * 0.18;
          }
          var animatedGlow = glowStrength * pulse;
          if (animatedGlow > 1) {
            animatedGlow = 1;
          }
          ctx.save();
          ctx.lineCap = "round";
          ctx.strokeStyle = "rgba(210, 160, 255, " + (0.14 + animatedGlow * 0.66) + ")";
          ctx.lineWidth = lineWidth + animatedGlow * 4.5 * cameraZoom;
          ctx.shadowColor = "rgba(220, 170, 255, " + (0.22 + animatedGlow * 0.68) + ")";
          ctx.shadowBlur = 4 + animatedGlow * 22;
          drawBlackHoleInfluenceLinePath(
            pointScreenX,
            pointScreenY,
            holeScreenX,
            holeScreenY,
            controlScreenX,
            controlScreenY
          );
          ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.restore();
        }
        ctx.lineCap = "round";
        ctx.strokeStyle = "rgba(190, 140, 255, " + lineAlpha + ")";
        ctx.lineWidth = lineWidth;
        drawBlackHoleInfluenceLinePath(
          pointScreenX,
          pointScreenY,
          holeScreenX,
          holeScreenY,
          controlScreenX,
          controlScreenY
        );
        ctx.stroke();
      }

      function getBlackHoleInfluenceCurveControlWorld(startX, startY, holeX, holeY, lineIndex, lineCount) {
        if (lineCount <= 1 || lineIndex === 0) {
          return null;
        }
        var offsetX = startX - holeX;
        var offsetY = startY - holeY;
        var distanceSq = offsetX * offsetX + offsetY * offsetY;
        if (distanceSq < 0.001) {
          return null;
        }
        var distance = Math.sqrt(distanceSq);
        var radialX = offsetX / distance;
        var radialY = offsetY / distance;
        var tangentX = -radialY;
        var tangentY = radialX;
        var proximity = 1 - distance / BLACK_HOLE_PULL_RADIUS;
        if (proximity < 0) {
          proximity = 0;
        }
        if (proximity > 1) {
          proximity = 1;
        }
        var centerIndex = (lineCount - 1) * 0.5;
        var indexDelta = lineIndex - centerIndex;
        var sideSign = indexDelta >= 0 ? 1 : -1;
        if (lineIndex % 2 === 0) {
          sideSign = -sideSign;
        }
        var indexMagnitude = Math.abs(indexDelta);
        if (indexMagnitude < 0.001) {
          indexMagnitude = lineIndex;
        }
        var bulgeScale = indexMagnitude / Math.max(1, (lineCount - 1) * 0.5);
        var bulge = distance * (0.14 + proximity * 0.28) * bulgeScale;
        var alongT = 0.5;
        var pathPattern = lineIndex % 3;
        if (pathPattern === 1) {
          alongT = 0.28;
        } else if (pathPattern === 2) {
          alongT = 0.72;
        }
        var anchorX = holeX + offsetX * alongT;
        var anchorY = holeY + offsetY * alongT;
        return {
          controlX: anchorX + tangentX * bulge * sideSign,
          controlY: anchorY + tangentY * bulge * sideSign
        };
      }

      function drawBlackHoleInfluenceLineWorld(startX, startY, holeX, holeY, pullStrength, centerGlow, lineIndex, lineCount) {
        var pointScreen = worldToScreen(startX, startY);
        var holeScreen = worldToScreen(holeX, holeY);
        var curveControl = getBlackHoleInfluenceCurveControlWorld(startX, startY, holeX, holeY, lineIndex, lineCount);
        var controlScreenX;
        var controlScreenY;
        if (curveControl) {
          var controlScreen = worldToScreen(curveControl.controlX, curveControl.controlY);
          controlScreenX = controlScreen.x;
          controlScreenY = controlScreen.y;
        }
        drawBlackHoleInfluenceLine(
          pointScreen.x,
          pointScreen.y,
          holeScreen.x,
          holeScreen.y,
          pullStrength,
          centerGlow,
          controlScreenX,
          controlScreenY
        );
      }

      function drawLiveBlackHolePullInfluence(ballX, ballY, holeX, holeY, forceMinimumStrength) {
        var holePoint = { x: holeX, y: holeY };
        var pullStrength = getBlackHolePullDisplayStrength(ballX, ballY, holePoint);
        if (pullStrength < TRAJECTORY_PULL_STRENGTH_MIN) {
          if (!forceMinimumStrength) {
            return;
          }
          pullStrength = TRAJECTORY_PULL_STRENGTH_MIN;
        }
        var centerGlow = getBlackHoleCenterGlow(ballX, ballY, holeX, holeY);
        var offsetX = ballX - holeX;
        var offsetY = ballY - holeY;
        var distanceSq = offsetX * offsetX + offsetY * offsetY;
        var innerDepth = 0;
        var extraLineCount = 0;
        if (distanceSq >= 0.001) {
          var distance = Math.sqrt(distanceSq);
          innerDepth = getBlackHolePullInnerDepth(distance);
          if (innerDepth > 0.001) {
            extraLineCount = 1 + Math.floor(innerDepth * 6);
          }
        }
        var totalLineCount = 1;
        if (innerDepth > 0.001) {
          totalLineCount = 1 + extraLineCount + 2;
        }
        var lineIndex = 0;
        drawBlackHoleInfluenceLineWorld(
          ballX,
          ballY,
          holeX,
          holeY,
          pullStrength,
          centerGlow,
          lineIndex,
          totalLineCount
        );
        lineIndex += 1;
        if (innerDepth <= 0.001) {
          return;
        }
        var sampleIndex;
        var along;
        var sampleX;
        var sampleY;
        var sampleStrength;
        var sampleGlow;
        for (sampleIndex = 1; sampleIndex <= extraLineCount; sampleIndex += 1) {
          along = sampleIndex / (extraLineCount + 1);
          sampleX = holeX + offsetX * along;
          sampleY = holeY + offsetY * along;
          sampleStrength = getBlackHolePullDisplayStrength(sampleX, sampleY, holePoint);
          if (sampleStrength < TRAJECTORY_PULL_STRENGTH_MIN) {
            continue;
          }
          sampleGlow = getBlackHoleCenterGlow(sampleX, sampleY, holeX, holeY);
          drawBlackHoleInfluenceLineWorld(
            sampleX,
            sampleY,
            holeX,
            holeY,
            sampleStrength,
            sampleGlow,
            lineIndex,
            totalLineCount
          );
          lineIndex += 1;
        }
        var distance = Math.sqrt(distanceSq);
        var perpX = -offsetY / distance;
        var perpY = offsetX / distance;
        var lateralSpread = collisionRadius * (0.25 + innerDepth * 0.55);
        var lateralIndex;
        var sideSign;
        for (lateralIndex = -1; lateralIndex <= 1; lateralIndex += 2) {
          sideSign = lateralIndex;
          sampleX = ballX + perpX * lateralSpread * sideSign;
          sampleY = ballY + perpY * lateralSpread * sideSign;
          sampleStrength = getBlackHolePullDisplayStrength(sampleX, sampleY, holePoint);
          if (sampleStrength < TRAJECTORY_PULL_STRENGTH_MIN) {
            continue;
          }
          sampleGlow = getBlackHoleCenterGlow(sampleX, sampleY, holeX, holeY);
          drawBlackHoleInfluenceLineWorld(
            sampleX,
            sampleY,
            holeX,
            holeY,
            sampleStrength,
            sampleGlow,
            lineIndex,
            totalLineCount
          );
          lineIndex += 1;
        }
      }

      function drawTrajectoryBlackHoleInfluence(preview) {
        if (!preview) {
          return;
        }
        var samples = preview.influenceSamples;
        if (!samples || samples.length < 1) {
          return;
        }
        var sampleIndex;
        var holeLineCounts = {};
        var holeLineIndices = {};
        for (sampleIndex = 0; sampleIndex < samples.length; sampleIndex += 1) {
          var countSample = samples[sampleIndex];
          var holeKey = countSample.holeX + "|" + countSample.holeY;
          if (!holeLineCounts[holeKey]) {
            holeLineCounts[holeKey] = 0;
          }
          holeLineCounts[holeKey] += 1;
        }
        ctx.save();
        ctx.lineCap = "round";
        ctx.setLineDash([]);
        for (sampleIndex = 0; sampleIndex < samples.length; sampleIndex += 1) {
          var sample = samples[sampleIndex];
          var sampleHoleKey = sample.holeX + "|" + sample.holeY;
          if (holeLineIndices[sampleHoleKey] === undefined) {
            holeLineIndices[sampleHoleKey] = 0;
          }
          var sampleGlow = getBlackHoleCenterGlow(sample.pointX, sample.pointY, sample.holeX, sample.holeY);
          drawBlackHoleInfluenceLineWorld(
            sample.pointX,
            sample.pointY,
            sample.holeX,
            sample.holeY,
            sample.strength,
            sampleGlow,
            holeLineIndices[sampleHoleKey],
            holeLineCounts[sampleHoleKey]
          );
          holeLineIndices[sampleHoleKey] += 1;
        }
        ctx.restore();
      }

      function drawBallBlackHolePullInfluence() {
        if (!levelReady) {
          return;
        }
        ctx.save();
        ctx.lineCap = "round";
        ctx.setLineDash([]);
        if (holeWarpActive && holeWarpPhase === HOLE_WARP_PHASE_SINK) {
          drawLiveBlackHolePullInfluence(ballX, ballY, holeWarpTargetX, holeWarpTargetY, true);
          ctx.restore();
          return;
        }
        if (gameState !== stateRolling || holeWarpActive) {
          ctx.restore();
          return;
        }
        var displayBall = getBallDisplayPosition();
        var holeIndex;
        for (holeIndex = 0; holeIndex < blackHoles.length; holeIndex += 1) {
          var hole = blackHoles[holeIndex];
          drawLiveBlackHolePullInfluence(displayBall.x, displayBall.y, hole.x, hole.y, false);
        }
        ctx.restore();
      }

      function drawAimLine() {
        if (gameState !== stateAiming || hitsLeft <= 0 || loseScreenActive || levelIntroActive) {
          return;
        }
        var worldMouse = screenToWorld(screenMouseX, screenMouseY);
        var kick = getKickFromCursor(worldMouse.x, worldMouse.y);
        if (!kick) {
          return;
        }
        var ballScreen = worldToScreen(ballX, ballY);
        var cursorScreen = { x: screenMouseX, y: screenMouseY };
        var pullX = ballScreen.x - cursorScreen.x;
        var pullY = ballScreen.y - cursorScreen.y;
        var pullLength = Math.sqrt(pullX * pullX + pullY * pullY);
        if (pullLength < 8) {
          return;
        }
        var powerRatio = getKickPowerRatio(kick.power);
        var pullEndX = cursorScreen.x;
        var pullEndY = cursorScreen.y;
        ctx.strokeStyle = "rgba(255, 248, 220, 0.9)";
        ctx.lineWidth = Math.max(1.5, 2 * cameraZoom);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(ballScreen.x, ballScreen.y);
        ctx.lineTo(pullEndX, pullEndY);
        ctx.stroke();
        ctx.fillStyle = "rgba(255, 220, 120, " + (0.35 + powerRatio * 0.5) + ")";
        ctx.beginPath();
        ctx.arc(pullEndX, pullEndY, 4 + powerRatio * 5, 0, Math.PI * 2);
        ctx.fill();

        var trajectoryPreview = cachedAimTrajectoryPreview;
        if (!trajectoryPreview) {
          return;
        }
        drawTrajectoryBlackHoleInfluence(trajectoryPreview);
        drawTrajectoryPreview(trajectoryPreview);
        updateDistanceHud();
      }

      function estimateCoastMeters(speed, velocityX, velocityY) {
        if (velocityX !== undefined && velocityY !== undefined) {
          return estimateKickTravelMeters(velocityX, velocityY);
        }
        var headingX = ballVelX;
        var headingY = ballVelY;
        return estimateKickTravelMeters(headingX, headingY);
      }

      function getBallMotionVector() {
        if (gameState !== stateRolling) {
          return null;
        }
        var speed = Math.sqrt(ballVelX * ballVelX + ballVelY * ballVelY);
        if (speed <= 0.5) {
          return null;
        }
        return {
          dirX: ballVelX / speed,
          dirY: ballVelY / speed,
          speed: speed,
          metersPerSecond: speed
        };
      }

      function drawInertiaArrow(screen, motion) {
        if (!motion || motion.speed < 2) {
          return;
        }
        var speedRatio = motion.speed / KICK_POWER_DISPLAY_REFERENCE;
        if (speedRatio > 1) {
          speedRatio = 1;
        }
        var arrowLength = ARROW_MIN_SCREEN_LENGTH + (ARROW_MAX_SCREEN_LENGTH - ARROW_MIN_SCREEN_LENGTH) * speedRatio;
        var tipX = screen.x + motion.dirX * arrowLength;
        var tipY = screen.y + motion.dirY * arrowLength;
        var headSize = 7 + speedRatio * 4;
        var sideX = -motion.dirY;
        var sideY = motion.dirX;
        ctx.strokeStyle = "rgba(30, 42, 58, 0.85)";
        ctx.fillStyle = "rgba(255, 120, 90, 0.92)";
        ctx.lineWidth = 2.5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(screen.x, screen.y);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(tipX, tipY);
        ctx.lineTo(tipX - motion.dirX * headSize + sideX * headSize * 0.55, tipY - motion.dirY * headSize + sideY * headSize * 0.55);
        ctx.lineTo(tipX - motion.dirX * headSize - sideX * headSize * 0.55, tipY - motion.dirY * headSize - sideY * headSize * 0.55);
        ctx.closePath();
        ctx.fill();
        var tickCount = 3;
        var tickIndex;
        for (tickIndex = 1; tickIndex <= tickCount; tickIndex += 1) {
          var tickT = tickIndex / (tickCount + 1);
          var tickCenterX = screen.x + motion.dirX * arrowLength * tickT;
          var tickCenterY = screen.y + motion.dirY * arrowLength * tickT;
          ctx.strokeStyle = "rgba(30, 42, 58, 0.55)";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(tickCenterX - sideX * 4, tickCenterY - sideY * 4);
          ctx.lineTo(tickCenterX + sideX * 4, tickCenterY + sideY * 4);
          ctx.stroke();
        }
      }

      function drawBallPattern(radius, speed) {
        var stripeCount = 5;
        var stripeIndex;
        ctx.strokeStyle = "rgba(55, 50, 46, 0.45)";
        ctx.lineWidth = 1.4;
        for (stripeIndex = 0; stripeIndex < stripeCount; stripeIndex += 1) {
          var angle = (stripeIndex / stripeCount) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(0, 0, radius * 0.72, angle - 0.35, angle + 0.35);
          ctx.stroke();
        }
        var dimpleCount = 8;
        var dimpleIndex;
        ctx.fillStyle = "rgba(70, 65, 60, 0.22)";
        for (dimpleIndex = 0; dimpleIndex < dimpleCount; dimpleIndex += 1) {
          var dimpleAngle = (dimpleIndex / dimpleCount) * Math.PI * 2 + ballRollAngle * 0.5;
          var ring = dimpleIndex % 2 === 0 ? radius * 0.45 : radius * 0.62;
          ctx.beginPath();
          ctx.arc(Math.cos(dimpleAngle) * ring, Math.sin(dimpleAngle) * ring, 1.2, 0, Math.PI * 2);
          ctx.fill();
        }
        if (speed > REST_SPEED) {
          ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(0, 0, radius * 0.88, ballRollAngle * 2.2, ballRollAngle * 2.2 + 1.1);
          ctx.stroke();
        }
      }

      function drawWarpBallGlow(screenX, screenY, drawRadius) {
        if (holeWarpGlowStrength <= 0.01) {
          return;
        }
        var pulse = 0.82 + Math.sin(Date.now() * 0.012) * 0.18;
        var glowRadius = drawRadius * (2.4 + pulse * 0.8);
        var glowGradient = ctx.createRadialGradient(
          screenX,
          screenY,
          drawRadius * 0.2,
          screenX,
          screenY,
          glowRadius
        );
        var glowAlpha = holeWarpGlowStrength;
        if (holeWarpPhase === HOLE_WARP_PHASE_TRAVEL) {
          glowGradient.addColorStop(0, "rgba(220, 120, 255, " + (0.75 * glowAlpha) + ")");
          glowGradient.addColorStop(0.45, "rgba(140, 40, 200, " + (0.35 * glowAlpha) + ")");
          glowGradient.addColorStop(1, "rgba(40, 8, 80, 0)");
        } else if (holeWarpPhase === HOLE_WARP_PHASE_SETTLE) {
          glowGradient.addColorStop(0, "rgba(200, 150, 255, " + (0.55 * glowAlpha) + ")");
          glowGradient.addColorStop(0.5, "rgba(120, 60, 180, " + (0.22 * glowAlpha) + ")");
          glowGradient.addColorStop(1, "rgba(40, 8, 80, 0)");
        } else {
          glowGradient.addColorStop(0, "rgba(80, 20, 120, " + (0.65 * glowAlpha) + ")");
          glowGradient.addColorStop(0.5, "rgba(40, 8, 70, " + (0.28 * glowAlpha) + ")");
          glowGradient.addColorStop(1, "rgba(10, 4, 20, 0)");
        }
        ctx.fillStyle = glowGradient;
        ctx.beginPath();
        ctx.arc(screenX, screenY, glowRadius, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawBall() {
        var displayBall = getBallDisplayPosition();
        var screen = worldToScreen(displayBall.x, displayBall.y);
        var drawRadius = getBallDrawRadius(displayBall.x, displayBall.y);
        if (holeWarpActive) {
          drawWarpBallGlow(screen.x, screen.y, drawRadius);
        }
        var terrainGradient = heightGradient(displayBall.x, displayBall.y);
        var shadowOffset = 5 + terrainGradient.height * 8;
        var shadowWidth = drawRadius * (1.15 + terrainGradient.height * 0.15);
        ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
        ctx.beginPath();
        ctx.ellipse(screen.x + 3, screen.y + shadowOffset, shadowWidth, drawRadius * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();

        var motion = getBallMotionVector();
        if (gameState === stateRolling && motion && !holeWarpActive) {
          drawInertiaArrow(screen, motion);
        }
        var spinSpeed = 0;
        if (motion) {
          spinSpeed = motion.speed;
        }

        ctx.save();
        ctx.translate(screen.x, screen.y);
        if (motion) {
          ctx.rotate(Math.atan2(motion.dirY, motion.dirX) + ballRollAngle);
        }
        ctx.fillStyle = "#f8f4ec";
        ctx.strokeStyle = "#2a2824";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, drawRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        drawBallPattern(drawRadius, spinSpeed);
        ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
        ctx.beginPath();
        ctx.arc(-drawRadius * 0.28, -drawRadius * 0.32, drawRadius * 0.22, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function getStartLineGeometry() {
        if (tunnelPath.length < 2) {
          return null;
        }
        var first = tunnelPath[0];
        var second = tunnelPath[1];
        var segX = second.x - first.x;
        var segY = second.y - first.y;
        var segLength = Math.sqrt(segX * segX + segY * segY);
        if (segLength < 0.001) {
          return null;
        }
        return {
          centerX: levelStartX,
          centerY: levelStartY,
          tangentX: segX / segLength,
          tangentY: segY / segLength,
          halfWidth: first.halfWidth
        };
      }

      function getFinishLineGeometry() {
        if (tunnelPath.length < 2) {
          return null;
        }
        var lastIndex = tunnelPath.length - 1;
        var previous = tunnelPath[lastIndex - 1];
        var last = tunnelPath[lastIndex];
        var segX = last.x - previous.x;
        var segY = last.y - previous.y;
        var segLength = Math.sqrt(segX * segX + segY * segY);
        if (segLength < 0.001) {
          return null;
        }
        return {
          centerX: finishX,
          centerY: finishY,
          tangentX: segX / segLength,
          tangentY: segY / segLength,
          halfWidth: last.halfWidth
        };
      }

      function drawCorridorLineMarker(centerX, centerY, tangentX, tangentY, corridorHalfWidth, markerKind) {
        var perpX = -tangentY;
        var perpY = tangentX;
        var span = corridorHalfWidth * CORRIDOR_LINE_WIDTH_SCALE;
        var depth = CORRIDOR_LINE_DEPTH;
        var stripeCount = CORRIDOR_LINE_STRIPE_COUNT;
        var stripeWidth = (span * 2) / stripeCount;
        var lightColor = "rgba(235, 242, 228, 0.92)";
        var darkColor = "rgba(42, 48, 40, 0.88)";
        var labelColor = "rgba(228, 236, 220, 0.95)";
        if (markerKind === "finish") {
          lightColor = "rgba(255, 236, 160, 0.94)";
          darkColor = "rgba(175, 125, 28, 0.9)";
          labelColor = "rgba(255, 248, 210, 0.96)";
        }
        var stripeIndex;
        var halfDepth = depth * 0.5;
        for (stripeIndex = 0; stripeIndex < stripeCount; stripeIndex += 1) {
          var perpOffsetStart = -span + stripeIndex * stripeWidth;
          var perpOffsetEnd = perpOffsetStart + stripeWidth;
          var fillColor = lightColor;
          if (stripeIndex % 2 === 1) {
            fillColor = darkColor;
          }
          var cornerOneX = centerX + perpX * perpOffsetStart - tangentX * halfDepth;
          var cornerOneY = centerY + perpY * perpOffsetStart - tangentY * halfDepth;
          var cornerTwoX = centerX + perpX * perpOffsetEnd - tangentX * halfDepth;
          var cornerTwoY = centerY + perpY * perpOffsetEnd - tangentY * halfDepth;
          var cornerThreeX = centerX + perpX * perpOffsetEnd + tangentX * halfDepth;
          var cornerThreeY = centerY + perpY * perpOffsetEnd + tangentY * halfDepth;
          var cornerFourX = centerX + perpX * perpOffsetStart + tangentX * halfDepth;
          var cornerFourY = centerY + perpY * perpOffsetStart + tangentY * halfDepth;
          var screenOne = worldToScreen(cornerOneX, cornerOneY);
          var screenTwo = worldToScreen(cornerTwoX, cornerTwoY);
          var screenThree = worldToScreen(cornerThreeX, cornerThreeY);
          var screenFour = worldToScreen(cornerFourX, cornerFourY);
          ctx.fillStyle = fillColor;
          ctx.beginPath();
          ctx.moveTo(screenOne.x, screenOne.y);
          ctx.lineTo(screenTwo.x, screenTwo.y);
          ctx.lineTo(screenThree.x, screenThree.y);
          ctx.lineTo(screenFour.x, screenFour.y);
          ctx.closePath();
          ctx.fill();
        }
        if (markerKind === "finish") {
          var labelOffset = halfDepth + CORRIDOR_LINE_LABEL_OFFSET;
          var labelX = centerX - tangentX * labelOffset;
          var labelY = centerY - tangentY * labelOffset;
          var labelScreen = worldToScreen(labelX, labelY);
          var labelText = getLocalized(LOCALE_KEY_MARKER_FINISH, "FINISH");
          ctx.fillStyle = labelColor;
          ctx.font = "11px Courier New, Courier, monospace";
          ctx.fillText(labelText, labelScreen.x - 22, labelScreen.y - 4);
        }
      }

      function drawStartFloorLabel(centerX, centerY, tangentX, tangentY, corridorHalfWidth) {
        var perpX = -tangentY;
        var perpY = tangentX;
        var halfDepth = CORRIDOR_LINE_DEPTH * 0.5;
        var labelOffset = halfDepth + START_FLOOR_LABEL_OFFSET;
        var labelX = centerX - tangentX * labelOffset;
        var labelY = centerY - tangentY * labelOffset;
