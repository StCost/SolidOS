        var labelScreen = worldToScreen(labelX, labelY);
        var labelText = getLocalized(LOCALE_KEY_MARKER_START, "START");
        var lineAngle = Math.atan2(perpY, perpX);
        var fontSize = corridorHalfWidth * cameraZoom * START_FLOOR_LABEL_SIZE_SCALE;
        if (fontSize < 26) {
          fontSize = 26;
        }
        if (fontSize > 88) {
          fontSize = 88;
        }

        ctx.save();
        ctx.translate(labelScreen.x, labelScreen.y);
        ctx.rotate(lineAngle);
        ctx.scale(1, START_FLOOR_LABEL_PERSPECTIVE_SCALE);
        ctx.font = "bold " + Math.floor(fontSize) + "px Courier New, Courier, monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "rgba(18, 22, 16, 0.62)";
        ctx.fillText(labelText, 3, 5);
        ctx.strokeStyle = "rgba(12, 16, 10, 0.75)";
        ctx.lineWidth = Math.max(2, fontSize * 0.14);
        ctx.strokeText(labelText, 0, 0);
        ctx.fillStyle = "rgba(228, 236, 220, 0.94)";
        ctx.fillText(labelText, 0, 0);
        ctx.restore();
      }

      function drawStartFinishLineMarkers() {
        var startLine = getStartLineGeometry();
        if (startLine) {
          drawCorridorLineMarker(
            startLine.centerX,
            startLine.centerY,
            startLine.tangentX,
            startLine.tangentY,
            startLine.halfWidth,
            "start"
          );
          drawStartFloorLabel(
            startLine.centerX,
            startLine.centerY,
            startLine.tangentX,
            startLine.tangentY,
            startLine.halfWidth
          );
        }
        var finishLine = getFinishLineGeometry();
        if (finishLine) {
          drawCorridorLineMarker(
            finishLine.centerX,
            finishLine.centerY,
            finishLine.tangentX,
            finishLine.tangentY,
            finishLine.halfWidth,
            "finish"
          );
        }
      }

      function drawFinishZone() {
        var finishScreen = worldToScreen(finishX, finishY);
        var inFinishZone = isBallInFinishZone();
        if (inFinishZone) {
          ctx.strokeStyle = "rgba(255, 180, 70, 0.95)";
          ctx.fillStyle = "rgba(255, 200, 80, 0.28)";
        } else {
          ctx.strokeStyle = "rgba(255, 220, 90, 0.7)";
          ctx.fillStyle = "rgba(255, 230, 120, 0.14)";
        }
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(finishScreen.x, finishScreen.y, FINISH_ZONE_RADIUS, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      function isFinishVisibleOnScreen() {
        var width = canvas.clientWidth;
        var height = canvas.clientHeight;
        var finishScreen = worldToScreen(finishX, finishY);
        var padding = FINISH_EDGE_HINT_ON_SCREEN_PADDING;
        if (finishScreen.x < padding) {
          return false;
        }
        if (finishScreen.y < padding) {
          return false;
        }
        if (finishScreen.x > width - padding) {
          return false;
        }
        if (finishScreen.y > height - padding) {
          return false;
        }
        return true;
      }

      function getFinishEdgeHintPlacement() {
        var width = canvas.clientWidth;
        var height = canvas.clientHeight;
        var centerX = width * 0.5;
        var centerY = height * 0.5;
        var finishScreen = worldToScreen(finishX, finishY);
        var directionX = finishScreen.x - centerX;
        var directionY = finishScreen.y - centerY;
        var directionLength = Math.sqrt(directionX * directionX + directionY * directionY);
        if (directionLength < 0.001) {
          directionX = 0;
          directionY = -1;
          directionLength = 1;
        }
        directionX /= directionLength;
        directionY /= directionLength;
        var margin = FINISH_EDGE_HINT_MARGIN;
        var rayDistance = Infinity;
        if (directionX > 0.0001) {
          var rightDistance = (width - margin - centerX) / directionX;
          if (rightDistance < rayDistance) {
            rayDistance = rightDistance;
          }
        } else if (directionX < -0.0001) {
          var leftDistance = (margin - centerX) / directionX;
          if (leftDistance < rayDistance) {
            rayDistance = leftDistance;
          }
        }
        if (directionY > 0.0001) {
          var bottomDistance = (height - margin - centerY) / directionY;
          if (bottomDistance < rayDistance) {
            rayDistance = bottomDistance;
          }
        } else if (directionY < -0.0001) {
          var topDistance = (margin - centerY) / directionY;
          if (topDistance < rayDistance) {
            rayDistance = topDistance;
          }
        }
        if (!isFinite(rayDistance) || rayDistance <= 0) {
          rayDistance = margin;
        }
        return {
          edgeX: centerX + directionX * rayDistance,
          edgeY: centerY + directionY * rayDistance,
          directionX: directionX,
          directionY: directionY
        };
      }

      function drawFinishEdgeHint() {
        if (!levelReady || levelIntroActive || congratsScreenActive || loseScreenActive || holeWarpActive) {
          return;
        }
        if (isFinishVisibleOnScreen()) {
          return;
        }
        var placement = getFinishEdgeHintPlacement();
        var labelText = getLocalized(LOCALE_KEY_MARKER_FINISH, "FINISH");
        var clusterCenterX = placement.edgeX - placement.directionX * FINISH_EDGE_HINT_CLUSTER_INSET;
        var clusterCenterY = placement.edgeY - placement.directionY * FINISH_EDGE_HINT_CLUSTER_INSET;
        var arrowSize = FINISH_EDGE_HINT_ARROW_SIZE;
        ctx.save();
        ctx.translate(clusterCenterX, clusterCenterY);
        ctx.rotate(Math.atan2(placement.directionY, placement.directionX));
        ctx.font = "10px Courier New, Courier, monospace";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        var labelWidth = ctx.measureText(labelText).width;
        var arrowTipLocalX = 16;
        var textLocalX = -labelWidth - 10;
        var badgePaddingX = 8;
        var badgePaddingY = 7;
        var badgeLeft = textLocalX - badgePaddingX;
        var badgeRight = arrowTipLocalX + arrowSize + badgePaddingX;
        var badgeTop = -badgePaddingY - arrowSize * 0.55;
        var badgeBottom = badgePaddingY + arrowSize * 0.55;
        ctx.fillStyle = "rgba(12, 8, 4, 0.78)";
        ctx.strokeStyle = "rgba(255, 210, 90, 0.78)";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.rect(badgeLeft, badgeTop, badgeRight - badgeLeft, badgeBottom - badgeTop);
        ctx.fill();
        ctx.stroke();
        var arrowBaseLocalX = arrowTipLocalX - arrowSize * 1.7;
        ctx.fillStyle = "rgba(255, 220, 96, 1)";
        ctx.strokeStyle = "rgba(48, 32, 8, 0.95)";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(arrowTipLocalX, 0);
        ctx.lineTo(arrowBaseLocalX, arrowSize * 0.62);
        ctx.lineTo(arrowBaseLocalX, -arrowSize * 0.62);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "rgba(255, 248, 210, 0.98)";
        ctx.strokeStyle = "rgba(24, 16, 4, 0.85)";
        ctx.lineWidth = 2.5;
        ctx.strokeText(labelText, textLocalX, 0);
        ctx.lineWidth = 1;
        ctx.fillText(labelText, textLocalX, 0);
        ctx.restore();
      }

      function drawFrame() {
        if (!levelReady) {
          var width = canvas.clientWidth;
          var height = canvas.clientHeight;
          ctx.fillStyle = "#06040f";
          ctx.fillRect(0, 0, width, height);
          return;
        }
        drawCosmicBackground();
        drawTerrainNearTunnel();
        drawCorridorEdgeBlend();
        if (terrainCanvas && tunnelPath.length >= 2) {
          var terrainViewBounds = getTerrainViewBounds();
          drawTerrainTopography(
            terrainViewBounds.left,
            terrainViewBounds.top,
            terrainViewBounds.right,
            terrainViewBounds.bottom
          );
        }
        cachedAimTrajectoryPreview = getAimTrajectoryPreview();
        drawBlackHoles();
        drawWalls();
        drawStartFinishLineMarkers();
        drawFinishZone();
        drawFinishParticles();
        drawAimLine();
        drawCursorPushField();
        drawBallBlackHolePullInfluence();
        drawBall();
        drawFinishEdgeHint();
      }

      var lastTime = 0;
      function loop(timestamp) {
        if (!lastTime) {
          lastTime = timestamp;
        }
        var deltaSeconds = (timestamp - lastTime) / 1000;
        if (deltaSeconds > 0.05) {
          deltaSeconds = 0.05;
        }
        lastTime = timestamp;
        updatePhysics(deltaSeconds);
        updateCamera(deltaSeconds);
        drawFrame();
        drawCelebrationEffects();
        fpsSampleFrames += 1;
        fpsSampleTime += deltaSeconds;
        if (fpsSampleTime >= 0.35) {
          fpsValueEl.textContent = String(Math.round(fpsSampleFrames / fpsSampleTime));
          fpsSampleFrames = 0;
          fpsSampleTime = 0;
        }
        window.requestAnimationFrame(loop);
      }

      function isTouchPointer(event) {
        return event.pointerType === "touch";
      }

      function updatePointerPosition(event) {
        var rect = canvas.getBoundingClientRect();
        screenMouseX = event.clientX - rect.left;
        screenMouseY = event.clientY - rect.top;
        var world = screenToWorld(screenMouseX, screenMouseY);
        mouseX = world.x;
        mouseY = world.y;
      }

      function onPointerMove(event) {
        if (touchAimHoldActive && event.pointerId !== touchAimPointerId) {
          return;
        }
        updatePointerPosition(event);
      }

      function onPointerDown(event) {
        if (event.button !== 0) {
          return;
        }
        updatePointerPosition(event);
        if (holeWarpActive) {
          return;
        }
        if (congratsScreenActive) {
          advanceAfterLevelComplete();
          return;
        }
        if (levelIntroActive) {
          if (!levelReady) {
            return;
          }
          hideLevelIntro();
          return;
        }
        if (loseScreenActive) {
          retryLevel();
          return;
        }
        if (gameState === stateRolling) {
          cursorPushFieldStrength = 1;
          cursorPushHoldActive = true;
          if (canvas.setPointerCapture) {
            canvas.setPointerCapture(event.pointerId);
          }
          return;
        }
        if (gameState === stateAiming && hitsLeft > 0) {
          if (isTouchPointer(event)) {
            touchAimHoldActive = true;
            touchAimPointerId = event.pointerId;
            if (canvas.setPointerCapture) {
              canvas.setPointerCapture(event.pointerId);
            }
            return;
          }
          kickBall(mouseX, mouseY);
        }
      }

      function onPointerUp(event) {
        if (event.button !== 0) {
          return;
        }
        if (touchAimHoldActive && event.pointerId === touchAimPointerId) {
          touchAimHoldActive = false;
          touchAimPointerId = -1;
          updatePointerPosition(event);
          if (
            gameState === stateAiming &&
            hitsLeft > 0 &&
            !loseScreenActive &&
            !levelIntroActive &&
            !congratsScreenActive &&
            !holeWarpActive
          ) {
            kickBall(mouseX, mouseY);
          }
        }
        setCursorPushHoldActive(false);
        if (canvas.releasePointerCapture) {
          try {
            canvas.releasePointerCapture(event.pointerId);
          } catch (releaseError) {
          }
        }
      }

      function onPointerCancel(event) {
        onPointerUp(event);
      }

      window.addEventListener("resize", resize);
      canvas.addEventListener("pointermove", onPointerMove);
      canvas.addEventListener("pointerdown", onPointerDown);
      canvas.addEventListener("pointerup", onPointerUp);
      canvas.addEventListener("pointercancel", onPointerCancel);
      window.addEventListener("blur", function () {
        setCursorPushHoldActive(false);
        touchAimHoldActive = false;
        touchAimPointerId = -1;
      });

      bindLocaleListener();
      applyGameLocale();
      resize();
      beginRun(hashSeed(Date.now()));
      window.requestAnimationFrame(loop);
    })();
  </script>
</body>

</html>
