<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbital Golf</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #06040f;
      color: #e8f0e4;
      font-family: "Courier New", Courier, monospace;
      cursor: url("../../../cursor-pointer.svg") 2.1 0, pointer;
    }

    #gameRoot {
      position: absolute;
      inset: 0;
    }

    #gameCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    #hud {
      position: absolute;
      left: 12px;
      top: 10px;
      z-index: 2;
      pointer-events: none;
      font-size: 13px;
      line-height: 1.45;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
    }

    #hud .label {
      color: rgba(200, 220, 190, 0.75);
    }

    #hud .value {
      color: #f4fff0;
      font-weight: bold;
    }

    #finishFlash {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(255, 240, 160, 0.55), transparent 62%);
      opacity: 0;
    }

    #finishFlash.is-active {
      animation: finish-flash 0.45s ease-out forwards;
    }

    @keyframes finish-flash {
      0% {
        opacity: 0.65;
      }

      100% {
        opacity: 0;
      }
    }

    #congratsOverlay {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #06040f;
      opacity: 1;
    }

    #congratsOverlay.is-hidden {
      display: none;
    }

    #congratsOverlay.is-instant-hide {
      opacity: 0 !important;
      transition: none !important;
    }

    #celebrationCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    #congratsCard {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 0 16px;
    }

    #congratsTitle {
      font-size: 18px;
      letter-spacing: 0.12em;
      color: #f0e8c8;
      margin-bottom: 10px;
    }

    #congratsStats {
      font-size: 14px;
      color: rgba(220, 230, 210, 0.9);
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    #congratsTotals {
      font-size: 14px;
      color: rgba(200, 215, 190, 0.88);
      letter-spacing: 0.04em;
      margin-bottom: 14px;
    }

    #congratsPrompt {
      font-size: 12px;
      letter-spacing: 0.14em;
      color: rgba(200, 210, 190, 0.72);
    }

    #levelIntroOverlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 12%;
      background: transparent;
    }

    #levelIntroOverlay.is-hidden {
      display: none;
    }

    #levelIntroCard {
      text-align: center;
      padding: 14px 20px;
      background: rgba(6, 4, 15, 0.82);
      border: 1px solid rgba(200, 220, 190, 0.22);
    }

    #levelIntroTitle {
      font-size: 20px;
      letter-spacing: 0.14em;
      color: #f0e8c8;
      margin-bottom: 10px;
    }

    #levelIntroScore {
      font-size: 14px;
      color: rgba(220, 230, 210, 0.92);
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    #levelIntroBest {
      font-size: 14px;
      color: rgba(200, 215, 190, 0.88);
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    #levelIntroPrompt {
      font-size: 12px;
      letter-spacing: 0.14em;
      color: rgba(200, 210, 190, 0.65);
    }

    #levelIntroPrompt.is-hidden {
      visibility: hidden;
    }

    #loseOverlay {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #06040f;
      opacity: 1;
    }

    #loseOverlay.is-hidden {
      display: none;
    }

    #loseCard {
      text-align: center;
      padding: 0 16px;
    }

    #loseTitle {
      font-size: 18px;
      letter-spacing: 0.12em;
      color: #e8a8a0;
      margin-bottom: 10px;
    }

    #loseStats {
      font-size: 14px;
      color: rgba(220, 210, 210, 0.9);
      letter-spacing: 0.04em;
    }

    #losePrompt {
      margin-top: 16px;
      font-size: 12px;
      letter-spacing: 0.14em;
      color: rgba(200, 190, 190, 0.72);
    }

    #fpsHud {
      position: absolute;
      right: 12px;
      bottom: 14px;
      z-index: 2;
      pointer-events: none;
      font-size: 11px;
      color: rgba(180, 170, 150, 0.55);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
    }
  </style>
</head>

      var perm = new Uint8Array(512);

      function rand() {
        return Math.random();
      }

      function hashSeed(seed) {
        var value = seed | 0;
        value = Math.imul(value ^ (value >>> 16), 2246822507);
        value = Math.imul(value ^ (value >>> 13), 3266489909);
        return (value ^ (value >>> 16)) >>> 0;
      }

      function seededRandom(seed) {
        var next = hashSeed(seed + 1);
        return function () {
          next = hashSeed(next);
          return next / 4294967296;
        };
      }

      function buildPermutation(seed) {
        var random = seededRandom(seed);
        var table = new Uint8Array(256);
        var index;
        for (index = 0; index < 256; index += 1) {
          table[index] = index;
        }
        for (index = 255; index > 0; index -= 1) {
          var swapIndex = Math.floor(random() * (index + 1));
          var temp = table[index];
          table[index] = table[swapIndex];
          table[swapIndex] = temp;
        }
        for (index = 0; index < 512; index += 1) {
          perm[index] = table[index & 255];
        }
      }

      function fade(t) {
        return t * t * t * (t * (t * 6 - 15) + 10);
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function grad2(hash, x, y) {
        var h = hash & 3;
        var u = h < 2 ? x : y;
        var v = h < 2 ? y : x;
        return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
      }

      function noise2(x, y) {
        var x0 = Math.floor(x) & 255;
        var y0 = Math.floor(y) & 255;
        var x1 = x - Math.floor(x);
        var y1 = y - Math.floor(y);
        var u = fade(x1);
        var v = fade(y1);
        var aa = perm[x0] + y0;
        var ab = perm[x0] + y0 + 1;
        var ba = perm[x0 + 1] + y0;
        var bb = perm[x0 + 1] + y0 + 1;
        var xLo = lerp(grad2(perm[aa], x1, y1), grad2(perm[ba], x1 - 1, y1), u);
        var xHi = lerp(grad2(perm[ab], x1, y1 - 1), grad2(perm[bb], x1 - 1, y1 - 1), u);
        return lerp(xLo, xHi, v);
      }
