        var octave;
        for (octave = 0; octave < 5; octave += 1) {
          var sampleX = worldX * NOISE_SCALE * frequency;
          var sampleY = worldY * NOISE_SCALE * frequency;
          total += noise2(sampleX, sampleY) * amplitude;
          norm += amplitude;
          amplitude *= 0.5;
          frequency *= 2.1;
        }
        return total / norm;
      }

      function heightAt(worldX, worldY) {
        var base = fractalHeight(worldX, worldY);
        var ridge = Math.abs(fractalHeight(worldX + 820, worldY - 560)) * 0.52;
        return base * 0.68 + ridge;
      }

      function sampleTerrainCloudiness(worldX, worldY) {
        var cloudX = worldX * TERRAIN_CLOUD_SCALE + 1400;
        var cloudY = worldY * TERRAIN_CLOUD_SCALE - 920;
        var largeCloud = noise2(cloudX, cloudY);
        var mediumCloud = noise2(cloudX * 2.1 + 80, cloudY * 2.1 - 60);
        var fineCloud = noise2(worldX * NOISE_SCALE * 3.4 + 200, worldY * NOISE_SCALE * 3.4 - 150);
        return largeCloud * 0.52 + mediumCloud * 0.33 + fineCloud * 0.15;
      }

      function getTerrainCloudModifier(cloudiness) {
        var positive = cloudiness > 0 ? cloudiness : 0;
        var negative = cloudiness < 0 ? -cloudiness : 0;
        return 1 + positive * (TERRAIN_CLOUD_STRENGTH + TERRAIN_CLOUD_CONTRAST)
          - negative * (TERRAIN_CLOUD_STRENGTH + TERRAIN_CLOUD_CONTRAST * 0.85);
      }

      function heightGradient(worldX, worldY) {
        var delta = 3.5;
        var heightCenter = heightAt(worldX, worldY);
        var gradX = (heightAt(worldX + delta, worldY) - heightAt(worldX - delta, worldY)) * 0.5;
        var gradY = (heightAt(worldX, worldY + delta) - heightAt(worldX, worldY - delta)) * 0.5;
        gradX *= SLOPE_GRADIENT_SCALE;
        gradY *= SLOPE_GRADIENT_SCALE;
        var gradientLengthSq = gradX * gradX + gradY * gradY;
        var clampLimit = TERRAIN_GRADIENT_CLAMP;
        if (gradientLengthSq > clampLimit * clampLimit) {
          var gradientLength = Math.sqrt(gradientLengthSq);
          gradX = gradX / gradientLength * clampLimit;
          gradY = gradY / gradientLength * clampLimit;
        }
        return {
          x: gradX,
          y: gradY,
          height: heightCenter
        };
      }

      function getTerrainVisibility(worldX, worldY) {
        var closest = getClosestOnPath(tunnelPath, worldX, worldY);
        var outerRadius = closest.halfWidth + TERRAIN_VISIBLE_PADDING;
        var fadeStart = outerRadius - TERRAIN_EDGE_FADE;
        if (closest.distance >= outerRadius) {
          return 0;
        }
        if (closest.distance <= fadeStart) {
          return 1;
        }
        var fadeT = (closest.distance - fadeStart) / (outerRadius - fadeStart);
        var smoothFade = fadeT * fadeT * (3 - 2 * fadeT);
        return 1 - smoothFade;
      }

      function getTerrainHillshade(worldX, worldY) {
        var gradient = heightGradient(worldX, worldY);
        var normalX = -gradient.x * HILL_NORMAL_STRENGTH;
        var normalY = -gradient.y * HILL_NORMAL_STRENGTH;
        var normalZ = 1;
        var normalLength = Math.sqrt(normalX * normalX + normalY * normalY + normalZ * normalZ);
        normalX /= normalLength;
        normalY /= normalLength;
        normalZ /= normalLength;
        var lightLength = Math.sqrt(LIGHT_DIR_X * LIGHT_DIR_X + LIGHT_DIR_Y * LIGHT_DIR_Y + LIGHT_DIR_Z * LIGHT_DIR_Z);
        var lightX = LIGHT_DIR_X / lightLength;
        var lightY = LIGHT_DIR_Y / lightLength;
        var lightZ = LIGHT_DIR_Z / lightLength;
        var diffuse = normalX * lightX + normalY * lightY + normalZ * lightZ;
        if (diffuse < 0) {
          diffuse = 0;
        }
        var shade = 1 - HILLSHADE_STRENGTH + HILLSHADE_STRENGTH * diffuse;
        var valley = heightAt(worldX, worldY);
        if (valley < -0.05) {
          shade *= 0.94;
        }
        if (shade < 0.42) {
          shade = 0.42;
        }
        if (shade > 1.22) {
          shade = 1.22;
        }
        return shade;
      }

      function getTerrainCellHillshade(worldX, worldY) {
        var sampleOffset = TERRAIN_CELL * TERRAIN_CELL_HILLSHADE_OFFSET_SCALE;
        return (
          getTerrainHillshade(worldX - sampleOffset, worldY - sampleOffset) +
          getTerrainHillshade(worldX + sampleOffset, worldY - sampleOffset) +
          getTerrainHillshade(worldX - sampleOffset, worldY + sampleOffset) +
          getTerrainHillshade(worldX + sampleOffset, worldY + sampleOffset)
        ) * 0.25;
      }

      function getTerrainCellScreenRect(cellX, cellY, screenOriginX, screenOriginY, screenCellSize) {
        var drawX = Math.floor(screenOriginX + cellX * screenCellSize);
        var drawY = Math.floor(screenOriginY + cellY * screenCellSize);
        var drawRight = Math.floor(screenOriginX + (cellX + 1) * screenCellSize);
        var drawBottom = Math.floor(screenOriginY + (cellY + 1) * screenCellSize);
        var drawWidth = drawRight - drawX;
        var drawHeight = drawBottom - drawY;
        if (drawWidth < 1) {
          drawWidth = 1;
        }
        if (drawHeight < 1) {
          drawHeight = 1;
        }
        return {
          x: drawX,
          y: drawY,
          width: drawWidth,
          height: drawHeight
        };
      }

      function getTerrainHeightBlend(height) {
        var blend = (height - TERRAIN_HEIGHT_LOW) / (TERRAIN_HEIGHT_HIGH - TERRAIN_HEIGHT_LOW);
        if (blend < 0) {
          return 0;
        }
        if (blend > 1) {
          return 1;
        }
        return blend;
      }

      function getBallDrawRadius(worldX, worldY) {
        var height = heightAt(worldX, worldY);
        var blend = getTerrainHeightBlend(height);
        return BALL_RADIUS * (1 + blend * BALL_HEIGHT_SIZE_BOOST);
      }

      function heightColor(height) {
        var t = getTerrainHeightBlend(height);
        var greenR = 38;
        var greenG = 98;
        var greenB = 48;
        var dustR = 168;
        var dustG = 142;
        var dustB = 98;
        var snowR = 232;
        var snowG = 240;
        var snowB = 248;
        var r;
        var g;
        var b;
        if (t < 0.45) {
          var local = t / 0.45;
          r = greenR + (dustR - greenR) * local;
          g = greenG + (dustG - greenG) * local;
          b = greenB + (dustB - greenB) * local;
        } else {
          var localHigh = (t - 0.45) / 0.55;
          r = dustR + (snowR - dustR) * localHigh;
          g = dustG + (snowG - dustG) * localHigh;
          b = dustB + (snowB - dustB) * localHigh;
        }
        return {
          r: r | 0,
          g: g | 0,
          b: b | 0
        };
      }

      function buildSpaceBackdrop(seed) {
        var random = seededRandom(seed + 99);
        var starIndex;
        spaceStarsFar.length = 0;
        spaceStarsNear.length = 0;
        spaceNebulaSpots.length = 0;
        for (starIndex = 0; starIndex < SPACE_STAR_FAR_COUNT; starIndex += 1) {
          spaceStarsFar.push({
            worldX: (random() - 0.5) * 12000,
            worldY: (random() - 0.5) * 12000,
            size: 0.5 + random() * 1.1,
            brightness: 0.25 + random() * 0.45,
            twinkle: random() * Math.PI * 2
          });
        }
        for (starIndex = 0; starIndex < SPACE_STAR_NEAR_COUNT; starIndex += 1) {
          spaceStarsNear.push({
            worldX: (random() - 0.5) * 9000,
            worldY: (random() - 0.5) * 9000,
            size: 1 + random() * 2.2,
            brightness: 0.45 + random() * 0.55,
            twinkle: random() * Math.PI * 2
          });
        }
        var nebulaIndex;
        for (nebulaIndex = 0; nebulaIndex < SPACE_NEBULA_COUNT; nebulaIndex += 1) {
          spaceNebulaSpots.push({
            worldX: (random() - 0.5) * 14000,
            worldY: (random() - 0.5) * 14000,
            radius: 160 + random() * 280,
            red: 60 + Math.floor(random() * 40),
            green: 30 + Math.floor(random() * 30),
            blue: 110 + Math.floor(random() * 60)
          });
        }
      }

      function getCosmicBackdropCacheKey(width, height) {
        return width + "|" + height + "|" +
          Math.floor(cameraCenterX / COSMIC_BACKDROP_CACHE_BUCKET) + "|" +
          Math.floor(cameraCenterY / COSMIC_BACKDROP_CACHE_BUCKET) + "|" +
          Math.floor(cameraZoom * 40);
      }

      function ensureCosmicBackdropCache() {
        var width = canvas.clientWidth;
        var height = canvas.clientHeight;
        var cacheKey = getCosmicBackdropCacheKey(width, height);
        if (cacheKey === cosmicBackdropCacheKey && cosmicBackdropCanvas) {
          return;
        }
        cosmicBackdropCacheKey = cacheKey;
        if (!cosmicBackdropCanvas) {
          cosmicBackdropCanvas = document.createElement("canvas");
          cosmicBackdropCtx = cosmicBackdropCanvas.getContext("2d");
        }
        if (cosmicBackdropCanvas.width !== width || cosmicBackdropCanvas.height !== height) {
          cosmicBackdropCanvas.width = width;
          cosmicBackdropCanvas.height = height;
        }
        var backdropCtx = cosmicBackdropCtx;
        var skyGradient = backdropCtx.createLinearGradient(0, 0, 0, height);
        skyGradient.addColorStop(0, "#06040f");
        skyGradient.addColorStop(0.45, "#0e0820");
        skyGradient.addColorStop(1, "#04030a");
        backdropCtx.fillStyle = skyGradient;
        backdropCtx.fillRect(0, 0, width, height);
        var nebulaIndex;
        for (nebulaIndex = 0; nebulaIndex < spaceNebulaSpots.length; nebulaIndex += 1) {
          var nebula = spaceNebulaSpots[nebulaIndex];
          var nebulaParallaxX = cameraCenterX * 0.05;
          var nebulaParallaxY = cameraCenterY * 0.05;
          var nebulaScreenX = (nebula.worldX - nebulaParallaxX - cameraCenterX) * cameraZoom + width * 0.5;
          var nebulaScreenY = (nebula.worldY - nebulaParallaxY - cameraCenterY) * cameraZoom + height * 0.5;
          var nebulaGradient = backdropCtx.createRadialGradient(
            nebulaScreenX,
            nebulaScreenY,
            0,
            nebulaScreenX,
            nebulaScreenY,
            nebula.radius
          );
          nebulaGradient.addColorStop(0, "rgba(" + nebula.red + ", " + nebula.green + ", " + nebula.blue + ", 0.24)");
          nebulaGradient.addColorStop(0.55, "rgba(" + nebula.red + ", " + nebula.green + ", " + nebula.blue + ", 0.11)");
          nebulaGradient.addColorStop(1, "rgba(" + nebula.red + ", " + nebula.green + ", " + nebula.blue + ", 0)");
          backdropCtx.fillStyle = nebulaGradient;
          backdropCtx.fillRect(
            nebulaScreenX - nebula.radius,
            nebulaScreenY - nebula.radius,
            nebula.radius * 2,
            nebula.radius * 2
          );
        }
      }

      function drawCosmicBackground() {
        var width = canvas.clientWidth;
        var height = canvas.clientHeight;
        ensureCosmicBackdropCache();
        ctx.drawImage(cosmicBackdropCanvas, 0, 0, width, height);
        var time = Date.now() * 0.001;
        var starIndex;
        for (starIndex = 0; starIndex < spaceStarsFar.length; starIndex += 1) {
          var farStar = spaceStarsFar[starIndex];
          var farParallaxX = cameraCenterX * 0.1;
          var farParallaxY = cameraCenterY * 0.1;
          var farScreenX = (farStar.worldX - farParallaxX - cameraCenterX) * cameraZoom + width * 0.5;
          var farScreenY = (farStar.worldY - farParallaxY - cameraCenterY) * cameraZoom + height * 0.5;
          if (farScreenX < -8 || farScreenX > width + 8 || farScreenY < -8 || farScreenY > height + 8) {
            continue;
          }
          var farAlpha = farStar.brightness * (0.7 + Math.sin(time * 1.4 + farStar.twinkle) * 0.3);
          var farSize = farStar.size * 2;
          ctx.fillStyle = "rgba(210, 220, 255, " + farAlpha + ")";
          ctx.fillRect(farScreenX - farSize * 0.5, farScreenY - farSize * 0.5, farSize, farSize);
        }
        for (starIndex = 0; starIndex < spaceStarsNear.length; starIndex += 1) {
          var nearStar = spaceStarsNear[starIndex];
          var nearParallaxX = cameraCenterX * 0.22;
          var nearParallaxY = cameraCenterY * 0.22;
          var nearScreenX = (nearStar.worldX - nearParallaxX - cameraCenterX) * cameraZoom + width * 0.5;
          var nearScreenY = (nearStar.worldY - nearParallaxY - cameraCenterY) * cameraZoom + height * 0.5;
          if (nearScreenX < -10 || nearScreenX > width + 10 || nearScreenY < -10 || nearScreenY > height + 10) {
            continue;
          }
          var nearAlpha = nearStar.brightness * (0.75 + Math.sin(time * 2.2 + nearStar.twinkle) * 0.25);
          var nearSize = nearStar.size * 2;
          ctx.fillStyle = "rgba(240, 245, 255, " + nearAlpha + ")";
          ctx.fillRect(nearScreenX - nearSize * 0.5, nearScreenY - nearSize * 0.5, nearSize, nearSize);
        }
      }

      function getTerrainViewBounds() {
        var width = canvas.clientWidth;
        var height = canvas.clientHeight;
        var viewHalfWidth = width * 0.5 / cameraZoom;
        var viewHalfHeight = height * 0.5 / cameraZoom;
        var viewMargin = TERRAIN_VISIBLE_PADDING + TERRAIN_EDGE_FADE + TERRAIN_EDGE_BLEND_EXTRA + CORRIDOR_HALF_WIDTH_MAX;
        return {
          left: cameraCenterX - viewHalfWidth - viewMargin,
          top: cameraCenterY - viewHalfHeight - viewMargin,
          right: cameraCenterX + viewHalfWidth + viewMargin,
          bottom: cameraCenterY + viewHalfHeight + viewMargin
        };
      }

      function drawTerrainNearTunnel() {
        if (!terrainCanvas || !terrainVisibilityCanvas || tunnelPath.length < 2) {
          return;
        }
        var worldStart = -WORLD_HALF;
        var width = canvas.clientWidth;
        var height = canvas.clientHeight;
        var terrainViewBounds = getTerrainViewBounds();
        var viewLeft = terrainViewBounds.left;
        var viewTop = terrainViewBounds.top;
        var viewRight = terrainViewBounds.right;
        var viewBottom = terrainViewBounds.bottom;
        var cellStartX = Math.floor((viewLeft - worldStart) / TERRAIN_CELL);
        var cellEndX = Math.ceil((viewRight - worldStart) / TERRAIN_CELL);
        var cellStartY = Math.floor((viewTop - worldStart) / TERRAIN_CELL);
        var cellEndY = Math.ceil((viewBottom - worldStart) / TERRAIN_CELL);
        if (cellStartX < 0) {
          cellStartX = 0;
        }
        if (cellStartY < 0) {
          cellStartY = 0;
        }
        if (cellEndX > terrainCanvas.width) {
          cellEndX = terrainCanvas.width;
        }
        if (cellEndY > terrainCanvas.height) {
          cellEndY = terrainCanvas.height;
        }
        var sourceWidth = cellEndX - cellStartX;
        var sourceHeight = cellEndY - cellStartY;
        if (sourceWidth <= 0 || sourceHeight <= 0) {
          return;
        }
        var screenOriginX = width * 0.5 + (worldStart - cameraCenterX) * cameraZoom;
        var screenOriginY = height * 0.5 + (worldStart - cameraCenterY) * cameraZoom;
        var screenCellSize = TERRAIN_CELL * cameraZoom;
        var destX = Math.floor(screenOriginX + cellStartX * screenCellSize);
        var destY = Math.floor(screenOriginY + cellStartY * screenCellSize);
        var destWidth = Math.ceil(sourceWidth * screenCellSize);
        var destHeight = Math.ceil(sourceHeight * screenCellSize);
        if (!terrainCompositeCanvas) {
          terrainCompositeCanvas = document.createElement("canvas");
          terrainCompositeCtx = terrainCompositeCanvas.getContext("2d");
        }
        if (terrainCompositeCanvas.width !== width || terrainCompositeCanvas.height !== height) {
          terrainCompositeCanvas.width = width;
          terrainCompositeCanvas.height = height;
        }
        var compositeCtx = terrainCompositeCtx;
        compositeCtx.clearRect(0, 0, width, height);
        var previousSmoothing = compositeCtx.imageSmoothingEnabled;
        compositeCtx.imageSmoothingEnabled = true;
        compositeCtx.drawImage(
          terrainCanvas,
          cellStartX,
          cellStartY,
          sourceWidth,
          sourceHeight,
          destX,
          destY,
          destWidth,
          destHeight
        );
        compositeCtx.globalCompositeOperation = "destination-in";
        compositeCtx.drawImage(
          terrainVisibilityCanvas,
          cellStartX,
          cellStartY,
          sourceWidth,
          sourceHeight,
          destX,
          destY,
          destWidth,
          destHeight
        );
        compositeCtx.globalCompositeOperation = "source-over";
        compositeCtx.imageSmoothingEnabled = previousSmoothing;
        var mainPreviousSmoothing = ctx.imageSmoothingEnabled;
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(terrainCompositeCanvas, 0, 0, width, height);
        ctx.imageSmoothingEnabled = mainPreviousSmoothing;
      }

      function getContourEdgeBlend(targetHeight, heightStart, heightEnd) {
        var heightDelta = heightEnd - heightStart;
        if (Math.abs(heightDelta) < 0.00001) {
          return 0.5;
        }
        return (targetHeight - heightStart) / heightDelta;
      }

      function getContourEdgePoint(edgeIndex, worldX, worldY, gridStep, cornerHeights, targetHeight) {
        var blend;
        if (edgeIndex === 0) {
          blend = getContourEdgeBlend(targetHeight, cornerHeights[0], cornerHeights[1]);
          return { x: worldX + blend * gridStep, y: worldY };
        }
        if (edgeIndex === 1) {
          blend = getContourEdgeBlend(targetHeight, cornerHeights[1], cornerHeights[2]);
          return { x: worldX + gridStep, y: worldY + blend * gridStep };
        }
        if (edgeIndex === 2) {
          blend = getContourEdgeBlend(targetHeight, cornerHeights[3], cornerHeights[2]);
          return { x: worldX + blend * gridStep, y: worldY + gridStep };
        }
        blend = getContourEdgeBlend(targetHeight, cornerHeights[0], cornerHeights[3]);
        return { x: worldX, y: worldY + blend * gridStep };
      }

      function getMarchingSquaresSegments(worldX, worldY, gridStep, cornerHeights, targetHeight) {
        var caseIndex = 0;
        if (cornerHeights[0] >= targetHeight) {
          caseIndex |= 1;
        }
        if (cornerHeights[1] >= targetHeight) {
          caseIndex |= 2;
        }
        if (cornerHeights[2] >= targetHeight) {
          caseIndex |= 4;
        }
        if (cornerHeights[3] >= targetHeight) {
          caseIndex |= 8;
        }
        if (caseIndex === 0 || caseIndex === 15) {
          return [];
        }
        var edgePairs = [];
        if (caseIndex === 1) {
          edgePairs = [3, 0];
        } else if (caseIndex === 2) {
          edgePairs = [0, 1];
        } else if (caseIndex === 3) {
          edgePairs = [3, 1];
        } else if (caseIndex === 4) {
          edgePairs = [1, 2];
        } else if (caseIndex === 5) {
          var centerHeight = (cornerHeights[0] + cornerHeights[1] + cornerHeights[2] + cornerHeights[3]) * 0.25;
          if (centerHeight >= targetHeight) {
            edgePairs = [3, 0, 1, 2];
          } else {
            edgePairs = [3, 1, 0, 2];
          }
        } else if (caseIndex === 6) {
          edgePairs = [0, 2];
        } else if (caseIndex === 7) {
          edgePairs = [3, 2];
        } else if (caseIndex === 8) {
          edgePairs = [3, 2];
        } else if (caseIndex === 9) {
          edgePairs = [0, 2];
        } else if (caseIndex === 10) {
          var centerHeightTen = (cornerHeights[0] + cornerHeights[1] + cornerHeights[2] + cornerHeights[3]) * 0.25;
          if (centerHeightTen >= targetHeight) {
            edgePairs = [0, 1, 3, 2];
          } else {
            edgePairs = [0, 3, 1, 2];
          }
        } else if (caseIndex === 11) {
          edgePairs = [1, 2];
        } else if (caseIndex === 12) {
          edgePairs = [3, 1];
        } else if (caseIndex === 13) {
          edgePairs = [0, 1];
        } else if (caseIndex === 14) {
          edgePairs = [3, 0];
        }
        var segments = [];
        var pairIndex;
        for (pairIndex = 0; pairIndex < edgePairs.length; pairIndex += 2) {
          var pointStart = getContourEdgePoint(
            edgePairs[pairIndex],
            worldX,
            worldY,
            gridStep,
            cornerHeights,
            targetHeight
          );
          var pointEnd = getContourEdgePoint(
            edgePairs[pairIndex + 1],
            worldX,
            worldY,
            gridStep,
            cornerHeights,
            targetHeight
          );
          segments.push({
            x0: pointStart.x,
            y0: pointStart.y,
            x1: pointEnd.x,
            y1: pointEnd.y
          });
        }
        return segments;
      }

      function invalidateTopoCache() {
        topoCacheKey = "";
        topoCacheMinorSegments.length = 0;
        topoCacheMajorSegments.length = 0;
        topoCacheTickSegments.length = 0;
        topoCacheFlowSegments.length = 0;
      }

      function getTopoCacheKey(viewLeft, viewTop, viewRight, viewBottom) {
        var bucket = TERRAIN_TOPO_CACHE_BUCKET;
        return worldSeed + "|" +
          Math.floor(viewLeft / bucket) + "|" +
          Math.floor(viewTop / bucket) + "|" +
          Math.floor(viewRight / bucket) + "|" +
          Math.floor(viewBottom / bucket);
      }

      function buildTopoWorldCache(viewLeft, viewTop, viewRight, viewBottom) {
        var gridStep = TERRAIN_TOPO_GRID_STEP;
        var contourStep = TERRAIN_TOPO_CONTOUR_STEP;
        var startX = Math.floor(viewLeft / gridStep) * gridStep;
        var startY = Math.floor(viewTop / gridStep) * gridStep;
        var worldX;
        var worldY;
        topoCacheMinorSegments.length = 0;
        topoCacheMajorSegments.length = 0;
        topoCacheTickSegments.length = 0;
        topoCacheFlowSegments.length = 0;
        for (worldY = startY; worldY <= viewBottom + gridStep; worldY += gridStep) {
          for (worldX = startX; worldX <= viewRight + gridStep; worldX += gridStep) {
            var sampleX = worldX + gridStep * 0.5;
            var sampleY = worldY + gridStep * 0.5;
            var visibility = getTerrainVisibility(sampleX, sampleY);
            if (visibility < 0.04) {
              continue;
            }
            var cornerHeights = [
              heightAt(worldX, worldY),
              heightAt(worldX + gridStep, worldY),
              heightAt(worldX + gridStep, worldY + gridStep),
              heightAt(worldX, worldY + gridStep)
            ];
            var minHeight = cornerHeights[0];
            var maxHeight = cornerHeights[0];
            var cornerIndex;
            for (cornerIndex = 1; cornerIndex < 4; cornerIndex += 1) {
              if (cornerHeights[cornerIndex] < minHeight) {
                minHeight = cornerHeights[cornerIndex];
              }
              if (cornerHeights[cornerIndex] > maxHeight) {
                maxHeight = cornerHeights[cornerIndex];
              }
            }
            var levelStart = Math.ceil(minHeight / contourStep);
            var levelEnd = Math.floor(maxHeight / contourStep);
            var contourLevel;
            for (contourLevel = levelStart; contourLevel <= levelEnd; contourLevel += 1) {
              var targetHeight = contourLevel * contourStep;
              var cellSegments = getMarchingSquaresSegments(
                worldX,
                worldY,
                gridStep,
                cornerHeights,
                targetHeight
              );
              var segmentIndex;
              var isMajorContour = contourLevel % TERRAIN_TOPO_INDEX_EVERY === 0;
              var segmentBucket = isMajorContour ? topoCacheMajorSegments : topoCacheMinorSegments;
              for (segmentIndex = 0; segmentIndex < cellSegments.length; segmentIndex += 1) {
                var segment = cellSegments[segmentIndex];
                segmentBucket.push(segment);
                if (!isMajorContour) {
                  continue;
                }
                var midX = (segment.x0 + segment.x1) * 0.5;
                var midY = (segment.y0 + segment.y1) * 0.5;
                var midVisibility = getTerrainVisibility(midX, midY);
                if (midVisibility < 0.04) {
                  continue;
                }
                var segmentLength = Math.sqrt(
                  (segment.x1 - segment.x0) * (segment.x1 - segment.x0) +
                  (segment.y1 - segment.y0) * (segment.y1 - segment.y0)
                );
                if (segmentLength < 0.001) {
                  continue;
                }
                var gradient = heightGradient(midX, midY);
                var slopeLength = Math.sqrt(gradient.x * gradient.x + gradient.y * gradient.y);
                if (slopeLength < 0.001) {
                  continue;
                }
                var downhillX = -gradient.x / slopeLength;
                var downhillY = -gradient.y / slopeLength;
                var tangentX = (segment.x1 - segment.x0) / segmentLength;
                var tangentY = (segment.y1 - segment.y0) / segmentLength;
                var perpX = -tangentY;
                var perpY = tangentX;
                if (perpX * downhillX + perpY * downhillY < 0) {
                  perpX = -perpX;
                  perpY = -perpY;
                }
                var tickLength = TERRAIN_TOPO_TICK_LENGTH;
                topoCacheTickSegments.push({
                  x0: midX,
                  y0: midY,
                  x1: midX + perpX * tickLength,
                  y1: midY + perpY * tickLength
                });
              }
            }
          }
        }
        var flowStep = TERRAIN_TOPO_FLOW_GRID_STEP;
        var flowStartX = Math.floor(viewLeft / flowStep) * flowStep;
        var flowStartY = Math.floor(viewTop / flowStep) * flowStep;
        for (worldY = flowStartY; worldY <= viewBottom + flowStep; worldY += flowStep) {
          for (worldX = flowStartX; worldX <= viewRight + flowStep; worldX += flowStep) {
            var flowSampleX = worldX + flowStep * 0.5;
            var flowSampleY = worldY + flowStep * 0.5;
            var flowVisibility = getTerrainVisibility(flowSampleX, flowSampleY);
            if (flowVisibility < 0.04) {
              continue;
            }
            var flowGradient = heightGradient(flowSampleX, flowSampleY);
            var flowSlopeLength = Math.sqrt(flowGradient.x * flowGradient.x + flowGradient.y * flowGradient.y);
            if (flowSlopeLength < TERRAIN_TOPO_SLOPE_MIN) {
              continue;
            }
            var flowDownhillX = -flowGradient.x / flowSlopeLength;
            var flowDownhillY = -flowGradient.y / flowSlopeLength;
            var flowLength = TERRAIN_TOPO_FLOW_LENGTH;
            topoCacheFlowSegments.push({
              x0: flowSampleX,
              y0: flowSampleY,
              x1: flowSampleX + flowDownhillX * flowLength,
              y1: flowSampleY + flowDownhillY * flowLength
            });
          }
        }
      }

      function ensureTopoWorldCache(viewLeft, viewTop, viewRight, viewBottom) {
        var margin = TERRAIN_TOPO_CACHE_BUCKET;
        var expandedLeft = viewLeft - margin;
        var expandedTop = viewTop - margin;
        var expandedRight = viewRight + margin;
        var expandedBottom = viewBottom + margin;
        var cacheKey = getTopoCacheKey(expandedLeft, expandedTop, expandedRight, expandedBottom);
        if (cacheKey === topoCacheKey) {
          return;
        }
        topoCacheKey = cacheKey;
        buildTopoWorldCache(expandedLeft, expandedTop, expandedRight, expandedBottom);
      }

      function drawCachedTopoSegmentList(segmentList) {
        var segmentIndex;
        for (segmentIndex = 0; segmentIndex < segmentList.length; segmentIndex += 1) {
          var segment = segmentList[segmentIndex];
          var segmentStart = worldToScreen(segment.x0, segment.y0);
          var segmentEnd = worldToScreen(segment.x1, segment.y1);
          ctx.moveTo(segmentStart.x, segmentStart.y);
          ctx.lineTo(segmentEnd.x, segmentEnd.y);
        }
      }

      function drawTerrainTopography(viewLeft, viewTop, viewRight, viewBottom) {
        ensureTopoWorldCache(viewLeft, viewTop, viewRight, viewBottom);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "rgba(38, 32, 24, 0.36)";
        ctx.lineWidth = 0.95;
        ctx.beginPath();
        drawCachedTopoSegmentList(topoCacheFlowSegments);
        ctx.stroke();
        ctx.strokeStyle = "rgba(36, 30, 24, 0.22)";
        ctx.lineWidth = TERRAIN_TOPO_MINOR_LINE_WIDTH;
        ctx.beginPath();
        drawCachedTopoSegmentList(topoCacheMinorSegments);
        ctx.stroke();
        ctx.strokeStyle = "rgba(32, 26, 20, 0.34)";
        ctx.lineWidth = TERRAIN_TOPO_MAJOR_LINE_WIDTH;
        ctx.beginPath();
        drawCachedTopoSegmentList(topoCacheMajorSegments);
        ctx.stroke();
        ctx.strokeStyle = "rgba(34, 28, 22, 0.46)";
        ctx.lineWidth = TERRAIN_TOPO_TICK_LINE_WIDTH;
        ctx.beginPath();
        drawCachedTopoSegmentList(topoCacheTickSegments);
        ctx.stroke();
      }

      function drawCorridorEdgeBlendAlongEdge(edgePoints, outwardSign) {
        if (edgePoints.length < 2) {
          return;
        }
        var width = canvas.clientWidth;
        var height = canvas.clientHeight;
        var viewHalfWidth = width * 0.5 / cameraZoom;
        var viewHalfHeight = height * 0.5 / cameraZoom;
        var viewLeft = cameraCenterX - viewHalfWidth - 120;
        var viewTop = cameraCenterY - viewHalfHeight - 120;
        var viewRight = cameraCenterX + viewHalfWidth + 120;
        var viewBottom = cameraCenterY + viewHalfHeight + 120;
        var edgeIndex;
        for (edgeIndex = 0; edgeIndex < edgePoints.length - 1; edgeIndex += 1) {
          var edgeStart = edgePoints[edgeIndex];
          var edgeEnd = edgePoints[edgeIndex + 1];
          var segX = edgeEnd.x - edgeStart.x;
          var segY = edgeEnd.y - edgeStart.y;
          var segLength = Math.sqrt(segX * segX + segY * segY);
          if (segLength < 0.001) {
            continue;
          }
          var tangentX = segX / segLength;
          var tangentY = segY / segLength;
          var outwardX = -tangentY * outwardSign;
          var outwardY = tangentX * outwardSign;
          var along = 0;
          while (along <= segLength) {
            var alongT = along / segLength;
            var centerX = edgeStart.x + segX * alongT;
            var centerY = edgeStart.y + segY * alongT;
            if (centerX >= viewLeft && centerX <= viewRight && centerY >= viewTop && centerY <= viewBottom) {
              var corridorHalfWidth = edgeStart.halfWidth + (edgeEnd.halfWidth - edgeStart.halfWidth) * alongT;
              drawCorridorEdgeBlendStrip(
                centerX,
                centerY,
                tangentX,
                tangentY,
                outwardX,
                outwardY,
                corridorHalfWidth
              );
            }
            along += TERRAIN_EDGE_STRIP_STEP;
          }
        }
      }

      function drawCorridorEdgeBlend() {
        if (tunnelPath.length < 2) {
          return;
        }
        drawCorridorEdgeBlendAlongEdge(tunnelLeftEdge, 1);
        drawCorridorEdgeBlendAlongEdge(tunnelRightEdge, -1);
      }

      function drawCorridorEdgeBlendStrip(centerX, centerY, tangentX, tangentY, outwardNormalX, outwardNormalY, halfWidth) {
        var outerRadius = halfWidth + TERRAIN_VISIBLE_PADDING;
        var innerRadius = outerRadius - TERRAIN_EDGE_FADE;
        var extraRadius = outerRadius + TERRAIN_EDGE_BLEND_EXTRA;
        var tangentHalf = TERRAIN_EDGE_STRIP_STEP * 0.55;
        var innerCenterX = centerX + outwardNormalX * innerRadius;
        var innerCenterY = centerY + outwardNormalY * innerRadius;
        var outerCenterX = centerX + outwardNormalX * extraRadius;
        var outerCenterY = centerY + outwardNormalY * extraRadius;
        var innerLeftX = innerCenterX - tangentX * tangentHalf;
        var innerLeftY = innerCenterY - tangentY * tangentHalf;
        var innerRightX = innerCenterX + tangentX * tangentHalf;
        var innerRightY = innerCenterY + tangentY * tangentHalf;
        var outerLeftX = outerCenterX - tangentX * tangentHalf;
        var outerLeftY = outerCenterY - tangentY * tangentHalf;
        var outerRightX = outerCenterX + tangentX * tangentHalf;
        var outerRightY = outerCenterY + tangentY * tangentHalf;
        var innerLeftScreen = worldToScreen(innerLeftX, innerLeftY);
        var innerRightScreen = worldToScreen(innerRightX, innerRightY);
        var outerLeftScreen = worldToScreen(outerLeftX, outerLeftY);
        var outerRightScreen = worldToScreen(outerRightX, outerRightY);
        var gradientStartX = (innerLeftScreen.x + innerRightScreen.x) * 0.5;
        var gradientStartY = (innerLeftScreen.y + innerRightScreen.y) * 0.5;
        var gradientEndX = (outerLeftScreen.x + outerRightScreen.x) * 0.5;
        var gradientEndY = (outerLeftScreen.y + outerRightScreen.y) * 0.5;
        var edgeGradient = ctx.createLinearGradient(
          gradientStartX,
          gradientStartY,
          gradientEndX,
          gradientEndY
        );
        edgeGradient.addColorStop(0, "rgba(12, 8, 22, 0)");
        edgeGradient.addColorStop(0.35, "rgba(18, 12, 32, 0.22)");
        edgeGradient.addColorStop(0.72, "rgba(10, 6, 18, 0.62)");
        edgeGradient.addColorStop(1, "rgba(6, 4, 12, 0.92)");
        ctx.fillStyle = edgeGradient;
        ctx.beginPath();
        ctx.moveTo(innerLeftScreen.x, innerLeftScreen.y);
        ctx.lineTo(innerRightScreen.x, innerRightScreen.y);
        ctx.lineTo(outerRightScreen.x, outerRightScreen.y);
        ctx.lineTo(outerLeftScreen.x, outerLeftScreen.y);
        ctx.closePath();
        ctx.fill();
      }

      function buildTerrainTexture() {
        var size = Math.ceil((WORLD_HALF * 2) / TERRAIN_CELL);
        if (!terrainCanvas) {
          terrainCanvas = document.createElement("canvas");
          terrainCtx = terrainCanvas.getContext("2d");
        }
        terrainCanvas.width = size;
        terrainCanvas.height = size;
        var imageData = terrainCtx.createImageData(size, size);
        var data = imageData.data;
        var pixelIndex = 0;
        var worldStart = -WORLD_HALF;
        var cellY;
        var cellX;
        for (cellY = 0; cellY < size; cellY += 1) {
          for (cellX = 0; cellX < size; cellX += 1) {
            var worldX = worldStart + (cellX + 0.5) * TERRAIN_CELL;
            var worldY = worldStart + (cellY + 0.5) * TERRAIN_CELL;
            var height = heightAt(worldX, worldY);
            var color = heightColor(height);
            var hillShade = getTerrainCellHillshade(worldX, worldY);
            var cloudiness = sampleTerrainCloudiness(worldX, worldY);
            var cloudModifier = getTerrainCloudModifier(cloudiness);
            var shadedR = color.r * hillShade * cloudModifier;
            var shadedG = color.g * hillShade * cloudModifier;
            var shadedB = color.b * hillShade * cloudModifier;
            if (cloudiness > 0.15) {
              shadedR += cloudiness * 14;
              shadedG += cloudiness * 10;
              shadedB += cloudiness * 6;
            } else if (cloudiness < -0.15) {
              shadedR += cloudiness * 10;
              shadedG += cloudiness * 8;
              shadedB += cloudiness * 12;
            }
            if (shadedR > 255) {
              shadedR = 255;
            }
            if (shadedG > 255) {
              shadedG = 255;
            }
            if (shadedB > 255) {
              shadedB = 255;
            }
            data[pixelIndex] = shadedR | 0;
            data[pixelIndex + 1] = shadedG | 0;
            data[pixelIndex + 2] = shadedB | 0;
            data[pixelIndex + 3] = 255;
            pixelIndex += 4;
          }
        }
        terrainCtx.putImageData(imageData, 0, 0);
      }

      function buildTerrainVisibilityTexture() {
        if (!terrainCanvas || tunnelPath.length < 2) {
          return;
        }
        var size = terrainCanvas.width;
        if (!terrainVisibilityCanvas) {
          terrainVisibilityCanvas = document.createElement("canvas");
          terrainVisibilityCtx = terrainVisibilityCanvas.getContext("2d");
        }
        terrainVisibilityCanvas.width = size;
        terrainVisibilityCanvas.height = size;
        var imageData = terrainVisibilityCtx.createImageData(size, size);
        var data = imageData.data;
        var pixelIndex = 0;
        var worldStart = -WORLD_HALF;
        var cellY;
        var cellX;
        for (cellY = 0; cellY < size; cellY += 1) {
          for (cellX = 0; cellX < size; cellX += 1) {
            var worldX = worldStart + (cellX + 0.5) * TERRAIN_CELL;
            var worldY = worldStart + (cellY + 0.5) * TERRAIN_CELL;
            var visibility = getTerrainVisibility(worldX, worldY);
            var alpha = (visibility * 255) | 0;
            data[pixelIndex] = alpha;
            data[pixelIndex + 1] = alpha;
            data[pixelIndex + 2] = alpha;
            data[pixelIndex + 3] = alpha;
            pixelIndex += 4;
          }
        }
        terrainVisibilityCtx.putImageData(imageData, 0, 0);
      }

      function addWall(x1, y1, x2, y2) {
        walls.push({ x1: x1, y1: y1, x2: x2, y2: y2 });
      }

      function normalizeVector(vectorX, vectorY) {
        var length = Math.sqrt(vectorX * vectorX + vectorY * vectorY);
        if (length < 0.001) {
          return { x: 1, y: 0 };
        }
        return { x: vectorX / length, y: vectorY / length };
      }

      function normalizeAngle(angle) {
        while (angle > Math.PI) {
          angle -= Math.PI * 2;
        }
        while (angle < -Math.PI) {
          angle += Math.PI * 2;
        }
        return angle;
      }

      function clampHeadingToForwardCone(heading) {
        var delta = normalizeAngle(heading - TUNNEL_FORWARD_HEADING);
        if (delta > TUNNEL_DEVIATION_HALF_ANGLE) {
          delta = TUNNEL_DEVIATION_HALF_ANGLE;
        } else if (delta < -TUNNEL_DEVIATION_HALF_ANGLE) {
          delta = -TUNNEL_DEVIATION_HALF_ANGLE;
        }
        return TUNNEL_FORWARD_HEADING + delta;
      }

      function getForwardCoord(pointX, pointY) {
        var forwardX = Math.cos(TUNNEL_FORWARD_HEADING);
        var forwardY = Math.sin(TUNNEL_FORWARD_HEADING);
        return pointX * forwardX + pointY * forwardY;
      }

      function createTunnelPoint(pointX, pointY, halfWidth) {
        return { x: pointX, y: pointY, halfWidth: halfWidth };
      }

      function pickNextHalfWidth(random, previousHalfWidth) {
        var target = CORRIDOR_HALF_WIDTH_MIN + random() * (CORRIDOR_HALF_WIDTH_MAX - CORRIDOR_HALF_WIDTH_MIN);
        return previousHalfWidth * 0.55 + target * 0.45;
      }

      function buildMainTunnelPath(seed) {
        var random = seededRandom(seed + 17);
        var path = [createTunnelPoint(0, 0, CORRIDOR_HALF_WIDTH_MAX * 0.92)];
        var heading = TUNNEL_FORWARD_HEADING;
        var straightBias = 0;
        var stepIndex;
        var gentleTurns = [0, 0, 0, Math.PI / 8, -Math.PI / 8];
        var mediumTurns = [0, 0, Math.PI / 8, -Math.PI / 8, Math.PI / 4, -Math.PI / 4];
        for (stepIndex = 0; stepIndex < TUNNEL_STEP_COUNT; stepIndex += 1) {
          var turnPool = straightBias > 1 ? gentleTurns : mediumTurns;
          var turnPick = turnPool[Math.floor(random() * turnPool.length)];
          if (stepIndex < 3) {
            turnPick = turnPick * 0.35;
          }
          heading += turnPick;
          heading = clampHeadingToForwardCone(heading);
          if (Math.abs(turnPick) < 0.01) {
            straightBias += 1;
          } else {
            straightBias = 0;
          }
          var segmentLength = TUNNEL_SEGMENT_LENGTH * (0.9 + random() * 0.45);
          var dirX = Math.cos(heading);
          var dirY = Math.sin(heading);
          var lastPoint = path[path.length - 1];
          var lastForwardCoord = getForwardCoord(lastPoint.x, lastPoint.y);
          var nextX = lastPoint.x + dirX * segmentLength;
          var nextY = lastPoint.y + dirY * segmentLength;
          var nextForwardCoord = getForwardCoord(nextX, nextY);
          var minForwardAdvance = segmentLength * TUNNEL_MIN_FORWARD_STEP;
          if (nextForwardCoord < lastForwardCoord + minForwardAdvance) {
            heading = clampHeadingToForwardCone(TUNNEL_FORWARD_HEADING);
            dirX = Math.cos(heading);
            dirY = Math.sin(heading);
            nextX = lastPoint.x + dirX * segmentLength;
            nextY = lastPoint.y + dirY * segmentLength;
          }
          var nextHalfWidth = pickNextHalfWidth(random, lastPoint.halfWidth);
          path.push(createTunnelPoint(nextX, nextY, nextHalfWidth));
        }
        return path;
      }

      function offsetPoint(pointX, pointY, normalX, normalY, distance, corridorHalfWidth) {
        return {
          x: pointX + normalX * distance,
          y: pointY + normalY * distance,
          halfWidth: corridorHalfWidth
        };
      }

      function getCornerOffset(path, pointIndex, sideSign) {
        var point = path[pointIndex];
        var halfWidth = point.halfWidth;
        var prev = path[pointIndex - 1];
        var next = path[pointIndex + 1];
        var inVector = normalizeVector(point.x - prev.x, point.y - prev.y);
        var outVector = normalizeVector(next.x - point.x, next.y - point.y);
        var tangentX = inVector.x + outVector.x;
        var tangentY = inVector.y + outVector.y;
        var tangent = normalizeVector(tangentX, tangentY);
        var normalX = -tangent.y * sideSign;
        var normalY = tangent.x * sideSign;
        var inNormalX = -inVector.y * sideSign;
        var inNormalY = inVector.x * sideSign;
        var turnDot = inVector.x * outVector.x + inVector.y * outVector.y;
        var miterX = normalX * halfWidth;
        var miterY = normalY * halfWidth;
        var miterLength = Math.sqrt(miterX * miterX + miterY * miterY);
        if (miterLength > TUNNEL_MITER_LIMIT || turnDot < 0.55) {
          var outNormalX = -outVector.y * sideSign;
          var outNormalY = outVector.x * sideSign;
          var bevelX = inNormalX + outNormalX;
          var bevelY = inNormalY + outNormalY;
          var bevelLength = Math.sqrt(bevelX * bevelX + bevelY * bevelY);
          if (bevelLength < 0.001) {
            miterX = inNormalX * halfWidth;
            miterY = inNormalY * halfWidth;
          } else {
            miterX = bevelX / bevelLength * halfWidth;
            miterY = bevelY / bevelLength * halfWidth;
          }
        }
        return {
          x: point.x + miterX,
          y: point.y + miterY,
          halfWidth: halfWidth
        };
      }

      function buildCorridorEdge(path, sideSign) {
        var edgePoints = [];
        var pointCount = path.length;
        var pointIndex;
        if (pointCount < 2) {
          return edgePoints;
        }
        var firstSegment = normalizeVector(path[1].x - path[0].x, path[1].y - path[0].y);
        edgePoints.push(offsetPoint(
          path[0].x,
          path[0].y,
          -firstSegment.y * sideSign,
          firstSegment.x * sideSign,
          path[0].halfWidth,
          path[0].halfWidth
        ));
        for (pointIndex = 1; pointIndex < pointCount - 1; pointIndex += 1) {
          edgePoints.push(getCornerOffset(path, pointIndex, sideSign));
        }
        var lastSegment = normalizeVector(path[pointCount - 1].x - path[pointCount - 2].x, path[pointCount - 1].y - path[pointCount - 2].y);
        edgePoints.push(offsetPoint(
          path[pointCount - 1].x,
          path[pointCount - 1].y,
          -lastSegment.y * sideSign,
          lastSegment.x * sideSign,
          path[pointCount - 1].halfWidth,
          path[pointCount - 1].halfWidth
        ));
        return edgePoints;
      }

      function addEdgeWalls(edgePoints) {
        var edgeIndex;
        for (edgeIndex = 0; edgeIndex < edgePoints.length - 1; edgeIndex += 1) {
          var start = edgePoints[edgeIndex];
          var end = edgePoints[edgeIndex + 1];
          addWall(start.x, start.y, end.x, end.y);
        }
      }

      function buildTunnelWalls(path) {
        if (path.length < 2) {
          return;
        }
        var leftEdge = buildCorridorEdge(path, 1);
        var rightEdge = buildCorridorEdge(path, -1);
        tunnelLeftEdge.length = 0;
        tunnelRightEdge.length = 0;
        var edgeCopyIndex;
        for (edgeCopyIndex = 0; edgeCopyIndex < leftEdge.length; edgeCopyIndex += 1) {
          tunnelLeftEdge.push({
            x: leftEdge[edgeCopyIndex].x,
            y: leftEdge[edgeCopyIndex].y,
            halfWidth: leftEdge[edgeCopyIndex].halfWidth
          });
        }
        for (edgeCopyIndex = 0; edgeCopyIndex < rightEdge.length; edgeCopyIndex += 1) {
          tunnelRightEdge.push({
            x: rightEdge[edgeCopyIndex].x,
            y: rightEdge[edgeCopyIndex].y,
            halfWidth: rightEdge[edgeCopyIndex].halfWidth
          });
        }
        addEdgeWalls(leftEdge);
        addEdgeWalls(rightEdge);
        var startCapLeft = leftEdge[0];
        var startCapRight = rightEdge[0];
        addWall(startCapLeft.x, startCapLeft.y, startCapRight.x, startCapRight.y);
        var endCapLeft = leftEdge[leftEdge.length - 1];
        var endCapRight = rightEdge[rightEdge.length - 1];
        addWall(endCapLeft.x, endCapLeft.y, endCapRight.x, endCapRight.y);
      }

      function getTunnelFinishPosition() {
        if (tunnelPath.length < 1) {
          return { x: 0, y: 0 };
        }
        var last = tunnelPath[tunnelPath.length - 1];
        return { x: last.x, y: last.y };
      }

      function buildBlackHoles(seed) {
        blackHoles.length = 0;
        if (tunnelPath.length < 4) {
          return;
        }
        var random = seededRandom(seed + 41);
        var holeCount = BLACK_HOLE_COUNT_MIN + Math.floor(random() * BLACK_HOLE_COUNT_EXTRA);
        var attemptIndex;
        var placedCount = 0;
        var maxAttempts = holeCount * 18;
        for (attemptIndex = 0; attemptIndex < maxAttempts && placedCount < holeCount; attemptIndex += 1) {
          var segmentIndex = 2 + Math.floor(random() * (tunnelPath.length - 4));
          var pathStart = tunnelPath[segmentIndex];
          var pathEnd = tunnelPath[segmentIndex + 1];
          var along = 0.12 + random() * 0.76;
          var centerX = pathStart.x + (pathEnd.x - pathStart.x) * along;
          var centerY = pathStart.y + (pathEnd.y - pathStart.y) * along;
          var segX = pathEnd.x - pathStart.x;
          var segY = pathEnd.y - pathStart.y;
          var segLength = Math.sqrt(segX * segX + segY * segY);
          if (segLength < 0.001) {
            continue;
          }
          var normalX = -segY / segLength;
          var normalY = segX / segLength;
          var sideSign = random() < 0.5 ? -1 : 1;
          var localHalfWidth = pathStart.halfWidth + (pathEnd.halfWidth - pathStart.halfWidth) * along;
          var offset = 14 + random() * (localHalfWidth - 30);
          var holeX = centerX + normalX * offset * sideSign;
          var holeY = centerY + normalY * offset * sideSign;
          var closestAtHole = getClosestOnPath(tunnelPath, holeX, holeY);
          if (closestAtHole.distance > closestAtHole.halfWidth - BLACK_HOLE_DRAW_RADIUS - 4) {
            continue;
          }
          var finishDx = holeX - finishX;
          var finishDy = holeY - finishY;
          if (finishDx * finishDx + finishDy * finishDy < 90 * 90) {
            continue;
          }
          var teePosition = getTunnelStartPosition();
          var startDx = holeX - teePosition.x;
          var startDy = holeY - teePosition.y;
          if (startDx * startDx + startDy * startDy < 75 * 75) {
            continue;
          }
          blackHoles.push({ x: holeX, y: holeY });
          placedCount += 1;
        }
      }

      function buildWalls(seed) {
        walls.length = 0;
        tunnelPath = buildMainTunnelPath(seed);
        buildTunnelWalls(tunnelPath);
        var finishPosition = getTunnelFinishPosition();
        finishX = finishPosition.x;
        finishY = finishPosition.y;
      }

      function distancePointToSegment(pointX, pointY, x1, y1, x2, y2) {
        var segX = x2 - x1;
        var segY = y2 - y1;
        var segLenSq = segX * segX + segY * segY;
        if (segLenSq < 0.001) {
          var dx = pointX - x1;
          var dy = pointY - y1;
          return Math.sqrt(dx * dx + dy * dy);
        }
        var t = ((pointX - x1) * segX + (pointY - y1) * segY) / segLenSq;
        if (t < 0) {
          t = 0;
        } else if (t > 1) {
          t = 1;
        }
        var closestX = x1 + segX * t;
        var closestY = y1 + segY * t;
        var offsetX = pointX - closestX;
        var offsetY = pointY - closestY;
        return Math.sqrt(offsetX * offsetX + offsetY * offsetY);
      }

      function getClosestOnPath(path, pointX, pointY) {
        var bestDistance = 999999;
        var bestX = pointX;
        var bestY = pointY;
        var bestHalfWidth = CORRIDOR_HALF_WIDTH;
        var segmentIndex;
        for (segmentIndex = 0; segmentIndex < path.length - 1; segmentIndex += 1) {
          var start = path[segmentIndex];
          var end = path[segmentIndex + 1];
          var segX = end.x - start.x;
          var segY = end.y - start.y;
          var segLenSq = segX * segX + segY * segY;
          if (segLenSq < 0.001) {
            continue;
          }
          var t = ((pointX - start.x) * segX + (pointY - start.y) * segY) / segLenSq;
          if (t < 0) {
            t = 0;
          } else if (t > 1) {
            t = 1;
          }
          var closestX = start.x + segX * t;
          var closestY = start.y + segY * t;
          var offsetX = pointX - closestX;
          var offsetY = pointY - closestY;
          var distance = Math.sqrt(offsetX * offsetX + offsetY * offsetY);
          if (distance < bestDistance) {
            bestDistance = distance;
            bestX = closestX;
            bestY = closestY;
            bestHalfWidth = start.halfWidth + (end.halfWidth - start.halfWidth) * t;
          }
        }
        return {
          distance: bestDistance,
          closestX: bestX,
          closestY: bestY,
          halfWidth: bestHalfWidth
        };
      }

      function distanceToTunnelCenter(pointX, pointY) {
        return getClosestOnPath(tunnelPath, pointX, pointY).distance;
      }

      function constrainPositionToTunnelAt(positionX, positionY, velocityX, velocityY, circleRadius) {
        if (circleRadius === undefined) {
          circleRadius = collisionRadius;
        }
        var bounced = false;
        var closest = getClosestOnPath(tunnelPath, positionX, positionY);
        var allowed = closest.halfWidth - circleRadius - 1;
        if (closest.distance <= allowed) {
          return {
            x: positionX,
            y: positionY,
            vx: velocityX,
            vy: velocityY,
            bounced: bounced
          };
        }
        var pushX = positionX - closest.closestX;
        var pushY = positionY - closest.closestY;
        var pushLength = Math.sqrt(pushX * pushX + pushY * pushY);
        if (pushLength < 0.001) {
          return {
            x: positionX,
            y: positionY,
            vx: velocityX,
            vy: velocityY,
            bounced: bounced
          };
        }
        pushX /= pushLength;
        pushY /= pushLength;
        var pushAmount = closest.distance - allowed;
        positionX -= pushX * pushAmount;
        positionY -= pushY * pushAmount;
        var velDot = velocityX * pushX + velocityY * pushY;
        if (velDot > 0) {
          velocityX -= (1 + WALL_BOUNCE) * velDot * pushX;
          velocityY -= (1 + WALL_BOUNCE) * velDot * pushY;
          bounced = true;
        }
        return {
          x: positionX,
          y: positionY,
          vx: velocityX,
          vy: velocityY,
          bounced: bounced
        };
      }

      function constrainBallToTunnel() {
        var result = constrainPositionToTunnelAt(ballX, ballY, ballVelX, ballVelY);
        ballX = result.x;
        ballY = result.y;
        ballVelX = result.vx;
        ballVelY = result.vy;
      }

      function resolveWallCollisionAt(positionX, positionY, velocityX, velocityY, circleRadius) {
        if (circleRadius === undefined) {
          circleRadius = collisionRadius;
        }
        var bounced = false;
        var wallIndex;
        for (wallIndex = 0; wallIndex < walls.length; wallIndex += 1) {
          var wall = walls[wallIndex];
          var segX = wall.x2 - wall.x1;
          var segY = wall.y2 - wall.y1;
          var segLenSq = segX * segX + segY * segY;
          if (segLenSq < 0.001) {
            continue;
          }
          var t = ((positionX - wall.x1) * segX + (positionY - wall.y1) * segY) / segLenSq;
          if (t < 0) {
            t = 0;
          } else if (t > 1) {
            t = 1;
          }
          var closestX = wall.x1 + segX * t;
          var closestY = wall.y1 + segY * t;
          var offsetX = positionX - closestX;
          var offsetY = positionY - closestY;
          var dist = Math.sqrt(offsetX * offsetX + offsetY * offsetY);
          if (dist >= circleRadius || dist < 0.001) {
            continue;
          }
          var normal = segmentNormal(wall);
          var dot = offsetX * normal.x + offsetY * normal.y;
          if (dot < 0) {
            normal.x = -normal.x;
            normal.y = -normal.y;
          }
          var penetration = circleRadius - dist;
          positionX += normal.x * penetration;
          positionY += normal.y * penetration;
          var velDot = velocityX * normal.x + velocityY * normal.y;
          if (velDot < 0) {
            velocityX -= (1 + WALL_BOUNCE) * velDot * normal.x;
            velocityY -= (1 + WALL_BOUNCE) * velDot * normal.y;
            bounced = true;
          }
        }
        return {
          x: positionX,
          y: positionY,
          vx: velocityX,
          vy: velocityY,
          bounced: bounced
        };
      }

      function resolveWallCollision() {
        var result = resolveWallCollisionAt(ballX, ballY, ballVelX, ballVelY);
        ballX = result.x;
        ballY = result.y;
        ballVelX = result.vx;
        ballVelY = result.vy;
      }

      function moveBallWithSteppedWallChecks(positionX, positionY, velocityX, velocityY, deltaSeconds, options, circleRadius) {
        if (circleRadius === undefined) {
          circleRadius = collisionRadius;
        }
        var wallBounced = false;
        var moveX = velocityX * deltaSeconds;
        var moveY = velocityY * deltaSeconds;
        var moveDistance = Math.sqrt(moveX * moveX + moveY * moveY);
        var maxSubStepDistance = circleRadius * WALL_MOVE_SUBSTEP_DISTANCE_SCALE;
        if (moveDistance < 0.001) {
          if (options.walls) {
            var restWallResult = resolveWallCollisionAt(positionX, positionY, velocityX, velocityY, circleRadius);
            positionX = restWallResult.x;
            positionY = restWallResult.y;
            velocityX = restWallResult.vx;
            velocityY = restWallResult.vy;
            if (restWallResult.bounced) {
              wallBounced = true;
            }
          }
          if (options.tunnel) {
            var restTunnelResult = constrainPositionToTunnelAt(positionX, positionY, velocityX, velocityY, circleRadius);
            positionX = restTunnelResult.x;
            positionY = restTunnelResult.y;
            velocityX = restTunnelResult.vx;
            velocityY = restTunnelResult.vy;
            if (restTunnelResult.bounced) {
              wallBounced = true;
            }
          }
          return {
            x: positionX,
            y: positionY,
            vx: velocityX,
            vy: velocityY,
            wallBounced: wallBounced
          };
        }
        var remainingDistance = moveDistance;
        var dirX = moveX / moveDistance;
        var dirY = moveY / moveDistance;
        var iterationLimit = Math.ceil(moveDistance / maxSubStepDistance) + 6;
        var iteration;
        for (iteration = 0; iteration < iterationLimit && remainingDistance > 0.001; iteration += 1) {
          var stepDistance = remainingDistance;
          if (stepDistance > maxSubStepDistance) {
            stepDistance = maxSubStepDistance;
          }
          if (options.walls) {
            var wallHit = rayHitWall(positionX, positionY, dirX, dirY, stepDistance);
            if (wallHit.wall !== null && wallHit.distance < stepDistance) {
              stepDistance = wallHit.distance;
              if (stepDistance < 0) {
                stepDistance = 0;
              }
            }
          }
          positionX += dirX * stepDistance;
          positionY += dirY * stepDistance;
          remainingDistance -= stepDistance;
          if (options.walls) {
            var wallResult = resolveWallCollisionAt(positionX, positionY, velocityX, velocityY, circleRadius);
            positionX = wallResult.x;
            positionY = wallResult.y;
            velocityX = wallResult.vx;
            velocityY = wallResult.vy;
            if (wallResult.bounced) {
              wallBounced = true;
              var speedAfterWall = Math.sqrt(velocityX * velocityX + velocityY * velocityY);
              if (speedAfterWall > 0.001) {
                dirX = velocityX / speedAfterWall;
                dirY = velocityY / speedAfterWall;
              }
            }
          }
          if (options.tunnel) {
            var tunnelResult = constrainPositionToTunnelAt(positionX, positionY, velocityX, velocityY, circleRadius);
            positionX = tunnelResult.x;
            positionY = tunnelResult.y;
            velocityX = tunnelResult.vx;
            velocityY = tunnelResult.vy;
            if (tunnelResult.bounced) {
              wallBounced = true;
              var speedAfterTunnel = Math.sqrt(velocityX * velocityX + velocityY * velocityY);
              if (speedAfterTunnel > 0.001) {
                dirX = velocityX / speedAfterTunnel;
                dirY = velocityY / speedAfterTunnel;
              }
            }
          }
          if (stepDistance < 0.001) {
            break;
          }
        }
        return {
          x: positionX,
          y: positionY,
          vx: velocityX,
          vy: velocityY,
          wallBounced: wallBounced
        };
      }

      function stepBallPhysics(positionX, positionY, velocityX, velocityY, deltaSeconds, options) {
        var gradient = heightGradient(positionX, positionY);
        velocityX -= gradient.x * SLOPE_FORCE * deltaSeconds;
        velocityY -= gradient.y * SLOPE_FORCE * deltaSeconds;
        if (options.useFriction) {
          velocityX *= FRICTION;
          velocityY *= FRICTION;
        }
        if (options.blackHoles) {
          var pullResult = applyBlackHolePullToVelocity(
            positionX,
            positionY,
            velocityX,
            velocityY,
            deltaSeconds,
            options.captureBlackHoles
          );
          velocityX = pullResult.velocityX;
          velocityY = pullResult.velocityY;
          if (pullResult.captured) {
            return {
              x: positionX,
              y: positionY,
              vx: 0,
              vy: 0,
              captured: true,
              hole: pullResult.hole,
              wallBounced: false
            };
          }
        }
        var moveResult = moveBallWithSteppedWallChecks(
          positionX,
          positionY,
          velocityX,
          velocityY,
          deltaSeconds,
          options
        );
        positionX = moveResult.x;
        positionY = moveResult.y;
        velocityX = moveResult.vx;
        velocityY = moveResult.vy;
        var wallBounced = moveResult.wallBounced;
        return {
          x: positionX,
          y: positionY,
          vx: velocityX,
          vy: velocityY,
          captured: false,
          hole: null,
          wallBounced: wallBounced
        };
      }

      function getSimulationOptions(captureBlackHoles) {
        return {
          useFriction: true,
          blackHoles: true,
          captureBlackHoles: captureBlackHoles,
          walls: true,
          tunnel: true
        };
      }

      function getClosestPointOnSegmentToPoint(pointX, pointY, segmentStartX, segmentStartY, segmentEndX, segmentEndY) {
        var segmentX = segmentEndX - segmentStartX;
        var segmentY = segmentEndY - segmentStartY;
        var segmentLengthSq = segmentX * segmentX + segmentY * segmentY;
        if (segmentLengthSq < 0.001) {
          var offsetX = pointX - segmentStartX;
          var offsetY = pointY - segmentStartY;
          return {
            x: segmentStartX,
            y: segmentStartY,
            distanceSq: offsetX * offsetX + offsetY * offsetY
          };
        }
        var along = ((pointX - segmentStartX) * segmentX + (pointY - segmentStartY) * segmentY) / segmentLengthSq;
        if (along < 0) {
          along = 0;
        } else if (along > 1) {
          along = 1;
        }
        var closestX = segmentStartX + segmentX * along;
        var closestY = segmentStartY + segmentY * along;
        var closestOffsetX = pointX - closestX;
        var closestOffsetY = pointY - closestY;
        return {
          x: closestX,
          y: closestY,
          distanceSq: closestOffsetX * closestOffsetX + closestOffsetY * closestOffsetY
        };
      }

      function getBlackHolePullDisplayStrength(positionX, positionY, hole) {
        var offsetX = hole.x - positionX;
        var offsetY = hole.y - positionY;
        var distanceSq = offsetX * offsetX + offsetY * offsetY;
        if (distanceSq < 0.001) {
          return 1;
        }
        var distance = Math.sqrt(distanceSq);
        if (distance >= BLACK_HOLE_PULL_RADIUS) {
          return 0;
        }
        var pullT = 1 - distance / BLACK_HOLE_PULL_RADIUS;
        return pullT * pullT;
      }

      function getBlackHoleCenterGlow(positionX, positionY, holeX, holeY) {
        var offsetX = holeX - positionX;
        var offsetY = holeY - positionY;
        var distanceSq = offsetX * offsetX + offsetY * offsetY;
        if (distanceSq < 0.001) {
          return 1;
        }
        var distance = Math.sqrt(distanceSq);
        if (distance >= BLACK_HOLE_PULL_GLOW_RADIUS) {
          return 0;
        }
        var glowT = 1 - distance / BLACK_HOLE_PULL_GLOW_RADIUS;
        return glowT * glowT;
      }

      function getBlackHolePullInnerDepth(distance) {
        var innerRadius = BLACK_HOLE_PULL_RADIUS * BLACK_HOLE_PULL_INNER_HALF_SCALE;
        if (distance >= innerRadius) {
          return 0;
        }
        return 1 - distance / innerRadius;
      }

      function isBallInsideBlackHolePull(hole) {
        var offsetX = hole.x - ballX;
        var offsetY = hole.y - ballY;
        var distanceSq = offsetX * offsetX + offsetY * offsetY;
        return distanceSq < BLACK_HOLE_PULL_RADIUS * BLACK_HOLE_PULL_RADIUS;
      }

      function doesSegmentIntersectBlackHolePull(segmentStartX, segmentStartY, segmentEndX, segmentEndY, hole) {
        var closestPoint = getClosestPointOnSegmentToPoint(
          hole.x,
          hole.y,
          segmentStartX,
          segmentStartY,
          segmentEndX,
          segmentEndY
        );
        var pullRadiusSq = BLACK_HOLE_PULL_RADIUS * BLACK_HOLE_PULL_RADIUS;
        return closestPoint.distanceSq < pullRadiusSq;
      }

      function doesTrajectoryPreviewAffectBlackHole(preview, hole) {
        var segmentIndex;
        var pointIndex;
        if (!preview || !preview.segments) {
          return false;
        }
        for (segmentIndex = 0; segmentIndex < preview.segments.length; segmentIndex += 1) {
          var segmentPoints = preview.segments[segmentIndex].points;
          if (!segmentPoints || segmentPoints.length < 1) {
            continue;
          }
          for (pointIndex = 0; pointIndex < segmentPoints.length; pointIndex += 1) {
            var pathPoint = segmentPoints[pointIndex];
            if (getBlackHolePullDisplayStrength(pathPoint.x, pathPoint.y, hole) >= TRAJECTORY_PULL_STRENGTH_MIN) {
              return true;
            }
          }
          for (pointIndex = 1; pointIndex < segmentPoints.length; pointIndex += 1) {
            var segmentStart = segmentPoints[pointIndex - 1];
            var segmentEnd = segmentPoints[pointIndex];
            if (doesSegmentIntersectBlackHolePull(segmentStart.x, segmentStart.y, segmentEnd.x, segmentEnd.y, hole)) {
              return true;
            }
          }
        }
        return false;
      }

      function shouldShowBlackHolePullOutline(hole, aimPreview) {
        if (gameState === stateRolling) {
          return isBallInsideBlackHolePull(hole);
        }
        if (gameState === stateAiming && hitsLeft > 0 && !loseScreenActive && !levelIntroActive) {
          return doesTrajectoryPreviewAffectBlackHole(aimPreview, hole);
        }
        return false;
      }

      function getAimTrajectoryPreview() {
        if (gameState !== stateAiming || hitsLeft <= 0 || loseScreenActive || levelIntroActive) {
          return null;
        }
        var worldMouse = screenToWorld(screenMouseX, screenMouseY);
        var kick = getKickFromCursor(worldMouse.x, worldMouse.y);
        if (!kick) {
          return null;
        }
        return buildTrajectoryPreview(worldMouse.x, worldMouse.y);
      }

      function collectTrajectoryPathPoints(path) {
        var pathPoints = [];
        var segmentIndex;
        var pointIndex;
        if (!path || !path.segments) {
          return pathPoints;
        }
        for (segmentIndex = 0; segmentIndex < path.segments.length; segmentIndex += 1) {
          var points = path.segments[segmentIndex].points;
          for (pointIndex = 0; pointIndex < points.length; pointIndex += 1) {
            var pathPoint = points[pointIndex];
            pathPoints.push({ x: pathPoint.x, y: pathPoint.y });
          }
        }
        return pathPoints;
      }

      function buildTrajectoryHoleInfluences(path) {
        var influences = [];
        var pathPoints = collectTrajectoryPathPoints(path);
        var holeIndex;
        var pointIndex;
        if (pathPoints.length < 1) {
          return influences;
        }
        for (pointIndex = 0; pointIndex < pathPoints.length; pointIndex += 1) {
          var pathPoint = pathPoints[pointIndex];
          for (holeIndex = 0; holeIndex < blackHoles.length; holeIndex += 1) {
            var hole = blackHoles[holeIndex];
            var strength = getBlackHolePullDisplayStrength(pathPoint.x, pathPoint.y, hole);
            if (strength < TRAJECTORY_PULL_STRENGTH_MIN) {
              continue;
            }
            influences.push({
              pointX: pathPoint.x,
              pointY: pathPoint.y,
              holeX: hole.x,
              holeY: hole.y,
              strength: strength
            });
          }
        }
        return influences;
      }

      function simulateBallPath(startX, startY, velocityX, velocityY, maxDistance, captureBlackHoles, stepSeconds) {
        var options = getSimulationOptions(captureBlackHoles);
        var stepTime = stepSeconds;
        if (!stepTime) {
          stepTime = PHYSICS_FIXED_STEP_SECONDS;
        }
        var segments = [];
        var bounces = [];
        var positionX = startX;
        var positionY = startY;
        var velX = velocityX;
        var velY = velocityY;
        var traveled = 0;
        var bounceIndex = 0;
        var stepIndex = 0;
        var captured = false;
        var reachedFinish = false;
        var restSimTime = 0;
        var segmentPoints = [{ x: positionX, y: positionY }];
        while (
          traveled < maxDistance &&
          bounceIndex <= TRAJECTORY_MAX_BOUNCES &&
          stepIndex < TRAJECTORY_TRAVEL_MAX_STEPS
        ) {
          stepIndex += 1;
          var previousX = positionX;
          var previousY = positionY;
          var stepResult = stepBallPhysics(
            positionX,
            positionY,
            velX,
            velY,
            stepTime,
            options
          );
          if (stepResult.captured) {
            positionX = stepResult.hole.x;
            positionY = stepResult.hole.y;
            segmentPoints.push({ x: positionX, y: positionY });
            traveled += Math.sqrt(
              (positionX - previousX) * (positionX - previousX) +
              (positionY - previousY) * (positionY - previousY)
            );
            captured = true;
            break;
          }
          positionX = stepResult.x;
          positionY = stepResult.y;
          velX = stepResult.vx;
          velY = stepResult.vy;
          traveled += Math.sqrt(
            (positionX - previousX) * (positionX - previousX) +
            (positionY - previousY) * (positionY - previousY)
          );
          segmentPoints.push({ x: positionX, y: positionY });
          if (isPositionInFinishZone(positionX, positionY)) {
            reachedFinish = true;
            velX = 0;
            velY = 0;
            break;
          }
          if (stepResult.wallBounced) {
            var bounceSpeed = Math.sqrt(velX * velX + velY * velY);
            if (bounceSpeed > 0.001) {
              bounces.push({
                x: positionX,
                y: positionY,
                dirX: velX / bounceSpeed,
                dirY: velY / bounceSpeed
              });
            }
            if (segmentPoints.length > 1) {
              segments.push({ points: segmentPoints });
            }
            segmentPoints = [{ x: positionX, y: positionY }];
            bounceIndex += 1;
            speed = bounceSpeed;
            if (speed > 0.001) {
              var nudge = collisionRadius + 2;
              positionX += (velX / speed) * nudge;
              positionY += (velY / speed) * nudge;
              segmentPoints[0].x = positionX;
              segmentPoints[0].y = positionY;
            }
          }
          if (traveled >= maxDistance) {
            break;
          }
          var speed = Math.sqrt(velX * velX + velY * velY);
          if (speed < REST_SPEED) {
            restSimTime += stepTime;
            if (restSimTime >= REST_TIME) {
              break;
            }
          } else {
            restSimTime = 0;
          }
        }
        if (segmentPoints.length > 1) {
          segments.push({ points: segmentPoints });
        }
        if (segments.length < 1 && segmentPoints.length > 0) {
          segments.push({ points: segmentPoints });
        }
        var endPoint = null;
        var endDir = null;
        var endSpeed = Math.sqrt(velX * velX + velY * velY);
        if (endSpeed > 0.001) {
          endDir = { x: velX / endSpeed, y: velY / endSpeed };
        }
        if (segmentPoints.length > 0) {
          var lastPoint = segmentPoints[segmentPoints.length - 1];
          endPoint = { x: lastPoint.x, y: lastPoint.y };
          if (!endDir && segmentPoints.length > 1) {
            var prevPoint = segmentPoints[segmentPoints.length - 2];
            var tailX = lastPoint.x - prevPoint.x;
            var tailY = lastPoint.y - prevPoint.y;
            var tailLength = Math.sqrt(tailX * tailX + tailY * tailY);
            if (tailLength > 0.001) {
              endDir = { x: tailX / tailLength, y: tailY / tailLength };
            }
          }
        }
        if (traveled > maxDistance) {
          traveled = maxDistance;
        }
        var endStopped = captured || reachedFinish || endSpeed < REST_SPEED;
        var endKeepsGoing = !captured && !reachedFinish && endSpeed >= REST_SPEED;
        return {
          segments: segments,
          bounces: bounces,
          endPoint: endPoint,
          endDir: endDir,
          endSpeed: endSpeed,
          endStopped: endStopped,
          endKeepsGoing: endKeepsGoing,
          traveled: traveled,
          captured: captured
        };
      }

      function getTunnelStartPosition() {
        if (tunnelPath.length < 2) {
          return { x: 0, y: 0 };
        }
        var first = tunnelPath[0];
        var second = tunnelPath[1];
        var segX = second.x - first.x;
        var segY = second.y - first.y;
        var segLength = Math.sqrt(segX * segX + segY * segY);
        if (segLength < 0.001) {
          return { x: first.x, y: first.y };
        }
        var forwardDistance = TUNNEL_START_SPAWN_FORWARD_BASE + first.halfWidth * TUNNEL_START_SPAWN_HALF_WIDTH_SCALE;
        var minimumForward = collisionRadius + first.halfWidth * 0.22 + BALL_RADIUS * 2;
        if (forwardDistance < minimumForward) {
          forwardDistance = minimumForward;
        }
        return {
          x: first.x + (segX / segLength) * forwardDistance,
          y: first.y + (segY / segLength) * forwardDistance
        };
      }

      function setBallPositionClearOfWalls(positionX, positionY) {
        var resolvedX = positionX;
        var resolvedY = positionY;
        var velocityX = 0;
        var velocityY = 0;
        var iteration;
        for (iteration = 0; iteration < BALL_SPAWN_WALL_CLEAR_ITERATIONS; iteration += 1) {
          var wallResult = resolveWallCollisionAt(resolvedX, resolvedY, velocityX, velocityY);
          resolvedX = wallResult.x;
          resolvedY = wallResult.y;
          var tunnelResult = constrainPositionToTunnelAt(resolvedX, resolvedY, velocityX, velocityY);
          resolvedX = tunnelResult.x;
          resolvedY = tunnelResult.y;
        }
        return { x: resolvedX, y: resolvedY };
      }

      function resize() {
        var rect = canvas.getBoundingClientRect();
        var width = Math.max(1, Math.floor(rect.width));
        var height = Math.max(1, Math.floor(rect.height));
        var ratio = window.devicePixelRatio || 1;
        canvas.width = Math.floor(width * ratio);
        canvas.height = Math.floor(height * ratio);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        cosmicBackdropCacheKey = "";
        resizeCelebrationCanvas();
      }

      function resizeCelebrationCanvas() {
        var rect = congratsOverlayEl.getBoundingClientRect();
        var width = Math.max(1, Math.floor(rect.width));
        var height = Math.max(1, Math.floor(rect.height));
        var ratio = window.devicePixelRatio || 1;
        celebrationWidth = width;
        celebrationHeight = height;
        celebrationCanvas.width = Math.floor(width * ratio);
        celebrationCanvas.height = Math.floor(height * ratio);
        celebrationCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function trimCelebrationParticles() {
        while (celebrationParticles.length > CELEBRATION_PARTICLE_MAX) {
          celebrationParticles.shift();
        }
      }

      function pushCelebrationParticle(particle) {
        celebrationParticles.push(particle);
        trimCelebrationParticles();
      }

      function pickCelebrationHue() {
        var hueRoll = Math.floor(rand() * 6);
        if (hueRoll === 0) {
          return 42;
        }
        if (hueRoll === 1) {
          return 118;
        }
        if (hueRoll === 2) {
          return 188;
        }
        if (hueRoll === 3) {
          return 268;
        }
        if (hueRoll === 4) {
          return 328;
        }
        return 52;
      }

      function spawnCelebrationConfettiBurst(burstCount) {
        var particleIndex;
        var spawnX;
        var spawnY;
        var particle;
        for (particleIndex = 0; particleIndex < burstCount; particleIndex += 1) {
          spawnX = rand() * celebrationWidth;
          spawnY = -12 - rand() * celebrationHeight * 0.35;
          particle = {
            kind: "confetti",
            x: spawnX,
            y: spawnY,
            velX: (rand() - 0.5) * 140,
            velY: 90 + rand() * 200,
            width: 3 + rand() * 5,
            height: 6 + rand() * 8,
            angle: rand() * Math.PI * 2,
            spin: (rand() - 0.5) * 9,
            hue: pickCelebrationHue(),
            life: 2.4 + rand() * 2.2,

      function updateCelebrationEffects(deltaSeconds) {
        var particleIndex;
        var particle;
        var nextFireworkDelay;
        if (!congratsScreenActive) {
          return;
        }
        celebrationConfettiBurstTimer -= deltaSeconds;
        if (celebrationConfettiBurstTimer <= 0) {
          celebrationConfettiBurstTimer = CELEBRATION_CONFETTI_BURST_INTERVAL;
          spawnCelebrationConfettiBurst(CELEBRATION_CONFETTI_BURST_COUNT);
        }
        celebrationFireworkTimer -= deltaSeconds;
        if (celebrationFireworkTimer <= 0) {
          nextFireworkDelay =
            CELEBRATION_FIREWORK_INTERVAL_MIN +
            rand() * (CELEBRATION_FIREWORK_INTERVAL_MAX - CELEBRATION_FIREWORK_INTERVAL_MIN);
          celebrationFireworkTimer = nextFireworkDelay;
          spawnCelebrationFirework(
            celebrationWidth * (0.12 + rand() * 0.76),
            celebrationHeight * (0.14 + rand() * 0.42)
          );
        }
        for (particleIndex = celebrationParticles.length - 1; particleIndex >= 0; particleIndex -= 1) {
          particle = celebrationParticles[particleIndex];
          particle.life -= deltaSeconds;
          if (particle.life <= 0) {
            celebrationParticles.splice(particleIndex, 1);
            continue;
          }
          if (particle.kind === "confetti") {
            particle.velY += CELEBRATION_CONFETTI_GRAVITY * deltaSeconds;
            particle.velX += Math.sin(particle.y * 0.04) * 18 * deltaSeconds;
          } else {
            particle.velY += CELEBRATION_FIREWORK_GRAVITY * deltaSeconds;
            particle.velX *= 0.98;
            particle.velY *= 0.98;
          }
          particle.x += particle.velX * deltaSeconds;
          particle.y += particle.velY * deltaSeconds;
          if (particle.kind === "confetti") {
            particle.angle += particle.spin * deltaSeconds;
          }
        }
      }

      function drawCelebrationEffects() {
        var particleIndex;
        var particle;
        var alpha;
        var halfWidth;
        var halfHeight;
        if (!congratsScreenActive) {
          return;
