<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="transparent" content="true" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LOAD</title>
  <script src="../Web Main Menu/menu-background.js"></script>
  <link rel="stylesheet" href="../Web Main Menu/screen-shared.css" />
  <link rel="stylesheet" href="loading.css" />
  <script src="../Web Main Menu/menu-common.js" defer></script>
  <script src="loading.js" defer></script>
</head>

<body>
  <main class="loading-screen menu-screen" id="loadingRoot" aria-live="polite">
    <div class="screen-backdrop" aria-hidden="true"></div>
    <div class="screen-hazard" aria-hidden="true">
      <div class="screen-hazard-track"></div>
    </div>
    <div class="screen-scanlines" aria-hidden="true"></div>
    <div class="screen-phosphor" aria-hidden="true"></div>
    <div class="screen-vignette" aria-hidden="true"></div>

    <div class="os-shell">
      <header class="os-statusbar" aria-hidden="true">
        <span class="os-statusbar-segment terminal-text--dim">NODE CM-LOCAL</span>
        <span class="os-statusbar-segment terminal-text--dim">boot_ldr.sys</span>
        <span class="os-statusbar-segment os-statusbar-segment--right terminal-text--dim os-clock">00:00:00</span>
      </header>

      <div class="os-workspace os-workspace--loading">
        <section class="loading-panel os-window" aria-labelledby="loadingPanelTitle">
          <header class="os-window-chrome">
            <div class="os-window-controls" aria-hidden="true">
              <span class="os-window-dot os-window-dot--active"></span>
              <span class="os-window-dot"></span>
              <span class="os-window-dot"></span>
            </div>
            <p class="os-window-title terminal-text--dim" id="loadingPanelTitle">load_status.lst</p>
          </header>
          <div class="loading-panel-body os-window-body--terminal">
            <p class="loading-prompt terminal-text--dim"><span class="term-prompt-path">C:\CM\boot&gt;</span> type load_status.lst</p>
            <p class="loading-text terminal-text" id="loadingText">2/4 Memorizing...</p>
            <div class="loading-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="loading-bar-track">
                <div class="loading-bar-fill" id="loadingBarFill"></div>
                <div class="loading-bar-shimmer" aria-hidden="true"></div>
              </div>
              <span class="loading-bar-label terminal-text--dim" id="loadingPercent">0%</span>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>
</body>

</html>
